.btn.ghost{ background:#eef4ea; color:var(--ink); border-color:rgba(30,82,35,.45); }
.btn.red{ background:linear-gradient(180deg,#d9554a,#b3362b); color:#fff; border-color:#7e241c; }
#hud .btn.ghost,#racectl .btn.ghost{ background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.4); }
/* 見出し・名前バー・チップ類：はみ出さず折り返す */
h2.sec{ flex-wrap:wrap; row-gap:4px; }
h2.sec .tag{ flex:none; }
.namebar{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; }
.namebar .nb-name{ overflow-wrap:anywhere; line-height:1.25; min-width:0; }
.hr-name{ overflow-wrap:anywhere; }
.ab-text,.gtext,.sectext,.ticket,.rcard .rn,.fname,.dstat,.talk div,.guidebox .g-title{ overflow-wrap:anywhere; }
#actionbar .ab-btn{ flex:none; }
#actionbar .ab-text{ overflow-wrap:anywhere; }
/* 表：セル内で折り返して全文を見せる（列の省略はしない） */
table{ table-layout:auto; }
th,td{ overflow-wrap:anywhere; }
@media (max-width:640px){
  table{ font-size:12px; }
  th,td{ padding:5px 4px; }
  .gauge .gname{ width:50px; font-size:12.5px; }
  .gauge{ gap:5px; }
  #racehud .rh-rem{ font-size:23px; }
  #racehud .rh-pos{ font-size:16px; }
  .namebar .nb-name{ font-size:19px; }
  #sb-title{ font-size:18px; }
  .guidebox .g-title{ font-size:18px; }
  .paddock .pad-name{ font-size:20px; overflow-wrap:anywhere; }
}
/* 入力・選択・モーダル・帯の幅あふれ防止 */
input,select,textarea{ max-width:100%; }
#overlay .box{ width:calc(100vw - 28px); }
.posbar{ flex-wrap:wrap; }
.entryline{ flex-wrap:wrap; row-gap:4px; }
.kv dd{ min-width:0; overflow-wrap:anywhere; }
.fmark{ overflow-wrap:anywhere; }
#commentary{ overflow-wrap:anywhere; }
/* 画像の被写体見切れ対策：馬イラストは全身が収まる contain を基本とし、余白は情景色で埋める */
.hcard .art img.hart,.detail-art img.hart,.resultart img{ object-fit:contain; background:linear-gradient(180deg,#cfe4f7 0%,#dcefd2 78%,#cfe3bd 100%); }
.resultart{ background:linear-gradient(180deg,#cfe4f7 0%,#dcefd2 78%,#cfe3bd 100%); }
.ownset .os-head img{ object-fit:contain; background:#e7efe0; }
.paddock .pad-art{ background:linear-gradient(180deg,#cfe4f7 0%,#dcefd2 78%,#cfe3bd 100%); }
.paddock .pad-art img{ object-fit:contain; }
/* 円形サムネは馬の顔（頭部）に寄せ、耳・鼻先が切れない位置にする */
.hrow img{ object-position:20% 28%; }
/* 人物の顔は上寄せで全体を収める */
.talk img{ object-position:center 20%; }
img.faceimg{ object-position:center 20%; }

/* ============================================================
   見切れ・押しにくさ最終修正（2026-11-08 第5次）
   1) 「次の週へ」だけの状態：#actionbar .ab-btn{flex:none} が
      .ab-wide{flex:1} に勝ち、ボタンが左寄せの小さい表示になっていた。
      ab-wide のときはバー幅いっぱい・高さ64px以上の大ボタンにする。
   2) 馬一覧の円形サムネは横長画像が左右で切れ、馬の鼻先が見切れる。
      横長の角丸サムネに戻し、全身が収まる見え方にする。
   3) 詳細の馬イラストは contain の余白帯で小さく見える。枠の比率を
      画像(3:2)に寄せ、cover で大きく見せる（上下の軽いトリミングのみ）。
   4) HUD（スマホ）：ボタンが巨大な楕円になり2段に膨らむのを防ぎ、
      小さな角丸ボタン＋小さめチップで1〜2段に収める。
   5) 一覧の状態テキストは意味の塊（span.seg）単位で折り返し、
      「疲労」など単語の途中で割れないようにする。
   6) ゲージの LOW/HIGH など極小文字を読みやすい大きさへ。
   ============================================================ */
#actionbar .ab-btn.ab-wide{ flex:1 1 auto !important; width:100%; min-width:0; min-height:64px; font-size:18px; font-weight:900; }
#actionbar:has(> .ab-wide){ padding:10px; }
.hrow img{ width:88px; height:64px; border-radius:10px; object-fit:cover; object-position:center 38%; border:2.5px solid #f2c41c; }
.hr-stat .seg{ white-space:nowrap; }
.detail-art{ aspect-ratio:2.05/1; background:linear-gradient(180deg,#cfe4f7 0%,#dcefd2 78%,#cfe3bd 100%); }
.detail-art img.hart{ object-fit:contain; object-position:center 50%; }
.hcard .art img.hart{ object-fit:contain; object-position:center 50%; }
.hcard .art{ aspect-ratio:2.05/1; background:linear-gradient(180deg,#cfe4f7 0%,#dcefd2 78%,#cfe3bd 100%); }
.resultart img{ object-fit:cover; }
.gauge .glo,.gauge .ghi{ font-size:10.5px; }
.posbar span{ font-size:10px; }
#actionbar .ab-text{ overflow-wrap:break-word; }
@media (max-width:640px){
  #hud{ gap:6px; row-gap:6px; padding:8px 10px; }
  #hud .dchip{ font-size:12.5px; padding:2px 6px; border-radius:6px; }
  #hud .funds{ font-size:15px; }
  #hud .hudchip{ font-size:11.5px; padding:4px 8px; }
  #hud .saved{ font-size:11px; }
  #hud .btn.sm{ min-height:38px; height:38px; padding:4px 13px; font-size:13px; border-radius:10px; flex:none; }
  #actionbar .ab-btn{ min-width:132px; }
  #actionbar .ab-btn.ab-wide{ min-height:66px; font-size:18.5px; }
  /* スマホでは提案バーを縦積みに：本文は幅いっぱいで読みやすく、ボタンも幅いっぱいの大ボタン */
  #actionbar{ flex-direction:column; align-items:stretch; gap:7px; }
  #actionbar .ab-btn{ width:100%; min-height:54px; }
}
/* ============================================================
   見切れ・固定バー最終修正（2026-11-08 第6次）
   A) 能力ゲージ：行を「ラベル｜ランク｜バー列」の3カラムに固定。
      ラベルは固定幅・縮小なし（左端が切れない）、バー列は
      min-width:0 で必ず残り幅に収まる。LOW/HIGH はバーの下段に
      左右へ分けて置き、バーの端に重ねない。
   B) 下部固定バー：「次の週へ」だけの状態（.solo）はバーを
      block 化し、ボタンを display:block / width:100% に固定。
      flex の解釈差でも左寄りの小ボタンにならないようにする。
   ============================================================ */
.gauges{ width:100%; max-width:100%; box-sizing:border-box; margin:10px 0 6px; padding:0 2px; overflow:hidden; }
.gauge{ display:flex; align-items:center; gap:8px; width:100%; max-width:100%; box-sizing:border-box; margin:0 0 8px; height:auto; min-height:0; overflow:visible; background:none; border-radius:0; }
.gauge .gname{ flex:0 0 58px; width:58px; min-width:58px; white-space:nowrap; font-weight:800; font-size:13.5px; text-align:left; }
.gauge .rankb{ flex:none; }
.gauge .gtrack{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.gauge .gbar{ display:block; flex:none; width:100%; height:14px; }
.gauge .gscale{ display:flex; justify-content:space-between; align-items:center; width:100%; line-height:1.3; }
.gauge .glo,.gauge .ghi{ position:static; flex:none; font-size:10.5px; font-weight:900; color:#66755f; }
@media (prefers-color-scheme: dark){ .gauge .glo,.gauge .ghi{ color:#a9bda0; } }
#actionbar.solo{ display:block; padding:10px; }
#actionbar.solo .ab-btn.ab-wide{ display:block; width:100% !important; max-width:none; flex:none; min-height:66px; font-size:18.5px; font-weight:900; margin:0; }
#actionbar .ab-btn.ab-wide{ flex:1 1 100% !important; width:100%; }
/* 下部固定バーは全状態（提案／次の週へのみ／レース後の「帰る」）・
   全幅共通で縦積み：本文ブロックの下に、バー幅いっぱいの大ボタンを置く。
   どの状態でもボタンが右寄り・左寄りの小ボタンにならない。 */
#actionbar{ display:block; padding:10px; }
#actionbar .ab-text{ display:block; margin:0 0 8px; }
#actionbar .ab-btn{ display:block; width:100% !important; max-width:none; min-height:62px; font-size:17px; font-weight:900; margin:0; }
#actionbar.solo .ab-btn{ min-height:66px; font-size:18.5px; }
@media (max-width:640px){
  .gauge{ gap:6px; margin-bottom:7px; }
  .gauge .gname{ flex-basis:54px; width:54px; min-width:54px; font-size:12.5px; }
  .gauge .rankb{ width:25px; height:25px; font-size:14px; border-radius:7px; }
}
/* ============================================================
   見切れ最終確認（2026-11-08 第7次）
   ・馬詳細サマリ（.sumlist）の dd は折り返し指定がなく、スマホ幅で
     「成長型」の説明が数pxはみ出して見切れた。anywhere で必ず折る。
   ・能力ゲージの LOW/HIGH は1語として扱い、途中で割らない。
   ・「次の週へ」だけの状態（.solo）は最終ルールとして再固定：
     バーは block、ボタンは幅100%・中央寄せテキストの大ボタン。
     （実画面で 390px / 1440px 両幅・提案状態とあわせて確認済み）
   ============================================================ */
.sumlist dd{ overflow-wrap:anywhere; }
/* 第7次の anywhere 指定だけでは監査でなお約5pxの見切れが残ったため、
   グリッド側の列定義を minmax(0,1fr) にして列自体が内容に押し広げられない
   ようにし、dd 側も break-all で禁則に引っかかる箇所でも必ず折る */
.sumlist{ grid-template-columns:auto minmax(0,1fr); }
.sumlist dd{ word-break:break-all; }
.gauge .glo,.gauge .ghi{ white-space:nowrap; }
#actionbar.solo{ display:block; text-align:center; }
#actionbar.solo .ab-btn.ab-wide{ display:block; width:100% !important; max-width:none; margin:0 auto; text-align:center; }
/* ============================================================
   モーダルの縦あふれ修正（2026-11-08 第8次）
   ・通常の .box には最大高さがなく、セーブ画面のように縦に長い
     パネルでは「閉じる」ボタンが画面外へ流れて押せなかった。
     全パネルに画面高さ上限＋内部スクロールを持たせる。
   ・セーブ／設定パネルは本文（.ov-body）だけがスクロールし、
     「閉じる／保存して閉じる」を収めた .ov-foot はパネル下部に
     常時固定される（390pxのスマホでも常に見えて押せる）。
   ============================================================ */
#overlay{ padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
#overlay .box{ max-height:calc(100vh - 20px); max-height:calc(100dvh - 20px - env(safe-area-inset-bottom,0px)); overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
#overlay .box.wide{ max-height:calc(100vh - 20px); max-height:calc(100dvh - 20px - env(safe-area-inset-bottom,0px)); }
#overlay .box:has(> .ov-body){ display:flex; flex-direction:column; overflow:hidden; }
#overlay .box > h2{ flex:none; }
#overlay .box > .ov-body{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
#overlay .box > .ov-foot{ flex:none; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding-top:12px; margin-top:12px; border-top:1.5px solid var(--line); background:inherit; }
#overlay .box > .ov-foot .btn{ min-height:52px; flex:1 1 auto; max-width:440px; font-size:15.5px; }
@media (max-width:640px){ #overlay .box{ padding:16px; } }
/* ============================================================
   提案バー併記（2026-11-08 第9次）
   ・提案表示中でも「次の週へ」を小さめの副ボタンとして常時併記し、
     提案を実行しなくても週を進められる状態を保証する。
     提案が無いときは従来どおり全面幅の「次の週へ」(.solo) のまま。
   ============================================================ */
#actionbar .ab-btn.ab-skip{ min-height:48px; font-size:14.5px; font-weight:800; margin-top:8px; }
/* ============================================================
   第10次（2026-11-08）：次週へ移設／直線での視点切替／コーナー再現
   1) 「次の週へ」は上部HUDへ移設したので、下部バーは「次の提案」
      専用に戻す（次週へボタンは下部には置かない）。
   2) レース中の視点切替は、映像の上に重ねたフローティング
      コントロールでも常時できるようにする。最後の直線（真横画角）
      でもスクロールせずに自馬／先頭／全体を切り替えられる。
      あわせて #racectl 自体も下端に吸着させ、操作列が画面外へ
      流れないようにする。
   ============================================================ */
#racewrap{ position:relative; }
#racecam-float{ position:absolute; top:10px; right:10px; z-index:8; display:flex; gap:5px; align-items:center; background:rgba(10,24,14,.82); border:1.5px solid rgba(255,233,168,.65); border-radius:999px; padding:5px 6px; box-shadow:0 4px 12px rgba(0,0,0,.4); }
#racecam-float .rcf-lbl{ color:#ffe9a8; font-size:12px; font-weight:900; padding:0 3px 0 7px; white-space:nowrap; }
#racecam-float .cambtn{ min-height:44px; min-width:58px; padding:7px 10px; font-size:13.5px; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.4); box-shadow:none; }
#racecam-float .cambtn.on{ background:linear-gradient(180deg,#ffe066,#f5a301); color:#3a2400; border-color:#8a5a00; font-weight:900; }
#racecam-float .cambtn:disabled{ opacity:.4; }
#racectl{ }
@media (max-width:640px){
  #racecam-float{ top:8px; right:8px; left:8px; justify-content:flex-end; }
  #racecam-float .cambtn{ flex:1; min-width:0; }
  #hud{ flex-wrap:wrap; }
  #btn-nextweek{ min-height:46px; font-size:15.5px; padding:9px 18px; }
}
/* ============================================================
   第11次（2026-11-08）：次週へ再移設／提案は遷移型に／コーナー強調
   1) 「次の週へ」は上部HUDからも外し、提案バーとタブナビの間に
      専用の全面幅バー（#nextweekbar）を新設してそこへ移す。
      提案バーとは別要素なので、提案の有無に左右されず常時表示され、
      提案ボタンの下に積まれることも上部の小ボタンに埋もれることもない。
   2) 提案から遷移した先で、対象の調教ボタン等を金枠で示す。
   ============================================================ */
#nextweekbar{ background:#fffdf4; border-top:2.5px solid #d9c98a; padding:8px 10px; }
#nextweekbar #btn-nextweek{ display:block; width:100%; min-height:58px; font-size:17.5px; font-weight:900; border-radius:13px; letter-spacing:.04em; }
.guidefocus{ outline:3.5px solid var(--gold-mid) !important; outline-offset:2px; box-shadow:0 0 0 6px rgba(233,188,46,.35), 0 0 18px rgba(233,188,46,.65) !important; }

/* ============================================================
   第16次（2026-11-08）：固定レイアウト化
   ・土台は固定レイアウト（画面切替＋ページ送りで分割）を維持する
   第17次（2026-11-08）：見切れゼロを優先し、内容が入りきらない
   領域ではその領域内だけスクロールを戻す（ページ全体は固定のまま）。
   スクロールするのは表示領域の中身だけ：サブパネル／フィルパネル／
   ビュー全体の保険／オーバーレイ本文。収まる画面では従来どおり
   スクロールは発生しない
   ============================================================ */
html,body{ height:100%; overflow:hidden; }
#app{ height:100dvh; }
#main{ overflow:hidden; padding:8px; }
#sceneband{ height:46px; margin:6px 8px 0; overflow:hidden; }
#sceneband img{ height:100%; width:100%; object-fit:cover; }
.view{ display:none; height:100%; }
.view.on{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
.subnav{ display:flex; gap:6px; flex:none; }
.subnav button{ flex:1 1 0; min-width:0; min-height:42px; border-radius:10px; border:2px solid #cbbd7a; background:#fffdf4; font-weight:800; font-size:13px; color:var(--ink); padding:4px 2px; white-space:normal; line-height:1.25; }
.subnav button.on{ background:linear-gradient(180deg,#ffe066,#f5b90d); border-color:#b8860b; color:#3a2400; }
.subpanel{ display:none; flex:1 1 auto; min-height:0; }
.subpanel.on{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
.pager{ display:flex; gap:10px; align-items:center; justify-content:center; flex:none; min-height:40px; }
.pager .btn{ min-height:40px; }
.fillpanel{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
table{ font-size:12.5px; }
th,td{ padding:4px 6px; }
@media (max-width:719px){ .optcol{ display:none; } }
@media (min-width:900px){ .hgrid{ grid-template-columns:repeat(2,1fr); } .rgrid{ grid-template-columns:repeat(2,1fr); } .tgrid{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:899px){ .tgrid{ grid-template-columns:repeat(2,1fr); } }
#overlay .box{ max-height:calc(100dvh - 14px); display:flex; flex-direction:column; }
#overlay .box>.ov-body{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
#racewrap{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
#racecv{ flex:1 1 auto; min-height:0; }
.subpanel .panel, .subpanel .guidebox{ margin:0; }
.hcard, .rcard{ min-width:0; }

/* 第13次：提案から着地した調教を、その場で実行できる固定バー（調教画面の上部に吸着）。
   提案ボタン→このバーの実行ボタン→次の提案、とボタンの連打だけで週が進む */
.tpropbar{ display:flex; gap:10px; align-items:center; background:#fff8dc; border:2.5px solid var(--gold-mid); border-radius:14px; padding:10px 12px; margin:10px 0; box-shadow:0 6px 18px rgba(120,84,0,.28); }
.tpropbar .tp-text{ flex:1; min-width:0; font-weight:700; font-size:14.5px; line-height:1.45; }
.tpropbar .tp-kicker{ display:block; font-size:11.5px; font-weight:900; color:#b8860b; letter-spacing:.08em; }
.tpropbar .tp-exec{ flex:none; min-height:54px; font-size:16.5px; padding:10px 20px; }
.tpropbar .tp-cancel{ flex:none; }
@media (max-width:640px){ .tpropbar{ flex-wrap:wrap; } .tpropbar .tp-exec{ flex:1 1 100%; width:100%; } }
/* ============================================================
   第15次（2026-11-08）：オート（提案どおり）バー
   提案バーと次週バーの間に置く専用バー。実行中は状態と停止
   ボタンを出し、提案バー・次週バーは隠して誤操作を防ぐ。
   あわせてレース中の視点ボタンは映像上のフローティング
   1組のみに統一（下部操作列の重複を廃止）。
   ============================================================ */

/* 馬詳細のコンパクト表示（固定パネルに収めるため、大きな画像と秘書の吹き出しは一覧側に任せる） */
.compact-detail .detail-art{ display:none; }
.subpanel .farmmap>img{ height:168px; }
.compact-detail .talk{ display:none; }
.compact-detail .gauges{ display:grid; grid-template-columns:1fr 1fr; gap:1px 16px; }
.compact-detail .gauge{ margin:0; }
.compact-detail h2.sec{ margin:0 0 6px; }

#autobar{ background:#edf6ec; border-top:2.5px solid #8fbf7f; padding:8px 10px; display:flex; gap:10px; align-items:center; }
#autobar .ab-text{ flex:1; min-width:0; font-weight:700; font-size:14px; line-height:1.45; overflow-wrap:break-word; }
#autobar .ab-kicker{ display:block; font-size:11.5px; font-weight:900; color:#2e7d32; letter-spacing:.08em; }
#autobar .ab-btn{ flex:none; min-height:52px; font-size:15.5px; font-weight:900; padding:10px 18px; }
@media (max-width:640px){ #autobar{ flex-direction:column; align-items:stretch; gap:7px; } #autobar .ab-btn{ width:100%; } }

/* ============================================================
   第18次（2026-11-08）：配色の統一（トンマナ）
   ・色数は「基調の緑＋アクセントの金＋無彩色」に絞り、彩度を落とす
   ・紫（HUD／タブ／レース操作列）と空色（背景）は基調の深緑へ寄せる
   ・青系の情報色は緑寄りのスレートに落として画面ごとの色バラつきをなくす
   ・意味の色分けは維持：通常=緑／確定=金／戻る=淡色／危険=赤
     （レース傾向タグも彩度を落とした3色にそろえる）
   ============================================================ */
body{ background:linear-gradient(180deg,#e7efe1 0%,#dde7d2 45%,#d2dfc2 100%); }
@media (prefers-color-scheme:dark){
  body{ background:linear-gradient(180deg,#131f16 0%,#182619 45%,#1d2f1e 100%); }
}
#hud{ background:linear-gradient(180deg,#2e7d46,#1d5c33); box-shadow:0 4px 14px rgba(16,52,28,.35); }
#hud .dchip{ color:#1d5c33; box-shadow:inset 0 -2px 0 rgba(29,92,51,.25); }
#tabs{ background:linear-gradient(180deg,#2e7d46,#1d5c33); }
#racectl{ background:linear-gradient(180deg,#2e7d46,#1d5c33); }
.btn.blue{ background:linear-gradient(180deg,#5d7f6e 0%,#476b58 52%,#37543f 100%); }
.trendtag.kire{ background:#8a6d3b; }
.trendtag.jizoku{ background:#4a6b5d; }
.trendtag.shoumo{ background:#a34a3c; }
.rankC{ color:#4a6b5d; }
.wd-arw{ color:#4a6b5d; }
/* ============================================================
   第19次（2026-11-08）：固定要素の圧迫解消（画面が殆ど見えない対策）
   1) #main を flex 縦積みに変更。従来 .view{height:100%} が
      シーンバンド（約52px）分だけ #main からはみ出し、overflow:hidden
      でビューの下端（ページ送り・最下部のボタン）が常時隠れていた。
      flex:1＋min-height:0 でバンドとビューが正確に収まるようにする。
   2) 下部の3バー（提案／オート／次週へ）を横並び・薄型にし、タブも
      薄くして、固定要素の合計高さを大幅に削減する。
   3) 「下のバーを畳む」トグル（#docktoggle）を追加。畳むと提案／
      オートバーが消え、次週へバーとタブだけが残る（オート実行中は
      停止ボタンのあるオートバーを残す）。
   4) 秘書パネル（#todo）も薄型化。縦の短い画面ではシーンバンドを
      隠してコンテンツ領域を優先する。
   ============================================================ */
#main{ display:flex; flex-direction:column; }
#sceneband{ flex:none; height:38px; margin:4px 8px 0; }
.view{ flex:1 1 auto; min-height:0; height:auto; }
#todo:empty{ display:none; }
#hud{ padding:7px 10px; }
#todo{ margin:4px 6px 0; padding:6px 10px; gap:8px; }
#todo img.secface{ width:40px; height:40px; }
#todo .sectext{ font-size:12.5px; line-height:1.4; }
#todo .secbtns{ margin-top:4px; }
#todo .secbtns button{ min-height:34px; padding:4px 11px; }
/* 提案バー：本文（左）とボタン（右）の横並びにし、縦積みの巨大バーをやめる */
#actionbar{ display:flex; align-items:center; gap:10px; padding:7px 10px; min-height:0; }
#actionbar .ab-text{ flex:1 1 auto; min-width:0; margin:0; font-size:13.5px; line-height:1.4; }
#actionbar .ab-kicker{ font-size:11px; }
#actionbar .ab-btn, #actionbar .ab-btn.ab-wide, #actionbar.solo .ab-btn, #actionbar.solo .ab-btn.ab-wide{ display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto !important; width:auto !important; max-width:none; min-width:150px; min-height:48px; font-size:15px; font-weight:900; margin:0; padding:8px 18px; }
#actionbar.solo{ display:flex; padding:7px 10px; text-align:left; }
#actionbar .ab-btn.ab-skip{ min-height:44px; min-width:0; font-size:13.5px; }
/* オートバー：薄型化（スマホでもボタンは横並び1段） */
#autobar{ padding:6px 10px; gap:8px; }
#autobar .ab-text{ font-size:12.5px; line-height:1.4; }
#autobar .ab-kicker{ font-size:11px; }
#autobar .ab-btn{ min-height:44px; font-size:14px; padding:7px 14px; }
/* 次週へバー：薄型化 */
#nextweekbar{ padding:5px 10px; }
#nextweekbar #btn-nextweek{ min-height:46px; font-size:16px; }
/* タブ：薄型化 */
#tabs{ padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px)); }
#tabs button{ min-height:44px; }

@media (max-width:640px){
  #hud{ padding:6px 8px; }
  #todo .secbtns button{ min-height:38px; }
  #actionbar .ab-btn, #actionbar .ab-btn.ab-wide, #actionbar.solo .ab-btn.ab-wide{ min-width:124px; min-height:50px; font-size:14.5px; padding:8px 12px; }
  #autobar{ flex-direction:row; flex-wrap:wrap; align-items:center; }
  #autobar .ab-text{ flex:1 1 100%; }
  #autobar .ab-btn{ flex:1 1 0; width:auto; min-height:44px; }
  #tabs button{ min-height:42px; font-size:13px; }
}
@media (max-height:620px){
  #sceneband{ display:none; }
  #tabs button{ min-height:38px; }
  #nextweekbar #btn-nextweek{ min-height:42px; }
}
/* ============================================================
   第20次（2026-11-08）：スマホでスクロール領域が殆ど見えない対策
   原因は旧ルールの競合だった（第19次の薄型化が一部効いていなかった）：
   ・#tabs が ≤640px で 4列グリッド＝2段になっていた
   ・#actionbar が ≤640px で縦積み（本文＋全幅ボタン）になっていた
   ・#autobar が本文を全幅にしてボタンを下段に置いていた
   ・#hud が折り返して2段になっていた
   固定バーの合計が画面の約半分を占め、セールのような一覧画面で
   スクロールできる範囲が極端に狭かった。以下で ≤640px では全て
   横並び1段に統一し、固定要素の合計高さを最小化する。
   （畳むトグル・オート実行中の表示切替は従来どおり動く）
   ============================================================ */
@media (max-width:640px){
  /* HUD：1段に固定（「保存済み」は省スペースのため隠す） */
  #hud{ flex-wrap:nowrap; gap:4px; padding:6px; }
  #hud .date{ font-size:12px; white-space:nowrap; letter-spacing:0; }
  #hud .funds{ font-size:12.5px; white-space:nowrap; letter-spacing:0; }
  #hud .hudchip{ font-size:10.5px; padding:3px 6px; white-space:nowrap; }
  #hud .saved{ display:none; }
  #hud .sp{ min-width:0; }
  #hud .btn.sm{ min-height:38px; padding:5px 8px; font-size:12px; white-space:nowrap; }
  /* タブ：8ボタンを1段に（グリッド2段をやめる） */
  #tabs{ display:flex; flex-wrap:nowrap; gap:4px; padding:4px 5px calc(4px + env(safe-area-inset-bottom,0px)); }
  #tabs button{ flex:1 1 0; min-width:0; min-height:44px; font-size:12px; padding:5px 1px; white-space:nowrap; }
  /* 提案バー：本文（左）＋ボタン（右）の横並び1段（縦積みをやめる） */
  #actionbar{ flex-direction:row; align-items:center; gap:8px; padding:6px 8px; }
  #actionbar .ab-kicker{ display:none; }
  #actionbar .ab-text{ font-size:12.5px; line-height:1.35; }
  #actionbar .ab-btn, #actionbar .ab-btn.ab-wide{ min-width:112px; min-height:46px; font-size:14px; padding:7px 12px; }
  #actionbar .ab-btn.ab-skip{ min-height:42px; min-width:0; font-size:12.5px; padding:6px 9px; }
  /* オートバー：本文＋2ボタンを横並び1段に（本文の全幅行をやめる） */
  #autobar{ flex-direction:row; flex-wrap:nowrap; align-items:center; gap:6px; padding:6px 8px; }
  #autobar .ab-kicker{ display:none; }
  #autobar .ab-text{ flex:1 1 auto; min-width:0; font-size:11.5px; line-height:1.35; }
  #autobar .ab-btn{ flex:0 0 auto; width:auto; min-height:44px; font-size:13px; padding:7px 10px; white-space:nowrap; }
  /* 次週へバー・畳むトグル帯：薄く */
  #nextweekbar{ padding:4px 8px; }
  #nextweekbar #btn-nextweek{ min-height:44px; font-size:15px; }
  /* サブナビ：少し低くして一覧の表示行を増やす */
  .subnav{ gap:5px; }
  .subnav button{ min-height:38px; font-size:12.5px; }
  /* カード画像を横長にして1枚の高さを抑え、一覧で多く見えるようにする */
  #main{ padding:8px; }
  .hcard{ padding:9px; }
  .hcard .art{ aspect-ratio:2.9/1; }
}
/* さらに狭い画面では所有頭数チップを畳んでセーブ／設定を必ず収める */
@media (max-width:380px){
  #hud .hudchip{ display:none; }
  #tabs button{ font-size:11px; }
}
/* ============================================================
   第21次（2026-11-08）：セール画面の表示領域を最大化
   セール（と市場）の一覧を開いている間は、情景バンドと秘書
   パネルを畳んで一覧そのものに画面を譲る（#app.list-focus）。
   あわせてセールのカードを「1頭＝1行」のコンパクトな行に
   組み替え、全頭（5頭）をページ送りなしで一覧できるようにする。
   ページ送りが必要な場合も、送りボタンはパネル下端に吸着して
   スクロール位置によらず常に押せる。
   ============================================================ */
#app.list-focus #sceneband{ display:none; }
#app.list-focus #todo{ display:none !important; }
.subpanel[data-panel="farm:sale"]{ gap:6px; }
.subpanel[data-panel="farm:sale"] h2.sec{ margin:0; padding:6px 10px; font-size:16px; }
.sale-funds{ font-size:12.5px; font-weight:800; color:var(--ink2); padding:0 2px; }
.salelist{ display:flex; flex-direction:column; gap:6px; }
.salecard{ display:flex; gap:10px; align-items:center; background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; box-shadow:var(--shadow); min-width:0; }
.salecard .sc-main{ flex:1 1 auto; min-width:0; }
.salecard .sc-name{ font-size:15.5px; font-weight:900; line-height:1.3; overflow-wrap:anywhere; }
.salecard .sc-meta{ font-size:12px; color:var(--ink2); line-height:1.4; overflow-wrap:anywhere; }
.salecard .sc-stats{ font-size:12px; line-height:1.45; margin-top:2px; }
.salecard .sc-eval{ font-size:11.5px; color:var(--ink2); line-height:1.4; }
.salecard .sc-actions{ display:flex; flex-direction:column; gap:5px; flex:none; }
.salecard .sc-actions .btn{ min-width:150px; min-height:44px; white-space:nowrap; }
.subpanel .pager{ background:var(--panel2); padding:6px 0 2px; }
@media (max-width:640px){
  .salecard{ flex-direction:column; align-items:stretch; gap:6px; padding:8px 9px; }
  .salecard .sc-actions{ flex-direction:row; }
  .salecard .sc-actions .btn{ flex:1 1 0; min-width:0; font-size:13px; padding:7px 6px; }
}
/* ============================================================
   第22次（2026-11-08）：Duolingo系デザインシステム（サカタケ Design System）へ全面統一
   ・基調：Primary #58CC02（下辺 #58A700）／Secondary #1CB0F6／
     注目 #FFC800／危険 #FF4B4B／文字 #3C3C3C・補足 #777777／
     背景は白、面 #F7F7F7、枠線 #E5E5E5
   ・カード：白地＋2px枠＋角丸20px＋下辺シャドウ 0 4px 0 #E5E5E5。
     入れ子にしない（内側の箱は面色＋無影）
   ・ボタン：角丸12px＋下辺4pxの「押せる」造形。タップで2px沈む（約80ms）
   ・書体：システムゴシック（ヒラギノ角ゴ／Noto Sans JP／游ゴシック）。見出し800／ラベル700、本文15-18px
   ・紫バー・金リボン・金属グラデ・発光などの旧装飾はすべて置き換える
   ・動きはボタンの押し込みのみ。常時アニメーションは置かない
   ============================================================ */
:root{
  --bg:#ffffff; --bg2:#ffffff; --panel:#ffffff; --panel2:#f7f7f7; --ink:#3c3c3c; --ink2:#777777;
  --line:#e5e5e5; --green:#58cc02; --green2:#58cc02; --gold:#ffc800; --gold2:#ffc800;
  --gold-mid:#ffc800; --gold-hi:#ffc800; --gold-lo:#58a700;
  --red:#ff4b4b; --blue:#1cb0f6; --chip:#f7f7f7; --bar:#e5e5e5;
  --shadow:0 4px 0 #e5e5e5; --shadow-lg:0 4px 0 #e5e5e5, 0 14px 30px rgba(60,60,60,.14);
  --panel-grad:#ffffff; --panel2-grad:#f7f7f7; --head-grad:#58cc02; --inset-hi:none;
  --duo-green-d:#58a700; --duo-blue-d:#1899d6; --duo-yellow-d:#e0a800;
}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  background:#ffffff; color:var(--ink); font-size:16px; font-weight:700; line-height:1.55;
}
#app{ background:#ffffff; box-shadow:none; }
a{ color:var(--blue); }
:focus-visible{ outline:3px solid var(--blue); outline-offset:1px; }
/* ---- HUD：白バー＋下枠。資金は太字の文字色（金グラデ文字は廃止） ---- */
#hud{ background:#ffffff; color:var(--ink); border-bottom:2px solid var(--line); border-radius:0; margin:0; box-shadow:none; text-shadow:none; }
#hud .date{ color:var(--ink); font-weight:800; }
#hud .dchip{ background:var(--chip); color:var(--ink); border:2px solid var(--line); border-radius:8px; box-shadow:none; font-weight:800; }
#hud .funds{ color:var(--ink); background:none; -webkit-text-fill-color:currentColor; filter:none; font-weight:900; }
#hud .funds.neg{ color:var(--red); -webkit-text-fill-color:currentColor; }
.hudchip{ background:var(--chip); border:2px solid var(--line); color:var(--ink); box-shadow:none; font-weight:800; }
.saved{ color:var(--ink2); text-shadow:none; }
#hud .btn.ghost{ background:#ffffff; color:var(--blue); border-color:var(--line); }
/* ---- タブ：白ピルではなく、面色バー＋選択中は緑フィル ---- */
#tabs{ background:#ffffff; border-top:2px solid var(--line); margin:0; border-radius:0; box-shadow:none; }
#tabs button{ background:#ffffff; color:var(--ink2); border:2px solid var(--line); border-bottom:4px solid var(--line); border-radius:12px; font-weight:800; box-shadow:none; text-shadow:none; transition:transform .08s ease, border-bottom-width .08s ease; }
#tabs button:active{ transform:translateY(2px); border-bottom-width:2px; }
#tabs button.on{ background:var(--green); color:#ffffff; border-color:var(--green); border-bottom:4px solid var(--duo-green-d); box-shadow:none; font-weight:900; }
/* ---- メイン面：白キャンバス ---- */
#main{ background:#ffffff; border-radius:0; margin:0; box-shadow:none; border-top:none; }
/* 情景バンド：写真帯はやめ、面色の見出し帯に（タイトルは太字の文字） */
#sceneband{ background:var(--chip); border:2px solid var(--line); border-radius:16px; box-shadow:none; }
#sceneband .sb-cap{ color:var(--ink); text-shadow:none; }
#sb-title{ color:var(--ink); text-shadow:none; font-weight:900; }
#sb-sub{ color:var(--ink2); text-shadow:none; }
/* ---- カード：白＋2px枠＋角丸20px＋下辺シャドウ。入れ子は面色で無影 ---- */
.panel,.hcard,.rcard,.jcard,.focusbox,.guidebox,.hrow,.talk,.salecard,details.fold,div.fold,.farmmap,.ownset{
  background:#ffffff; background-image:none; border:2px solid var(--line); border-radius:20px; box-shadow:0 4px 0 #e5e5e5;
}
.quad,.parentcard,.evalbox,.jcell,.calcell,.entryline,.gcard,.planbox,.hallcard,.ticket,.posbar,.facrow,.tbtn,details.fold>.foldbody>.panel{
  background:var(--chip); background-image:none; border:2px solid var(--line); box-shadow:none;
}
.quad,.parentcard,.evalbox,.jcell,.calcell,.entryline,.gcard,.planbox,.hallcard,.facrow{ border-radius:16px; }
.ticket{ border-radius:16px; }
.focusbox{ border-color:var(--gold); }
.guidebox{ border-color:var(--gold); box-shadow:0 4px 0 #e5e5e5; }
.hcard:hover{ transform:none; box-shadow:0 4px 0 #e5e5e5; }
.hcard.sel,.rcard.sel,.hrow.sel,.facrow.sel{ border-color:var(--blue); box-shadow:0 0 0 2px var(--blue), 0 4px 0 #e5e5e5; background:#ffffff; }
.hcard .art,.detail-art{ border:2px solid var(--line); border-radius:14px; box-shadow:none; }
.hcard .art::after,.detail-art::after{ display:none; }
.hcard .art img.hart,.detail-art img.hart{ filter:none; }
.zekken{ background:#ffffff; border:2px solid var(--line); color:var(--ink); box-shadow:none; border-radius:8px; }
.coatlb{ background:#3c3c3c; color:#ffffff; box-shadow:none; }
.hrow img{ border:2px solid var(--line); }
img.faceimg,.gcard img.gface,#todo img.secface,.talk img{ border:2px solid var(--gold); box-shadow:none; }
/* ---- 見出し：バーの塗りをやめ、太字の文字＋緑の丸マーカー ---- */
h2.sec{ background:none; color:var(--ink); border:none; border-radius:0; box-shadow:none; text-shadow:none; font-size:20px; font-weight:800; padding-left:2px; }
h2.sec::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--green); transform:none; border:none; box-shadow:none; flex:none; }
h2.sec .tag{ background:var(--gold); color:var(--ink); border-radius:999px; box-shadow:none; text-shadow:none; font-weight:800; }
.panel h3{ color:var(--ink); border-bottom:2px solid var(--line); border-image:none; font-weight:800; }
.quad h4{ color:var(--ink); border-bottom:2px solid var(--line); }
/* 名前バー：木札・緑バーをやめ、白カード＋太字 */
.namebar{ background:#ffffff; border:2px solid var(--line); border-radius:16px; box-shadow:0 4px 0 #e5e5e5; overflow:visible; }
.namebar::after{ display:none; }
.namebar .nb-name{ color:var(--ink); text-shadow:none; font-weight:900; }
.namebar .nb-sub{ background:var(--chip); color:var(--ink2); border:2px solid var(--line); }
/* リボン・バッジ・タグ類：色＋文字で意味を持たせる（装飾グラデは廃止） */
.ribbon{ background:var(--gold); color:var(--ink); border:none; box-shadow:none; border-radius:999px; font-weight:800; }
.ribbon.sub{ background:var(--chip); color:var(--ink2); border:2px solid var(--line); }
.badge{ background:var(--chip); color:var(--ink); border:2px solid var(--line); box-shadow:none; font-weight:800; }
.badge.g1,.sale-tag{ background:var(--gold); color:var(--ink); border:2px solid var(--gold); box-shadow:none; text-shadow:none; }
.badge.win{ background:var(--green); color:#ffffff; border-color:var(--green); text-shadow:none; }
.gtag{ background:var(--chip); color:var(--ink); border:2px solid var(--line); box-shadow:none; text-shadow:none; }
.gtag.G1{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.gtag.G2{ background:var(--blue); color:#ffffff; border-color:var(--blue); }
.gtag.G3{ background:var(--green); color:#ffffff; border-color:var(--green); }
.gtag.OP{ background:var(--chip); color:var(--ink2); }
.trendtag{ box-shadow:none; text-shadow:none; }
.trendtag.kire{ background:var(--gold); color:var(--ink); }
.trendtag.jizoku{ background:var(--blue); color:#ffffff; }
.trendtag.shoumo{ background:var(--red); color:#ffffff; }
.pop{ background:var(--red); color:#ffffff; box-shadow:none; }
.mini{ background:var(--chip); color:var(--ink); border:2px solid var(--line); box-shadow:none; }
.mini.good{ background:var(--green); color:#ffffff; border-color:var(--green); }
.mini.warn{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.mini.bad{ background:#ffffff; color:var(--red); border-color:var(--red); }
.trait{ background:var(--chip); border:2px solid var(--line); color:var(--ink); box-shadow:none; }
.trait.plus{ background:var(--green); color:#ffffff; border-color:var(--green); }
.trait.minus{ background:#ffffff; color:var(--red); border-color:var(--red); }
.trait.up{ background:var(--gold) !important; color:var(--ink) !important; border:2px solid var(--gold) !important; box-shadow:none !important; }
.trait.uq{ background:#ffffff !important; color:var(--ink) !important; border:2px solid var(--blue) !important; box-shadow:none !important; }
.aptchip{ background:#ffffff; border:2px solid var(--line); color:var(--ink); box-shadow:none; }
.aptchip.on{ background:var(--green); color:#ffffff; border-color:var(--green); text-shadow:none; }
.aptchip.strong{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.aptchip b{ color:inherit; }
.cls-badge{ background:var(--green); color:#ffffff; border:none; }
.wd-arw{ color:var(--blue); }
.hr-name{ background:none; color:var(--ink); border-radius:0; padding:0; }
.hr-sex{ color:var(--ink2); }
.wpentry,.passbadge{ background:var(--gold); color:var(--ink); }
.wpentry.now{ background:var(--red); color:#ffffff; }
.steps span,.gsteps span{ background:var(--chip); border:2px solid var(--line); color:var(--ink2); box-shadow:none; }
.gsteps span.done{ background:var(--green); border-color:var(--green); color:#ffffff; }
.gsteps span.cur{ background:var(--gold); border-color:var(--gold); color:var(--ink); box-shadow:none; }
.stylearrows .sa{ background:#ffffff; border:2px solid var(--line); color:var(--ink2); }
.stylearrows .sa.on{ background:var(--green); border-color:var(--green); color:#ffffff; box-shadow:none; }
.posbar span{ background:#ffffff; border:2px solid var(--line); color:var(--ink2); box-shadow:none; }
.posbar span.on{ background:var(--gold); color:var(--ink); border-color:var(--gold); box-shadow:none; }
.posbar span.spec{ background:var(--blue); color:#ffffff; border-color:var(--blue); }
.fchip{ background:var(--chip); border:2px solid var(--line); color:var(--ink); box-shadow:none; }
.formgrp .fchip.me{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.cupgrid span{ background:#ffffff; border:2px solid var(--line); }
.cupgrid span.got{ background:var(--gold); border-color:var(--gold); color:var(--ink); box-shadow:none; }
.faccirc{ background:var(--green); color:#ffffff; border:none; box-shadow:none; }
.stars{ color:var(--duo-yellow-d); text-shadow:none; }
.hearts{ color:var(--red); text-shadow:none; }
.hearts .off{ color:var(--line); }
/* ランク表示：パレット内の色に置き換え（金属グラデ文字は廃止） */
.rankmark{ text-shadow:none; }
.rankS,.rankA,.rankB,.rankC{ background:none; -webkit-background-clip:initial; background-clip:initial; color:inherit; filter:none; }
.rankS{ color:var(--red); } .rankA{ color:var(--duo-yellow-d); } .rankB{ color:var(--duo-green-d); } .rankC{ color:var(--blue); } .rankD{ color:var(--ink2); }
.rankb{ box-shadow:none; }
.rkS{ background:var(--red); color:#ffffff; } .rkA{ background:var(--gold); color:var(--ink); } .rkB{ background:var(--green); color:#ffffff; } .rkC{ background:var(--blue); color:#ffffff; } .rkD{ background:#777777; color:#ffffff; } .rkE{ background:var(--chip); color:var(--ink2); }
.evalbox .ev{ background:none; -webkit-background-clip:initial; background-clip:initial; color:var(--ink); }
/* 数値バー／ゲージ：ベタ塗り（緑＝通常／黄＝高） */
.stat .bar,.gauge,.distbar,.facbar{ background-color:var(--bar); background-image:none; box-shadow:none; }
.stat .bar i,.gauge i{ background:var(--green); background-image:none; box-shadow:none; }
.stat .bar i.hot{ background:var(--gold); background-image:none; box-shadow:none; }
.gauge .gbar{ background:var(--bar); }
.gbar i{ background:var(--green); }
.gauge i.add{ background:var(--gold); }
.distbar i{ background:var(--green); background-image:none; }
.distbar b{ background:var(--ink); box-shadow:none; }
.facbar i.base{ background:var(--green); } .facbar i.inc{ background:var(--gold); }
.facrow .pips{ color:var(--duo-yellow-d); } .facrow .pips .off{ color:var(--line); }
/* テーブル：面色の見出し行＋枠線のみ */
table th{ background:var(--chip); color:var(--ink2) !important; border-bottom:2px solid var(--line); text-shadow:none; }
tr.mine{ background:rgba(255,200,0,.16) !important; box-shadow:inset 3px 0 0 var(--gold); }
tr.win td{ font-weight:800; }
.rank-me{ background:rgba(255,200,0,.16) !important; }
.legend-detail td{ background:var(--chip); }
.pedigree td{ background:var(--chip); }
.pedigree td .mk{ background:#ffffff; border:2px solid var(--line); }
.pedigree td .mk.hot{ background:#ffffff; color:var(--red); border-color:var(--red); }
/* ---- ボタン：下辺4pxの「押せる」造形（意味色は固定） ---- */
button{ border-radius:12px; font-weight:800; }
.btn{
  background:var(--green); color:#ffffff; border:2px solid var(--green); border-bottom:4px solid var(--duo-green-d);
  box-shadow:none; text-shadow:none; min-height:48px;
  transition:transform .08s ease, border-bottom-width .08s ease, filter .08s ease;
}
.btn:hover{ filter:brightness(1.03); }
.btn:active{ transform:translateY(2px); border-bottom-width:2px; box-shadow:none; }
.btn.gold{ background:var(--gold); color:var(--ink); border-color:var(--gold); border-bottom:4px solid var(--duo-yellow-d); text-shadow:none; }
.btn.gold:active{ border-bottom-width:2px; }
.btn.ghost{ background:#ffffff; color:var(--blue); border:2px solid var(--line); border-bottom:4px solid var(--line); box-shadow:none; text-shadow:none; }
.btn.ghost:active{ border-bottom-width:2px; }
.btn.blue{ background:var(--blue); color:#ffffff; border-color:var(--blue); border-bottom:4px solid var(--duo-blue-d); }
.btn.blue:active{ border-bottom-width:2px; }
.btn.red{ background:#ffffff; color:var(--red); border:2px solid var(--red); border-bottom:4px solid var(--red); }
.btn.red:active{ border-bottom-width:2px; }
.btn:disabled{ opacity:.45; box-shadow:none; }
.btn.glow{ animation:none; box-shadow:none; }
#btn-nextweek.glow{ animation:none; }
#btn-nextweek{ background:var(--green); color:#ffffff; border-color:var(--green); border-bottom:4px solid var(--duo-green-d); }
/* 副次ボタン群（サブナビ／詳細タブ／作戦／馬券／絞り込み等）も同じ造形に */
.subnav button,.dtabs button,.tacbtns button,.ranktabs button,.betpick button,.silkpick button{
  background:#ffffff; color:var(--ink2); border:2px solid var(--line); border-bottom:4px solid var(--line);
  border-radius:12px; box-shadow:none; font-weight:800;
  transition:transform .08s ease, border-bottom-width .08s ease;
}
.subnav button:active,.dtabs button:active,.tacbtns button:active,.ranktabs button:active,.betpick button:active,.silkpick button:active{ transform:translateY(2px); border-bottom-width:2px; }
.subnav button.on,.dtabs button.on,.tacbtns button.on,.ranktabs button.on{ background:var(--green); color:#ffffff; border-color:var(--green); border-bottom:4px solid var(--duo-green-d); box-shadow:none; text-shadow:none; }
.betpick button.on{ background:var(--gold); color:var(--ink); border-color:var(--gold); border-bottom:4px solid var(--duo-yellow-d); box-shadow:none; }
.silkpick button.on{ outline:none; box-shadow:0 0 0 2px var(--blue); }
.dtabs button{ border-radius:12px; }
.tbtn{ transition:transform .08s ease, border-bottom-width .08s ease; }
.tbtn:hover{ box-shadow:0 4px 0 #e5e5e5; }
.tbtn:active{ transform:translateY(2px); }
.gcard .gx{ color:var(--ink2); }
.guidefocus{ outline:3px solid var(--blue) !important; outline-offset:2px; box-shadow:none !important; }
/* フォーム：2px枠＋角丸12px、フォーカスは青の3pxアウトライン */
select,input[type=text],input[type=number],textarea{
  border:2px solid var(--line); border-radius:12px; background:var(--chip); background-image:none;
  color:var(--ink); box-shadow:none; font-weight:700; min-height:48px;
}
select:focus,input[type=text]:focus,input[type=number]:focus,textarea:focus{ outline:3px solid var(--blue); outline-offset:0; border-color:var(--blue); background:#ffffff; }
/* 秘書パネル：白カード（金の縁・吹き出し装飾は廃止） */
#todo{ background:#ffffff; border:2px solid var(--line); border-bottom:2px solid var(--line); border-radius:20px; box-shadow:0 4px 0 #e5e5e5; }
#todo .secbtns button{ background:var(--green); color:#ffffff; border:2px solid var(--green); border-bottom:4px solid var(--duo-green-d); border-radius:12px; box-shadow:none; text-shadow:none; }
#todo .secbtns button.sub{ background:#ffffff; color:var(--blue); border-color:var(--line); border-bottom:4px solid var(--line); }
#todo .secname{ color:var(--ink2); }
#weekplan{ color:var(--ink2); }
/* 下部バー類：白＋上枠に統一（紫・クリーム・金の帯は廃止） */
#actionbar{ background:#ffffff; border-top:2px solid var(--line); box-shadow:none; }
#actionbar .ab-kicker{ color:var(--ink2); }
#autobar{ background:var(--chip); border-top:2px solid var(--line); }
#autobar .ab-kicker{ color:var(--ink2); }
#nextweekbar{ background:#ffffff; border-top:2px solid var(--line); }
#nextweekbar #btn-nextweek{ border-radius:12px; }
.actionbar{ background:#ffffff; border:2px solid var(--line); border-radius:16px; box-shadow:0 4px 0 #e5e5e5; }
.tpropbar{ background:#ffffff; border:2px solid var(--gold); border-radius:16px; box-shadow:0 4px 0 #e5e5e5; }
.tpropbar .tp-kicker{ color:var(--ink2); }
.ownbet{ background:var(--chip); border:2px dashed var(--gold); }
.ownbet.done{ background:var(--chip); }
.ownset .os-ready.no{ background:#ffffff; color:var(--red); border:2px solid var(--red); }
.ownset .os-ready.ok{ background:var(--green); color:#ffffff; }
.entryline.now{ border-color:var(--red); background:#ffffff; }
.bigcount.now,.disreason{ color:var(--red); }
/* 牧場マップのマーカー */
.farmmap{ box-shadow:0 4px 0 #e5e5e5; }
.fmark{ background:#ffffff; border:2px solid var(--line); color:var(--ink); border-radius:12px; box-shadow:0 3px 0 #e5e5e5; }
.fmark.built{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
/* ---- レース画面：3D表示はそのまま。枠・操作UIだけ白基調に ---- */
#racewrap{ border:2px solid var(--line); border-radius:20px; box-shadow:0 4px 0 #e5e5e5; }
#racehud{ background:#3c3c3c; color:#ffffff; }
#racehud .rh-pos{ color:var(--gold); }
#commentary{ background:#ffffff; color:var(--ink); border-top:2px solid var(--line); text-shadow:none; }
#racectl{ background:#ffffff; border-top:2px solid var(--line); }
#racectl .btn.ghost{ background:#ffffff; color:var(--blue); border-color:var(--line); }
#racectl .btn.on,.spdctl .btn.spd.on,.camctl .btn.cambtn.on,#racectl .btn.mapbtn.on{ background:var(--green); color:#ffffff; border-color:var(--green); box-shadow:none; font-weight:900; }
#racecam-float{ background:#ffffff; border:2px solid var(--line); border-radius:999px; box-shadow:0 4px 0 rgba(60,60,60,.25); }
#racecam-float .rcf-lbl{ color:var(--ink2); }
#racecam-float .cambtn{ background:#ffffff; color:var(--ink2); border:2px solid var(--line); border-bottom:4px solid var(--line); box-shadow:none; }
#racecam-float .cambtn.on{ background:var(--green); color:#ffffff; border-color:var(--green); border-bottom:4px solid var(--duo-green-d); }
.posbar .p{ background:#ffffff; border:2px solid var(--line); color:var(--ink); box-shadow:none; }
.posbar .p.me{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.poschip{ background:rgba(60,60,60,.9); color:#ffffff; }
/* ---- モーダル：白カード＋角丸20px ---- */
#overlay{ background:rgba(60,60,60,.55); }
#overlay .box{ background:#ffffff; border:2px solid var(--line); border-radius:20px; box-shadow:0 18px 44px rgba(60,60,60,.3); }
#overlay h2{ background:none; -webkit-background-clip:initial; background-clip:initial; color:var(--ink); filter:none; font-weight:800; }
#overlay .box>.ov-foot{ border-top:2px solid var(--line); }
/* 詳細の折りたたみ */
details.fold>summary{ font-weight:800; }
.gfold>summary{ color:var(--ink2); }
.dstat{ background:var(--chip); border-radius:16px; }
/* 文字サイズ：補足も読みやすく */
.small{ font-size:13px; color:var(--ink2); }
.hname{ font-weight:900; }
.salecard .sc-name{ font-weight:900; }
.sale-funds{ color:var(--ink2); }
/* 動きは押し込みのみ：常時アニメーションを止める */
.flash{ animation:none; box-shadow:0 0 0 3px var(--blue); }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
}
@media (max-width:640px){
  body{ font-size:15.5px; }
  #tabs button{ min-height:48px; }
  .btn{ min-height:48px; }
  /* HUDは1段に収める：所有頭数チップは狭幅では畳み（厩舎で確認できる）、
     セーブ／設定の両ボタンを常時 fully 表示する */
  #hud{ flex-wrap:nowrap; gap:5px; padding-left:8px; padding-right:8px; }
  #hud .hudchip{ display:none; }
  #hud .date{ font-size:12.5px; }
  #hud .funds{ font-size:13px; }
  #hud .btn.sm{ min-height:44px; padding:6px 9px; font-size:12.5px; white-space:nowrap; }
}
/* ============================================================
   第23次（2026-11-08）：デザインシステム最終固定
   ・このデザインシステムは白キャンバス前提（color-scheme: light）。
     端末がダーク設定でも、旧来のダーク反転ルールが残っている要素を
     白基調パレットへ固定し、画面ごとに色が変わらないようにする
   ・情景バンドのタイトルは帯の中で必ず見える太字にする
   ============================================================ */
@media (prefers-color-scheme: dark){
  body{ background:#ffffff; color:var(--ink); }
  #main{ background:#ffffff; }
  #hud,#tabs,#todo,#overlay .box,#actionbar,#autobar,#nextweekbar,#racectl{ background:#ffffff; color:var(--ink); }
  .panel,.hcard,.rcard,.jcard,.focusbox,.guidebox,.hrow,.talk,.salecard,details.fold,div.fold,.ownset,.namebar,.tpropbar,.actionbar{ background:#ffffff; color:var(--ink); }
  .quad,.parentcard,.evalbox,.jcell,.calcell,.entryline,.gcard,.planbox,.hallcard,.ticket,.posbar,.facrow,.tbtn,.dstat,.legend-detail td,.pedigree td{ background:var(--chip); color:var(--ink); }
  .mini.bad,.mini.good,.mini.warn{ background:var(--chip); color:var(--ink); }
  .mini.good{ background:var(--green); color:#ffffff; }
  .mini.warn{ background:var(--gold); color:var(--ink); }
  .mini.bad{ background:#ffffff; color:var(--red); }
  .trait{ background:var(--chip); color:var(--ink); }
  .entryline.now{ background:#ffffff; }
  .facrow.sel{ background:#ffffff; }
  #sceneband img{ filter:none; }
  #todo .secbtns button.sub{ background:#ffffff; }
  .gauge .glo,.gauge .ghi{ color:var(--ink2); }
  table th{ background:var(--chip); color:var(--ink2) !important; }
  select,input[type=text],input[type=number],textarea{ background:#f7f7f7; background-image:none; color:var(--ink); }
}
#sceneband{ display:flex; align-items:center; min-height:44px; }
#sceneband .sb-cap{ position:static; display:flex; align-items:baseline; gap:10px; padding:6px 12px; }
#sb-title{ font-size:19px; font-weight:900; color:var(--ink); }
#sb-sub{ font-size:12.5px; font-weight:700; color:var(--ink2); }
/* ===== 馬詳細の視覚表示（ゲージ／チップ／着順内訳バー） ===== */
.hstat{ display:flex; flex-direction:column; gap:7px; margin-top:9px; }
.hs-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.statechip{ display:inline-flex; align-items:center; gap:6px; font-weight:900; font-size:13.5px; background:#fff; border:2px solid var(--line); border-radius:999px; padding:4px 11px; color:var(--ink); }
.statechip .sdot{ width:10px; height:10px; border-radius:50%; flex:none; }
.nxchip{ display:inline-flex; align-items:center; gap:4px; font-weight:800; font-size:12.5px; background:var(--chip); border:2px solid var(--line); border-radius:999px; padding:4px 11px; color:var(--ink); max-width:100%; overflow-wrap:anywhere; }
.nxchip.nx-entry{ background:#fff7d1; border-color:var(--gold); }
.nxchip .nx-now{ color:var(--red); }
.nxchip.nx-inj{ background:#ffecec; border-color:var(--red); color:#a02c2c; }
.nxchip.nx-ok{ background:#eef9e4; border-color:var(--green); }
.meter{ display:flex; align-items:center; gap:8px; }
.meter .m-lb{ flex:0 0 52px; font-size:12.5px; font-weight:800; color:var(--ink2); }
.meter .m-track{ flex:1 1 auto; min-width:0; height:12px; background:var(--bar); border-radius:99px; overflow:hidden; }
.meter .m-track i{ display:block; height:100%; border-radius:99px; }
.meter .m-v{ flex:0 0 28px; text-align:right; font-size:14px; }
.meter .m-t{ flex:0 0 auto; font-size:12px; font-weight:700; color:var(--ink2); }
.recwrap{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:8px 11px; }
.recline{ display:flex; align-items:baseline; gap:10px; }
.recbig{ font-size:19px; font-weight:900; }
.recrate{ font-size:12px; font-weight:800; color:var(--ink2); }
.recbar{ display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--bar); margin-top:6px; }
.recbar i{ display:block; height:100%; }
.recleg{ display:flex; gap:10px; flex-wrap:wrap; margin-top:5px; font-size:12px; font-weight:800; color:var(--ink2); }
@media (prefers-color-scheme: dark){
  .statechip,.recwrap{ background:#ffffff; color:#3c3c3c; }
  .recbig{ color:#3c3c3c; } .nxchip{ color:#3c3c3c; }
}
/* ===== レース画面：映像ステージとモバイル最適化 =====
   3Dキャンバスは以前 #racewrap 全体（実況・操作列の上まで）に広がっており、
   下部が操作列に隠れて映像が見切れていた。キャンバス類は映像専用ステージ
   #racestage の中だけに重ね、実況・操作列はステージの外に置く */
#racestage{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#0d2013; border-radius:18px 18px 0 0; }
#racestage #racecv{ position:absolute; inset:0; width:100%; height:100%; }
#racestage #racegl{ position:absolute; inset:0; width:100%; height:100%; }
#app.racing #todo, #app.racing #weekplan, #app.racing #sceneband, #app.racing #actionbar{ display:none !important; }
@media (max-width:640px){
  #racectl{ gap:5px; padding:6px; }
  #racectl .btn{ min-height:40px; padding:5px 8px; font-size:12.5px; }
  #racectl .spdlbl, #racectl .camblbl{ display:none; }
  #glfps{ display:none; }
  #racehud{ min-height:0; padding:6px 10px; gap:10px; }
  #commentary{ min-height:34px; padding:6px 10px; }
}
/* ============================================================
   固定最小化（2026-11-09）：固定レイアウトを通常フローへ戻す
   ・従来は html,body を overflow:hidden にし、#app を 100dvh の
     flex 列として、HUD／秘書／情景バンドを上部に、各ビュー内の
     サブナビ（牧場の施設詳細・施設一覧・幼駒・セール等）をビュー
     上端に、下部に畳むトグル＋提案バー＋オートバー＋次週へバー＋
     タブナビを常時固定していたため、スクロールしても常に画面を
     圧迫していた。
   ・ページ全体を通常のドキュメントスクロールに戻し、HUD・
     サブナビ・各バーは本文と一緒に流れるようにする。
   ・残す固定は下部タブナビ（#tabs）だけ。畳むトグルは廃止し、
     dock-min（自動で畳む処理）が付いてもバーが消えないように
     する。モーダル（#overlay）とトーストは一時表示なので例外。
   ============================================================ */
html,body{ height:auto; overflow:visible; }
#app{ height:auto; min-height:100dvh; padding-bottom:calc(74px + env(safe-area-inset-bottom,0px)); }
#main{ display:block; flex:none; overflow:visible; }
.view{ height:auto; flex:none; }
.view.on{ overflow:visible; }
/* ドキュメント全体スクロール方式では、パネル側にスクロール量が無い時に
   ホイール／タッチのスクロールをドキュメントへ伝える必要がある。
   旧固定レイアウト時代の overscroll-behavior:contain が残っていると、
   パネル上のホイールが飲み込まれて PC でページがスクロールできなくなる */
.view.on, .subpanel.on, .fillpanel{ overscroll-behavior:auto; }
#tabs{ position:fixed; left:0; right:0; bottom:0; z-index:40; width:100%; max-width:1100px; margin-left:auto; margin-right:auto; }
#racewrap{ flex:none; }
#racestage{ flex:none; height:clamp(280px,52dvh,520px); }
#toast{ bottom:86px !important; }
/* ===== 年末処理：写真バナー＋カード中心のレイアウト。金額・勝敗などの数字は装飾なしの素の文字で出す ===== */
.ye-hero{ position:relative; border-radius:12px; overflow:hidden; margin-bottom:6px; text-align:left; }
.ye-hero img{ width:100%; height:104px; object-fit:cover; display:block; }
.ye-hero .ye-cap{ position:absolute; left:0; right:0; bottom:0; padding:16px 14px 8px; background:linear-gradient(180deg,rgba(8,26,13,0),rgba(8,26,13,.78)); color:#fff; }
.ye-hero .ye-title{ font-size:20px; font-weight:900; line-height:1.15; }
.ye-hero .ye-sub{ font-size:12.5px; opacity:.95; }
.ye-sec{ text-align:left; font-size:15px; font-weight:900; color:var(--green); margin:18px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--line); }
.ye-awards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ye-award{ background:var(--panel2); border:1.5px solid var(--line); border-radius:12px; padding:10px; text-align:left; }
.ye-alabel{ display:inline-block; font-size:11.5px; font-weight:800; color:var(--green); border:1.5px solid var(--green); border-radius:99px; padding:1px 9px; margin-bottom:8px; }
.ye-art{ width:100%; aspect-ratio:2.6/1; border-radius:9px; overflow:hidden; background:#a8d4ee; margin-bottom:8px; }
.ye-art img{ width:100%; height:100%; object-fit:cover; object-position:center 38%; display:block; }
.ye-name{ font-size:17px; font-weight:900; overflow-wrap:anywhere; }
.ye-big{ font-size:22px; font-weight:900; margin-top:2px; }
.ye-big small{ font-size:12px; font-weight:700; color:var(--ink2); }
.ye-sub2{ font-size:12.5px; color:var(--ink2); margin-top:1px; }
.ye-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }

<script>
"use strict";
/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString("ja-JP");
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
/* セーブ由来データの無害化：引き継ぎコード／JSONファイル／端末内セーブなど外部から取り込んだ
   文字列が、画面表示用HTMLへそのまま埋め込まれて script として実行されるのを防ぐ。
   危険な文字（< > & " '）は取り除き、危険なキー（__proto__ 等）も落とす */
function sanitizeSaveData(d){
  const seen=new WeakSet();
  const clean=v=>typeof v==="string"? v.replace(/[<>&"']/g,"") : v;
  const walk=(o,depth)=>{
    if(!o||typeof o!=="object"||depth>14) return;
    if(seen.has(o)) return; seen.add(o);
    if(Array.isArray(o)){ for(let i=0;i<o.length;i++){ o[i]=clean(o[i]); walk(o[i],depth+1); } return; }
    Object.keys(o).forEach(k=>{
      if(k==="__proto__"||k==="constructor"||k==="prototype"){ delete o[k]; return; }
      o[k]=clean(o[k]); walk(o[k],depth+1);
    });
  };
  walk(d,0);
  return d;
}
function gauss(){return (Math.random()+Math.random()+Math.random())/1.5-1;} // -1..1

/* ============ サウンド（Web Audioで生成する自作音源のみ・外部ファイルなし） ============
   軽量設計：常駐ノードは BGMスケジューラ（250ms間隔の先行予約）と歓声ノイズ1本だけ。
   AudioContextはユーザーの最初のタップ以降に生成・再開する（自動再生制限対応） */
const AU={ctx:null,master:null,bgmGain:null,seGain:null,crowdGain:null,crowdSrc:null,mode:null,timer:0,step:0,nextT:0,hoofM:-99,crowdLvl:-1,_crowdTimer:0,_unlocked:false};
function sndCfg(){ if(typeof S==="undefined") return {on:true,bgm:0.6,se:0.9}; if(!S.sound) S.sound={on:true,bgm:0.6,se:0.9}; return S.sound; }
function auApply(){
  if(!AU.ctx)return; const c=sndCfg();
  AU.master.gain.setTargetAtTime(c.on?1:0, AU.ctx.currentTime, 0.05);
  if(AU.bgmGain)AU.bgmGain.gain.setTargetAtTime(0.13*c.bgm, AU.ctx.currentTime, 0.1);
  if(AU.seGain)AU.seGain.gain.setTargetAtTime(0.9*c.se, AU.ctx.currentTime, 0.1);
}
function auInit(){
  if(AU.ctx){ if(AU.ctx.state==="suspended"||AU.ctx.state==="interrupted")AU.ctx.resume(); return AU.ctx; }
  const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor)return null;
  const ctx=new Ctor(); AU.ctx=ctx;
  /* 出力段：マスター→コンプレッサー→出力。音が潰れず、全体がまとまって聞こえる */
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.18;
  comp.connect(ctx.destination);
  AU.master=ctx.createGain(); AU.master.connect(comp);
  /* BGMバス：ローパスで耳当たりを柔らかくし、短いディレイの残響で広がりを付ける */
  AU.bgmGain=ctx.createGain();
  const bgmLP=ctx.createBiquadFilter(); bgmLP.type="lowpass"; bgmLP.frequency.value=5600;
  AU.bgmGain.connect(bgmLP); bgmLP.connect(AU.master);
  const dly=ctx.createDelay(1); dly.delayTime.value=0.27;
  const fb=ctx.createGain(); fb.gain.value=0.22;
  const wet=ctx.createGain(); wet.gain.value=0.16;
  bgmLP.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(AU.master);
  /* 生成リバーブ：減衰ノイズのインパルス応答で空間を付ける（ホールの残響感）。
     BGMバスとファンファーレ（seGain経由は混ざらないよう専用センド）で共用する */
  const conv=ctx.createConvolver(); conv.buffer=auMakeIR();
  const wet2=ctx.createGain(); wet2.gain.value=0.30;
  conv.connect(wet2); wet2.connect(AU.master);
  AU.verb=conv; bgmLP.connect(conv);
  AU.seGain=ctx.createGain(); AU.seGain.connect(AU.master);
  /* 歓声：ホワイトノイズ→バンドパスで「群衆のざわめき」に整形し、ゲインで盛り上がりを制御 */
  const len=2*ctx.sampleRate, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.04*w)/1.04; d[i]=(last*3.2+w*0.18)*0.55; } // ブラウン寄り＋成分
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=620; bp.Q.value=0.45;
  const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2400;
  /* 第2層：少し高い帯域で「声」の粒立ちを足す */
  const src2=ctx.createBufferSource(); src2.buffer=buf; src2.loop=true; src2.playbackRate.value=1.31;
  const bp2=ctx.createBiquadFilter(); bp2.type="bandpass"; bp2.frequency.value=1450; bp2.Q.value=0.7;
  const g2=ctx.createGain(); g2.gain.value=0.34;
  /* LFO：バンドパスの中心をゆっくり揺らし、群衆のざわめきにうねりを作る */
  const lfo=ctx.createOscillator(); lfo.frequency.value=0.07;
  const lfoG=ctx.createGain(); lfoG.gain.value=150;
  lfo.connect(lfoG); lfoG.connect(bp.frequency); lfo.start();
  AU.crowdGain=ctx.createGain(); AU.crowdGain.gain.value=0;
  src.connect(bp); bp.connect(lp); lp.connect(AU.crowdGain); AU.crowdGain.connect(AU.seGain);
  src2.connect(bp2); bp2.connect(g2); g2.connect(AU.crowdGain);
  src.start(); AU.crowdSrc=src; src2.start();
  /* iOS Safari の解放用：生成直後に無音バッファを1回鳴らす（ユーザー操作内で呼ばれた時に効く） */
  try{ const ub=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*0.03),ctx.sampleRate); const us=ctx.createBufferSource(); us.buffer=ub; us.connect(ctx.destination); us.start(0); }catch(e){}
  auApply();
  return ctx;
}
/* ユーザー操作のたびに呼ぶ解放処理：iOS Safari は操作の同期処理の中で
   生成・resume しないと音が出ない（suspended／interrupted の両方に対応）。
   画面復帰時にも resume を試みる */
function auUnlock(){
  const ctx=auInit(); if(!ctx)return;
  if(ctx.state==="suspended"||ctx.state==="interrupted"){ const p=ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
  AU._unlocked=true;
  if(typeof raceState!=="undefined"&&raceState.phase!=="run"&&!AU.mode) auSetMode("home");
}
function auSetCrowd(lvl,sec){
  if(!AU.ctx||!AU.crowdGain)return; lvl=clamp(lvl,0,1);
  if(lvl>0.02&&AU._crowdTimer){ clearTimeout(AU._crowdTimer); AU._crowdTimer=0; } // 新たに歓声を上げるなら停止予約を取り消す
  if(Math.abs(lvl-AU.crowdLvl)<0.03&&sec===undefined)return; AU.crowdLvl=lvl;
  AU.crowdGain.gain.setTargetAtTime(lvl*0.5, AU.ctx.currentTime, sec||0.4);
}
/* レース中サウンドの確実な停止：歓声を予約ごと取り消して即座に 0 へ落とす。
   レース終了画面を離れる経路（帰るボタン／画面切替の安全網）から呼ぶ */
function auStopCrowd(){
  if(AU._crowdTimer){ clearTimeout(AU._crowdTimer); AU._crowdTimer=0; }
  if(!AU.ctx||!AU.crowdGain)return;
  const t=AU.ctx.currentTime;
  AU.crowdGain.gain.cancelScheduledValues(t);
  AU.crowdGain.gain.setTargetAtTime(0, t, 0.1);
  AU.crowdLvl=0;
}
/* ---- BGM：厚みのある生成ループ（パッド／ピアノプラック／ベース／アルペジオ／打楽器） ----
   ホーム＝Cメジャーの8小節（セブンスコードのボイシング＋作曲済みの主旋律フレーズ）
   レース＝Aマイナーの4小節ドライブ（8分パルスのベース＋キック／スネア／ハット） */
const AU_HOME=[ // Cmaj7 Am7 Fmaj7 Gadd9 Em7 Am7 Dm7 G7
 [261.6,329.6,392.0,493.9],[220.0,261.6,329.6,392.0],[174.6,220.0,261.6,329.6],[196.0,246.9,293.7,440.0],
 [164.8,196.0,246.9,293.7],[220.0,261.6,329.6,392.0],[146.8,174.6,220.0,261.6],[196.0,246.9,293.7,349.2]];
const AU_RACE=[ // Am F C/G G
 [220.0,261.6,329.6,440.0],[174.6,220.0,261.6,349.2],[196.0,261.6,329.6,392.0],[196.0,246.9,293.7,392.0]];
/* 主旋律フレーズ：[小節, 拍(0-3), 周波数, 長さ(拍)] */
const AU_MEL_HOME=[
 [0,0,659.3,1],[0,1,587.3,1],[0,2,523.3,2],[1,0,440.0,1.5],[1,2,523.3,0.5],[1,3,587.3,1],
 [2,0,659.3,2],[2,2,783.9,1],[2,3,659.3,1],[3,0,587.3,3],
 [4,0,523.3,1],[4,1,587.3,1],[4,2,659.3,2],[5,0,880.0,1],[5,1,783.9,1],[5,2,659.3,1],[5,3,587.3,1],
 [6,0,523.3,1.5],[6,2,440.0,0.5],[6,3,493.9,1],[7,0,523.3,3]];
const AU_MEL_RACE=[
 [0,0,440.0,0.5],[0,0.5,523.3,0.5],[0,1,659.3,1],[0,2,523.3,0.5],[0,2.5,440.0,0.5],[0,3,329.6,1],
 [1,0,349.2,0.5],[1,0.5,440.0,0.5],[1,1,523.3,1],[1,2,440.0,2],
 [2,0,523.3,0.5],[2,0.5,659.3,0.5],[2,1,783.9,1],[2,2,659.3,0.5],[2,2.5,587.3,0.5],[2,3,523.3,1],
 [3,0,493.9,0.5],[3,0.5,587.3,0.5],[3,1,659.3,1],[3,2,440.0,2]];
function auMakeIR(){ /* 1.6秒・ステレオ・指数減衰ノイズの残響インパルス */
  const ctx=AU.ctx, sr=ctx.sampleRate, len=Math.floor(sr*1.6), buf=ctx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); let lp=0;
    for(let i=0;i<len;i++){ const dec=Math.pow(1-i/len,2.6); const w=Math.random()*2-1; lp=(lp+0.22*w)/1.22; d[i]=(lp*2.6+w*0.35)*dec*0.6; } }
  return buf;
}
function auNoiseBuf(){ /* 打楽器共用のノイズバッファ（1回だけ生成） */
  if(AU._nb) return AU._nb;
  const ctx=AU.ctx, buf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  AU._nb=buf; return buf;
}
function auPan(node,pan){ /* ステレオパンナー（未対応環境では素通し） */
  const ctx=AU.ctx;
  if(pan&&ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=pan; node.connect(p); return p; }
  return node;
}
function auNote(freq,t,dur,type,vol,dest){
  const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol),t+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||AU.bgmGain); o.start(t); o.stop(t+dur+0.05);
}
/* パッド：デチューンした2声＋サインで厚みを作り、ゆっくり立ち上がる弦風の音 */
function auPad(freq,t,dur,vol,pan){
  const ctx=AU.ctx, g0=ctx.createGain(), out=auPan(g0,pan); out.connect(AU.bgmGain);
  /* エンベロープはゲインノード g0 に付ける（auPan の戻り値は StereoPanner のことがあり gain を持たない） */
  g0.gain.setValueAtTime(0.0001,t); g0.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol),t+0.38);
  g0.gain.setValueAtTime(Math.max(0.0011,vol),t+Math.max(0.4,dur-0.45)); g0.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [[-6,"triangle",1],[6,"triangle",0.9],[0,"sine",0.8]].forEach(([det,ty,vr])=>{
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=ty; o.frequency.value=freq; o.detune.value=det; g.gain.value=vr;
    o.connect(g); g.connect(g0); o.start(t); o.stop(t+dur+0.05);
  });
}
/* プラック：倍音を添えたピアノ風の単音（主旋律用） */
function auPluck(freq,t,dur,vol){
  const ctx=AU.ctx;
  [[1,"triangle",1],[2,"sine",0.35],[3.01,"sine",0.12]].forEach(([mul,ty,vr])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=ty; o.frequency.value=freq*mul;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol*vr),t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.09,dur));
    o.connect(g); g.connect(AU.bgmGain); o.start(t); o.stop(t+Math.max(0.09,dur)+0.05);
  });
}
/* ベース：サイン＋三角の二重で丸く太く */
function auBass(freq,t,dur,vol){
  const ctx=AU.ctx;
  [["sine",1],["triangle",0.5]].forEach(([ty,vr])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=ty; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol*vr),t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AU.bgmGain); o.start(t); o.stop(t+dur+0.05);
  });
}
/* 打楽器（すべて生成音）：キック／スネア／ハット・シェイカー */
function auKick(t,vol){
  const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type="sine"; o.frequency.setValueAtTime(128,t); o.frequency.exponentialRampToValueAtTime(44,t+0.10);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g); g.connect(AU.bgmGain); o.start(t); o.stop(t+0.16);
}
function auNoiseHit(t,dur,ftype,ffreq,q,vol){
  const ctx=AU.ctx, s=ctx.createBufferSource(); s.buffer=auNoiseBuf();
  const f=ctx.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq; f.Q.value=q;
  const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(AU.bgmGain); s.start(t); s.stop(t+dur+0.03);
}
function auSchedule(){
  if(!AU.ctx||!AU.mode)return;
  const ctx=AU.ctx, ahead=ctx.currentTime+0.7;
  const PANS=[-0.28,-0.09,0.09,0.28];
  while(AU.nextT<ahead){
    const t=Math.max(AU.nextT,ctx.currentTime+0.03);
    const race=AU.mode==="race";
    const chords=race?AU_RACE:AU_HOME, bar=race?1.8:2.6, beat=bar/4;
    const ch=chords[AU.step%chords.length];
    const root=ch[0]/2;
    /* パッド：4声ボイシングを左右に広げて厚く */
    ch.forEach((f,i)=>auPad(f,t,bar*1.02,race?0.052:0.058,PANS[i%4]));
    /* 主旋律：作曲済みフレーズをピアノ風プラックで */
    const mel=race?AU_MEL_RACE:AU_MEL_HOME, mlen=race?4:8, mbar=AU.step%mlen;
    mel.forEach(([mb,bt,f,ln])=>{ if(mb===mbar) auPluck(f,t+bt*beat,Math.max(0.12,ln*beat*0.92),race?0.10:0.088); });
    /* アルペジオ：コードトーンを8分で循環（きらめき） */
    for(let e=0;e<8;e++){ const f=ch[[0,1,2,3,2,1,2,3][e]]*2; auNote(f,t+e*beat/2,beat*0.42,"sine",race?0.020:0.016); }
    if(race){
      /* ベース：8分パルス（ルート中心、4小節目の終わりはオクターブへ駆け上がる） */
      for(let e=0;e<8;e++){ const up=(mbar===3&&e>=6); auBass(root*(up?2:1),t+e*beat/2,beat*0.42, e%2?0.085:0.115); }
      /* ドラム：キック4つ打ち／スネア裏拍／ハット裏8分 */
      for(let b=0;b<4;b++){ auKick(t+b*beat, b===0?0.30:0.22); auNoiseHit(t+(b+0.5)*beat,0.035,"highpass",6800,0.7,0.045); }
      auNoiseHit(t+beat,0.09,"bandpass",1900,0.8,0.10); auNoiseHit(t+3*beat,0.09,"bandpass",1900,0.8,0.10);
    } else {
      /* ベース：1拍目ルート／3拍目5度でゆったり支える */
      auBass(root,t,beat*1.9,0.105); auBass(root*1.5,t+2*beat,beat*1.7,0.08);
      /* シェイカー：裏拍に薄く */
      auNoiseHit(t+beat,0.14,"highpass",7500,0.6,0.016); auNoiseHit(t+3*beat,0.14,"highpass",7500,0.6,0.016);
    }
    AU.nextT=t+bar; AU.step++;
  }
}
function auSetMode(m){
  if(!AU.ctx)return;
  if(AU.mode===m)return;
  AU.mode=m; AU.step=0; AU.nextT=AU.ctx.currentTime+0.06;
  if(AU.timer){clearInterval(AU.timer); AU.timer=0;}
  /* 音声スケジュールの例外で呼び出し側（レース開始・クリック処理など）を止めない */
  if(m){ try{ auSchedule(); }catch(e){} AU.timer=setInterval(()=>{ try{ auSchedule(); }catch(e){} },240); }
}
/* ---- レース前のファンファーレ：格で編成と長さを変える（実競馬の入場演奏に寄せる） ----
   G1（cls8）＝金管フル編成＋ティンパニ＋シンバルの荘厳なロング版
   G2（cls7）＝金管＋ティンパニの標準版／G3（cls6）＝金管中心の短縮版
   オープン（cls5）＝トランペットの短いコール。それ以下は演奏なし（実競馬どおり） */
/* 金管の1声：デチューン鋸波2本＋ローパスのうねりでブラスらしく */
function auBrass(freq,t,dur,vol,lpF){
  const ctx=AU.ctx;
  const out=ctx.createGain(); out.connect(AU.seGain); if(AU.verb) out.connect(AU.verb);
  const fl=ctx.createBiquadFilter(); fl.type="lowpass"; fl.Q.value=0.6;
  fl.frequency.setValueAtTime((lpF||2400)*0.55,t); fl.frequency.exponentialRampToValueAtTime(lpF||2400,t+0.07);
  fl.frequency.exponentialRampToValueAtTime((lpF||2400)*0.6,t+dur);
  fl.connect(out);
  out.gain.setValueAtTime(0.0001,t); out.gain.exponentialRampToValueAtTime(Math.max(0.0011,vol),t+0.045);
  out.gain.setValueAtTime(Math.max(0.0011,vol),t+Math.max(0.05,dur-0.09)); out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [[-5,1],[5,0.9],[0,0.45]].forEach(([det,vr],i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=i===2?"square":"sawtooth"; o.frequency.value=freq; o.detune.value=det; g.gain.value=vr;
    o.connect(g); g.connect(fl); o.start(t); o.stop(t+dur+0.05);
  });
}
/* 和音：[主旋律, 3度下, 5度]の金管アンサンブルで1音を鳴らす */
function auBrassChord(freq,t,dur,vol,full){
  auBrass(freq,t,dur,vol);
  auBrass(freq*0.841,t,dur,vol*0.72);            // 長3度下（和声）
  if(full){ auBrass(freq*0.667,t,dur,vol*0.62,1900); auBrass(freq/2,t,dur,vol*0.55,1500); } // 5度下＋低音金管
}
function auTimp(t,vol){ /* ティンパニ：音程が沈むサイン＋皮のノイズ */
  const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type="sine"; o.frequency.setValueAtTime(148,t); o.frequency.exponentialRampToValueAtTime(58,t+0.16);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  o.connect(g); g.connect(AU.seGain); o.start(t); o.stop(t+0.34);
  const s=ctx.createBufferSource(); s.buffer=auNoiseBuf();
  const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;
  const g2=ctx.createGain(); g2.gain.setValueAtTime(vol*0.5,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  s.connect(f); f.connect(g2); g2.connect(AU.seGain); s.start(t); s.stop(t+0.12);
}
function auCym(t){ /* シンバル：高域ノイズのゆっくりしたクレッシェンド */
  const ctx=AU.ctx, s=ctx.createBufferSource(); s.buffer=auNoiseBuf(); s.loop=true;
  const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=5800;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.05,t+0.5); g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
  s.connect(f); f.connect(g); g.connect(AU.seGain); if(AU.verb){ const gv=ctx.createGain(); gv.gain.value=0.5; g.connect(gv); gv.connect(AU.verb); }
  s.start(t); s.stop(t+1.6);
}
/* 格に応じた演奏を実行し、演奏時間（秒）を返す。演奏しない格は0 */
function auFanfareFor(cls){
  if(!auInit())return 0;
  const ctx=AU.ctx, t=ctx.currentTime+0.05;
  /* 主旋律モチーフ（C→E→G→C の王道ファンファーレ型）：[開始, 音, 長さ, 音量] */
  let seq, dur, full=false, timp=[], cym=false;
  if(cls>=8){ /* G1：ロング版。繰り返し音の導入→上昇→高らかな終止（全和音＋打楽器） */
    seq=[[0,523.3,0.17,0.105],[0.19,523.3,0.17,0.105],[0.38,523.3,0.17,0.11],[0.57,659.3,0.38,0.115],
         [1.02,783.9,0.55,0.12],[1.66,659.3,0.17,0.10],[1.85,783.9,0.17,0.105],[2.04,1046.5,0.62,0.125],
         [2.78,783.9,0.30,0.105],[3.12,1046.5,1.30,0.13]];
    timp=[0,0.57,1.02,2.04,3.12]; dur=4.55; full=true; cym=true;
  } else if(cls===7){ /* G2：標準版 */
    seq=[[0,523.3,0.16,0.10],[0.18,523.3,0.16,0.10],[0.36,659.3,0.34,0.11],
         [0.78,783.9,0.48,0.115],[1.36,659.3,0.16,0.095],[1.54,783.9,0.16,0.10],[1.72,1046.5,1.05,0.12]];
    timp=[0,0.78,1.72]; dur=2.9; full=true;
  } else if(cls===6){ /* G3：短縮版 */
    seq=[[0,523.3,0.15,0.095],[0.17,659.3,0.30,0.105],[0.55,783.9,0.42,0.11],[1.06,1046.5,0.85,0.115]];
    timp=[0,1.06]; dur=2.0;
  } else if(cls===5){ /* オープン：トランペットの短いコール（和声のみ） */
    seq=[[0,659.3,0.22,0.09],[0.26,783.9,0.55,0.10]];
    dur=0.9;
  } else return 0;
  /* 演奏中はBGMを少し沈めて演奏を際立たせる（終わりに向けて戻す） */
  if(AU.bgmGain){ const base=0.13*sndCfg().bgm;
    AU.bgmGain.gain.cancelScheduledValues(t);

}
function auTone(freq,dur,type,vol,when){
  if(!AU.ctx)return; const ctx=AU.ctx, t=ctx.currentTime+(when||0);
  const o=ctx.createOscillator(), g=ctx.createGain();

  o.connect(g); g.connect(AU.seGain); o.start(t); o.stop(t+dur+0.05);
}

function auWinJingle(){ [523.3,659.3,783.9,1046.5,783.9,1046.5,1318.5].forEach((f,i)=>auTone(f,0.3,"triangle",0.16,i*0.11)); }

  const s=ctx.createBufferSource(); s.buffer=buf; const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=2400;
  const g=ctx.createGain(); g.gain.value=0.22; s.connect(f); f.connect(g); g.connect(AU.seGain); s.start(t);
}
function auHoof(dirt){ // 蹄音：短いノイズ＋低い打音。芝は柔らかく、ダートは粒立ちを強く

  const ctx=AU.ctx, t=ctx.currentTime, dur=0.07;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
  const s=ctx.createBufferSource(); s.buffer=buf; s.playbackRate.value=0.92+Math.random()*0.16;

}

const PARENT_LINES=["サンデーサイレンス系","キングマンボ系","ロベルト系","ミスタープロスペクター系","サドラーズウェルズ系","ストームキャット系"];
const FAMOUS_ANCESTORS=["サンデーサイレンス","ノーザンテースト","トニービン","ブライアンズタイム","リアルシャダイ","マルゼンスキー","ノーザンダンサー","ミスタープロスペクター","サドラーズウェルズ","ダンシングブレーヴ","カーリアン","リファール","シンボリルドルフ","オグリキャップ","メジロマックイーン","ナリタブライアン","テイエムオペラオー","ウオッカ","アーモンドアイ","ステイゴールド","キングマンボ","エルコンドルパサー","ディープインパクト","キタサンブラック"];

function hashStr(s){ let h=0; for(let i=0;i<(s||"").length;i++){ h=(h*31+(s||"").charCodeAt(i))>>>0; } return h; }
function sireKey(sireStr){ if(!sireStr) return ""; let s=String(sireStr).replace(/^外部・/,"").replace(/種牡馬$/,"").replace(/系$/,""); return s; }
function lineOf(sireStr){
 const k=sireKey(sireStr);
 if(LINE_DB[k]) return Object.assign({name:k},LINE_DB[k]);
 if(String(sireStr).includes("米国")||String(sireStr).includes("ダート")) return {name:k||"海外系",parent:"ミスタープロスペクター系",type:"SP",pop:"主流",grade:"名",factors:["pow","spd"]};
 if(String(sireStr).includes("欧州")) return {name:k||"欧州系",parent:"サドラーズウェルズ系",type:"ST",pop:"主流",grade:"名",factors:["sta","flx"]};
 const pools=PARENT_LINES, h=hashStr(k||sireStr||"x");
 return {name:k||"その他",parent:pools[h%pools.length],type:["SP","ST","MID"][h%3],pop:h%3===0?"零細":"主流",grade:"",factors:[["spd","sta","pow","gut","bst","flx"][h%6]]};
}
/* 4代血統を決定的に生成（判定エンジン用）。各要素 {name,parent,type,grade,factors,side,gen} */
function pedigreeOf(sireStr, dam){
 const L=lineOf(sireStr), damSireStr=dam?dam.sire:"", DL=lineOf(damSireStr);
 const anc=[];
 anc.push({name:L.name,parent:L.parent,type:L.type,grade:L.grade,factors:L.factors,side:"s",gen:1});
 anc.push({name:DL.name,parent:DL.parent,type:DL.type,grade:DL.grade,factors:DL.factors,side:"d",gen:1,damSire:true});
 const seeds=[["s",2,L.parent],["s",2,DL.name],["d",2,DL.parent],["d",2,"母系牝祖"]];
 const base=(sireStr||"")+"|"+(dam?dam.name:"");
 for(let g=2;g<=4;g++){
   const prev=anc.filter(a=>a.gen===g-1);
   prev.forEach((p,i)=>{
     for(let j=0;j<2;j++){
       const idx=hashStr(base+p.name+g+""+i+""+j)%FAMOUS_ANCESTORS.length;
       const nm=FAMOUS_ANCESTORS[idx], ln=lineOf(nm);
       anc.push({name:nm,parent:ln.parent,type:ln.type,grade:ln.grade,factors:ln.factors,side:p.side,gen:g});
     }
   });
 }
 return {sire:L, damSire:DL, anc};
}
/* 配合理論エンジン：成立理論の一覧・爆発力・危険度・能力補正・サブパラを返す */

 const T=(n,kind,txt,opts)=>{ out.theories.push(Object.assign({n,kind,txt},opts||{})); };
 const sireH=(sireHorse&&sireHorse.health)||78, damH=(damHorse&&damHorse.health)||78, avgH=(sireH+damH)/2;
 // インブリード判定
 const byName={}; P.anc.forEach(a=>{ (byName[a.name]=byName[a.name]||[]).push(a); });
 let inb=null, inbName="";
 Object.keys(byName).forEach(nm=>{ const arr=byName[nm]; const gs=arr.map(a=>a.gen), ss=arr.some(a=>a.side==="s"), dd=arr.some(a=>a.side==="d");
   if(arr.length>=2 && ss && dd){ const depth=Math.min.apply(null,gs)+Math.min.apply(null,arr.filter(a=>a.side!== (arr[0].side)).map(a=>a.gen)); if(!inb||depth<inb.depth){ inb={depth, count:arr.length, names:[nm]}; inbName=nm; } else if(depth===inb.depth){ inb.names.push(nm); } } });
 if(inb){
   const close=inb.depth<=4, dk=close?3:(inb.depth<=5?2:1);

   out.danger+=dg; out.burst+=dk*2;
   const a=byName[inbName][0]; (a.factors||[]).forEach(f=>{ out.mods[f]=(out.mods[f]||0)+2; });
   T("インブリード（"+inbName+" "+(inb.depth)+"× 系）","up","共通先祖の因子が濃く出る。爆発力は大きいが危険度も上がる",{spdStar:dk});
   out.inbred={names:inb.names, full:Object.keys(byName).filter(nm=>{const arr=byName[nm]; return arr.some(a=>a.gen<=2)&&arr.some(b=>b.gen<=2);}), dam:Object.keys(byName).filter(nm=>byName[nm].some(a=>a.damSire))};
   if(out.inbred.full.length) T("全きょうだいインブリード","up","近親の血が強く重なる。爆発力はさらに増すが危険度も高い",{spdStar:1});
   if(P.anc.some(a=>a.damSire) && inb.names.some(nm=>byName[nm].some(a=>a.gen===1&&a.damSire))) T("母系インブリード","up","母系の血が濃い。牝系由来の特性が上位進化しやすくなる",{});
 } else {
   out.burst+=1; ["men","smt","hlt","flx"].forEach(f=>{ out.mods[f]=(out.mods[f]||0)+1; });
   T("アウトブリード","up","共通先祖なし。精神力・賢さ・健康・柔軟性と競走寿命に小さなボーナス",{});
   out.outbreed=true;
 }
 // ラインブリード
 const gen3s=P.anc.filter(a=>a.gen===3);
 const pc={}; gen3s.forEach(a=>{ pc[a.parent]=(pc[a.parent]||0)+1; });
 const topParent=Object.keys(pc).sort((a,b)=>pc[b]-pc[a])[0];
 if(P.sire.parent===P.damSire.parent){ out.burst+=2; T("親系統ラインブリード","up","父と母父が同じ親系統。系統の長所がまとまって出る",{spdStar:1}); out.outbreed=false; if(out.theories.find(t=>t.n==="アウトブリード")){ out.theories=out.theories.filter(t=>t.n!=="アウトブリード"); } }
 if(P.sire.name!==P.damSire.name && P.sire.parent===P.damSire.parent){ T("子系統ラインブリード","up","同じ親系統の異なる子系統同士。まとまりと新味の両立",{}); }
 if(topParent && pc[topParent]>=3){ const subs=new Set(gen3s.filter(a=>a.parent===topParent).map(a=>a.name)); if(subs.size>=3){ out.burst+=4; T("親系統ラインブリード爆発型","up","3代目の種牡馬3頭以上が同じ親系統で子系統は異なる。大爆発の型",{spdStar:3}); } }
 // ニックス
 const nickKey=P.sire.name+"×"+P.damSire.name, ng=NICKS[nickKey];
 if(ng){ const lv=ng==="A"?3:2; out.burst+=lv; T("ニックス（シングル）","up","父×母父の相性が良い組み合わせ（"+nickKey+"）",{spdStar:lv});
   (P.damSire.factors||[]).forEach(f=>{ out.sub[f]=(out.sub[f]||0)+lv; });
   if(P.sire.parent===P.damSire.parent||pc[topParent]>=2){ T("ダブルニックス","up","2方向で相性が重なる",{spdStar:1}); out.burst+=1; }
 } else if(P.sire.parent===P.damSire.parent){ T("ニックス（系統相性）","up","親系統同士の相性が悪くない",{spdStar:1}); out.burst+=1; }
 // 母父○
 const dfac=(P.damSire.factors||[]).length + (P.damSire.grade?1:0);
 if(P.damSire.grade && dfac>=2){ out.burst+=dfac-1; T("母父◎","up","母父が格付け因子と能力因子を持つ。因子の数だけ爆発力が上がる",{spdStar:Math.min(3,dfac-1)}); }
 // 血脈活性化
 const distinct=new Set(gen3s.map(a=>a.parent)).size + new Set(P.anc.filter(a=>a.gen===3).map(a=>a.parent)).size;
 if(distinct>=6){ out.burst+=Math.floor(distinct/2); T("血脈活性化配合","up","3代前の親系統が"+distinct+"種。多様な血が活力を生む",{spdStar:2});

 // 活力源化・活力補完
 if(P.sire.grade||P.damSire.grade){ T("活力源化","up","大種牡馬・名種牡馬の因子が生命力を底上げする",{}); out.mods.life=(out.mods.life||0)+1; }
 const namedSire=!!P.sire.grade, namedDam=!!(dam&&dam.famousDam);
 if(namedSire&&namedDam){ T("活力補完・完全型","up","名種牡馬と名牝の両立。競走寿命が延びる",{}); out.mods.life=(out.mods.life||0)+2; }
 else if(namedDam){ T("活力補完・名牝型","up","名牝系の活力で競走寿命が延びる",{}); out.mods.life=(out.mods.life||0)+1; }
 // 隔世遺伝
 const sireFac=(P.sire.factors||[]).length, damFac=(P.damSire.factors||[]).length;
 const gp=P.anc.find(a=>a.gen===2 && (a.factors||[]).length);
 if(!P.sire.grade && !P.damSire.grade && gp && gp.factors && gp.factors.length){ const f=gp.factors[0]; out.mods[f]=(out.mods[f]||0)+3; T("隔世遺伝","up","祖父の能力因子（"+ABNAME[f]+"）が発現する",{}); }
 // メールライン／ボトムライン活性
 const sireLineCount=P.anc.filter(a=>a.side==="s").length, damLineCount=P.anc.filter(a=>a.side==="d").length;
 if(P.sire.grade==="大"){ T("メールライン活性 Lv3","up","父系が大種牡馬で活性化。スピードの伝達が強い",{spdStar:2}); out.mods.spd=(out.mods.spd||0)+2; }
 else if(P.sire.grade==="名"){ T("メールライン活性 Lv2","up","父系が名種牡馬で活性化",{spdStar:1}); out.mods.spd=(out.mods.spd||0)+1; }
 if(dam&&dam.famousDam){ T("ボトムライン活性 Lv3","up","名牝系の母系が活性化。底力が増す",{}); out.mods.gut=(out.mods.gut||0)+2; }
 else if(dam&&dam.damLine==="主流"){ T("ボトムライン活性 Lv1","up","主流牝系で母系が安定",{}); out.mods.men=(out.mods.men||0)+1; }
 // SP/ST昇華・融合
 if(P.sire.type==="SP"&&P.damSire.type==="SP"){ out.mods.spd=(out.mods.spd||0)+3; out.burst+=2; T("SP昇華 Lv3","up","父母ともスピード系。スピードが一段階跳ね上がる",{spdStar:3}); }
 else if(P.sire.type==="SP"||P.damSire.type==="SP"){ T("SP昇華 Lv1","up","スピード系の血が混ざる",{spdStar:1}); out.mods.spd=(out.mods.spd||0)+1; }
 if(P.sire.type==="ST"&&P.damSire.type==="ST"){ out.mods.sta=(out.mods.sta||0)+3; T("ST昇華 Lv3","up","父母ともスタミナ系。スタミナが一段階跳ね上がる",{}); }
 else if(P.sire.type==="ST"||P.damSire.type==="ST"){ T("ST昇華 Lv1","up","スタミナ系の血が混ざる",{}); out.mods.sta=(out.mods.sta||0)+1; }
 if((P.sire.type==="SP"&&P.damSire.type==="ST")||(P.sire.type==="ST"&&P.damSire.type==="SP")){ T("SPST融合","up","スピードとスタミナの融合。バランスの取れた素質になる",{}); out.mods.bst=(out.mods.bst||0)+1; out.mods.flx=(out.mods.flx||0)+1; }

 if(sireHorse&&sireHorse.tripleCrown&&damHorse&&damHorse.tripleCrown){ T("3冠配合","up","3冠馬同士の配合。素質の天井が上がる",{spdStar:2}); out.burst+=2; }
