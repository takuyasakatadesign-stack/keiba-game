  if(S.sale){
    if(!nSeason) nSeason={title:"セール開催中です。注目馬を見ましょう", sub:"開催は今週のみです"};
    cards.push({key:"sale"+S.week, who:"秘書・佐倉 澪", face:"sec", text:"セール上場馬に関係者の評価が付いています", btn:"セールを見る", act:"view", view:"farm", anchor:"farm-sale"});
  }
  /* 種付け期：今季まだ種付けしていない繁殖牝馬がいる時だけ案内する（全頭種付け済みなら出さない）。
     調教師の配合提案（牝馬×種牡馬の具体案）がある場合はそちらを提案カードにし、
     ない場合のみ従来の牧場長の案内カードを出す */
  if((month()===5||month()===6)&&(S.mares||[]).some(m=>!m.pregnant)){
    if(!nSeason) nSeason={title:"種付けの季節です。配合を決めましょう", sub:"受胎は月末に判明し、翌年4月に生まれます"};
    let bprops=[]; try{ bprops=trainerBreedProposals(); }catch(e){}
    bprops.slice(0,2).forEach(p=>{
      cards.push({key:"breedprop"+p.mare.id, who:"調教師・"+TRAINER.name, face:"trainer",
        text:`配合提案：${p.mare.name} × ${p.sire.name}（評価${p.ev.rank} ${p.ev.total}・爆発力${p.ev.explosion}${p.ev.theory.theories.length?"・"+p.ev.theory.theories.slice(0,2).map(t=>t.n).join("／"):""}）`,
        btn:"この配合で種付けへ", act:"breed", mid:p.mare.id, sname:p.sire.name, dis:S.funds<p.cost});
    });
    if(!bprops.length) cards.push({key:"breed"+S.week, who:"牧場長・佐伯 恒夫", face:"mgr", text:"配合評価で理論を確認して種付けへ", btn:"生産へ", act:"view", view:"breed", anchor:"breed-form"});
  }
  /* 次走が未定の馬 → ベストな次走をその場で登録 */
  const unentered=S.horses.filter(h=>!h.entry&&(h.injured||0)===0&&h.age>=2);
  for(const h of unentered){
    const sg=suggestNextRaces(h); const top=sg.list[0]; if(!top) continue;
    if(!nEntry) nEntry={title:`${h.name}の次走を決めましょう`, sub:`${top.race.name}（${top.race.course} ${top.race.surf}${top.race.dist}m・${top.race.when||"今週"}）がベストです`};
    const inWeek=S.races.some(x=>x.id===top.race.id||x.name===top.race.name);
    cards.push({key:"entry"+h.id, who:"秘書・佐倉 澪", face:"sec", text:`${h.name} → ${top.race.name}：${top.reasons[0]||"条件が合います"}`, btn: inWeek? "レース画面へ進む" : "次走提案を見る", act:"entry", hid:h.id, rid:top.race.id||null, rname:top.race.name});
    break;
  }
  /* 疲労が高い馬 → 休養/放牧 */
  const tired=S.horses.filter(h=>(h.injured||0)===0).sort((a,b)=>b.fat-a.fat)[0];
  if(tired&&tired.fat>=60){
    if(!nTired) nTired={title:`${tired.name}を休ませましょう`, sub:`疲労 ${Math.round(tired.fat)}。故障の前に抜くのが先決です`};
    cards.push({key:"rest"+tired.id, who:"調教師・"+TRAINER.name, face:"trainer", text:`${tired.name}は疲労 ${Math.round(tired.fat)}。放牧でしっかり抜きましょう`, btn:"放牧へ進む", act:"train", hid:tired.id, tid:"bokujou", dis:tired.trainsLeft<=0||S.funds<30});
  }
  /* 調教が残っている馬 → 調教師のおすすめの調教そのものへ着地させる */
  const untrained=S.horses.find(h=>h.trainsLeft>0&&(h.injured||0)===0);
  if(untrained){
    const rec=trainerSuggest(untrained)[0];
    if(rec){ const rt=TRAINS.find(x=>x.id===rec.tid);
      if(!nTrain) nTrain={title:`今週の調教を進めましょう`, sub:`${untrained.name}：${rt?rt.n:""}がおすすめです`};
      cards.push({key:"train"+untrained.id+rec.tid, who:"調教師・"+TRAINER.name, face:"trainer", text:`${untrained.name}：${rec.reason}`, btn:rt?`${rt.n}へ進む`:"この調教へ進む", act:"train", hid:untrained.id, tid:rec.tid, dis:S.funds<(rt?rt.cost:0)});
    }
  }
  /* 施設の空き＋資金 */
  const sp=farmSpaces();
  const recG=facRecommend()[0];
  const buildable=recG? recG.f : FACILITIES.filter(f=>facLv(f.id)===0&&facBuilding(f.id)===0&&f.cost<=S.funds).sort((a,b)=>a.cost-b.cost)[0];
  if(sp.free>0&&buildable){
    cards.push({key:"fac"+buildable.id, who:"牧場長・佐伯 恒夫", face:"mgr", text:`スペースに空きがあります。⭐おすすめは「${buildable.n}」（${fmt(buildable.cost)}万円・${buildable.cat}効果）：${recG? recG.reasons[0] : ""}`, btn:"施設を見る", act:"facility", fid:buildable.id});
  } else if(sp.free<=0){
    /* 満杯のときの提案：基本施設（面積）が未建設ならそれを勧め、
       建設済みなら名声を上げる道を示す（名声5ごとに+1で必ず広がる） */
    const bf=FACILITIES.find(f=>f.id==="base");
    if(bf&&facLv("base")===0&&facBuilding("base")===0&&bf.cost<=S.funds){
      cards.push({key:"facbase", who:"牧場長・佐伯 恒夫", face:"mgr", text:`スペースが満杯（${sp.used}/${sp.base}）です。「${bf.n}」（${fmt(bf.cost)}万円）を建設すると ${sp.base}→${sp.base+4} に広がります`, btn:"施設を見る", act:"facility", fid:"base"});
    } else {
      const unbuilt=FACILITIES.filter(f=>facLv(f.id)===0&&facBuilding(f.id)===0).sort((a,b)=>a.cost-b.cost)[0];
      if(unbuilt) cards.push({key:"facfame", who:"牧場長・佐伯 恒夫", face:"mgr", text:`スペースが満杯（${sp.used}/${sp.base}）です。名声 ${sp.nextFame} で +1 広がります（現在 名声 ${S.fame||0}）。重賞・G1を勝って名声を上げましょう`, btn:"施設を見る", act:"facility", fid:unbuilt.id});
    }
  }
  /* 資金が厳しい：マイナスなら立て直し案（融資・スポンサー・緊急売却）を最優先で提示 */
  if(S.funds<0){
    cards.push({key:"rescue"+S.week, who:"秘書・佐倉 澪", face:"sec", text:`資金がマイナス（${fmt(S.funds)}万円）です。融資・スポンサー支援・緊急売却で立て直せます`, btn:"立て直し案を見る", act:"finance"});
  } else if(S.funds<1200){
    cards.push({key:"funds"+S.week, who:"秘書・佐倉 澪", face:"sec", text:`資金 ${fmt(S.funds)}万円。馬券で立て直す手もありますし、融資・支援の相談もできます`, btn:"融資・支援に相談", act:"finance"});
  }
  if(!next) next= (tired&&tired.fat>=85)? nTired : (nTrain||nEntry||nTired||nSeason||{title:"週を進めましょう", sub:"今週の手当ては済んでいます"});
  const allCards=cards.filter(c=>!guideDismissed(c.key));
  const vis=allCards.slice(0,3);
  return {next, cards:vis, allCards};
}
function guideFaceHTML(who){
  if(who==="trainer") return `<img class="gface" src="assets/portrait-trainer.webp" alt="調教師・高橋健一">`;
  if(who==="mgr") return `<img class="gface" src="assets/portrait-trainer.webp" alt="牧場長・佐伯恒夫" style="filter:sepia(.35)">`;

/* 提案生成が万一例外を投げても、バーとガイドは必ず描く（進行不能の根絶） */
function buildGuideSafe(){
  try{ return buildGuide(); }
  catch(e){ return {next:{title:"週を進めましょう", sub:"今週の手当ては済んでいます"}, cards:[]}; }
}
function guideHTML(){
  const g=buildGuideSafe(); const st=guideSteps();
  const stepsHTML=st.steps.map((s,i)=>`<span class="${s.done?"done":i===st.cur?"cur":s.na?"na":""}">${s.done?"✓ ":(i+1)+". "}${s.n}${s.na?"（今週なし）":""}</span>`).join("");
  return `<div class="guidebox"><div class="g-next">次にやること</div><div class="g-title">${g.next.title}</div><div class="small">${g.next.sub}</div>
  <details class="gfold"><summary>週の進み具合を見る</summary><div class="gsteps">${stepsHTML}</div></details>
  ${entriesHTML()}
  ${g.cards.length?`<div class="gcards">${g.cards.map(c=>`<div class="gcard">${guideFaceHTML(c.face)}<div style="flex:1;min-width:0"><div class="gwho">${esc(c.who)} の提案</div><div class="gtext">${esc(c.text)}</div><div class="gbtns"><button class="btn sm" data-guide="${c.key}" ${c.dis?"disabled":""}>${esc(c.btn)}</button></div></div><button class="gx" data-gdismiss="${c.key}" title="この提案を消す（今週は再表示しません）">✕</button></div>`).join("")}</div>`:`<p class="small" style="margin:8px 0 0">提案はすべて完了しました。画面下部の「次の週へ」ボタンから進めます。</p>`}
  </div>`;
}
/* 提案ボタンの基本動作（第13次）：
   ・調教の提案（act:"train"）は、汎用の調教画面を開くのではなく、提案されている
     その調教そのものまで着地させる：対象馬が選択済みになり、その調教が金枠で
     示され、画面上部の固定バーと下部の提案バーに「この調教を実行する」が出る。
     実行すると次の提案が同じ場所に出るので、ボタンを押し続けるだけで進む。
   ・それ以外の提案（作戦・次走・施設・画面移動）は該当画面へ遷移する（第11次）。
     遷移先では対象の馬・レースが選択済みになり、該当ボタンが金枠で示される
   第14次：期間限定の提案（セール＝開催週のみ／種付け＝季節のみ）を通常の
   提案より先に出し、下部バーの「次の提案」に必ず現れるようにした。あわせて
   秘書ボタン・厩舎内の提案ボタンも含め、汎用ボタン（「レースへ」「馬券へ」
   「調教する」等）まで全て「対象の馬・レース・箇所」への遷移に統一し、
   着地スクロールはレイアウトが落ち着くまで複数回行って外さないようにした */
function guideFocusEl(el){
  if(!el)return;
  el.classList.add("guidefocus");
  const go=()=>{ try{ el.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){ try{ el.scrollIntoView(); }catch(e2){} } };
  go();
  /* 描画直後は画像・折りたたみの開閉でレイアウトが動き、1回のスクロールでは
     着地がずれる（牧場の長い画面でセール欄を通り過ぎる等）。レイアウトが
     落ち着くまで数回スクロールし直し、必ず「その箇所」に着地させる */
  if(typeof requestAnimationFrame==="function") requestAnimationFrame(go);
  setTimeout(go,260); setTimeout(go,650);
}
/* 提案の着地先（画面内の特定の要素）を、画面切替後の描画に対して適用する。
   「セールを見る→牧場タブの先頭」のような中途半端な着地をなくすための共通口 */
const ANCHOR_PANEL={"farm-sale":["farm","sale"], "farm-fac-detail":["farm","fac"], "breed-form":["breed","breed"]};
function applyPendingAnchor(view){
  if(!pendingAnchor||pendingAnchor.view!==view)return;
  const id=pendingAnchor.id; pendingAnchor=null;
  const mp=ANCHOR_PANEL[id];
  if(mp){ UI[mp[0]]=mp[1]; renderAll(); }
  const el=document.getElementById(id); if(el&&el.offsetParent!==null) guideFocusEl(el);
}
/* 厩舎の馬詳細にある「次走提案」の折りたたみを開いて示す（登録はそこのボタンで初めて実行される） */
function openPlanFold(){
  const folds=document.querySelectorAll("#v-stable details");
  for(const d of folds){ const sm=d.querySelector("summary"); if(sm&&sm.textContent.includes("次走提案")){ d.open=true; guideFocusEl(d); return true; } }
  return false;
}
function gotoGuideCard(c){
  if(!c)return;
  if(c.act==="entry"){
    const h=S.horses.find(x=>x.id===c.hid); if(!h)return;
    S.selected=h.id;
    const r=S.races.find(x=>x.id===c.rid)||S.races.find(x=>x.name===c.rname);
    if(r){ // 今週のレース：そのレースの出馬表（作戦画面）を開き、エントリー用ボタンを示す
      S.selRace=r.id; raceState.rivals=null; pendingCardFlash=true; cardFocus=true; switchView("race");
      guideFocusEl($("#btn-entry"));
    } else { // 今週のレース一覧にない将来のレース：対象馬の詳細を開き、「次走提案」から登録できる状態にする
      cardFocus=false; detailOpen=true; switchView("stable");
      if(!openPlanFold()){ const hd=$("#hdetail"); if(hd) hd.scrollIntoView({block:"start"}); }
    }
  }
  else if(c.act==="train"){
    const h=S.horses.find(x=>x.id===c.hid); if(!h)return;
    S.selected=h.id; pendingTrain={hid:h.id, tid:c.tid}; switchView("train");
  }
  else if(c.act==="card"){ const h=S.horses.find(x=>x.id===c.hid); if(h){ S.selected=h.id; const r=S.races.find(x=>h.entry&&x.name===h.entry.name); if(r){ S.selRace=r.id; raceState.rivals=null; } pendingCardFlash=true; cardFocus=true; switchView("race"); } }
  else if(c.act==="breed"){
    const mi=(S.mares||[]).findIndex(m=>m.id===c.mid), si=(S.stallions||[]).findIndex(s=>s.name===c.sname);
    if(mi>=0) breedSel.m=mi; if(si>=0) breedSel.s=si;
    pendingAnchor={view:"breed", id:"breed-form"}; switchView("breed");
    const bb2=$("#btn-breed2"); if(bb2) guideFocusEl(bb2);
  }
  else if(c.act==="facility"){ selFac=c.fid; pendingAnchor={view:"farm", id:"farm-fac-detail"}; switchView("farm"); }
  else if(c.act==="finance"){ showFinance(); }
  else if(c.act==="view"){ if(c.rid){ betState.raceId=c.rid; betState.field=null; } if(c.anchor) pendingAnchor={view:c.view, id:c.anchor}; switchView(c.view); }
}
/* 提案ボタンの実行口：調教提案は「提案された調教そのもの」へ着地させる。
   対象馬を選択し、その調教を実行待ち（pendingTrain）にして調教画面へ進む。
   着地先では金枠＋固定の実行バーが出るので、自分で探す必要はない。
   実行可否（回数・資金・故障）は着地先のバーに理由つきで表示される */
function execGuideCard(c){
  if(!c)return;
  if(c.act==="train"){
    const h=S.horses.find(x=>x.id===c.hid); const rt=TRAINS.find(x=>x.id===c.tid);
    if(h&&rt){ S.selected=h.id; pendingTrain={hid:h.id, tid:c.tid}; switchView("train"); return; }
  }
  gotoGuideCard(c);
}
function wireGuide(root){
  if(!root)return;
  root.querySelectorAll("[data-gdismiss]").forEach(b=>b.addEventListener("click",()=>{ guideSkipSet().push(S.week+":"+b.dataset.gdismiss); saveAuto(); renderAll(); }));
  root.querySelectorAll("[data-guide]").forEach(b=>b.addEventListener("click",()=>{
    const g=buildGuideSafe(); const c=g.cards.find(x=>x.key===b.dataset.guide); if(!c)return;
    try{ execGuideCard(c); }catch(e){ renderAll(); }
  }));
}
/* ============ 下部固定バー（次の提案／画面ごとの主行動を1つだけ出す） ============ */
function renderActionBar(){
  const bar=$("#actionbar"); if(!bar)return;
  if(typeof raceState!=="undefined"&&raceState.phase==="run"){ bar.style.display="none"; return; }
  bar.style.display="";
  bar.classList.remove("solo");
  if(typeof raceState!=="undefined"&&raceState.phase==="done"){
    bar.innerHTML=`<div class="ab-text"><span class="ab-kicker">レース終了</span>結果を確認したら、厩舎へ帰りましょう</div><button class="ab-btn btn gold" id="ab-exec">🏠 帰る</button>`;
    const hb=$("#ab-exec"); if(hb) hb.addEventListener("click",()=>{ auStopCrowd(); auSetMode("home"); raceState.phase="idle"; switchView("stable"); });
    return;
  }
  /* 提案の調教に着地している間は、下部バーがそのまま「実行ボタン」になる。
     提案ボタン（下部）→実行ボタン（下部）→次の提案ボタン（下部）と、
     押す位置が変わらないまま連打で週の手当てが進む */
  if(pendingTrain){
    const ph=S.horses.find(x=>x.id===pendingTrain.hid); const pt=TRAINS.find(x=>x.id===pendingTrain.tid);
    const onTab=document.querySelector("#tabs button.on");
    const curV2=onTab?onTab.dataset.v:"";
    if(ph&&pt&&curV2==="train"){
      const blockedMsg=trainBlockReason(ph, pt.id);
      bar.innerHTML=`<div class="ab-text"><span class="ab-kicker">提案の調教</span>${esc(ph.name)} に「${esc(pt.n)}」${pt.cost?`（${pt.cost}万円）`:""}${blockedMsg?`<br>⚠ ${blockedMsg}`:""}</div><button class="ab-btn btn gold" id="ab-exec" ${blockedMsg?"disabled":""}>▶ この調教を実行する</button>`;
      const eb=$("#ab-exec"); if(eb) eb.addEventListener("click",()=>{ const tid=pendingTrain?pendingTrain.tid:null; pendingTrain=null; if(tid){ S.selected=ph.id; doTrain(tid); } });
      return;
    }
    if(ph&&pt){ /* 調教画面から離れている間は、着地先へ戻すボタンを出す */
      bar.innerHTML=`<div class="ab-text"><span class="ab-kicker">提案の調教</span>${esc(ph.name)} の「${esc(pt.n)}」が実行待ちです</div><button class="ab-btn btn gold" id="ab-exec">調教へ戻る</button>`;
      const rb2=$("#ab-exec"); if(rb2) rb2.addEventListener("click",()=>{ S.selected=ph.id; switchView("train"); });
      return;
    }
    pendingTrain=null;
  }
  /* 下部バーは「次の提案」専用。「次の週へ」は提案バーとタブの間の
     専用バー（#nextweekbar）へ移設したので、ここには提案だけを出す。
     提案ボタンは execGuideCard 経由：調教提案は提案された調教そのものへ
     着地し（着地後は上の実行バーに切り替わる＝連打で進む）、
     それ以外は該当画面へ遷移する。提案が無い週はバーを丸ごと隠す */
  const g=buildGuideSafe();
  const c=(g.cards||[]).find(x=>!x.dis) || null;
  if(c){
    bar.innerHTML=`<div class="ab-text"><span class="ab-kicker">次の提案</span>${esc(c.text)}</div><button class="ab-btn btn gold" id="ab-exec">${esc(c.btn)}</button>`;
    const b=$("#ab-exec"); if(b) b.addEventListener("click",()=>{ try{ const g2=buildGuideSafe(); execGuideCard(g2.cards.find(x=>x.key===c.key&&!x.dis)||g2.cards.find(x=>!x.dis)); }catch(e){} });
    return;
  }
  bar.style.display="none";
}


/* ============ レイアウト共通（サブタブ） ============
   一覧はページ送りで分割せず、全件をそのまま並べてスクロールで
   見せる（サブタブ切替は維持）。pagerHTML／pageSlice は互換のため
   残すが、pagerHTML は何も出さず pageSlice は全件を返す */
const UI={stable:"horses", train:"plan", race:"list", bet:"races", breed:"breed", jockey:"list", farm:"top", rank:"earn", racedone:"result", sdetail:"0"};
const PG={};
function subnavHTML(view, items){ return `<div class="subnav" role="tablist">${items.map(([k,n])=>`<button type="button" data-subnav="${view}:${k}" class="${UI[view]===k?"on":""}">${n}</button>`).join("")}</div>`; }
function panelHTML(view, key, inner){ return `<div class="subpanel ${UI[view]===key?"on":""}" data-panel="${view}:${key}">${inner}</div>`; }
function pagerHTML(key, total, per){ return ""; } /* ページ送りは廃止：一覧は全件スクロール表示 */
function pageSlice(key, arr, per){ return arr.slice(); }
const panelOpen=(view,key)=>`<section class="subpanel ${UI[view]===key?"on":""}" data-panel="${view}:${key}">`;
const panelClose=()=>`</section>`;
function wirePanels(root){
  if(!root) return;
  root.querySelectorAll("[data-subnav]").forEach(b=>b.addEventListener("click",()=>{ const pr=b.dataset.subnav.split(":");
    /* 「出馬表へ」直行中（cardFocus）は renderRace が出馬表パネルへ強制的に戻すため、
       そのままでは作戦・単勝など他のタブを押しても開かない。タブを押した時点で
       直行モードを解除し、押したタブがそのまま開くようにする（出馬表タブ自身は維持） */
    if(pr[0]==="race"&&pr[1]!=="card"&&typeof cardFocus!=="undefined") cardFocus=false;

  root.querySelectorAll("[data-pg]").forEach(b=>b.addEventListener("click",()=>{ const pr=b.dataset.pg.split(":"); PG[pr[0]]=(PG[pr[0]]||0)+ +pr[1]; renderAll(); }));
}
/* 長い詳細HTMLを <h3> 見出し単位で分割し、タブ切替で見せる（見切れ防止） */
function tabSplitHTML(html){
  const parts=html.split(/(?=<h3)/);
  if(parts.length<=1) return html;
  const tabs=parts.map((p,i)=>{ const m=p.match(/<h3[^>]*>([^<]+)/); return [String(i), i===0?"基本":(m?m[1].replace(/（[^）]*）/g,""):"詳細")]; });
  let cur=+UI.sdetail||0; if(cur>=parts.length)cur=parts.length-1; if(cur<0)cur=0;
  return `<div class="subnav">${tabs.map(([k,n])=>`<button type="button" data-dtab="${k}" class="${cur===+k?"on":""}">${esc(n)}</button>`).join("")}</div><div class="fillpanel">${parts[cur]||""}</div>`;
}

/* ============ オート（提案どおりに自動で進める） ============
   進め方の土台は「定常指示」：調教は毎回選ぶものではなく、馬ごとの
   定常指示（h.plan＝繰り返し調教／疲労の閾値と切替先／レース前後の
   軽め調整など）を設定しておけば、週送りの runPlan が毎週自動で
   実行する。オートはこの仕組みの上で動く：
   ・調教の提案は「その場限りの一回実行」にはせず、定常指示の
     設定・変更として反映する（おすすめ調教→繰り返し指示に設定、
     疲労が高い馬→閾値を下げて放牧へ切り替える指示に変更、
     調教師の指示変更の提案→その指示をそのまま採用する）
   ・次走の提案はベストな次走をそのまま登録する
   ・実行できる提案が無くなれば次の週へ進む（調教は定常指示が実行）
   停止条件に触れたらその場で止まり、理由をバーに残す。レース自体は
   自動で走らないため出走週では必ず止まる。確認画面（年末・資金不足・
   延滞警告など）が出た場合も、内容を確認してもらうため止まる */
const AUTO={running:false, timer:null, steps:0, weeksDone:0, skip:{}, planSet:{}, bredTried:{}, label:"", stopReason:"", injured:""};
function autoCfg(){
  const d={weeks:4, fundsMin:-1, stopInjury:true, stopSale:true, stopFacility:true, stopFinance:true};
  if(!S.autoCfg||typeof S.autoCfg!=="object") S.autoCfg={};
  /* 出走週の扱い（raceStop）：all=すべての出走週で止まる／graded=重賞（G3以上）の週だけ止まる／
     g1=G1の週だけ止まる／none=止まらず全レースを「結果だけ」で消化する。
     移行は既定値の補完より前に、保存データに stopRace が明示されているかで判定する：
     明示された旧セーブは true→all／false→none、無い場合（新規開始）は graded を既定にする。
     新規の既定を all にすると、オートが全レース週で止まってしまい
     「オートでレースが進まない」状態になるため、条件戦は自動消化される graded とする */
  if(!["all","graded","g1","none"].includes(S.autoCfg.raceStop)){
    S.autoCfg.raceStop = ("stopRace" in S.autoCfg)? (S.autoCfg.stopRace===false? "none" : "all") : "graded";
  }
  for(const k in d) if(S.autoCfg[k]===undefined) S.autoCfg[k]=d[k];
  if(![1,2,4,8,12,24,36,48].includes(S.autoCfg.weeks)) S.autoCfg.weeks=4;
  if(![-1,0,500,1000,2000].includes(S.autoCfg.fundsMin)) S.autoCfg.fundsMin=-1;
  S.autoCfg.stopRace = S.autoCfg.raceStop!=="none";
  return S.autoCfg;
}
/* エントリー中のレースが、オートの停止対象かどうか（クラスで判定） */
function autoRaceStopFor(ne){
  const mode=autoCfg().raceStop;
  if(mode==="all") return true;
  if(mode==="none") return false;
  const cls=(ne&&ne.e&&typeof ne.e.cls==="number")? ne.e.cls : -1;
  if(mode==="g1") return cls>=8;
  if(mode==="graded") return cls>=6;
  return true;
}
function autoInjuredKey(){ return S.horses.filter(h=>h.injured>0).map(h=>h.id).sort((a,b)=>a-b).join(","); }
function autoSchedule(ms){ if(AUTO.timer)clearTimeout(AUTO.timer); AUTO.timer=setTimeout(autoStep, ms||850); }
function autoStart(){
  if(AUTO.running||S.gameover) return;
  if(typeof raceState!=="undefined"&&(raceState.phase==="run"||raceState.phase==="done")){ toast("レース中はオートを開始できません"); return; }
  AUTO.running=true; AUTO.steps=0; AUTO.weeksDone=0; AUTO.skip={}; AUTO.planSet={}; AUTO.bredTried={}; AUTO._rc={}; AUTO.facSkipLog={}; AUTO._digestTry={}; AUTO.digestFailReason=""; AUTO.stopReason=""; AUTO.label="開始します"; AUTO.injured=autoInjuredKey();
  pendingTrain=null; pendingAnchor=null;
  switchView("stable");
  renderAll();
  autoSchedule(400);
}
function autoStop(reason){
  if(AUTO.timer){ clearTimeout(AUTO.timer); AUTO.timer=null; }
  const was=AUTO.running; AUTO.running=false;
  AUTO.stopReason=reason||"";
  if(was&&reason) toast("🤖 オート停止："+reason);
  renderAll();
}
/* オート用：出走週のレースを観戦方法「結果だけ」で即時消化する。
   出馬表は固定フィールド（出馬表・馬券と同一）を使い、作戦は現在の設定のまま。
   手動プレイの観戦設定（S.watchMode）は一時的に差し替えてレース後に戻す。
   結果処理（賞金・記録・疲労・エントリー消化）は通常の finishRace が行う */
function autoDigestRace(ne){
  const h=ne&&ne.h; if(!h||!h.entry) return false;
  AUTO.digestFailReason="";
  const r=S.races.find(x=>x.name===h.entry.name);
  if(!r){ /* 番組に無いエントリーは消化のしようがない：理由を残して取り消し、止まらずに進める */
    cancelEntryStale(h,"今週の番組にこのレースが見つかりませんでした"); return true; }
  /* 開催週を迎えた同レースのエントリーを、出走できる馬と条件外の馬に分ける。
     条件外（登録後に別のレースで勝ってクラスが上がった等）はエラー停止にせず、
     理由を記録に残して自動で取り消し、出走できる馬だけを消化する */
  const due=S.horses.filter(x=>x.entry&&x.entry.name===r.name&&x.entry.absWeek<=S.week);
  const owns=[];
  for(const x of due){ const why=eligible(x,r); if(why) cancelEntryStale(x,why); else owns.push(x); }
  if(!owns.length) return true; /* 全頭取り消し済み：消化するレースは無いので進行を続ける */
  /* 繰り返しガード：同じレース（同じ週・同じエントリー）の消化が2回目に
     入ったら、前回でエントリーが消費されなかった異常とみなして即失敗にする。
     startRace を再実行しないので、騎乗料だけが毎手引かれ続けることもない */
  if(!AUTO._digestTry) AUTO._digestTry={};
  const dkey=r.name+"@"+h.entry.absWeek+"@"+owns.map(x=>x.id).sort((a,b)=>a-b).join(",");
  if(AUTO._digestTry[dkey]){ AUTO.digestFailReason=`同じレース（${r.name}）の消化が繰り返されました。前回の消化でエントリーが消費されなかったため、これ以上は進めません`; return false; }
  AUTO._digestTry[dkey]=1;
  /* 事前チェック：騎乗料（＋海外遠征費）が払えるか。払えない場合は startRace の
     警告画面ではなく、理由つきの失敗としてオートを止める */
  let totalFee=0;
  for(const oh of owns){
    const ej=oh.reqJockey!=null? oh.reqJockey : oh.jockey;
    const jk=JOCKEYS[ej];
    if(!jk){ AUTO.digestFailReason=`${oh.name} の騎手が見つかりませんでした`; return false; }
    totalFee+=jk.fee+(r.overseas? (r.travel||0) : 0);
  }
  if(S.funds<totalFee){ AUTO.digestFailReason=`騎乗料${r.overseas?"と遠征費":""}が不足しています（必要 ${fmt(totalFee)}万円／現在 ${fmt(S.funds)}万円）`; return false; }
  const field=[...fixedRivalsFor(r)];
  owns.forEach(x=>{ if(!field.includes(x)) field.push(x); });
  fixGates(field);
  raceState.card=field; raceState.rivals=fixedRivalsFor(r); raceState.rivalRace=r.id;
  const prevWatch=S.watchMode;
  S.watchMode="result";
  const before=new Map(owns.map(x=>[x.id,{races:x.races||0}]));
  let ok=false;
  try{
    startRace(r, owns[0], field);
    /* 成功の判定は phase だけでは行わない：精算（finishRace）が実際に行われ、
       エントリーが消費され、出走数が増えたことを必ず確認する。
       phase が "done" でも精算が飛ばされた場合は「成功」と扱わず失敗にする
       （成功ログだけ出てエントリーが残り、無限に消化し続ける不具合の再発防止） */
    ok=(raceState.phase==="done") && owns.every(x=>!x.entry && (x.races||0)>before.get(x.id).races);
    if(ok){
      const res=(raceState.result&&raceState.result.ownResults)||[];
      res.forEach(o=>log(`🤖 オート：${year()}年${month()}月第${weekInMonth()}週／${o.h.name} は ${r.name} に出走し ${o.place}着（賞金${fmt(o.prize)}万円）― 結果だけ表示で消化`));
      raceState.phase="idle";
      /* 画面切替は付随処理：失敗しても精算済みの消化を「失敗」にしない */
      try{ switchView("stable"); }catch(e2){ console.warn("autoDigest switchView failed", e2); }
    } else if(raceState.phase==="done"){
      AUTO.digestFailReason=`${r.name} の結果が精算されませんでした（エントリーが消費されませんでした）`;
    } else {
      AUTO.digestFailReason=`${r.name} を開始できませんでした`;
    }
  }catch(e){ ok=false; const em=(e&&e.message)||String(e); if(!AUTO.digestFailReason) AUTO.digestFailReason=`${r.name} の消化中にエラーが発生しました（${em}）`;
    /* 例外の中身を必ず捕捉して残す：メッセージと発生箇所（スタック先頭）を
       記録に出し、次に同じ失敗が起きても原因が追えるようにする */
    try{ log(`⚠ オート消化エラー：${r.name} ― ${em}`); const st=String((e&&e.stack)||"").split("\n")[1]; if(st) log(`⚠ 発生箇所：${st.trim()}`); }catch(e2){} }
  if(!ok){
    /* 消化に失敗しても詰ませない：レース状態を初期化して厩舎画面と操作バー
       （オート開始・次の週へ）を必ず戻し、手動で続けられる状態にフォールバックする。
       phase が "run"/"done" のまま残るとバーが「レース中」として隠れ続けてしまう */
    try{ cancelAnimationFrame(raceState.raf); }catch(e){}
    raceState.phase="idle"; raceState.done=false; raceState.sim=null; raceState.vis=null; raceState.result=null;
    try{ switchView("stable"); }catch(e){}
  }
  S.watchMode=prevWatch;
  return ok;
}
/* 次走提案のベスト候補をそのまま登録する（確認画面は挟まない）。
   登録できない時は黙って素通りせず、理由を記録に残す（週に1回まで）。
   1位候補が出走条件で落ちる場合は2位・3位候補へ順に切り替える */
function autoRegFailLog(h,msg){
  if(!AUTO.regFailLog) AUTO.regFailLog={};
  const k=h.id+"@"+S.week; if(AUTO.regFailLog[k]) return;
  AUTO.regFailLog[k]=1;
  log(`🤖 オート：${h.name} の次走を登録できませんでした ― ${msg}`);
}
function autoRegisterBest(h){
  if((h.injured||0)>0){ autoRegFailLog(h,`故障の休養中（あと${h.injured}週）です`); return false; }
  if(h.age<2){ autoRegFailLog(h,"まだ2歳になっていません"); return false; }
  const sg=suggestNextRaces(h); const list=(sg&&sg.list)||[];
  if(!list.length){ autoRegFailLog(h,"条件に合うレースの候補が見つかりませんでした（年齢・クラス・季節を確認してください）"); return false; }
  let lastRs="";
  for(const pk of list){
    const race=pk.race;
    const cur=S.races.find(x=>x.id===race.id);
    const rs=cur? eligible(h,cur) : eligibleAt(h,race,ageAtRaceMonth(h,race.month,race.week),race.weeks||0);
    if(rs){ lastRs=`${race.name}：${rs}`; continue; }
    if(!registerEntry(h,race,S.week+(race.weeks||0))){ lastRs=`${race.name}：登録時に出走条件を満たしませんでした`; continue; }
    log(`🤖 オート：${h.name} の次走をエントリー方針「${policyName()}」で登録 ― ${race.name}（${year()}年${race.month||month()}月第${race.week||weekInMonth()}週・あと${race.weeks||0}週）`);
    return true;
  }
  autoRegFailLog(h,`候補のレースすべて出走条件に合いませんでした（${lastRs}）`);
  return false;
}
/* 調教の提案 → 定常指示の設定・変更として反映する（一回実行はしない）。
   疲労系の提案（放牧・休養）は「疲労が閾値を超えたら切り替える」条件付き
   指示として設定し、実際の調教・放牧は週送りの runPlan が実行する */
function autoApplyTrainProposal(h,tid){
  const p=Object.assign({}, h.plan||defaultPlan());
  if(tid==="bokujou"||tid==="rest"){
    p.fatAct=tid; p.goalTrait=""; p.weakFocus=false;
    p.fatTh=Math.max(30, Math.min(p.fatTh||60, Math.ceil(h.fat)-1)); // 今の疲労で確実に切り替わる閾値にする
    h.plan=p;
    log(`🤖 オート：${h.name} の定常指示を変更（疲労 ${p.fatTh} 超で${FAT_ACTS[tid]}へ切替）`);
    return `${h.name}：疲労${p.fatTh}超で${FAT_ACTS[tid]}に切り替える指示に設定`;
  }
  const t=TRAINS.find(x=>x.id===tid); if(!t) return null;
  p.repeat=tid; p.goalTrait=""; p.weakFocus=false;
  h.plan=p;
  log(`🤖 オート：${h.name} の定常指示を「${t.n}繰り返し」に設定`);
  return `${h.name} の定常指示を「${t.n}繰り返し」に設定`;
}
function autoCardAction(c,cfg){
  if(c.act==="train"){
    const h=S.horses.find(x=>x.id===c.hid); if(!h) return {type:"skip"};
    /* 適用できたら今週ぶんは済みとして記録する。記録しないと、同じ調教提案
       カードが出続けて（定常指示の設定は調教回数を消費しないため）オートが
       その場で空転し、週送りに永遠に到達しない */
    return {type:"run", label:"定常指示を設定", run:()=>{ const msg=autoApplyTrainProposal(h,c.tid); if(msg) AUTO.label=msg; AUTO.skip[c.key+"@"+S.week]=1; }};
  }
  if(c.act==="entry"){
    const h=S.horses.find(x=>x.id===c.hid); if(!h) return {type:"skip"};
    return {type:"run", label:`${h.name} の次走を登録`, run:()=>{ if(!autoRegisterBest(h)) AUTO.skip[c.key+"@"+S.week]=1; }};
  }
  if(c.act==="card"){
    const h=S.horses.find(x=>x.id===c.hid);
    const ne=h&&h.entry? {h, e:h.entry, left:h.entry.absWeek-S.week} : null;
    /* 停止対象でないレースの週は止めない（この後の消化ゲートが「結果だけ」で処理する） */
    if(ne&&!autoRaceStopFor(ne)) return {type:"skip"};
    return {type:"stop", reason:"出走週です。作戦を決めてレースへ進んでください"};
  }
  if(c.act==="facility"){
    /* 停止条件ONのときだけ止まってプレイヤーの判断を待つ */
    if(cfg.stopFacility){ const rt=facRecommend()[0]; return {type:"stop", reason: rt? `施設の建設提案があります（停止条件：施設）。⭐おすすめは「${rt.f.n}」（${fmt(rt.f.cost)}万円・${rt.f.cat}効果）：${rt.reasons[0]||""}` : "施設の建設提案があります（停止条件：施設）。内容を確認してください"}; }
    /* 停止条件OFFの場合は、止まらないだけでなく建設もしない：
       提案を素通りして進行を続ける（建設はプレイヤーが手動で行うもの）。
       実際に建てられたはずの提案については、見送ったことを週1回だけ
       ログに残す（何が起きたか追えるように） */
    const f=FACILITIES.find(x=>x.id===c.fid);
    if(f&&facLv(f.id)===0&&facBuilding(f.id)===0&&S.funds>=f.cost&&(f.id==="base"||farmSpaces().free>0)){
      if(!AUTO.facSkipLog) AUTO.facSkipLog={};
      const lk=c.key+"@"+S.week;
      if(!AUTO.facSkipLog[lk]){ AUTO.facSkipLog[lk]=1; log(`🤖 オート：施設「${f.n}」の建設提案は、停止条件（施設）がOFFのため建設せずに見送りました`); }
    }
    return {type:"skip"};
  }
  if(c.act==="finance"){
    if(cfg.stopFinance) return {type:"stop", reason:"資金繰りの相談（融資・スポンサー）が必要なため停止しました"};
    return {type:"skip"};
  }
  if(c.act==="view"&&c.anchor==="farm-sale"){
    if(cfg.stopSale) return {type:"stop", reason:"セール開催中です（停止条件：セール）。購入する馬を選んでください"};
    return {type:"skip"};
  }
  if(c.act==="breed"){
    /* オート中の種付けは停止条件の対象にしない：繁殖シーズンは止まらず、
       調教師の配合提案（相馬眼ランクで提案の質が変わる既存の仕組み）どおりに
       自動で種付けを登録し、オートはそのまま進行を続ける（おまかせと同じ扱い）。
       手動プレイ時の種付けフロー・提案カードの表示は従来どおり */
    const m=(S.mares||[]).find(x=>x.id===c.mid), s=(S.stallions||[]).find(x=>x.name===c.sname);
    if(!m||!s||m.pregnant) return {type:"skip"};
    return {type:"run", label:`配合：${m.name} × ${s.name}`, run:()=>{ const r=tryBreed(s,m); if(r.err){ AUTO.skip[c.key+"@"+S.week]=1; const why= r.err==="funds"? `資金不足（必要 ${fmt(r.cost||((s.fee||0)+150))}万円／現在 ${fmt(S.funds)}万円）` : r.err==="cap"? "繁殖牝馬の繋養上限に達しています" : r.err==="preg"? "今年は種付け済みです" : r.err==="season"? "種付け期間外です" : "登録できませんでした"; log(`🤖 オート：${m.name} の種付けは見送りました ― ${why}`); } else { AUTO.label=`種付けを登録：${m.name} × ${s.name}（評価${r.ev.rank}）`; log(`🤖 オート：調教師の配合提案で種付けを登録 ― ${m.name} × ${s.name}（評価${r.ev.rank} ${r.ev.total}）`); } }};
  }
  if(c.act==="view"&&c.anchor==="breed-form"){
    /* 配合提案が無い場合（種牡馬がいない等）は、調教師にも決めようがないので
       止まらずに見送って進行を続ける（提案がある場合は上の breed 分岐で実行済み） */
    return {type:"skip"};
  }
  return {type:"skip"};
}
/* オートの安全装置：1手でも例外が出ると setTimeout 連鎖が黙って切れ、
   理由も表示されずに止まって見える。例外は必ず「理由つきの停止」に変える */
function autoStep(){
  try{ autoStepBody(); }
  catch(e){
    try{ log("⚠ オート処理でエラー："+(e&&e.message||e)); }catch(e2){}
    try{ autoStop("内部エラーが発生したため停止しました（手動で続けられます）"); }
    catch(e3){ AUTO.running=false; try{ renderAutoBar(); renderAll(); }catch(e4){} }
  }
}
function autoStepBody(){
  AUTO.timer=null;
  if(!AUTO.running) return;
  if(S.gameover){ autoStop("ゲームオーバーになりました"); return; }
  if(typeof raceState!=="undefined"&&(raceState.phase==="run"||raceState.phase==="done")){ autoStop("レース画面のため停止しました"); return; }
  if(AUTO.steps>=400){ autoStop("安全上限（400手）に達したため停止しました"); return; }
  const cfg=autoCfg();
  /* 資金系の停止条件は確認画面より先に判定し、止まる理由が定義済みの
     停止条件（資金繰り／資金下限）になるようにする */
  if(S.funds<0){ autoStop("資金がマイナスになったため停止しました（立て直し案を確認してください）"); return; }
  if(cfg.fundsMin>=0&&S.funds<cfg.fundsMin){ autoStop(`資金が下限（${fmt(cfg.fundsMin)}万円）を下回ったため停止しました`); return; }
  const ov=$("#overlay");
  if(ov&&ov.style.display&&ov.style.display!=="none"){ autoStop("確認画面が出たため停止しました（画面の内容を確認してください）"); return; }
  const injNow=autoInjuredKey();
  if(injNow!==AUTO.injured){
    const grew=injNow.split(",").some(x=>x!==""&&!AUTO.injured.split(",").includes(x));
    AUTO.injured=injNow;
    if(grew&&cfg.stopInjury){ autoStop("故障が発生したため停止しました"); return; }
  }
  const ne=nearestEntry();
  if(ne&&ne.left<=0){
    if(autoRaceStopFor(ne)){ autoStop(`${ne.h.name} の出走週です（${ne.e.name}／${CLASSES[ne.e.cls]||""}）。作戦を決めてレースへ進んでください`); return; }
    /* 停止対象でないレース（設定で「止まらない」側にした通常レース等）は、
       「結果だけ」観戦で即時消化して自動進行を続ける（作戦は現在の設定のまま） */
    AUTO.steps++;
    if(autoDigestRace(ne)){ AUTO.label=`${ne.h.name} のレースを結果だけ表示で消化しました`; renderAll(); autoSchedule(850); }
    else autoStop(`レースを消化できなかったため停止しました${AUTO.digestFailReason?` ― ${AUTO.digestFailReason}`:"（出走条件・騎乗料・資金を確認してください）"}`);
    return;
  }
  /* 調教師の「指示変更」の提案があれば、定常指示の変更として採用する（週に1回まで） */
  for(const h of S.horses){
    const pk=S.week+":"+h.id;
    if(AUTO.planSet[pk]) continue;
    if(h.planFixed) continue; // プレイヤーが固定した指示はオートでも変更しない
    let prop=null; try{ prop=trainerPlanProposal(h); }catch(e){}
    if(prop){
      AUTO.planSet[pk]=1; AUTO.steps++;
      h.plan=JSON.parse(JSON.stringify(prop.plan));
      AUTO.label=`${h.name} の定常指示を変更（調教師の提案）`;
      log(`🤖 オート：${h.name} の定常指示を調教師の提案どおりに変更 ― ${planText(h.plan)}`);
      renderAll(); autoSchedule(850); return;
    }
  }
  /* 繁殖シーズン（5〜6月）の種付けは、提案カードの表示状態（未表示・非表示・
     資金不足での無効化など）に左右されず、調教師が直接実行する：未種付けの
     繁殖牝馬がいれば、調教師の配合提案（相馬眼で質が変わる既存の仕組み）
     どおりに1頭ずつ種付けを登録し、止まらずに進行を続ける。資金不足など
     登録できない牝馬はその週は見送りとして記録し、空転させない */
  if(month()===5||month()===6){
    if(!AUTO.bredTried) AUTO.bredTried={};
    if(!AUTO.bredLogged) AUTO.bredLogged={};
    const breedLogOnce=(key,msg)=>{ if(!AUTO.bredLogged[key]){ AUTO.bredLogged[key]=1; log(msg); } };
    let bprops=[]; try{ bprops=trainerBreedProposals(); }catch(e){}
    const bp=bprops.find(p=>p&&p.mare&&p.sire&&!p.mare.pregnant&&!AUTO.bredTried[S.week+":"+p.mare.id]);
    if(bp){
      AUTO.bredTried[S.week+":"+bp.mare.id]=1; AUTO.steps++;
      const r=tryBreed(bp.sire,bp.mare);
      if(!r.err){ AUTO.label=`種付けを登録：${bp.mare.name} × ${bp.sire.name}（評価${r.ev.rank}）`; log(`🤖 オート：調教師の配合提案で種付けを登録 ― ${bp.mare.name} × ${bp.sire.name}（評価${r.ev.rank} ${r.ev.total}）`); }
      else { const why= r.err==="funds"? `資金不足（必要 ${fmt(r.cost||((bp.sire.fee||0)+150))}万円／現在 ${fmt(S.funds)}万円）` : r.err==="cap"? "繁殖牝馬の繋養上限に達しています" : r.err==="preg"? "今年は種付け済みです" : r.err==="season"? "種付け期間外です" : "登録できませんでした";
        AUTO.label=`${bp.mare.name} の種付けは見送りました（${why}）`; log(`🤖 オート：${bp.mare.name} の種付けは見送りました ― ${why}`); }
      renderAll(); autoSchedule(850); return;
    }
    /* 種付けできない理由も、シーズン中は1回ずつログに残す（「何も起きていない」
       のではなく「やれない理由」が分かるように） */
    const unbred=(S.mares||[]).filter(m=>!m.pregnant);
    if(!(S.mares||[]).length) breedLogOnce("nosiremare"+S.week, "🤖 オート：繁殖シーズンですが、繁殖牝馬がいないため種付けは行いません（牝馬を引退させると繁殖入りします）");
    else if(!(S.stallions||[]).length) breedLogOnce("nosire"+S.week, "🤖 オート：繁殖シーズンですが、種牡馬がいないため種付けは行いません");
    else if(!unbred.length) breedLogOnce("allbred"+S.week, "🤖 オート：繁殖牝馬は全頭種付け済みです");
    else if(!bprops.length) breedLogOnce("noprop"+S.week, "🤖 オート：調教師の配合提案が作れなかったため、今週の種付けは見送ります");
    else { const cheap=Math.min.apply(null,bprops.map(p=>p.cost||((p.sire.fee||0)+150))); if(S.funds<cheap) breedLogOnce("funds"+S.week, `🤖 オート：種付けは資金不足で見送ります（最安の配合でも ${fmt(cheap)}万円が必要／現在 ${fmt(S.funds)}万円）`); }
  }
  const g=buildGuideSafe();
  const cards=(g.allCards||g.cards||[]).filter(c=>!c.dis&&!AUTO.skip[c.key+"@"+S.week]);
  for(const c of cards){
    const v=autoCardAction(c,cfg);
    if(v.type==="stop"){ autoStop(v.reason); return; }
    if(v.type==="skip"){ AUTO.skip[c.key+"@"+S.week]=1; continue; }
    /* 空転防止の保険：同じ提案を同じ週に3回実行しても状態が変わらない場合は
       その提案を今週ぶん見送り、週送りへ進む（提案の空ループで止まらない） */
    const rk=c.key+"@"+S.week;
    AUTO._rc=AUTO._rc||{};
    AUTO._rc[rk]=(AUTO._rc[rk]||0)+1;
    if(AUTO._rc[rk]>2){ AUTO.skip[rk]=1; continue; }
    AUTO.steps++; if(v.label) AUTO.label=v.label;
    try{ v.run(); }catch(e){ AUTO.skip[c.key+"@"+S.week]=1; }
    renderAll(); autoSchedule(850); return;
  }
  if(AUTO.weeksDone>=cfg.weeks){ autoStop(`指定の ${cfg.weeks} 週を進めたため停止しました`); return; }
  const blocked=blockedEntries();
  if(blocked.length){
    if(!autoRaceStopFor(blocked[0])&&autoDigestRace(blocked[0])){ AUTO.steps++; AUTO.label="レースを結果だけ表示で消化しました"; renderAll(); autoSchedule(850); return; }
    autoStop(AUTO.digestFailReason? `レースを消化できなかったため停止しました ― ${AUTO.digestFailReason}` : "出走週のため停止しました"); return;
  }
  /* 年末処理を跨ぐ週送りでは必ず止まる：年末処理（引退判断・明け2歳の処遇・
     お守り交換・クラブ処理）にはプレイヤーの意思決定が含まれるため自動消化しない。
     48週オートでも、年が替わる手前で停止して年末処理を済ませてもらう */
  if((S.week+1)%48===0){ autoStop("年末処理の週です。年末処理（引退判断・世代更新など）を確認してから、必要ならオートを再開してください"); return; }
  AUTO.steps++; AUTO.weeksDone++; AUTO.label="次の週へ（調教は定常指示が自動実行）";
  try{ nextWeek(); }catch(e){}
  renderAll(); autoSchedule(1000);
}
/* オートバー：提案バーと次週バーの間に置く。実行中は提案バー・
   次週バーを隠し、状態表示と停止ボタンだけにする */

    bar.innerHTML=`<div class="ab-text"><span class="ab-kicker">🤖 オート実行中（提案どおり・調教は定常指示）</span>${esc(AUTO.label||"")}（${AUTO.weeksDone}/${cfg.weeks}週・${AUTO.steps}手）</div><button class="ab-btn btn red" id="ab-auto-stop">■ 停止する</button>`;

/* ============ 調教師の雇用・おまかせモード ============
   役割分担：オート＝「提案どおりに進行」させる実行係（登録・週送り・
   停止条件）。おまかせ＝調教師が常時、定常指示の設定・変更と週次の
   手当てを代行する任せ方。おまかせ中は週送りのたびに omakaseReview が
   指示を見直してから runPlan が実行する。判断の質は調教師の能力
   （調教・閃きランク）で変わる：見られる頭数、繰り返し調教の組み替え、
   特性習得ゴールの設定まで面倒を見るかどうかが変わる */
function trainerData(){ return TRAINER_ROSTER.find(t=>t.id===(S.trainerId||"jp122"))||TRAINER_ROSTER.find(t=>t.id===TRAINER_DEFAULT_ID)||TRAINER_ROSTER[0]; }
function applyTrainer(){ const d=trainerData(); TRAINER.name=d.name; TRAINER.policy=d.policy; TRAINER.desc=d.desc; TRAINER.ranks=Object.assign({},d.ranks); TRAINER.dist=Object.assign({},d.dist); TRAINER.traits=d.traits.slice(); }
function trainerUpkeep(){ return trainerCost(trainerData()).upkeep; }
function hireTrainer(id){
  const d=TRAINER_ROSTER.find(t=>t.id===id); if(!d||d.id===trainerData().id) return;
  const cost=trainerCost(d);
  if(S.funds<cost.hire){ toast("資金が足りません"); return; }
  S.funds-=cost.hire; ledOut("trainer",cost.hire); S.trainerId=d.id; applyTrainer();
  log(`🤝 調教師に ${d.name} を迎えた（雇用費 ${fmt(cost.hire)}万円／維持費 ${fmt(cost.upkeep)}万円・週）`);
  saveAuto(true); $("#overlay").style.display="none"; renderAll();
  toast(`${d.name} を調教師に迎えました`);
}

    <span class="small">能力：${rankRow(d.ranks,[["train","調教"],["eye","相馬眼"],["idea","閃き"],["cond","体調"],["weight","体重"]])}／距離：${rankRow(d.dist,[["sprint","短"],["mile","マ"],["middle","中"],["long","長"]])}${d.ageApt?`／年代：2歳${d.ageApt[0]}・3歳${d.ageApt[1]}・古馬${d.ageApt[2]}・牝馬${d.ageApt[3]}`:""}</span><br>
    <span class="small">特性：${d.traits.length? d.traits.map(t=>`<span class="trait plus">${esc(t)}</span>`).join(" ") : "なし"}／雇用費 ${fmt(cost.hire)}万円・維持費 ${fmt(cost.upkeep)}万円/週</span>
    ${!isCur?`<div class="small">雇用後の資金見通し：12週 約${fmt((S.funds-cost.hire)-(fundsForecast(12).perWeek+cost.upkeep-trainerUpkeep())*12)}万円／1年 約${fmt((S.funds-cost.hire)-(fundsForecast(48).perWeek+cost.upkeep-trainerUpkeep())*48)}万円（収入なし試算）</div>`:""}
    <div class="mt">${isCur?`<button class="btn sm" disabled>雇用中</button>`:`<button class="btn gold sm" data-hire="${d.id}" ${dis?"disabled":""}>この調教師を雇う（${fmt(cost.hire)}万円）</button>${locked?` <span class="small">海外牧場が必要</span>`:(S.funds<cost.hire?` <span class="small">資金不足</span>`:"")}`}</div></div>`; }).join("")}
  <div class="small mt">全${list.length}名を表示しています</div>
  </div></div><div class="ov-foot"><button class="btn gold" onclick="document.getElementById('overlay').style.display='none'">閉じる</button></div>`);

  document.querySelectorAll("[data-trpage]").forEach(b=>b.addEventListener("click",()=>{ TRUI.page+=+b.dataset.trpage; showTrainers(); }));
}
function omakaseSmart(){ return (rankVal(TRAINER.ranks.train)+rankVal(TRAINER.ranks.idea))/2; }
function omakaseReview(){
  if(!S.weekReport) S.weekReport=[];
  const smart=omakaseSmart();
  const cap= smart>=4.5? Infinity : smart>=3.5? 8 : smart>=2.5? 5 : smart>=1.5? 3 : 2; // 能力が低い調教師は見る頭数に限りがある
  let seen=0;
  S.horses.forEach(h=>{
    if(h.retired||h.planFixed||seen>=cap) return; // プレイヤーが固定した指示はおまかせで絶対に上書きしない
    seen++;
    let prop=null; try{ prop=trainerPlanProposal(h); }catch(e){}
    if(prop){ h.plan=JSON.parse(JSON.stringify(prop.plan)); S.weekReport.push(`🤝 おまかせ：${h.name} の指示を変更 ― ${planText(h.plan)}`); return; }
    if(h.injured>0) return;
    if(smart>=2.5){ /* 繰り返し調教そのものも状態に合わせて組み替える */
      const p=h.plan||defaultPlan();
      if(!p.goalTrait&&!p.weakFocus&&h.fat<=(p.fatTh||60)){
        let rec=null; try{ rec=trainerSuggest(h)[0]; }catch(e){}
        if(rec&&rec.tid&&rec.tid!=="bokujou"&&rec.tid!=="rest"&&p.repeat!==rec.tid){
          h.plan=Object.assign({},p,{repeat:rec.tid});
          S.weekReport.push(`🤝 おまかせ：${h.name} の繰り返しを「${(TRAINS.find(x=>x.id===rec.tid)||{}).n||rec.tid}」に変更`);
          return;
        }
      }
    }
    if(smart>=4){ /* 一流は特性の習得ゴールまで設定する */
      const p=h.plan||defaultPlan();
      if(!p.goalTrait&&(h.learned||[]).length<LEARN_CAP){
        const cand=LEARN_TRACKS.map(lt=>({lt, prog:(h.learnProg&&h.learnProg[lt.trait])||0})).filter(x=>x.prog>0&&!traitOf(h,x.lt.trait)).sort((a,b)=>(b.prog/b.lt.need)-(a.prog/a.lt.need))[0];
        if(cand&&cand.prog/cand.lt.need>=0.5){ h.plan=Object.assign({},p,{goalTrait:cand.lt.trait, weakFocus:false}); S.weekReport.push(`🤝 おまかせ：${h.name} は特性「${traitName(cand.lt.trait)}」の習得を目標に設定`); }
      }
    }
  });
  /* 繁殖シーズンは配合も調教師の提案どおりに登録する（提案の質は相馬眼で変わる） */
  if(month()===5||month()===6){
    let bprops=[]; try{ bprops=trainerBreedProposals(); }catch(e){}
    for(const p of bprops){
      const r=tryBreed(p.sire,p.mare);
      if(!r.err) S.weekReport.push(`🤝 おまかせ：配合 ${p.mare.name} × ${p.sire.name} で種付けを登録（評価${r.ev.rank} ${r.ev.total}・爆発力${r.ev.explosion}）`);
      else if(r.err==="funds") S.weekReport.push(`🤝 おまかせ：${p.mare.name} の種付けは資金不足のため見送りました`);
    }
  }
}
function toggleOmakase(){
  S.omakase=!S.omakase;
  if(S.omakase){ log(`🤝 調教師におまかせを開始（${TRAINER.name}）`); omakaseReview(); toast(`おまかせ開始：${TRAINER.name} が指示と週次の手当てを代行します`); }
  else { log("🤝 調教師におまかせを終了"); toast("おまかせを終了しました"); }
  saveAuto(true); renderAll();
}

/* ============ 画面切替 ============ */
function switchView(v){
  if(raceState.phase==="done"&&v!=="race"){ renderAll(); return; } // レース終了画面からは「帰る」ボタンでのみ離れられる
  const SB={stable:["厩舎","牧場の朝 ― 馬たちと過ごす日々"],train:["調教","坂路とトラック ― 仕上げの時間"],race:["レース","競馬場 ― スタンドの歓声"],bet:["馬券","予想と勝負の記録"],breed:["生産","血統を紡ぐ ― 次の世代へ"],jockey:["騎手","鞍上のパートナーたち"],farm:["牧場","緑の丘と施設のある風景"],rank:["名馬","歴史に名を刻んだ馬たち"]};
  const sb=$("#sb-title"), ss=$("#sb-sub"); if(sb&&SB[v]){ sb.textContent=SB[v][0]; if(ss)ss.textContent=SB[v][1]; }
  const sbi=$("#sb-img"); if(sbi) sbi.src=(v==="race"||v==="bet"||v==="jockey"||v==="rank")?"assets/scene-racecourse.webp":"assets/scene-farm.webp";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $("#main").scrollTop=0;
  try{ window.scrollTo(0,0); }catch(e){} /* 通常フロー化に伴い、画面切替時はページ先頭へ戻す（失敗しても画面切替自体は止めない） */
  if(v!=="race"&&raceState.phase!=="run"){ raceState.phase = raceState.phase==="done"?"done":"idle"; if(v!=="race"){raceState.phase="idle";} }
  if(v!=="race"&&raceState.phase!=="run"&&typeof AU!=="undefined"&&AU.ctx&&(AU.mode==="race"||AU.crowdLvl>0)){ auStopCrowd(); auSetMode("home"); } /* 安全網：歓声・レースBGMの止め忘れを画面切替で必ず止める */
  renderAll();
  applyPendingAnchor(v);
}
function renderAll(){
  hud();
  renderChrome();
  const cur=document.querySelector("#tabs button.on").dataset.v;
  /* セール／市場の一覧を開いている間は情景バンドと秘書パネルを畳み、一覧の表示領域を最大化する（第21次） */
  const appEl=$("#app"); if(appEl) appEl.classList.toggle("list-focus", (cur==="farm"&&UI.farm==="sale")||(cur==="stable"&&UI.stable==="market"));
  if(cur==="stable")renderStable();
  if(cur==="train")renderTrain();
  if(cur==="race")renderRace();
  if(cur==="bet")renderBet();
  if(cur==="breed")renderBreed();
  if(cur==="jockey")renderJockey();
  if(cur==="farm")renderFarm();
  if(cur==="rank")renderRank();
  wirePanels(document.getElementById("v-"+cur));
  saveAuto();
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ cardFocus=false; pendingTrain=null; pendingAnchor=null; switchView(b.dataset.v); }));
$("#btn-nextweek").addEventListener("click",()=>{ if(raceState.phase==="run"||raceState.phase==="done")return; pendingTrain=null; nextWeek(); });
$("#btn-save").addEventListener("click",()=>showSavePanel());
const setBtn=$("#btn-settings"); if(setBtn)setBtn.addEventListener("click",()=>showSettings());
/* サウンド開始はユーザーの操作以降（自動再生制限・iOS Safari対応）：
   pointerdown／touchend／click のいずれでも、操作の同期処理の中で
   AudioContextを生成・resumeする。画面復帰時も resume を試みる */
["pointerdown","touchend","click"].forEach(ev=>document.addEventListener(ev,auUnlock,{passive:true}));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) auUnlock(); });
document.addEventListener("click",e=>{ if(e.target.closest("button")) auClick(); });
window.addEventListener("resize",()=>{ if(raceState.phase==="run"&&raceState.simT!==undefined) drawRace(raceState.simT); });
log("厩舎を開業。新馬アオイソラ1頭でスタート。2歳戦は6月開始なので、デビューは6月の新馬戦から。それまでは調教で仕上げよう");
/* 起動：セーブがあれば「つづきから／はじめから」を選ぶ */
(function boot(){
  let has=null, bak=null; try{ has=localStorage.getItem(SAVE_KEY+"auto"); bak=localStorage.getItem(SAVE_KEY+"auto_bak"); }catch(e){}
  const dMain=parseSaveChecked(has), dBak=parseSaveChecked(bak);
  if(dMain||dBak){
    const useBak=!dMain, src=useBak?dBak:dMain;
    const info=saveInfo(useBak?"auto_bak":"auto");
    showOverlay(`<h2>競馬ゲーム</h2><p>${useBak?"セーブデータ本体が壊れていたため、少し前のバックアップから復旧します。":"セーブデータがあります。"}<br><span class="small">${info?info.date+"／"+info.label:""}</span></p>
    <div class="flex" style="justify-content:center"><button class="btn gold" id="boot-cont">▶ つづきから</button><button class="btn ghost" id="boot-new">はじめから</button></div>`);
    $("#boot-cont").addEventListener("click",()=>{ let ok=false; try{ applySave(src); ok=true; }catch(e){ if(!useBak&&dBak){ try{ applySave(dBak); ok=true; }catch(e2){} } } booted=true; $("#overlay").style.display="none"; renderAll(); if(useBak&&ok) toast("バックアップからセーブを復旧しました"); });
    $("#boot-new").addEventListener("click",()=>{ booted=true; $("#overlay").style.display="none"; renderAll(); });
    renderAll();
  } else if(has){
    showOverlay(`<h2>競馬ゲーム</h2><p>セーブデータが読み込めませんでした（データが壊れている可能性があります）。<br><span class="small">バックアップからも復旧できませんでした。はじめから始めるか、設定画面の引き継ぎコード／クラウド保存があれば読み込めます。</span></p>
    <div class="flex" style="justify-content:center"><button class="btn ghost" id="boot-new">はじめから</button></div>`);
    $("#boot-new").addEventListener("click",()=>{ booted=true; $("#overlay").style.display="none"; renderAll(); });
    renderAll();
  } else { booted=true; renderAll(); }
})();
</script>
