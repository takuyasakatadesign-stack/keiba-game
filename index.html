const FAC_CATS=["身体","精神","成長","疲労回復","調教","観光","名声"];
function facLv(id){ return S&&S.facilities? (S.facilities[id]||0):0; }
function facBuilding(id){ return S&&S.building? (S.building[id]||0):0; }
function facEffect(id){ const lv=facLv(id); if(lv<=0||facBuilding(id)>0) return 0; let m=1; if(S&&S.mgrPost===id) m=1.5; return lv*m; }
function farmSpaces(){ const fame=(S&&S.fame||0); const fameBonus=Math.floor(fame/5); const base=6+facLv("base")*4+fameBonus; let used=0; Object.keys(S?S.facilities||{}:{}).forEach(k=>{ if(k!=="base"&&facLv(k)>0) used++; }); return {base, used, free:base-used, fameBonus, nextFame:(Math.floor(fame/5)+1)*5}; }
function facCatTotals(){ const t={}; FAC_CATS.forEach(c=>t[c]=0); FACILITIES.forEach(f=>{ const e=facEffect(f.id); if(e>0) t[f.cat]=(t[f.cat]||0)+e; }); t["名声"]=facEffect("merit")*0.6+facEffect("tourism")*0.3; return t; }
/* ============ 施設のおすすめ判定 ============
   「どれを建てるべきか」を、今の牧場の状態から理由つきで返す。
   評価軸：①効果カテゴリの弱点（facCatTotals が一番低い分野を底上げ）
          ②費用対効果（建築費に対して効果が割安か／維持費の軽さ）
          ③牧場長の得意施設（坂路＝配置で効果1.5倍）
          ④スペース（満杯なら基本施設（面積）が最優先）
   建設提案カード・オート停止時の案内・施設アコーディオンのおすすめ表示で共用する */
function facRecommend(){
  if(typeof S==="undefined"||!S) return [];
  const sp=farmSpaces(), cats=facCatTotals();
  const catMin=Math.min.apply(null,FAC_CATS.map(c=>cats[c]||0));
  const out=[];
  FACILITIES.forEach(f=>{
    if(facLv(f.id)>0||facBuilding(f.id)>0) return;      /* 建設済み・工事中は候補外 */
    if(S.funds<f.cost) return;                            /* 今の資金で建てられるものだけ */
    if(f.id!=="base"&&sp.free<1) return;                  /* スペースが無いものは建てられない */
    let sc=0; const rs=[];
    const catNow=cats[f.cat]||0;
    if(f.id==="base"){
      if(sp.free<1){ sc+=60; rs.push("スペースが満杯で他の施設が建てられません。まず面積を広げるのが先決です（スペース+4）"); }
      else { sc+=8; rs.push(`スペースに余裕が生まれます（現在 空き${sp.free}）`); }
    } else if(catNow<=catMin+0.01){
      sc+=34;
      rs.push(catNow===0? `${f.cat}はまだ効果0の分野です。この施設で最初の底上げができます` : `${f.cat}は今の牧場で一番弱い分野（現在 ${catNow.toFixed(1)}）で、底上げの効果が大きいです`);
    } else if(catNow<2){
      sc+=15; rs.push(`${f.cat}の効果はまだ ${catNow.toFixed(1)} と低めで、伸ばす余地が大きいです`);
    }
    if(FARM_MANAGER.facility&&f.n.indexOf(FARM_MANAGER.facility)>=0){ sc+=16; rs.push(`牧場長（${FARM_MANAGER.name}）の得意施設です。配置すると効果が1.5倍になります`); }
    if(f.cost<=2000) sc+=Math.max(0,20-f.cost/130);
    if(f.cost<=600) rs.push(`建築費 ${fmt(f.cost)}万円と手頃で、資金（${fmt(S.funds)}万円）に無理がありません`);
    if(f.maint<=10) rs.push(`月維持費が ${f.maint}万円と軽く、建てた後の負担が小さいです`);
    if(f.weeks<=2) sc+=3;
    if(!rs.length) rs.push(`${f.cat}効果が +1 になります（建築費 ${fmt(f.cost)}万円／月維持費 ${f.maint}万円／${f.weeks}週）`);
    out.push({f, score:Math.round(sc*10)/10, reasons:rs.slice(0,3)});
  });
  return out.sort((a,b)=>b.score-a.score||a.f.cost-b.f.cost);
}

  return {perWeek, funds, weeksToShort};
}

/* ===== 固有名ジェネレータ（第19次） =====
   市場・セール・相手馬・幼駒など自動生成される馬の名前は、その馬だけの
   固有名にする。語彙プールを広げ、複合パターン（前+後／前+ノ+後／
   前+前+後／後+前）で組み合わせを大きく確保したうえで、同一セーブ内の
   既存名（所有馬・幼駒・繁殖馬・市場・セール・種牡馬・名馬・出馬表）と
   照合し、重複しない名前だけを採用する。どうしても埋まった場合は
   「・2」「・3」…の枝番で一意性を保証する（定型の連番名は付けない）。 */
const HORSE_NAMES_B=["アルカディア","ベルベット","グラン","プレミアム","ロワール","ミストラル","アリア","ノーブル","ヴァルキリー","オーロラ","セレナーデ","フィオーレ","ルーチェ","ヴェント","エテルノ","カプリチオ","ラルゴ","アマービレ","ソプラノ","バレッタ","ミラージュ","アンセム","カノン","フィナーレ"];
const HORSE_NAMES2_B=["ダンサー","ランナー","ソング","メモリー","キセキ","ユメ","ヒカリ","カガヤキ","ブリーズ","グローリー","レガシー","エコー","ハーモニー","リズム","スピリット","トラベラー","ワルツ","メロディ","アルペジオ","セレナーデ","ファンファーレ","コンチェルト"];
function composeHorseName(){
  const A=HORSE_NAMES.concat(HORSE_NAMES_B), B=HORSE_NAMES2.concat(HORSE_NAMES2_B);
  const As=A.filter(x=>x.length<=4);
  const r=Math.random();
  if(r<0.46) return pick(A)+pick(B);
  if(r<0.72) return pick(A)+"ノ"+pick(B);
  if(r<0.88) return pick(As)+pick(As)+pick(B);
  return pick(B)+pick(A);
}

function collectUsedNames(extra){
  const set=new Set(NAME_TAKEN);
  const add=o=>{ if(o&&typeof o.name==="string"&&o.name) set.add(o.name); };

    if(typeof S!=="undefined"&&S){
      (S.horses||[]).forEach(add); (S.youngStock||[]).forEach(add); (S.mares||[]).forEach(add);
      (S.market||[]).forEach(add); if(S.sale&&S.sale.list)S.sale.list.forEach(add);
      (S.stallions||[]).forEach(add); (S.worldHorses||[]).forEach(add);
      if(S.club&&S.club.offers)S.club.offers.forEach(add);
    }
  }catch(e){}

    if(typeof raceState!=="undefined"&&raceState){ (raceState.card||[]).forEach(add); (raceState.rivals||[]).forEach(add); }
  }catch(e){}
  if(extra) (Array.isArray(extra)?extra:[extra]).forEach(x=>{ if(!x)return; const n=typeof x==="string"?x:x.name; if(n)set.add(n); });
  return set;
}
function genUniqueName(extra){
  const used=collectUsedNames(extra);
  for(let i=0;i<300;i++){ const n=composeHorseName(); if(n&&!used.has(n)){ NAME_TAKEN.add(n); return n; } }
  let base=composeHorseName(), n=base, k=2;
  while(used.has(n)||NAME_TAKEN.has(n)){ n=base+"・"+k; k++; }
  NAME_TAKEN.add(n); return n;
}

  if(h.bst>=72)base.kire+=18; if(h.sta>=72)base.jizoku+=18; if(h.pow>=72||h.gut>=72)base.shoumo+=16;
  if(h.style==="追い込み"||h.style==="差し")base.kire+=10;
  if(h.style==="逃げ")base.shoumo+=10;
  Object.keys(base).forEach(k=>base[k]=clamp(base[k],20,96));

function determineTrend(race,field){

  const styles=field?field.map(h=>h.style):[];

  let jizoku= (race.dist>=2200?26:race.dist>=2000?14:0) + (front/tot)*10 + straight*0.012;
  let shoumo= (front/tot)*30 + (race.surf==="ダート"?16:0) + (GROUNDS.indexOf(race.ground)>=2?14:0) + (race.dist<=1400?10:0);
  const scores={kire,jizoku,shoumo};
  const key=Object.keys(scores).reduce((b,k)=>scores[k]>scores[b]?k:b,"kire");

/* ============ レーティング（見直し後の基準） ============
   出走数・勝利数の多さだけでは上がらない。能力素地は控えめにし、
   通算勝率、G1勝利、重賞勝利、G1での好走（複勝率）を中心に評価する。
   下級条件を勝ちまくる馬より、勝率は低くてもG1・重賞で戦う馬が高くなる。
   満点は概ね110前後（7能力の平均を70→素地59に、勝率22・G1勝17・重賞10・
   G1複勝6・賞金7を積み上げる）。算出式はランキング画面にも明示する */
function g1WinEst(h){ /* 旧セーブ（G1勝ち数が未記録の馬）は重賞実績と賞金から補う */
  if(h.g1w!=null) return h.g1w;
  return ((h.gWins||0)>=2 && (h.earnings||0)>=25000)? 1 : 0;
}
function ratingOf(h){
  ensureFullHorse(h);
  const ab=((h.spd||0)+(h.sta||0)+(h.pow||0)+(h.bst||0)+(h.gut||0)+(h.flx||0)+(h.smt||0))*0.085;
  const races=h.races||0, wins=h.wins||0;
  const wrPts= races>0? (wins/races)*22*Math.min(1,races/4) : 0; // 通算勝率（出走4未満は割引）
  const g1w=g1WinEst(h);
  const g1Pts=Math.min(17, g1w*5.5);                             // G1勝利
  const gPts=Math.min(10, Math.max(0,(h.gWins||0)-g1w)*2.2);     // G1以外の重賞勝利
  const g1r=h.g1r||0;
  const g1FormPts= g1r>=2? Math.min(6, ((h.g1t||0)/g1r)*6) : 0;  // G1での複勝率
  const earnPts=Math.min(7, (h.earnings||0)/6000);               // 賞金は補助（すぐ頭打ち）
  return Math.round(ab+wrPts+g1Pts+gPts+g1FormPts+earnPts);
}
function growthFactor(age,gt){
  /* 早熟=2歳後半〜3歳前半／早め=3歳後半〜4歳前半／遅め=4歳前半〜4歳後半／晩成=4歳後半以降／覚醒=4歳前半からピーク持続 */
  const T={
   "早熟":{2:0.90,3:1.0,4:0.96,5:0.90,6:0.84,7:0.78,8:0.72},
   "早め":{2:0.84,3:0.94,4:1.0,5:0.96,6:0.91,7:0.85,8:0.79},
   "遅め":{2:0.80,3:0.88,4:0.96,5:1.0,6:0.96,7:0.90,8:0.84},
   "晩成":{2:0.74,3:0.82,4:0.90,5:1.0,6:0.99,7:0.94,8:0.88},
   "覚醒":{2:0.82,3:0.90,4:1.0,5:1.0,6:1.0,7:0.97,8:0.94},
  };
  const t=T[gt]||T["早め"];
  return t[age]!==undefined?t[age]:(age<2?0.7:0.8);
}
function radarSVG(h){
  ensureFullHorse(h);
  const axes=[["スピード",h.spd],["スタミナ",h.sta],["パワー",h.pow],["瞬発力",h.bst],["根性",h.gut],["柔軟性",h.flx],["精神力",h.men],["賢さ",h.smt],["健康",h.hlt]];
  const cx=110,cy=100,R=72; const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/9; return [cx+Math.cos(a)*R*v/100, cy+Math.sin(a)*R*v/100];};
  const grid=[100,66,33].map(g=>`<polygon points="${axes.map((_,i)=>pt(i,g).join(",")).join(" ")}" fill="none" stroke="#c8d2c4" stroke-width="1"/>`).join("");
  const poly=axes.map((a,i)=>pt(i,a[1]).join(",")).join(" ");
  const labels=axes.map((a,i)=>{const [x,y]=pt(i,122); return `<text x="${x}" y="${y+3}" font-size="9" font-weight="700" text-anchor="middle" fill="var(--ink2)">${a[0]} ${a[1]}</text>`;}).join("");
  return `<svg viewBox="0 0 220 200" style="width:100%;max-width:280px;display:block;margin:0 auto" role="img" aria-label="${esc(h.name)}の能力レーダーチャート">${grid}<polygon points="${poly}" fill="rgba(44,138,79,.28)" stroke="#1d6b3c" stroke-width="2"/>${axes.map((a,i)=>{const [x,y]=pt(i,a[1]);return `<circle cx="${x}" cy="${y}" r="2.6" fill="#c9a227"/>`;}).join("")}${labels}</svg>`;
}
function growthSVG(h){
  const ages=[2,3,4,5,6,7,8];
  const pts=ages.map(a=>[18+(a-2)*30, 62-growthFactor(a,h.growth)*52]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1].toFixed(1)).join(" ");
  const cur=pts[clamp(h.age,2,8)-2];
  return `<svg viewBox="0 0 210 74" style="width:100%;max-width:300px;display:block" role="img" aria-label="成長曲線 ${h.growth} 現在${h.age}歳"><line x1="18" y1="62" x2="198" y2="62" stroke="#c8d2c4"/><path d="${path}" fill="none" stroke="#1d6b3c" stroke-width="2.4"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#fff" stroke="#1d6b3c"/>`).join("")}<circle cx="${cur[0]}" cy="${cur[1]}" r="5" fill="#c9a227" stroke="#fff" stroke-width="1.6"/><text x="${cur[0]}" y="${Math.max(10,cur[1]-9)}" font-size="9" font-weight="800" text-anchor="middle">現在 ${h.age}歳</text>${ages.map((a,i)=>`<text x="${pts[i][0]}" y="72" font-size="8" text-anchor="middle" fill="#888">${a}歳</text>`).join("")}</svg><div class="small">成長型：<b>${h.growth}</b>／ピーク目安 ${h.growth==="早熟"?"3歳":h.growth==="晩成"?"5歳":"4〜5歳"}・現在の発揮率 約${Math.round(growthFactor(clamp(h.age,2,8),h.growth)*100)}%</div>`;
}
function distBarHTML(h){
  const lo=1000,hi=3400, x1=(h.dmin-lo)/(hi-lo)*100, x2=(h.dmax-lo)/(hi-lo)*100, bx=((h.bestDist||1800)-lo)/(hi-lo)*100;
  return `<div class="small">適性距離 <b>${h.dmin}〜${h.dmax}m</b>（中心 ${h.bestDist}m）</div><div class="distbar"><i style="left:${x1}%;width:${Math.max(4,x2-x1)}%"></i><b style="left:${bx}%"></b></div><div class="small" style="display:flex;justify-content:space-between"><span>1000m</span><span>2000m</span><span>3400m</span></div>`;
}
function traitsHTML(h){ ensureFullHorse(h); return h.traits.map(id=>{const t=TRAITS.find(x=>x.id===id); return `<span class="trait ${t?t.kind:""}" title="${t?t.d:""}">${t?t.n:id}</span>`;}).join(""); }
function trendAptHTML(h){ const a=ensureTrendApt(h); return `<div class="stats">${statBar("切れ味適応",a.kire)}${statBar("持続力適応",a.jizoku)}${statBar("消耗戦適応",a.shoumo)}<div class="stat"><span class="lb">重馬場</span><span style="font-weight:900;font-size:14px">${h.heavy||"B"}</span></div></div>`; }
function classOf(h){
  if(h.races===0) return 0;
  if(h.wins===0) return 1;
  return clamp(1+h.wins,2,5); // 1勝->2... 表示用内部
}
function classLabel(h){
  if(h.races===0) return "新馬";
  if(h.wins===0) return "未勝利";
  if(h.wins>=5) return "オープン";
  return h.wins+"勝クラス";
}
function aptMul(g){return {S:1.07,A:1.03,B:0.98,C:0.92}[g]||1;}
function ability(h,race,jock){
  const distW = race.dist>=2600?{spd:.20,sta:.34,pow:.16,bst:.16,gut:.14}
    : race.dist>=2000?{spd:.26,sta:.28,pow:.15,bst:.18,gut:.13}
    : race.dist>=1500?{spd:.32,sta:.20,pow:.14,bst:.22,gut:.12}
    : {spd:.40,sta:.10,pow:.15,bst:.24,gut:.11};
  ensureFullHorse(h);
  let core=h.spd*distW.spd+h.sta*distW.sta+h.pow*distW.pow+h.bst*distW.bst+h.gut*distW.gut;
  core+= (h.flx-60)*0.045 + (h.men-60)*0.03 + (h.smt-60)*0.035; // 柔軟性・精神力・賢さが小さく効く
  core*=aptMul(race.surf==="芝"?h.turf:h.dirt);
  const er=effRange(h); // 柔軟性で距離適性の幅が変わる
  if(race.dist<er.lo) core*=1-Math.min(.18,(er.lo-race.dist)/100*.02)*(traitOf(h,"shortdash")?0.4:1);
  if(race.dist>er.hi) core*=1-Math.min(.22,(race.dist-er.hi)/100*.022)*(traitOf(h,"bigheart")?0.45:1);
  const gi=GROUNDS.indexOf(race.ground);
  core*= 1 - gi*(0.022 - h.pow/100*0.014); // 重馬場はパワーで軽減
  if(gi>=2) core*= aptMul(h.heavy||"B"); else if(gi===1) core*= 1+(aptMul(h.heavy||"B")-1)*0.5; // 重馬場適性
  if(STEEP_COURSES.includes(race.course)) core+=(h.pow-60)*0.018; // 急坂コースではパワーが効く（中山・阪神・中京）
  if(STEEP_COURSES.includes(race.course)&&traitOf(h,"slope")) core+=1.2; // 習得特性「坂巧者」
  const stLen=race.straight||COURSE_STRAIGHT[race.course]||350;
  if(stLen>=470) core+=(h.bst-60)*0.012; // 長い直線（東京・新潟・阪神外）では瞬発力が効く
  if(traitOf(h,"rain")&&gi>=2)core*=1.025;
  core*= 1 + (h.cond-65)/100*(traitOf(h,"stablemind")?0.16:0.35); // 調子（習得特性「精神安定」はブレを小さくする）
  const fatPen= traitOf(h,"sequential")?0.32:0.55;
  core*= 1 - Math.max(0,h.fat-45)/100*fatPen; // 疲労（連戦巧者は軽減）
  core*= 1 + ((jock?jock.skill:80)-82)/100*0.30; // 騎手
  core*= 1 - Math.max(0,(race.weight||55)-55)*0.004;
  return core;
}

function legendAboveBelow(earn){
  const sorted=[...LEGENDS].sort((a,b)=>b.earn-a.earn);
  const below=sorted.find(L=>L.earn<earn)||null;
  const above=[...sorted].reverse().find(L=>L.earn>earn)||null;
  return {below, above, isTop: earn>(sorted[0]?sorted[0].earn:0)};
}

/* ============ 自厩舎の殿堂入り（歴代名馬ランキングに自厩舎馬も並べる） ============
   基準は歴代名馬の最低ラインに合わせる（賞金閾値＝歴代名馬の最低獲得賞金
   ＝ミスターシービーの40,959万円、レーティング閾値＝歴代名馬の最低値。
   「実在の殿堂馬の最下位と同等以上」という設計意図で、固定値ではない）：獲得賞金が殿堂の最下位以上／
   レーティングが殿堂の最低値以上／G1を2勝以上、のいずれかに達した
   自厩舎馬は「殿堂入り」として、歴代名馬タブや牧場の殿堂でも
   実在の歴代名馬と並んで表示される。引退して繁殖入りした馬
   （繁殖牝馬・種牡馬）も対象に含め、売却などで手元を離れた後も
   残るよう、達した時点の記録を S.hallOfFame に写して残す */
function hallThresholds(){
  return { earn:Math.min(...LEGENDS.map(L=>L.earn)), rating:Math.min(...LEGENDS.map(L=>L.rating)) };
}
function hallQualifies(h){
  if(!h||!(h.races>0)) return false;
  const th=hallThresholds();
  return (h.earnings||0)>=th.earn || ratingOf(h)>=th.rating || g1WinEst(h)>=2;
}
function ownHorsePool(){
  /* 現役（S.horses）＋繁殖牝馬（現役時の記録のまま）＋種牡馬（own に現役時の記録） */
  const out=[];
  (S.horses||[]).forEach(h=>out.push(h));
  (S.mares||[]).forEach(h=>{ if(h&&h.races!=null) out.push(h); });
  (S.stallions||[]).forEach(s=>{ if(s&&s.own) out.push(s.own); });
  return out;
}
function refreshHallOfFame(){
  if(!Array.isArray(S.hallOfFame)) S.hallOfFame=[];
  ownHorsePool().forEach(h=>{
    if(h.id==null||!hallQualifies(h)) return;
    const rec={id:h.id, name:h.name, sex:h.sex, age:h.age, races:h.races||0, wins:h.wins||0,
      earnings:h.earnings||0, rating:ratingOf(h), gWins:h.gWins||0, g1w:g1WinEst(h)};
    const ix=S.hallOfFame.findIndex(x=>x.id===h.id);
    if(ix>=0) S.hallOfFame[ix]=rec; else S.hallOfFame.push(rec);
  });
  return S.hallOfFame;
}

/* ============ 維持費（頭数連動・項目別） ============
   競走馬は1頭あたり週18万円＝エサ代8＋厩舎管理6＋装蹄・獣医4（従来の総額は不変）。
   それ以外にも、繁殖牝馬・所有種牡馬・幼駒には飼養費が頭数ぶんかかる */
function upkeepItems(){
  const n=S.horses.length;
  const mares=(S.mares||[]).length;
  const sires=(S.stallions||[]).filter(s=>s.own).length;
  const young=(S.youngStock||[]).length;
  return [
    {cat:"feed", n:`エサ代（競走馬 ${n}頭 × 8万円）`, v:n*8},
    {cat:"labor", n:`厩舎管理費（競走馬 ${n}頭 × 6万円）`, v:n*6},
    {cat:"vet", n:`装蹄・獣医費（競走馬 ${n}頭 × 4万円）`, v:n*4},
    {cat:"feed", n:`飼養費（繁殖牝馬 ${mares}頭 × 5万円）`, v:mares*5},
    {cat:"feed", n:`飼養費（種牡馬 ${sires}頭 × 8万円）`, v:sires*8},
    {cat:"feed", n:`飼養費（幼駒 ${young}頭 × 3万円）`, v:young*3},
    {cat:"trainer", n:"調教師維持費", v:trainerUpkeep()},
  ].filter(x=>x.v>0);
}
function upkeep(){ return upkeepItems().reduce((a,x)=>a+x.v,0); }
/* ============ 月次明細（収支台帳） ============
   主な取引を項目別に月単位で記録し、設定画面から明細として見られるようにする。
   月が替わると前月分は履歴（最大12か月）へ移る */
const LED_CATS={feed:"飼料・飼養費",labor:"厩舎管理費",vet:"装蹄・獣医費",trainer:"調教師関係",facility:"施設維持費",jockey:"騎乗料・遠征費",breed:"種付料",buy:"馬の購入費",build:"施設建設費",betbuy:"馬券購入",loan:"融資返済",other:"その他支出"};
const LED_IN={prize:"レース賞金",bet:"馬券払戻",sell:"売却・クラブ収入",finance:"融資・スポンサー",otherIn:"その他収入"};
function ledKey(){ return year()+"-"+month(); }
function ledLabel(k){ const p=String(k||"").split("-"); return (p[0]||"?")+"年目 "+(p[1]||"?")+"月"; }
function ledger(){
  const k=ledKey();
  if(!S.ledger||S.ledger.key!==k){
    if(S.ledger&&S.ledger.key){ if(!S.ledgerHist)S.ledgerHist=[]; S.ledgerHist.unshift(S.ledger); if(S.ledgerHist.length>12)S.ledgerHist.length=12; }
    S.ledger={key:k, out:{}, inn:{}};
  }
  if(!S.ledger.out)S.ledger.out={}; if(!S.ledger.inn)S.ledger.inn={};
  return S.ledger;
}
function ledOut(cat,amt){ if(!(amt>0))return; try{ const L=ledger(); L.out[cat]=(L.out[cat]||0)+Math.round(amt); }catch(e){} }
function ledIn(cat,amt){ if(!(amt>0))return; try{ const L=ledger(); L.inn[cat]=(L.inn[cat]||0)+Math.round(amt); }catch(e){} }
function showLedger(){
  const L=ledger();
  const rows=(obj,cats)=>Object.keys(cats).filter(k=>(obj[k]||0)>0).map(k=>`<div class="ye-lrow"><span>${cats[k]}</span><b>${fmt(obj[k])}万円</b></div>`).join("")||`<div class="small">今月はまだ記録がありません</div>`;
  const totO=Object.values(L.out).reduce((a,b)=>a+b,0), totI=Object.values(L.inn).reduce((a,b)=>a+b,0);
  const hist=(S.ledgerHist||[]).map(hx=>{ const o=Object.values(hx.out||{}).reduce((a,b)=>a+b,0), ii=Object.values(hx.inn||{}).reduce((a,b)=>a+b,0);
    return `<div class="ye-lrow"><span>${ledLabel(hx.key)}</span><span>収入 ${fmt(ii)}／支出 ${fmt(o)}／差引 ${fmt(ii-o)}万円</span></div>`; }).join("");
  const items=upkeepItems().map(x=>`<div class="ye-lrow"><span>${x.n}</span><b>${fmt(x.v)}万円</b></div>`).join("");
  showOverlay(`<h2>📒 月次明細（${ledLabel(L.key)}）</h2><div class="ov-body"><div style="text-align:left">
  <div class="ye-sec" style="margin-top:2px">収入</div>${rows(L.inn,LED_IN)}
  <div class="ye-sec">支出</div>${rows(L.out,LED_CATS)}
  <div class="ye-lrow" style="border-top:2px solid var(--line);margin-top:6px;padding-top:6px"><span><b>今月の差引</b></span><b>${fmt(totI-totO)}万円</b></div>
  <div class="ye-sec">毎週の維持費（現在の頭数）</div>${items}
  <div class="ye-lrow"><span><b>維持費 合計</b></span><b>${fmt(upkeep())}万円／週</b></div>
  ${hist?`<div class="ye-sec">過去の月</div>${hist}`:""}
  </div></div><div class="ov-foot"><button class="btn gold" onclick="document.getElementById('overlay').style.display='none'">閉じる</button></div>`);
}

function triBase(lo,hi){ return Math.round(lo+(rnd(0,1)+rnd(0,1))/2*(hi-lo)); }

/* 開催競馬場は実際のJRA開催サイクルに合わせる（1月は中山・京都・小倉・中京、夏は函館・札幌・新潟・小倉 等。
   その月に開催のない競馬場＝東京の冬開催のような組み合わせは出さない） */
function seasonCourses(m){
  return {1:["中山","京都","小倉","中京"],2:["東京","京都","小倉","阪神"],3:["中山","阪神","中京"],4:["中山","阪神","福島","京都"],5:["東京","京都","新潟"],6:["東京","阪神","函館"],7:["函館","福島","小倉","新潟"],8:["札幌","新潟","小倉"],9:["中山","阪神","中京"],10:["東京","京都","新潟"],11:["東京","京都","福島"],12:["中山","阪神","中京"]}[m]||["東京","中山","京都","阪神"];
}

const COURSE_DISTS={

 "中山":{芝:[1200,1600,1800,2000,2200,2500],ダート:[1200,1800,2400]},

function distFor(course,surf,lo,hi){
  const list=((COURSE_DISTS[course]||{})[surf]||[1200,1400,1600,1800,2000]).filter(d=>d>=lo&&d<=hi);
  return list.length?pick(list):1600;

/* 平場・条件戦の編成（実際の年齢別体系）：
   ・2歳戦（新馬・未勝利・1勝クラス・オープン）は6月開始。1〜5月は2歳馬の出走レース自体がない
   ・1〜2月は3歳新馬あり。3歳未勝利は1〜9月まで（秋以降は組まれない）
   ・古馬条件戦は上半期「4歳以上」、下半期「3歳以上」
   レース名は実際の番組表記「（競馬場）○歳／○歳以上＋クラス名」で、架空のカップ／S等の汎用名は使わない */
function condSlots(m,w,absWeek){
  const older = m<=5 ? 4 : 3;
  let s0,s1;
  if(m<=2){ if(w%2===1){ s0={cls:0,age:3}; s1={cls:1,age:3}; } else { s0={cls:1,age:3}; s1={cls:2,age:3}; } }
  else if(m<=5){ s0={cls:1,age:3}; s1={cls:2,age:3}; }
  else if(m<=9){ s0={cls:0,age:2}; s1 = w%2===1 ? {cls:1,age:2} : {cls:1,age:3}; }
  else { s0 = w%2===1 ? {cls:0,age:2} : {cls:1,age:2}; s1={cls:2,age:2}; }
  const restPool = m<=5
    ? [{cls:2,age:3},{cls:2,ageMin:older},{cls:3,ageMin:older},{cls:4,ageMin:older},{cls:5,ageMin:older},{cls:3,age:3}]
    : [{cls:2,ageMin:3},{cls:3,ageMin:3},{cls:4,ageMin:3},{cls:5,ageMin:3},{cls:2,age:3},{cls:2,age:2},{cls:5,age:2}];
  /* absWeek が渡されたら残り2鞍も週から一意に決める（将来週の番組を次走提案と一致させるため） */
  if(absWeek!=null) return [s0,s1,restPool[absWeek%restPool.length],restPool[(absWeek+3)%restPool.length]];
  return [s0,s1,pick(restPool),pick(restPool)];
}
function genRaces(){
  const m=month(), w=weekInMonth(); S.races=[];
  /* 重賞は実際の開催（月・週）が来た週だけ開催する */
  GRADED.filter(g=>g.month===m&&g.week===w).forEach((g,i)=>{
    S.races.push({...g, id:"g"+S.week+"_"+i, ground:pick(GROUNDS.slice(0, m>=6&&m<=9?3:2)), graded:true});
  });
  OVERSEAS_RACES.filter(g=>g.month===m&&g.week===w).forEach((g,i)=>{
    S.races.push({...g, id:"o"+S.week+"_"+i, ground:"良", graded:true, month:m, week:w});
  });
  EXCHANGE_RACES.filter(g=>g.month===m&&g.week===w).forEach((g,i)=>{
    S.races.push({...g, id:"x"+S.week+"_"+i, ground:pick(GROUNDS.slice(0,3)), graded:true, month:m, week:w});
  });
  /* 条件戦：毎週4鞍。年齢・クラス・開催場・距離はすべて実際の体系に合わせる */
  const courses=seasonCourses(m);
  condSlots(m,w,S.week).forEach((sp,i)=>{
    const course=courses[(w-1+i)%courses.length];
    /* 馬場・距離も週から一意に決める：次走提案で提示した将来の条件戦が、その週にそのまま組まれるようにする */
    const surf=slotSurf(S.week,i);
    const dist=slotDist(course,surf,sp,S.week,i);
    const ageLabel = sp.age ? sp.age+"歳" : sp.ageMin+"歳以上";
    const r={
      id:"c"+S.week+"_"+i, name:course+" "+ageLabel+CLASSES[sp.cls],
      course, dist, surf, cls:sp.cls,
      ground:pick(GROUNDS.slice(0,3)), weight:sp.age===2?55:57, graded:false,
      maxField:(course==="東京"||course==="中山")&&surf==="芝"?18:16, month:m, week:w,
    };
    if(sp.age) r.age=sp.age;
    if(sp.ageMin) r.ageMin=sp.ageMin;
    S.races.push(r);
  });
  S.selRace=null;
}

/* ============ 次走提案（ベストな次走） ============
   「今週出られるレース」ではなく、今後12週の中からその馬にとってベストな1戦を探す。
   評価軸：①疲労と回復（週送りで疲労は約7/週回復する前提で、開催週時点の疲労を予測）
          ②調子（上向き・ピークは近い週に、底の時期は立て直しの時間を取る）
          ③戦績（条件別レコード：馬場・距離帯・競馬場・重馬場での実績）
          ④距離・馬場適性、クラスの釣り合い、若馬の成長段階 */
function ensureCourseRec(h){
  /* 競馬場別の実績（公開レコード）。未保持なら戦績全体から一度だけ按分して用意する */
  if(h.courseRec) return h.courseRec;
  h.courseRec={};
  const R=h.races||0; if(!R) return h.courseRec;
  const names=Object.keys(COURSE_DISTS);
  const main=names[(h.id||0)%names.length], sub=names[((h.id||0)+3)%names.length];
  const mk=(r)=>({r, w:Math.min(h.wins||0, Math.round((h.wins||0)*r/R)), t:Math.min(r, Math.round((h.top3||0)*r/R))});
  const rMain=Math.round(R*0.55), rSub=R-rMain;
  if(rMain>0) h.courseRec[main]=mk(rMain);
  if(rSub>0) h.courseRec[sub]=mk(rSub);
  return h.courseRec;
}
/* 将来週の条件戦は、開催週・競馬場ローテーションからクラス・馬場・距離を一意に決める。

function slotSurf(absWeek,i){ return ((absWeek*7+i*3)%10)<7 ? "芝" : "ダート"; }
function slotDist(course,surf,sp,absWeek,i){
  const lo= sp.age===2?1000:1200, hi= sp.age===2?2000 : (sp.age===3&&sp.cls<=1)?2400:2600;
  const list=((COURSE_DISTS[course]||{})[surf]||[1600]).filter(d=>d>=lo&&d<=hi);
  return list.length? list[(absWeek+i)%list.length] : 1600;
}
function futureCondRace(absWeek,i){
  const m=Math.floor((absWeek%48)/4)+1, w=(absWeek%4)+1;
  const sp=condSlots(m,w,absWeek)[i]; if(!sp) return null;
  const courses=seasonCourses(m), course=courses[(w-1+i)%courses.length];
  const surf=slotSurf(absWeek,i), dist=slotDist(course,surf,sp,absWeek,i);
  const r={id:"fc"+absWeek+"_"+i, name:course+" "+(sp.age?sp.age+"歳":sp.ageMin+"歳以上")+CLASSES[sp.cls], course, dist, surf, cls:sp.cls,
    ground:"良", weight:sp.age===2?55:57, graded:false, maxField:(course==="東京"||course==="中山")&&surf==="芝"?18:16,
    month:m, week:w, weeks:absWeek-S.week, when:m+"月第"+w+"週"};
  if(sp.age)r.age=sp.age; if(sp.ageMin)r.ageMin=sp.ageMin;

const BAND_JP={sprint:"短距離",mile:"マイル",middle:"中距離",long:"長距離"};
function scoreNextRace(h,r,restNeed){
  const weeks=r.weeks||0;
  let sc=50; const why=[];
  /* 距離適性：適性範囲内＋ベスト距離に近いほど高い */
  if(r.dist>=h.dmin&&r.dist<=h.dmax){ sc+=14; sc+=Math.max(0,9-Math.abs(r.dist-h.bestDist)/70); }
  else sc-=Math.abs(r.dist-h.bestDist)/22;
  /* 馬場適性（グレード） */
  sc+=(aptMul(r.surf==="芝"?h.turf:h.dirt)-1)*150;
  /* ③ 戦績：条件別レコードとの一致（サンプルが薄い条件は割り引く） */
  if(h.races>0){
    const fit=(rec,kw,kt)=>{ const rr=recRate(rec); if(!rr){ sc-=2.5; return 0; } const conf=Math.min(1,rr.n/4); const v=((rr.win-0.18)*kw+(rr.top3-0.42)*kt)*conf; sc+=v; return v; };
    const vSurf=fit((h.surfRec||{})[r.surf],26,10);
    const band=distBand(r.dist), bandRec=(h.distRec||{})[band];
    const vDist=fit(bandRec,20,8);
    const cr=(ensureCourseRec(h)||{})[r.course], rrC=recRate(cr);
    if(rrC){ const conf=Math.min(1,rrC.n/3); sc+=((rrC.win-0.18)*16+(rrC.top3-0.42)*6)*conf; }
    if(GROUNDS.indexOf(r.ground)>=2){ const hr=recRate(h.heavyRec); if(hr){ const conf=Math.min(1,hr.n/3); sc+=((hr.win-0.12)*14+(hr.top3-0.35)*10)*conf; if(hr.top3>=0.5&&hr.n>=2) why.push(`重馬場は${hr.n}戦${hr.t||0}回3着内と苦にしないタイプ`); } }
    const srR=recRate((h.surfRec||{})[r.surf]), drR=recRate(bandRec);
    if(srR&&srR.n>=2&&srR.top3>=0.5) why.push(`${r.surf}は${srR.n}戦${(h.surfRec[r.surf].t||0)}回3着内の得意条件`);
    if(drR&&drR.n>=2&&drR.top3>=0.5) why.push(`${BAND_JP[band]}は${drR.n}戦${(bandRec.t||0)}回3着内と結果が出ている`);
    if(rrC&&rrC.n>=2&&rrC.top3>=0.6) why.push(`${r.course}は${rrC.n}戦${(cr.t||0)}回3着内と相性が良い`);
    if(vSurf+vDist<=-7) why.push(`${r.surf}${BAND_JP[band]}はまだ結果が出ていない条件`);
  }
  /* ① 疲労と回復：開催週時点の予測疲労（週あたり約7回復）で評価する */
  const fatAt=Math.max(0,h.fat-7*weeks);
  if(fatAt>45) sc-=(fatAt-45)*1.15;
  else if(fatAt<=30) sc+=6;
  if(restNeed>0&&weeks>=restNeed) why.push(`疲労が抜ける${weeks}週後で、回復してから使える`);
  else if(restNeed===0&&h.fat<=25) why.push(`疲労は少なく（現在${h.fat}）、すぐ使える状態`);
  /* 中間隔：前走からの間隔が空きすぎても調子維持の面で割り引く */
  if(h.races>0&&h.restW!=null){
    const iv=h.restW+weeks;
    if(iv<3) sc-=8; else if(iv<=8) sc+=5; else if(iv>12) sc-=Math.min(8,(iv-12)*0.8);
  }
  /* ② 調子：ピークが近い週を優先し、底の時期は立て直しの期間を評価する */
  if(h.cond>=70){ sc+=(h.cond-65)*0.22*Math.max(0,1-weeks/10); if(weeks<=3) why.push(`調子は${h.cond}と上向きで、ピークを逃さない時期`); }
  else if(h.cond<45){ if(weeks===0) sc-=(45-h.cond)*0.6; else if(weeks===1) sc-=(45-h.cond)*0.25; else if(weeks>=3){ sc+=3; why.push(`調子（${h.cond}）を立て直す時間も取れる`); } }
  else sc+=2;
  /* ④ クラスの釣り合いと成長段階：若馬は無理な大レースより条件戦で力を付ける */
  const hc= h.races===0?0 : h.wins===0?1 : clamp(1+h.wins,2,5);
  if(r.graded||r.cls>=6){
    if(h.age<=2) sc-=10;
    else if(h.races<=3) sc-=6;
    else if(h.wins>=3||(h.gWins||0)>0){ sc+=4; why.push(`重賞でも実績があり、格は合っている`); }
  } else {
    if(r.cls<hc) sc-=(hc-r.cls)*2;
    if(r.cls===hc) sc+=4;
    if(h.age===2) sc+=3;
    if(h.age<=2&&(h.races||0)<=2) why.push(`若馬のうちは条件戦で力を付けたい時期`);
  }
  if(h.nextPlan&&r.name.includes(h.nextPlan)) sc+=4;
  /* エントリー方針（プレイヤー設定）：優先軸に応じてスコアと理由を調整する */
  const _pa=policyAdjust(h,r,why); sc+=_pa;
  const pos=why.filter(t=>!/まだ結果が出ていない/.test(t)).slice(0,3);
  if(!pos.length) pos.push(`距離${r.dist}mは適性${h.dmin}〜${h.dmax}m内`);
  return {race:r, score:Math.round(sc*10)/10, reasons:pos, fatAt};
}
function suggestNextRaces(h){
  ensureFullHorse(h); ensurePublicRecord(h); ensureCourseRec(h);
  /* 疲労が「使える水準（35以下）」まで抜けるのに必要な週数 */
  const restNeed= h.fat>35? Math.ceil((h.fat-35)/7) : 0;
  const buildPool=(horizon)=>{
    const pool=[];
    S.races.forEach(r=>pool.push({...r,when:"今週",weeks:0}));
    GRADED.forEach(g=>{ const w=weeksUntilRace(g); if(w>=1&&w<=horizon) pool.push({...g,id:"f_"+g.name+"_"+w,graded:true,ground:"良",when:g.month+"月第"+g.week+"週",weeks:w}); });
    for(let w=1;w<=horizon;w++){ for(let i=0;i<4;i++){ const r=futureCondRace(S.week+w,i); if(r) pool.push(r); } }
    const seen=new Set(), out=[];
    pool.forEach(r=>{
      const key=r.name+"|"+(r.month||0)+"|"+(r.week||0)+"|"+r.weeks;
      if(seen.has(key))return; seen.add(key);
      if(eligibleAt(h,r,ageAtRaceMonth(h,r.month,r.week),r.weeks))return; /* 出走条件に合わないものは候補にしない */
      out.push(scoreNextRace(h,r,restNeed));
    });
    return out.sort((a,b)=>b.score-a.score||a.race.weeks-b.race.weeks);
  };
  let scored=buildPool(12);
  /* 12週以内に候補がない場合（例：1〜2月の2歳馬はデビュー戦が6月）だけ、範囲を広げて探す */
  if(!scored.length) scored=buildPool(24);
  const list=scored.slice(0,3);
  /* 今週出られるのに上位に入らないレースがあれば、推奨しない理由を添える */
  let caution=null;
  const thisWeek=scored.filter(x=>x.race.weeks===0).sort((a,b)=>b.score-a.score)[0];
  if(thisWeek&&list.length&&!list.includes(thisWeek)){
    let reason="";
    if(restNeed>0&&thisWeek.fatAt>45) reason=`今週も出られますが疲労が${thisWeek.fatAt}ほど残る見込みです。あと${restNeed}週ほど置くのがおすすめです`;
    else if(h.cond<45) reason=`今週も出られますが調子が${h.cond}と戻りきっていません。立て直してから使う方が良さそうです`;
    else if(thisWeek.score<list[0].score-10) reason=`今週も出られますが、この馬の得意条件とは少しずれています`;
    if(reason) caution={race:thisWeek.race, reason};
  }
  return {list, restNeed, caution};
}
/* 従来の単一提案インターフェース（秘書・調教師の案内用） */
function suggestNextRace(h){
  const s=suggestNextRaces(h);
  return s.list[0]?{race:s.list[0].race, restNeed:s.restNeed, reason:s.list[0].reasons.join("／")}:null;
}
/* ローテーションプラン：馬ごとに「目標レース（G1）」を固定し、目標から逆算して
   前哨戦（重賞→目標の流れ）を suggestNextRaces のスコアで自動編成する。
   エントリー方針（entryPolicy）と連動し、方針に合う前哨戦を優先する */
function rotationPlan(h){
  if(!h||h.age<2||h.injured>0) return null;
  const tgt=h._rotTarget||null;
  const g1s=GRADED.filter(g=>g.cls===8).map(g=>({g, w:weeksUntilRace(g)})).filter(x=>x.w>=2&&x.w<=40)
    .sort((a,b)=> (ratingOf(h)>=95? b.w-a.w : a.w-b.w));
  if(!g1s.length) return null;
  const target=g1s[0].g, tw=g1s[0].w;
  const sg=suggestNextRaces(h).list.filter(x=>x.race.weeks<tw&&x.race.weeks>=0);
  const step=sg[0]||null;
  return {target:target.name, targetWeeks:tw, step: step? step.race.name : "（調整中）", stepWeeks: step? step.race.weeks : null,
    note: step? `前哨戦は ${step.race.name}（あと${step.race.weeks}週）が方針（${policyName()}）に合います` : "前哨戦はまだ決めず、調教で仕上げます"};
}

/* ============ エントリー方針（プレイヤーが決める優先軸） ============
   次走提案（scoreNextRace）とオートのエントリー判断（autoRegisterBest は
   suggestNextRaces 経由）は、すべてこの方針で重み付けされる。
   設定画面／厩舎の次走提案タブ／オート設定からいつでも変更でき、
   変更した瞬間に提案が計算し直される。S.entryPolicy に保存する */
const ENTRY_POLICIES=[
 {id:"balance", n:"バランス", d:"適性・戦績・疲労・調子を総合して、いちばん良い次走を提案します（従来どおり）"},
 {id:"winrate", n:"勝率重視", d:"勝ちやすい条件を最優先。実績のある馬場・距離帯・競馬場を強く評価し、実績不足の格上挑戦は控えめにして、勝てる条件のレースを選びます"},
 {id:"cond", n:"コンディション重視", d:"疲労と調子を最優先。疲労が抜け、調子が整う週のレースを高く評価し、状態が悪いうちは無理をしません"},
 {id:"graded", n:"重賞挑戦", d:"重賞・G1への挑戦を最優先。格上の大レースを積極的に評価してタイトルを狙いにいきます（条件戦は後回しになります）"},
 {id:"prize", n:"賞金重視", d:"1着賞金の高いレースを優先。オープン・重賞など賞金の大きいレースを高く評価します"},
];
function entryPolicy(){
  if(typeof S==="undefined"||!S) return {id:"balance",minFatRest:false};
  if(!S.entryPolicy||typeof S.entryPolicy!=="object") S.entryPolicy={};
  if(!ENTRY_POLICIES.some(p=>p.id===S.entryPolicy.id)) S.entryPolicy.id="balance";
  if(S.entryPolicy.minFatRest===undefined) S.entryPolicy.minFatRest=false;
  return S.entryPolicy;
}
function policyName(){ return (ENTRY_POLICIES.find(p=>p.id===entryPolicy().id)||ENTRY_POLICIES[0]).n; }
function policyAdjust(h,r,why){
  const p=entryPolicy(); let d=0;
  const graded=(r.graded||r.cls>=6), weeks=r.weeks||0;
  const hc= h.races===0?0 : h.wins===0?1 : clamp(1+h.wins,2,5);
  if(p.id==="winrate"){
    /* 勝率方針の中核：相手の強さ（クラス別の相手基礎値＝makeRivals と同じ物差し）と
       自分の能力（ability＝着順計算と同じ物差し）を比べ、「勝ち切れる相手関係か」を
       大きく評価する。格が上がるほど相手は強くなるので、能力が届かない格上挑戦は
       強く避け、勝ち切れるクラス・条件を優先する。未出走馬にも適用する
       （従来は実績条件の微調整だけで、相手の強さを見ていなかった） */
    const baseByCls=[52,54,60,65,72,78,84,88,93];
    const yrB= r.cls>=2? Math.min(5, Math.max(0, year()-1)) : 0;
    const rivalBase=(baseByCls[clamp(r.cls||0,0,8)]||60)+yrB;
    let ownAb=0; try{ ownAb=ability(h,r,jockOf(h)); }catch(e){ ownAb=0; }
    if(ownAb>0){
      const margin=ownAb-rivalBase;
      d+=clamp(margin*2.4,-34,22);
      if(margin>=4) why.push(`勝率方針：相手関係に勝ち切れる力があります（能力差 約+${Math.round(margin)}）`);
      else if(margin<=-6) why.push(`勝率方針：相手が強く、勝ち切るのは厳しい相手関係です（能力差 約${Math.round(margin)}）`);
    }
    if(h.races>0){
      const srR=recRate((h.surfRec||{})[r.surf]), drR=recRate((h.distRec||{})[distBand(r.dist)]), rrC=recRate((ensureCourseRec(h)||{})[r.course]);
      const proven=[[srR,"馬場"],[drR,"距離帯"],[rrC,"競馬場"]].filter(x=>x[0]&&x[0].n>=2&&x[0].top3>=0.5).map(x=>x[1]);
      if(proven.length){ d+=7*proven.length; why.push(`勝率方針：${proven.join("・")}で実績があり、勝ちやすい条件です`); }
      if(!graded&&r.cls<=hc) d+=5;
      if(graded&&(h.gWins||0)===0&&(h.wins||0)<3){ d-=12; why.push(`勝率方針：実績が届いていない格上挑戦は控えめに評価します`); }
    }
  } else if(p.id==="cond"){
    const fatAt=Math.max(0,h.fat-7*weeks);
    if(fatAt<=25){ d+=10; if(weeks>0) why.push(`コンディション方針：その頃には疲労が${fatAt}まで抜けています`); }
    else if(fatAt<=35) d+=4;
    else d-=(fatAt-35)*1.3;
    if(h.cond<50&&weeks>=2) d+=5;
    else if(h.cond>=75&&weeks<=2) d+=4;
  } else if(p.id==="graded"){
    if(r.cls>=8){ d+=26; why.push(`重賞方針：最高峰のG1に挑戦します`); }
    else if(r.cls===7){ d+=19; why.push(`重賞方針：G2に挑戦します`); }
    else if(r.cls===6){ d+=14; why.push(`重賞方針：重賞（G3）に挑戦します`); }
    else if(r.cls===5){ d+=3; }
    else d-=5;
    if(h.age<=2&&graded) d-=8; /* 若馬の無理な大レースだけは少し抑える */
  } else if(p.id==="prize"){
    const p1=prize1Of(r);
    d+=clamp((Math.log10(Math.max(1,p1))-3.2)*14,-8,20);
    if(p1>=6000) why.push(`賞金方針：1着賞金${fmt(p1)}万円の高額レースです`);
    else if(p1<1500) d-=4;
  }
  /* 追加条件：疲労が35以下まで抜ける週を優先する（どの方針にも重ねられる） */
  if(p.minFatRest){
    const fatAt=Math.max(0,h.fat-7*weeks);
    if(fatAt>35){ d-=30; why.push(`追加条件：その週はまだ疲労が${fatAt}残る見込みのため後回しにします`); }
  }
  return d;
}

let ownFilter={q:"",sort:"earn",cls:"all",st:"all"};
function ownList(){
  let list=[...S.horses];
  const f=ownFilter;
  if(f.q) list=list.filter(h=>(h.name||"").includes(f.q));
  if(f.cls!=="all") list=list.filter(h=>classLabel(h)===f.cls);
  if(f.st==="entry") list=list.filter(h=>h.entry);
  if(f.st==="inj") list=list.filter(h=>(h.injured||0)>0);
  if(f.st==="fit") list=list.filter(h=>(h.cond||0)>=75);
  const by={earn:(a,b)=>(b.earnings||0)-(a.earnings||0), rating:(a,b)=>ratingOf(b)-ratingOf(a), age:(a,b)=>(a.age||0)-(b.age||0), wins:(a,b)=>(b.wins||0)-(a.wins||0), name:(a,b)=>String(a.name).localeCompare(String(b.name),"ja")};
  list.sort(by[f.sort]||by.earn);
  return list;
}

function buyHorse(id){
  const h=S.market.find(x=>x.id===id); if(!h)return;
  if(S.funds<h.price){alert2("資金が足りません",`購入には ${fmt(h.price)}万円 が必要です。`);return;}
  S.funds-=h.price; ledOut("buy",h.price); h.owner=true; S.horses.push(h); S.market=S.market.filter(x=>x.id!==id); S.selected=h.id;
  log(`「${h.name}」を ${fmt(h.price)}万円 で購入`); renderAll();
}
function retireHorse(id,back){
  const h=S.horses.find(x=>x.id===id); if(!h)return;
  confirm2(`${esc(h.name)} を引退させますか？`, h.sex==="牝"?"繁殖牝馬として生産パートで使えます。":h.sex==="牡"?"種牡馬として生産パートで使えます。":"騸馬は繁殖に使えません。",
  ()=>{
    if(h.entry){ log(`🏁 ${h.name} のエントリー（${h.entry.name}）は引退に伴い取り消されました`); h.entry=null; }
    S.horses=S.horses.filter(x=>x.id!==id);
    if(h.sex==="牝") S.mares.push(h);
    if(h.sex==="牡") S.stallions.push({name:h.name,spd:Math.round((h.spd-55)/6),sta:Math.round((h.sta-55)/6),pow:Math.round((h.pow-55)/6),bst:Math.round((h.bst-55)/6),gut:Math.round((h.gut-55)/6),fee:0,own:h});
    log(`${h.name} が引退（${h.races}戦${h.wins}勝・賞金${fmt(h.earnings)}万円）`);
    if(S.selected===id) S.selected=S.horses[0]?S.horses[0].id:null;
    renderAll();
    if(back)back(); /* 年末処理から呼ばれた場合は年末処理の画面に戻る */
  }, back||null);
}

/* 提案された調教が今すぐ実行できない理由（空文字なら実行可）。着地バーと下部バーで共用 */
function trainBlockReason(h,tid){
  const t=TRAINS.find(x=>x.id===tid); if(!t) return "調教が見つかりません";
  if(h.trainsLeft<=0) return "今週の調教は終了しています（次の週からまた提案されます）";
  if(S.funds<t.cost) return `資金が足りません（必要 ${t.cost}万円）`;
  if(h.injured>0&&tid!=="bokujou"&&tid!=="rest") return "故障中はこの調教はできません（放牧で療養しましょう）";
  return "";
}
function renderTrain(){
  const el=$("#v-train"); const h=selHorse();

  let html=`<div class="flex">${S.horses.map(x=>`<button class="btn sm ${x.id===h.id?"":"ghost"}" data-th="${x.id}">${esc(x.name)}</button>`).join("")}</div>`;
  html+=subnavHTML("train", [["plan","定常指示"],["rec","おすすめ"],["menu","調教メニュー"],["weak","弱点・適性"],["trainer","調教師"]]);
  /* 提案からの着地バー（調教メニューのパネル先頭に出す） */
  const armed = (pendingTrain && pendingTrain.hid===h.id) ? pendingTrain : null;
  let armedHTML="";
  if(armed){
    const at=TRAINS.find(x=>x.id===armed.tid);

function trainerPlanProposal(h){

 const wk=weakestStatKey(h);
 if(!p.weakFocus && h[wk]<55){ return {reason:`${h.name}は${ABNAME[wk]}が弱点です。弱点重点の指示で底上げしませんか。`, plan:Object.assign({},p,{weakFocus:true})}; }

 return null;
}
function grow(h,amt){
  // 成長型と年齢で伸び幅
  const peakAge = h.growth==="早熟"?3 : h.growth==="晩成"?5 : 4;
  const f = h.age<peakAge?1 : h.age===peakAge?0.5 : 0.12;
  return amt*f;
}

function weaknessesOf(h){
  ensureFullHorse(h); const out=[];
  const wk=weakestStatKey(h);
  out.push({sev:100-h[wk], label:`${STAT_JP[wk]}が弱点（${h[wk]}）`, train:STAT_TRAIN[wk], why:`最も低い能力は${STAT_JP[wk]}。対応調教では伸びが1.6倍になります`});

  if(ta[tk]<52) out.push({sev:90-ta[tk], label:`${TRENDS[tk].n}への適応が低い（${ta[tk]}）`, train:tk==="kire"?"turf":tk==="jizoku"?"longwood":"dirt", why:`${TRENDS[tk].n}で力を発揮しにくい状態。対応調教で適応が少しずつ上がります`});

function trainerCost(d){
  if(d.id===TRAINER_DEFAULT_ID) return {hire:0, upkeep:0};
  const total=["train","eye","idea","cond","weight"].reduce((s,k)=>s+rankVal(d.ranks[k]),0);
  /* 三次式でメリハリ：能力合計 total（0〜25）に対し、維持費は total^3/40
     （合計22→週266万円／合計15→週84万円／合計10→週25万円／合計5→週3万円）、
     雇用費は total^3×0.9（合計22→約9,600万円／合計10→900万円／合計5→約100万円） */
  const cube=total*total*total;
  return {hire:Math.round(cube*0.9/50)*50, upkeep:Math.max(1,Math.round(cube/40))};
}

function trainerSuggest(h){

  const ent=entryOf(h);
  const sg=suggestNextRace(h); const tr= ent || (sg?sg.race:null);
  if(tr){
    const pre= ent? `エントリー中「${tr.name}」まであと${Math.max(0,ent.absWeek-S.week)}週。` : `次走「${tr.name}」に向けて。`;
    if(tr.dist>=2200) add("longwood",`${pre}${tr.dist}mの長距離戦なので、スタミナを付ける長距離ウッドで仕上げましょう。`);
    else if(tr.dist<=1400) add("saka",`${pre}${tr.dist}mの短距離戦なので、スピードを磨く坂路で仕上げましょう。`);
    else if(tr.surf==="ダート") add("dirt",`${pre}ダート${tr.dist}mに向けて、パワーを付けるダート調教で仕上げましょう。`);
    else add("wood",`${pre}${tr.surf}${tr.dist}mに向けて、瞬発力を上げるウッドで仕上げましょう。`);
  }
  /* 弱点改善 */
  const w0=weaknessesOf(h)[0];
  if(w0) add(w0.train, `弱点改善：${w0.why}。`);
  /* 作戦のずれ */
  const fit=tacFit(h,tacOf(h));
  if(fit<0.5) add((TRAINS.find(t=>t.tac===tacOf(h).fam)||{}).id, `作戦「${tacOf(h).n}」と脚質の相性がまだ浅いです。${tacOf(h).fam}訓練で適性を上げましょう。`);
  /* 調子 */
  if(h.cond<45) add("turf",`調子が${h.cond}と低めです。芝コースの軽めの追い切りで気分を上げましょう。`);
  /* 若馬の基礎固め（調教師の方針：スピード重視） */
  if(h.age<=3) add("saka",`${h.age}歳の成長期です。方針として、まずは坂路でスピードの基礎を固めたいところです。`);
  if(!out.length) add("awase",`状態は良好です。併せ馬で勝負根性をさらに伸ばしましょう。`);

  if(t.learn){
    const track=LEARN_TRACKS.find(x=>x.trait===t.learn);
    if(track && !traitOf(h,t.learn) && (h.learned||[]).length<LEARN_CAP && h.traits.length<TRAIT_MAX){
      h.learnProg[t.learn]=(h.learnProg[t.learn]||0)+1;
      if(h.learnProg[t.learn]>=track.need){
        h.learned.push(t.learn); if(!h.traits.includes(t.learn))h.traits.push(t.learn);
        msg+=` ― 特性「${traitName(t.learn)}」を習得した！`;
        log(`${h.name} が特性「${traitName(t.learn)}」を習得`);
      } else {
        msg+=`（特性「${traitName(t.learn)}」習得まで あと${track.need-h.learnProg[t.learn]}回）`;
      }
    }
  }
  /* 特別調教：対応特性の上位進化の進捗＋育成度ゲージ */
  if(tid.indexOf("sp_")===0){
    gainGauge(h, 34, false); const gk=pick(["spd","sta","pow","bst"]); if(h.gauges)h.gauges[gk]=clamp((h.gauges[gk]||0)+34,0,100);
    const great=Math.random()< (0.05+facEffect("recept")*0.025);
    Object.keys(EVO).forEach(base=>{ const ev=EVO[base];
      const match = ev.train===tid || (tid==="sp_dist"&&ev.train==="sp_dist") || (tid==="sp_big"&&ev.train==="sp_big") || (tid==="sp_tokyo"&&base==="tokyopro") || (tid==="sp_nakayama"&&base==="nakayamapro") || (tid==="sp_kyoto"&&base==="kyotopro") || (tid==="sp_hanshin"&&base==="hanshinpro") || (tid==="sp_saka"&&base==="slope") || (tid==="sp_start"&&(base==="gatepro"||base==="inner")) || (tid==="sp_heal"&&(base==="recover"||base==="sequential")) || (tid==="sp_mind"&&base==="stablemind");
      if(match && traitOf(h,base) && !traitOf(h,ev.up)){ h.evoProg[base]=(h.evoProg[base]||0)+(great?2:1); msg+=`（「${traitName(base)}」の進化進捗 ${Math.min(3,h.evoProg[base])}/3${great?"・大成功！":""}）`; if(h.evoProg[base]>=3) doEvolve(h,base); }
    });
    if(tid==="sp_heal"){ h.fat-=18; msg+=" 特別調教：回復管理で疲労が取れた"; }
    else if(tid==="sp_start"){ up("smt",rnd(.6,1.4)); h.fat+=ri(5,9); msg+=" 特別調教：スタートを反復した"; }
    else if(tid==="sp_saka"){ up("pow",rnd(1,2)); h.fat+=ri(12,18); msg+=" 特別調教：坂路で鍛えた"; }
    else if(t.course){ up("bst",rnd(.6,1.4)); h.fat+=ri(8,12); msg+=` 特別調教：${t.course}コースを想定した`; }
    else { up("men",rnd(.6,1.4)); h.fat+=ri(6,10); msg+=" 特別調教をこなした"; }
  }
  if(tid==="rest"){h.fat-=25; h.cond-=ri(2,5); msg="厩舎で休養し疲労が回復";}
  if(tid==="bokujou"){h.fat-=60; h.cond=ri(50,65); h.weight=clamp(h.weight+ri(-8,8),420,540); if(h.injured>0)h.injured=Math.max(0,h.injured-2); msg="放牧でリフレッシュ";}
  h.fat=clamp(h.fat * (1-facEffect("steamer")*0.02),0,100); h.cond=clamp(h.cond,0,100);
  if(h.fat>=92 && !["rest","bokujou"].includes(tid) && Math.random()<(0.4-((h.hlt||60)-60)*0.004 - facEffect("vet")*0.03 - ((h.flags||[]).includes("leganx")?-0.08:0))){
    h.injured=Math.max(1,ri(3,6)-Math.floor(facEffect("vet"))); msg+=" ― しかし故障が発生！ 休養が必要";
    log(`${h.name} が調教中に故障（${h.injured}週休養）`);
  } else log(`${h.name}：${msg}`);
  if(!quiet)renderAll();
  return msg;
}

let breedSel={s:null,m:null,sim:false};
function sireStats(s){ if(s.own){ensureFullHorse(s.own); return {spd:s.own.spd,sta:s.own.sta,pow:s.own.pow,bst:s.own.bst,gut:s.own.gut,flx:s.own.flx,smt:s.own.smt,hlt:s.own.hlt,trend:s.own.trendApt};}
  return {spd:72+(s.spd||0)*2, sta:72+(s.sta||0)*2, pow:72+(s.pow||0)*2, bst:72+(s.bst||0)*2, gut:72+(s.gut||0)*2, flx:68, smt:66, hlt:70, trend:null}; }
function evalBreed(s,m){
  if(!s||!m)return null; ensureFullHorse(m);
  const ss=sireStats(s);
  const avg=k=>Math.round((ss[k]+m[k])/2);
  const total=Math.round((avg("spd")+avg("sta")+avg("pow")+avg("bst")+avg("gut")+avg("flx")+avg("smt"))/7);
  const rank= total>=78?"S":total>=71?"A":total>=64?"B":total>=57?"C":"D";
  const sireHorse=s.own||{name:s.name, health:75, coat:null};
  const th=theorize(s.name, m, sireHorse, m);
  const explosion=clamp(30+th.burst*6+Math.round((ss.spd-60)*0.3),5,99);
  const trendChild={kire:Math.round(((ss.trend?ss.trend.kire:55)+(m.trendApt?m.trendApt.kire:55))/2), jizoku:Math.round(((ss.trend?ss.trend.jizoku:55)+(m.trendApt?m.trendApt.jizoku:55))/2), shoumo:Math.round(((ss.trend?ss.trend.shoumo:55)+(m.trendApt?m.trendApt.shoumo:55))/2)};
  const domTrend=Object.keys(trendChild).reduce((b,k)=>trendChild[k]>trendChild[b]?k:b,"kire");
  return {total,rank,explosion,risk:th.danger*10,theory:th,trendChild,domTrend, expect:{spd:avg("spd"),sta:avg("sta"),pow:avg("pow"),bst:avg("bst"),gut:avg("gut")}};
}

/* 種付け登録の実処理（画面の doBreed と、提案・おまかせ・オートの自動実行で共用）。
   成功時は {ev, cost}、失敗時は {err} を返す（アラートは呼び出し側の役目） */
function tryBreed(s,m){
  if(!s||!m) return {err:"none"};
  const mo=month();
  if(!(mo===5||mo===6)) return {err:"season"};
  if(m.pregnant) return {err:"preg"};
  if((S.mares||[]).length>mareCap()) return {err:"cap"};
  const cost=(s.fee||0)+150;
  if(S.funds<cost) return {err:"funds", cost};
  S.funds-=cost; ledOut("breed",cost);
  const ev=evalBreed(s,m);
  const th=ev.theory;
  /* 父系因子の活性化：表示された父系因子は受胎確定時に確実に上昇する下地になる */
  const P=pedigreeOf(s.name,m);
  S.pregnant.push({mareId:m.id, sireName:s.name, theory:{burst:th.burst, danger:th.danger, mods:th.mods, sub:th.sub, theories:th.theories, sireFactors:(P.sire.factors||[])}, judged:false, ok:false, dueYear:0});
  m.pregnant=true;
  log(`種付けを登録：${s.name} × ${m.name}（受胎判定は月末）`);
  return {ev, cost};
}
function doBreed(){
  const s=S.stallions[breedSel.s||0], m=S.mares[breedSel.m||0]; if(!s||!m)return;
  const r=tryBreed(s,m);
  if(r.err==="season"){ alert2("種付け期間外です","種付けは5〜6月のみ可能です（受胎は月末に判明し、翌年4月に誕生します）。配合評価とシミュレートは年中できます。"); return; }
  if(r.err==="preg"){ alert2("種付けできません",`${esc(m.name)} は今年すでに種付け済みです。`); return; }
  if(r.err==="cap"){ alert2("繋養上限","厩舎の繋養上限を超えています。牧場で厩舎を拡張してください。"); return; }
  if(r.err==="funds"){ alert2("資金が足りません",`種付けには ${fmt(r.cost)}万円 が必要です。`); return; }
  if(r.err) return;
  alert2("種付けを登録しました",`${esc(s.name)} × ${esc(m.name)}<br>受胎結果は月末に判明します。受胎すれば翌年4月に幼駒が誕生し、牧場で育成されます。<br><span class="small">成立理論：${r.ev.theory.theories.map(t=>t.n).join("、")||"なし"}</span>`);
  renderAll();
}
/* ============ 調教師の配合提案 ============
   繁殖シーズン（5〜6月）に、未種付けの繁殖牝馬ごとに調教師が配合を提案する。
   全組み合わせを既存の配合評価エンジン（evalBreed）で採点し（総合＋爆発力＋
   理論の厚み−危険度）、調教師の相馬眼ランクが高いほど上位の組み合わせを、
   低いほど下位寄りの組み合わせを選ぶ＝提案の質が能力で変わる。
   週と牝馬で決まるシードで選ぶため、同じ週の再描画では提案は変わらない */
function trainerBreedProposals(){
  if(!(month()===5||month()===6)) return [];
  const mares=S.mares||[], sires=S.stallions||[];
  if(!mares.length||!sires.length) return [];
  const eye=rankVal(TRAINER.ranks&&TRAINER.ranks.eye);
  const range= eye>=5? [0,0] : eye===4? [0,1] : eye===3? [1,2] : eye===2? [2,4] : eye===1? [3,6] : [4,999];
  const out=[];
  mares.forEach((m,mi)=>{
    if(m.pregnant) return;
    const combos=[];
    sires.forEach((s,si)=>{
      let ev=null; try{ ev=evalBreed(s,m); }catch(e){}
      if(!ev) return;
      const score=ev.total + ev.explosion*0.5 - ev.risk*0.4 + (ev.theory? ev.theory.burst*1.5 : 0);
      combos.push({mare:m, mareIdx:mi, sire:s, sireIdx:si, ev, score, cost:(s.fee||0)+150});
    });
    if(!combos.length) return;
    combos.sort((a,b)=>b.score-a.score);
    const seed=((S.week+1)*(mi+3)*37)%100/100;
    const lo=Math.min(range[0], combos.length-1);
    const hi=Math.min(range[1], combos.length-1);
    const idx=lo+Math.floor(seed*(hi-lo+1));
    out.push(combos[clamp(idx,0,combos.length-1)]);
  });
  return out;
}
function trainerBreedPanelHTML(){
  const props=trainerBreedProposals();
  if(!props.length) return "";
  return `<div class="panel mt" style="background:var(--panel2)"><b>調教師・${esc(TRAINER.name)} の配合提案</b> <span class="small">（相馬眼 ${esc(TRAINER.ranks.eye||"")}：能力が高い調教師ほど、配合評価の高い組み合わせを提案します）</span>

function lineDisp(s){ s=String(s||""); return s.endsWith("系")? s : s+"系"; }
function lineDominance(){

 (S.horses||[]).forEach(h=>add(h.sire)); (S.mares||[]).forEach(h=>add(h.sire)); (S.youngStock||[]).forEach(h=>add(h.sire));
 return Object.keys(counts).map(k=>({line:k, pct: total? Math.round(counts[k]/total*100):0})).sort((a,b)=>b.pct-a.pct);
}
function lineStatus(line){
 const d=lineDominance().find(x=>x.line===line); const pct=d?d.pct:0;
 if(S.overseasFarm||pct>=45) return "世界系統";

function worldYearStep(prevY){
  const sts=rivalStables();
  const world=(S.worldHorses||(S.worldHorses=[]));
  world.forEach(w=>{ w.age=(w.age||4)+1; });
  /* 実在の現役馬も年を取って引退し、世界で生まれた馬へ世代が移る（時代分離） */
  let retiredN=0;
  for(let i=world.length-1;i>=0;i--){ if((world[i].age||0)>=9){ world.splice(i,1); retiredN++; } }
  let champ=null;
  let newsBudget=2; // ライバル動向の新聞は年あたり最大2本まで（記事の氾濫を防ぐ）
  sts.forEach(st=>{
    const mine=world.filter(w=>w.stable===st.name);
    const earn=mine.reduce((a,w)=>a+Math.max(0,Math.round((wRating(w)-52)*ri(6,20))),0);
    const fundsBefore=st.funds||10000;
    st.funds=clamp(Math.max(600, fundsBefore+earn-ri(1400,4600)),600,60000); /* 下限で潰れず上限でも際限なく膨らまない */
    st.lastEarn=earn;
    mine.forEach(w=>{ if(!champ||wRating(w)>wRating(champ)) champ=w; });
    /* 方針は牧場ごとに違う：生産型は生産頭数を増やし、購買型は市場で
       積極的に補強し、小規模牧場は資金が細ると所属馬を手放して立て直す */
    const isBreeder=(st.style||"").includes("生産"), isBuyer=(st.style||"").includes("名門")||(st.style||"").includes("クラブ"), isSmall=(st.style||"").includes("小規模");
    /* 資金難の牧場は評価の低い所属馬を手放す（馬は世界を去り、資金は回復する） */
    if(st.funds<1800&&mine.length>3){
      const sell=[...mine].sort((a,b)=>wRating(a)-wRating(b))[0];
      const price=Math.max(300, Math.round(wRating(sell)*14));
      const ix=world.indexOf(sell); if(ix>=0) world.splice(ix,1);
      st.funds+=price;
      if(newsBudget>0&&Math.random()<0.7){ newsBudget--; pushNews(`${st.name}が${sell.name}を放出`, `資金繰りのため、${st.name}が所属馬の${sell.name}を ${fmt(price)}万円 で手放した。小規模牧場の経営は常に綱渡りだ。`); }
    }
    /* 生産：自牧場の牝馬×種牡馬から、その牧場の血統の2歳が加入する（生産型は資金が許せば2頭） */
    const mares=mine.filter(w=>w.sex==="牝"&&(w.age||0)>=4&&(w.age||0)<=10).sort((a,b)=>wRating(b)-wRating(a));
    const sires=mine.filter(w=>w.sex!=="牝"&&(w.age||0)>=4&&(w.age||0)<=12).sort((a,b)=>wRating(b)-wRating(a));
    const breedN= isSmall? (st.funds>2600?1:0) : isBreeder? (st.funds>6000?2:1) : 1;
    for(let bi=0; bi<breedN; bi++){
      const ma=mares[bi], si=sires.length? sires[bi%sires.length] : null;
      if(!ma||!si||st.funds<=1200) break;
      const f=newHorse({base:clamp(Math.round((wRating(ma)+wRating(si))/2)+ri(-5,9),45,95), age:2, sire:si.name, dam:ma.name});
      f.stable=st.name; f.worldBred=true; ensureFullHorse(f); f.rating=wRating(f);
      world.push(f); st.funds-=600;
    }
    /* 購買：購買型は積極的に（2頭まで）、他は余裕がある時だけセール級の若馬を買い増す */
    const buyP= isBuyer?0.75 : isBreeder?0.3 : 0.5;
    const buyN= (isBuyer&&st.funds>16000)?2:1;
    for(let bi=0; bi<buyN; bi++){
      if(st.funds>9000&&Math.random()<buyP){ const f=newHorse({base:ri(58,80), age:2}); f.stable=st.name; f.worldBred=true; ensureFullHorse(f); f.rating=wRating(f); world.push(f); const paid=Math.round(ri(800,2400)*lineHeatOf(f.sire)); st.funds-=paid;
        if(!Array.isArray(S.saleHist))S.saleHist=[];
        S.saleHist.unshift({name:f.name, price:paid, week:S.week, buyer:st.name}); if(S.saleHist.length>12)S.saleHist.length=12;
        if(newsBudget>0&&paid>=1800){ newsBudget--; pushNews(`${st.name}がセールで${f.name}を落札`, `今年のセールで、${st.name}が若馬の${f.name}を ${fmt(paid)}万円 で落札した（父 ${esc(f.sire)}）。${lineHeatOf(f.sire)>1.05?`父系の流行も価格を押し上げた格好だ。`:""}来季のデビューが注目される。`); }
      }
    }
    st._fundsDelta=(st.funds||0)-fundsBefore;
  });
  /* 世界の頭数の安全弁：何十年遊んでもセーブが肥大化しないよう、
     世界生産馬が増えすぎたら評価の低い古馬から世代交代させる */
  if(world.length>280){
    const cands=world.map((w,i)=>({w,i})).filter(x=>x.w.worldBred&&(x.w.age||0)>=6).sort((a,b)=>wRating(a.w)-wRating(b.w));
    const idxs=cands.slice(0, world.length-280).map(x=>x.i).sort((a,b)=>b-a);
    idxs.forEach(i=>world.splice(i,1));
  }
  /* 系統の盛衰：世界の上位馬の父系シェア（どの系統が今の主流か） */
  const top=[...world].sort((a,b)=>wRating(b)-wRating(a)).slice(0,24);
  const cnt={}; top.forEach(w=>{ const ln=lineOf(w.sire||""); const key=(ln&&ln.parent)?ln.parent:(w.sire||"その他"); cnt[key]=(cnt[key]||0)+1; });
  S.lineTrend=Object.keys(cnt).map(k=>({line:k, pct:Math.round(cnt[k]/Math.max(1,top.length)*100)})).sort((a,b)=>b.pct-a.pct).slice(0,5);
  /* 系統シェアの推移を残す（記録タブで年ごとの変動が見える）。首位系統が
     入れ替わった年は新聞記事にもする */
  const prevTop=(S.lineTrendHist&&S.lineTrendHist.length)? (S.lineTrendHist[S.lineTrendHist.length-1].top||[])[0] : null;
  S.lineTrendHist=S.lineTrendHist||[];
  S.lineTrendHist.push({y:prevY+1, top:S.lineTrend.slice(0,3)});
  if(S.lineTrendHist.length>10) S.lineTrendHist.splice(0, S.lineTrendHist.length-10);
  const newTop=S.lineTrend[0];
  if(newTop&&prevTop&&prevTop.line!==newTop.line) pushNews(`系統の勢力図に変化：${lineDisp(newTop.line)}が首位に`, `世界の上位馬の父系シェアで ${lineDisp(newTop.line)} が ${newTop.pct}% と首位に立った。前年首位の ${lineDisp(prevTop.line)}（${prevTop.pct}%）を逆転した年になった。流行の移り変わりは種付け需要にも波及する。`);
  if(newTop&&newTop.pct>=42&&Math.random()<0.7) pushNews(`${lineDisp(newTop.line)}の支配が強まる`, `世界の上位馬の父系シェアで ${lineDisp(newTop.line)} が ${newTop.pct}% に達した。流行系統の種付け料は市場価格で ×${trendHeat(newTop.line).toFixed(2)} まで熱を帯び、セール価格・売却価格にも波及している。逆にシェアの低い系統は割安で狙える時期とも言える。`);
  /* セール結果のまとめ：その年に記録された大きな取引を1本に */
  const bigSale=(S.saleHist||[]).filter(x=>x.week>S.week-48).sort((a,b)=>b.price-a.price)[0];
  if(bigSale&&bigSale.price>=1800&&Math.random()<0.5) pushNews(`今年のセール最高額は${bigSale.name}`, `${bigSale.buyer}が ${fmt(bigSale.price)}万円 で落札した${bigSale.name}が、今年のセール市場の話題をさらった。市場の熱は系統の流行とともに動いている。`);
  /* 新世代の台頭：世界生産の若馬で際立つ存在がいれば取り上げる */
  const rising=world.filter(w=>w.worldBred&&(w.age||0)<=3).sort((a,b)=>wRating(b)-wRating(a))[0];
  if(rising&&wRating(rising)>=88) pushNews(`新星 ${rising.name} が台頭`, `${rising.stable||"ライバル牧場"}の ${rising.age}歳・${rising.name}（レーティング${wRating(rising)}）が世代の中心に躍り出た。${rising.stable||""}の生産力が実を結びつつある。`);
  /* 資金を大きく伸ばした牧場の動向 */
  const gainer=[...sts].sort((a,b)=>(b._fundsDelta||0)-(a._fundsDelta||0))[0];
  if(gainer&&(gainer._fundsDelta||0)>=6000&&Math.random()<0.6) pushNews(`${gainer.name}の勢いが増している`, `今年、${gainer.name}は資金を大きく伸ばした（推定 +${fmt(gainer._fundsDelta)}万円）。看板馬の活躍と堅実な経営が実を結んでいる。`);
  /* 騎手の世代交代：数年ごとにベテランが引退し新人がデビューする（枠の入れ替え） */
  if(prevY>=3 && prevY%2===0){
    const k=ri(2, Math.max(3,JOCKEYS.length-1));
    const old=JOCKEYS[k];
    if(old){ const nm=genPersonName();
      log(`👋 ${old.name}騎手が引退し、新人の${nm}騎手がデビューしました`);
      pushNews(`${old.name}騎手が引退、新人・${nm}がデビュー`, `${prevY}年いっぱいで${old.name}騎手が現役を退き、${nm}騎手がデビューした。長く遊ぶほど、騎手界の顔ぶれも少しずつ入れ替わっていく。`);
      JOCKEYS[k]=Object.assign({}, old, {name:nm, skill:ri(70,84), fee:ri(15,50), tier:(old.tier==="S"?"A":old.tier)});
      if(S.friendship) S.friendship[old.id]=0;
      if(S.jockStats) delete S.jockStats[old.id];
    }
  }
  if(champ){ const tpl=prevY%3;
    if(tpl===0) pushNews(`今年の競馬界は${champ.name}が席巻`, `${champ.stable||"ライバル牧場"}の${champ.name}（レーティング${wRating(champ)}）が今年の世界の中心だった。${retiredN?`往年の馬${retiredN}頭がターフを去り、世代交代が進んでいる。`:""}来年、この牙城を崩す馬が現れるか注目だ。`);
    else if(tpl===1) pushNews(`年度代表は${champ.name}か`, `関係者の間では、${champ.stable||"ライバル牧場"}の${champ.name}（レーティング${wRating(champ)}）を今年の顔に推す声が強い。${retiredN?`引退馬${retiredN}頭の穴を埋める新世代の台頭も目立った。`:""}あなたの厩舎から対抗馬が出る日が待ち遠しい。`);
    else pushNews(`${champ.name}の時代が続く`, `${champ.stable||"ライバル牧場"}の${champ.name}（レーティング${wRating(champ)}）が今年も世界の頂点に君臨した。${retiredN?`今年は${retiredN}頭がターフを去り、顔ぶれは静かに入れ替わっている。`:""}牙城は高いが、世代交代の足音は確実に近づいている。`);
  }
  pruneWorldData(); /* 年末の締め：世界の頭数・履歴・資金の上限を必ず通す */
}

/* 種付け料の見込み（年末の実処理 sireDemandTick と、配合画面の表示で共用。
   需要・市場価格・設定時の実効料・依頼確率を一箇所で計算する） */
function sireFeeInfo(s){
  const progeny=(S.horses||[]).filter(h=>h.sire===s.name);
  const wins=progeny.reduce((a,h)=>a+(h.wins||0),0);
  const g1=progeny.reduce((a,h)=>a+(h.g1w||0),0);
  const demand=clamp(20+wins*6+g1*25+Math.round((ratingOf(s.own)-70)/2),0,100);
  const marketFee=Math.round((150+demand*4)*lineHeatOf(s.name)/10)*10;
  const fee=s.feeSet? clamp(Math.round(s.feeSet),0,5000) : marketFee;
  const pBook=s.feeSet? clamp(0.5*(marketFee/Math.max(50,fee)),0.05,0.95) : 0.5;
  return {demand, marketFee, fee, pBook, wins, g1};
}
function sireDemandTick(){
  const out=[];
  (S.stallions||[]).filter(s=>s.own).forEach(s=>{
    const info=sireFeeInfo(s);
    s.demand=info.demand;
    if(info.demand>=45 && Math.random()<info.pBook){ out.push({s, fee:info.fee}); }
  });
  return out;
}

/* 指示の自動実行：条件ルールを評価して調教を1〜2回実行し、週報に残す */
function weakestTrainId(h){
 const wk=weakestStatKey(h);
 const map={spd:"wood",sta:"longwood",pow:"saka",bst:"turf",gut:"awase",flx:"longwood",men:"mental",smt:"mental",hlt:"pool"};
 return map[wk]||"awase";
}
function runPlan(h){
 const p=h.plan||defaultPlan(); const rep=[];
 let tid=null, why="";
 const ent=h.entry; const weeksLeft=ent? ent.absWeek-S.week : 99;
 const sinceRace = h.restW!=null? h.restW : 99;
 if(ent && ent.absWeek===S.week){ rep.push(`${h.name}：今週は出走週のため調教は軽め（レース優先）`); doTrain("rest",true,h); S.weekReport.push(rep[0]); return; }

function saleEval(kind, h){

   else if(kind==="overseas"){ h=newHorse({base:triBase(60,80), age:1}); h.sire=pick(["海外・欧州スタミナ種牡馬","海外・米国ダート種牡馬"]); h.price=ri(900,4200); h.saleKind="young"; if(Math.random()<0.2){ h.charmPrice=true; h.price*=3; } }

   h.saleEvals={sec:saleEval("sec",h), mgr:saleEval("mgr",h), tr:saleEval("tr",h)};

function makeFoalFromTheory(p){

 const base=55+Math.min(7,T.burst)+ri(-5,4);
 const f=newHorse({base, age:0, sire:p.sireName, dam:mare?mare.name:""});
 f.name=applyCrownName(genUniqueName()); /* 仔馬は固有名＋設定があれば冠名を付ける */
 if(mare){ ["spd","sta","pow","bst","gut","flx","men","smt","hlt"].forEach(k=>{ const sv=sireH?sireH[k]:(mare[k]+8); f[k]=clamp(Math.round(62+((sv+mare[k])/2-62)*0.88+gauss()*5),25,95); }); f.turf=mare.turf; f.dirt=mare.dirt; f.heavy=mare.heavy; }
 /* 父系因子の活性化：受胎確定時に表示された父系因子は確実に上昇 */
 ((p.theory&&p.theory.sireFactors)||[]).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+ri(2,4),20,99); });
 Object.keys(T.sub||{}).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+T.sub[k],20,99); });
 Object.keys(T.mods||{}).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+T.mods[k]*2,20,99); });
 if(T.danger>=4){ f.hlt=clamp(f.hlt-ri(4,10),20,99); if(Math.random()<0.35&&!f.flags.length)f.flags=["leganx"]; if(Math.random()<0.3)f.temper=pick(["激","荒い","普通"]); }
 if(T.mods&&T.mods.life){ f.longLife=true; }
 /* 遺伝の実計算への反映：成長型・気性（temper）は父母から確率で受け継ぐ。
    能力は「現在値」と「成長限界（潜在値 pot）」を分けて持ち、潜在値は父母の
    高い方を基準に決まる（兄弟でも現在値と伸びしろが違う）。調教の得意不得意
    （trainLike）も受け継ぎ、得意な調教は効果が伸びる */

}

function sellHorseToRival(h, price){
 try{
  const sts=rivalStables();
  const buyers=sts.filter(st=>(st.funds||0)>=price).sort((a,b)=>(b.funds||0)-(a.funds||0));
  if(!buyers.length) return null;
  const st=buyers[Math.random()<0.6?0:ri(0,buyers.length-1)];
  const w=JSON.parse(JSON.stringify(h));
  delete w.entry; delete w.plan; delete w._pub;
  w.stable=st.name; w.exPlayer=true; w.owner=false; w.rival=false;
  ensureFullHorse(w); w.rating=wRating(w);

  st.funds=Math.max(0,(st.funds||0)-price);

  S.soldToRival.unshift({name:h.name, stable:st.name, price, week:S.week});
  if(S.soldToRival.length>20)S.soldToRival.length=20;
  pushNews(`${st.name}が${h.name}を購入`, `あなたが手放した${h.name}が、${st.name}の所属馬として再出発することになった（取引額 ${fmt(price)}万円）。今後、重賞の舞台で古巣と対戦する可能性もある。`);

 }catch(e){ return null; }

/* ============ レース ============ */
/* 開催時点の馬齢：馬齢は年明けに+1されるため、開催（月・週）が今より前なら翌年開催として+1歳で判定する */
function ageAtRaceMonth(h,raceMonth,raceWeek){
  if(raceMonth==null) return h.age;
  const nowIdx=(month()-1)*4+(weekInMonth()-1), raceIdx=(raceMonth-1)*4+((raceWeek||1)-1);
  return h.age + (raceIdx<nowIdx?1:0);
}
/* 開催までの週数（年間48週で循環） */
function weeksUntilRace(g){
  const nowIdx=(month()-1)*4+(weekInMonth()-1), raceIdx=(g.month-1)*4+((g.week||1)-1);
  return (raceIdx-nowIdx+48)%48;
}
/* 出走条件チェック（age=判定に使う馬齢／weeksAhead=開催までの週数。将来のレースでは故障・疲労は回復見込みを加味する） */
/* ============ 海外遠征の出走条件（実績制） ============
   通常の海外G1は「重賞勝利」が最低条件。凱旋門賞・キングジョージ・
   BCクラシックの最高峰3レースは、G1勝利か「重賞2勝＋G1で3着以内」の
   実績がないとエントリーできない */
function overseasOK(h,r){
  if(r.top) return g1WinEst(h)>=1 || ((h.gWins||0)>=2 && (h.g1t||0)>=1);
  return (h.gWins||0)>=1;
}
function overseasReqShort(r){ return r.top? "G1勝利、または重賞2勝＋G1で3着以内の実績が必要" : "重賞勝利の実績が必要"; }
function eligibleAt(h,r,age,weeksAhead){
  const wk=weeksAhead||0;
  if(h.injured>0 && wk<h.injured) return "故障休養中";
  if(wk===0 && h.racedWeek!=null && h.racedWeek===S.week) return "今週は出走済み";
  if(age<2) return "1歳は出走不可";
  /* 2歳戦は6月開始：1〜5月に開催されるレース（3歳・古馬戦）には、年齢条件以前に2歳馬は出走できない */
  const rMonth=(r.month!=null?r.month:null);
  if(age===2 && rMonth!=null && rMonth<6) return "2歳戦は6月から（1〜5月は開催なし）";
  /* 3歳未勝利は9月で終了（秋以降は組まれない） */
  if(r.age===3 && r.cls===1 && rMonth!=null && rMonth>=10) return "3歳未勝利は9月で終了";
  if(r.age && age!==r.age) return r.age+"歳限定";
  if(r.ageMin && age<r.ageMin) return r.ageMin+"歳以上限定";
  if(r.sex==="牝" && h.sex!=="牝") return "牝馬限定";
  if(r.sex==="牡騸" && h.sex==="牝") return "牡・騸馬限定";
  /* sex未指定（牡牝混合）は牡・牝・騸いずれも可 */
  const hc = h.races===0?0 : h.wins===0?1 : clamp(1+h.wins,2,5);
  if(r.cls===0 && h.races>0) return "新馬戦はデビュー馬のみ";
  if(r.cls===1 && h.wins>0) return "未勝利は未勝利馬のみ";
  if(r.cls>=2 && r.cls<=5 && hc<r.cls) return "クラスが足りない";
  /* 格下げ出走は不可：勝ち星で上がったクラスより下の条件戦には出られない
     （例：2勝した馬が1勝クラスに出る）。提案・登録の段階でここに落ちるので、
     レース週になってから内部で失敗する不整合は起きない */
  if(r.cls>=2 && r.cls<=5 && hc>r.cls) return `クラスが上のため出走不可（現在 ${CLASSES[hc]}）`;
  if(r.overseas){ if(!overseasOK(h,r)) return "実績が足りない（"+overseasReqShort(r)+"）"; }
  else if(r.minWins!=null){ if(h.wins<r.minWins) return "実績が足りない（"+r.minWins+"勝以上が必要）"; }
  else if(r.cls>=6 && hc<4 && h.wins<3) return "実績が足りない（3勝以上）";
  if(h.fat>=85 && wk<3) return "疲労が限界";
  return "";
}
function eligible(h,r){
  return eligibleAt(h,r,h.age,0);
}
function makeRivals(r){
  let n=clamp((r.maxField||16)-1,7,17); const out=[]; // 自厩舎馬1頭を加えてフルゲートになる頭数
  /* 実在馬の注入（主要G1） */
  if(r.cls===8 && REAL_FIELDS[r.name] && year()<=3){ REAL_FIELDS[r.name].forEach(nm=>{ const rh=makeRealRival(nm); if(rh && out.length<n){ out.push(rh); } }); }
  if(r.overseas && year()<=3){ const OF={"ドバイワールドカップ":["フォーエバーヤング"],"ドバイシーマクラシック":["ダノンデサイル","カランダガン"],"ブリーダーズカップクラシック":["フォーエバーヤング"],"凱旋門賞":["クロワデュノール","カランダガン"],"キングジョージVI世＆クイーンエリザベスS":["カランダガン"]};
    (OF[r.name]||["カランダガン","クロワデュノール"]).forEach(nm=>{ const rh=makeRealRival(nm); if(rh&&out.length<n-2) out.push(rh); }); }

     現役の実在馬もこのプールに含まれ、年を取れば引退して世代が移る */
  if(r.cls>=6){
    try{ rivalStables();
      const have=new Set(out.map(x=>x.name));
      const pool=(S.worldHorses||[]).filter(w=>!have.has(w.name)).sort((a2,b2)=>((b2.exPlayer?1000:0)+wRating(b2))-((a2.exPlayer?1000:0)+wRating(a2))).slice(0,6); /* 売却した元自厩舎馬は優先的に参戦し、古巣との対戦が起きやすくする */
      let added=0;
      for(const w of pool){ if(added>=2||out.length>=n)break;
        const x=ensureFullHorse(JSON.parse(JSON.stringify(w))); x.rival=true; x.worldRef=w.name; x.stable=w.stable||"";
        x.silk=RIVAL_SILKS[out.length%RIVAL_SILKS.length]; x.jockey=ri(0,JOCKEYS.length-1); x._wDev=ri(-14,2);

  const yrB = r.cls>=2 ? Math.min(5, Math.max(0, year()-1)) : 0;
  const baseByCls=[52,54,60,65,72,78,84,88,93][r.cls]+yrB;
  for(let i=out.length;i<n;i++){

    const h=newHorse({base:baseByCls+gauss()*7+ace, age:r.age||(r.ageMin?ri(r.ageMin,r.ageMin+2):pick([3,3,4,4,5,6]))});
    if(r.sex==="牝")h.sex="牝"; if(r.sex==="牡騸"&&h.sex==="牝")h.sex="牡";
    h.name=genUniqueName(out); /* 相手馬も固有名：この出馬表の中で重複させない */
    if(r.cls===0){h.races=0; h.wins=0;}
    else if(r.cls===1){h.races=r.age===2?ri(1,3):ri(1,8); h.wins=0;}
    else {h.races=ri(2,20); h.wins=clamp(Math.round(h.races*rnd(0.05,0.3)),0,9);}
    h.rival=true; h.silk=RIVAL_SILKS[i%RIVAL_SILKS.length]; h.jockey=ri(0,JOCKEYS.length-1);
    // NPCの作戦：本脚質に合う作戦が中心、たまに隣接作戦
    const nat=TAC_BY_STYLE[h.style]; const ti=TACTICS.findIndex(t=>t.id===nat);
    const roll=Math.random();
    h.tactic = roll<0.68 ? nat : TACTICS[clamp(ti+(Math.random()<0.5?-1:1),0,TACTICS.length-1)].id;
    h.tactic2 = Math.random()<0.62 ? "normal" : pick(["slow","front","late"]);
    if(Math.random()<0.07){ h.special=pick(["tame","insnipe","makuri2","saikouhou"]); }
    h.earnings=h.wins*ri(300,1500);
    /* 公開レコード（人気算出用）：重賞勝ち・休養期間・前走馬体重を用意する */
    h.gWins= r.cls>=6? clamp(Math.round(h.wins*rnd(0.2,0.6)),0,3) : 0;
    h.restW= h.races>0? (Math.random()<0.12? ri(18,40) : ri(2,12)) : null;
    h.wPrev= h.races>0? clamp(h.weight + (Math.random()<0.12? pick([-1,1])*ri(15,28) : ri(-8,8)),420,540) : null;
    ensurePublicRecord(h);
    out.push(h);
  }
  return out;
}

/* 出馬表の固定：相手馬は「レース×その週」で一度だけ生成して固定表に保持し、
   出馬表・馬券画面・レース開始で共有する。画面への出入りや再描画、各所の
   rivals=null リセットでは再抽選しない（初回生成時のみ抽選が起きる）。
   週が替われば固定表は作り直される */
/* ============ 馬券の購入上限（抜け道への歯止め） ============
   オッズは能力を参照しない公開情報ベースのため、能力を知っている自馬への
   過大な賭けが複利的に膨らむ問題への歯止めとして、1レースあたりの購入総額に
   上限を設ける：所有資金の20%かつ絶対上限2,000万円（手動・基本設定の自動購入・
   馬券画面のすべてに共通）。上限は各購入UIにも明示する */
const BET_CAP_PCT=20, BET_CAP_ABS=2000;
function betCapLimit(){ return Math.min(Math.max(0,S.funds)*BET_CAP_PCT/100, BET_CAP_ABS); }
function betRaceTotal(raceId){ return (S.bets||[]).filter(b=>b.raceId===raceId).reduce((a,b)=>a+(+b.stake||0),0); }
function betCapLeft(raceId){ return Math.max(0, betCapLimit()-betRaceTotal(raceId)); }
function fixedEntryFor(r){
  const fkey=r.id+"@"+S.week;
  if(!raceState.fixedFields || raceState.fixedFields.week!==S.week) raceState.fixedFields={week:S.week, map:{}};
  let fx=raceState.fixedFields.map[fkey];
  if(!fx){ fx={rivals:makeRivals(r)}; raceState.fixedFields.map[fkey]=fx; }
  return fx;
}
function fixedRivalsFor(r){ return fixedEntryFor(r).rivals; }
/* 人気・オッズの固定：初回生成時にだけ算出して固定表へ凍結し、再描画では
   凍結値を復元する。市場の乱数を引き直さないので、出馬表・馬券・レース開始で
   人気とオッズは常に同一になる */
function freezePopularity(field, race){
  const fx=fixedEntryFor(race);
  if(fx.popFrozen){
    let all=true;
    field.forEach(h=>{ const s=fx.pop[h.name+"#"+(h._gate||0)]; if(s){ h._pop=s.pop; h._odds=s.odds; h._tanOdds=s.tan; h._fukuOdds=s.fuku; h._pscore=s.ps; h._p=s.p; } else all=false; });
    if(all) return;
  }
  assignPopularity(field,race);
  fx.pop={}; field.forEach(h=>{ fx.pop[h.name+"#"+(h._gate||0)]={pop:h._pop,odds:h._odds,tan:h._tanOdds,fuku:h._fukuOdds,ps:h._pscore,p:h._p}; });
  fx.popFrozen=true;
}
/* 枠順の固定：既に振られた馬番（重複なし・範囲内）は保持し、未割当ての馬に
   だけ空き番号を割り当てる。再描画のたびに振り直さない */
function fixGates(all){
  const used=new Set(), keep=new Set();
  all.forEach(h=>{ const g=h._gate; if(g>=1&&g<=all.length&&!used.has(g)){ used.add(g); keep.add(h); } });
  let nxt=1;
  all.forEach(h=>{ if(keep.has(h))return; while(used.has(nxt))nxt++; h._gate=nxt; used.add(nxt); keep.add(h); });
}
function drawCard(r){
  const hid=+($("#entry-horse")?$("#entry-horse").value:0)||S.selected;
  const mine=S.horses.find(x=>x.id===hid);
  /* 複数頭エントリー対応：このレースに今週エントリー済みの自厩舎馬は全頭、
     セレクトで選んだ馬と合わせて1レースに同時出走させる */
  const dueOwns=S.horses.filter(x=>x.entry&&x.entry.name===r.name&&x.entry.absWeek<=S.week&&!eligible(x,r));
  const cardOwns=[]; if(mine&&!eligible(mine,r))cardOwns.push(mine); dueOwns.forEach(x=>{ if(!cardOwns.includes(x))cardOwns.push(x); });
  const hadFixed=!!(raceState.fixedFields&&raceState.fixedFields.week===S.week&&raceState.fixedFields.map[r.id+"@"+S.week]);
  raceState.rivals=fixedRivalsFor(r); raceState.rivalRace=r.id;
  if(!hadFixed) PG.cardtable=0;
  const all=[...raceState.rivals];
  cardOwns.forEach(x=>all.push(x));
  cardOwns.forEach(x=>{ x.cardJockey = x.reqJockey!=null? x.reqJockey : x.jockey; }); // 人気算出は実際に騎乗する騎手で
  /* 枠順は人気算出より先に確定させ、以降は固定する */
  fixGates(all);
  const order=[...all].sort((a,b)=>a._gate-b._gate);
  /* 人気・オッズは公開情報（戦績・近走・条件別実績・馬体重・騎手・枠・休養）だけで決める。能力値は使わない */
  freezePopularity(all,r);
  raceState.card=all;
  const trend=determineTrend(r,all); raceState.trend=trend;
  const tb=$("#trend-box"); if(tb){ const ma=mine?ensureTrendApt(mine)[trend.key]:null; tb.innerHTML=`<span class="trendtag ${trend.key}">${TRENDS[trend.key].n}</span> <span class="small">${TRENDS[trend.key].d}／${r.course}直線${trend.straight}m・${r.dist}m・脚質構成から判定${mine?`／${esc(mine.name)}の適応度 <b>${ma}</b>（${ma>=70?"得意な流れ":ma>=50?"標準":"苦手な流れ・能力割引あり"}）`:""}</span>`; }
  const t=$("#card-table"); if(!t)return;
  const formDisp=h=> h.races===0? "初出走" : (h.form&&h.form.length? h.form.join("・") : "―");
  const rentai=h=> h.races>0? Math.round((h.top2||0)/h.races*100)+"%" : "―";
  const wtDisp=h=>{ ensurePublicRecord(h); if(!h.wPrev) return h.weight+"kg"; const d=h.weight-h.wPrev; return `${h.weight}kg（${d>=0?"+":""}${d}）`; };
  const pageOrder=order; /* 全頭をスクロールで表示（ページ送りなし） */
  t.innerHTML=`<tr><th>馬名</th><th class="num">人気</th><th class="r">オッズ</th><th>騎手</th><th>近走</th></tr>`+
   pageOrder.map(h=>`<tr class="crow-main ${h===mine?"mine":""}" data-crow="${h._gate}"><td><b>${h._gate}番</b> ${esc(h.name)}${h===mine?"（自厩舎）":""}</td><td class="num"><span class="pop">${h._pop}</span></td><td class="r">${h._odds}</td><td>${riderName(h)}</td><td>${formDisp(h)}</td></tr>`+
   `<tr class="crow-detail" data-crowd="${h._gate}" hidden><td colspan="5"><div class="small" style="line-height:1.7">${h.sex}${h.age}歳／馬体重 ${wtDisp(h)}／連対率 ${rentai(h)}／${h.races}戦${h.wins}勝${h.gWins?`（重賞${h.gWins}勝）`:""}${h.restW!=null&&h.restW>=10?`／休養${h.restW}週明け`:""}${h.real?`<br>実在馬：${h.realNote||""}`:""}<br>脚質・位置取り：<span data-crowtac="${h.id}">${h.style}・${h===mine?tacOf(h).n+"／"+tac2Of(h).n:tacOf(h).n}</span>${posBarHTML(h,h===mine)}</div>${h===mine&&!eligible(h,r)?`<div class="mt"><button type="button" class="btn gold sm" data-goto-settings="1">作戦・騎手・単勝は「作戦・単勝」タブで設定する</button></div>`:""}</td></tr>`).join("");
  t.querySelectorAll("tr.crow-main").forEach(rw=>rw.addEventListener("click",()=>{ const d=t.querySelector(`tr.crow-detail[data-crowd="${rw.dataset.crow}"]`); if(d)d.hidden=!d.hidden; }));
  t.querySelectorAll("[data-goto-settings]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation(); UI.race="settings"; renderAll(); window.scrollTo(0,0); }));
  const cpEl=$("#card-pager"); if(cpEl){ cpEl.innerHTML=""; }
  const fb=$("#formation-box");
  if(fb){
    const grp=(h2)=>{ const pp=tacOf(h2).pos; return pp>=0.8?"先頭":pp>=0.48?"先団":pp>=0.24?"中団":"後方"; };
    const groups={"先頭":[],"先団":[],"中団":[],"後方":[]}; order.forEach(h2=>groups[grp(h2)].push(h2));
    const frontN=order.filter(h2=>["逃げ","先行"].includes(h2.style)).length;
    const ma2=mine?ensureTrendApt(mine)[trend.key]:null;
    const secTxt= !mine? "出走馬を選ぶと、秘書の見立てを表示します。" : ma2>=70? `${esc(mine.name)}はこの傾向（${TRENDS[trend.key].n}）が得意です。流れに乗せて力を出し切らせましょう。` : ma2>=50? `${esc(mine.name)}にとって標準的な流れです。作戦どおり運べば上位を狙えます。` : `${esc(mine.name)}にはやや厳しい流れです。温存度の高い作戦で消耗を抑えるのも手です。`;
    const keyTxt= frontN>=6? `逃げ・先行が${frontN}頭と多く、前は競り合いそうです。差し馬の末脚と、消耗戦への適応が鍵になります。` : frontN<=2? `前に行く馬が${frontN}頭と少なく、先行馬が自分のペースを作りそうです。前残りに注意。` : `前に行く馬は${frontN}頭。平均的な隊列で、位置取りと仕掛けのタイミングが鍵になります。`;
    fb.innerHTML=`<b>レース直前情報</b>

    <div class="formgrp"><span class="gl">先団</span>${groups["先団"].map(h2=>`<span class="fchip ${h2===mine?"me":""}">${h2._gate} ${esc(h2.name)}</span>`).join("")||'<span class="small">―</span>'}</div>
    <div class="formgrp"><span class="gl">中団</span>${groups["中団"].map(h2=>`<span class="fchip ${h2===mine?"me":""}">${h2._gate} ${esc(h2.name)}</span>`).join("")||'<span class="small">―</span>'}</div>
    <div class="formgrp"><span class="gl">後方</span>${groups["後方"].map(h2=>`<span class="fchip ${h2===mine?"me":""}">${h2._gate} ${esc(h2.name)}</span>`).join("")||'<span class="small">―</span>'}</div>
    <div class="small" style="margin-top:5px"><span class="trendtag ${trend.key}">${TRENDS[trend.key].n}</span> 秘書：${secTxt}</div>
    <div class="small">展開のキー：${keyTxt}</div>

/* ---- レースシミュレーション ---- */
const raceState={phase:"idle", rivals:null, rivalRace:null, fixedFields:null, card:null, sim:null, race:null, mine:null, raf:0, t0:0, done:false, betResults:null, paceInfo:"", showMap:true, showForm:true};
function startRace(r,mine,field){
  let all=field;
  if(!all){ all=[...fixedRivalsFor(r)]; if(mine&&!all.includes(mine))all.push(mine); fixGates(all); }
  /* 出走する自厩舎馬（複数頭可）：全頭ぶん出走条件と騎乗料を処理する */
  const owns=all.filter(h=>!h.rival&&S.horses.some(x=>x.id===h.id));
  if(owns.length){
    let totalFee=0;
    for(const h of owns){
      const er=eligible(h,r);
      if(er){ alert2("出走条件を満たしていません",`${esc(h.name)}は「${esc(r.name)}」に出走できません（${er}）。条件に合うレースを選んでください。`); return; }
      const effJ=h.reqJockey!=null? h.reqJockey : h.jockey;
      h._effJockey=effJ;
      totalFee+=JOCKEYS[effJ].fee + (r.overseas? (r.travel||0) : 0);
    }
    if(S.funds<totalFee){ alert2("資金不足",r.overseas?"騎乗料と遠征費が払えません。":"騎乗料が払えません。騎手を変更してください。"); owns.forEach(h=>{h._effJockey=null;}); return; }
    S.funds-=totalFee; ledOut("jockey",totalFee);
  }
  all.forEach((h,i)=>{ if(!h._gate)h._gate=i+1; });
  /* --- 基本設定：自厩舎馬の単勝を「所有資金の○%」で自動購入する ---
     設定（S.betPct）がある時だけ、レース開始時点で未購入の自厩舎馬全頭に適用する。
     手動購入と同じ S.bets 形式で積むので、結果画面の精算もそのまま連動する。
     オートで消化されるレースも startRace を通るため、同じルールで買われる */

/* レース終了時刻：全馬が入線し（tMax）、勝ち馬のウイニングランが数秒見えてから遷移する */
function raceEndT(){

/* 自厩舎馬かどうか（複数頭出走対応：マーカー・ラベル・順位バー・HUD・実況の

    // ゴール直前の速度（歪みの残り）と指数減速の初速がずれるため、補間窓 W（2.2秒）の中では
    // ゴール前速度→減速カーブへ滑らかにブレンドし、ゴール瞬間に速度が跳ねないようにする
    const v0=1/h._time, tau=4.0, dt=t-h._time;

     差し・追い込みの伸びは、癖が消えていく過程として最後の直線でそのまま見える */
  let D=1;

/* 再生速度：シミュレーション時刻を「実時間 × 選択倍率」でそのまま進めるだけ。
