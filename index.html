      if(leadD-AU.hoofM>=6.6){ AU.hoofM=leadD; auHoof(raceState.race.surf==="ダート"); }
      const rem=raceState.race.dist-leadD, tWin=raceState.sim.tWin;
      let lvl=0.13;
      if(el2>=tWin) lvl=0.95; else if(rem<=500) lvl=0.13+ (1-rem/500)*0.55; else if(rem<=900) lvl=0.22;
      auSetCrowd(lvl,0.5);
    }
  }
  if(raceState.simT>=simEnd){ finishRace(); return; } // 全馬がラインを越え、勝ち馬が流し切ってから結果へ
  raceState.raf=requestAnimationFrame(tickRaceSafe);
}
/* レース進行の安全装置：1フレームでも例外が出たら rAF 連鎖が黙って切れて
   レースが止まったままになる（＝「急に進まなくなる」）。例外を捕まえて
   結果画面への移行を試み、それも無理なら状態を戻して操作を返す */
function tickRaceSafe(now){
  try{ tickRaceBody(now); }
  catch(e){
    try{ finishRace(); }
    catch(e2){
      try{ cancelAnimationFrame(raceState.raf); }catch(e3){}
      raceState.phase="idle"; raceState.done=false; raceState.sim=null; raceState.vis=null; raceState.result=null;
      try{ log("⚠ レース処理でエラーが発生したため、厩舎に戻しました："+(e&&e.message||e)); }catch(e4){}
      try{ switchView("stable"); renderAll(); }catch(e5){}
    }
  }
}
/* 再生速度ボタンの見た目を現在の倍率に合わせる */
function syncSpeedBtns(){
  document.querySelectorAll("#racectl .spd").forEach(b=>b.classList.toggle("on", +b.dataset.rate===(raceState.rate||1)));
}
function setRaceRate(rate){
  raceState.rate=rate; S.raceSpeed=rate; saveAuto(); syncSpeedBtns();
}
/* ---- コース：細長いスタジアム型（長い直線＋両端の小さな半円コーナー）・左回り ----
   中心線を歩いてサンプル化する。s=0 はホームストレッチ入口（第4コーナー出口）。
   ゴールは直線の終わり寄り（直線の82%地点）に置き、4コーナー→ゴールを長く取る。 */
const LAP_M=1600;
let courseCache={key:"",pts:null,total:0,finS:0,cx:0,cy:0,a:0,R:0,trackW:40,straightPx:0,cornerPx:0};
function coursePoints(W,H){
  const key=W+"x"+H;
  if(courseCache.key===key)return courseCache;
  const cx=W/2, cy=H*0.52;
  const R=clamp(Math.min(H*0.30,(W/2-40)*0.32),44,115); // コーナー半径は小さめに（狭幅でも直線主体を保つ）
  const a=Math.max(30, W/2-40-R);                        // 直線の半長（大きく取る）
  const trackW=clamp(R*0.62,30,52);
  const pts=[]; let s=0, px=null, py=null;
  const push=(x,y,nx,ny)=>{ if(px!==null)s+=Math.hypot(x-px,y-py); pts.push({x,y,s,nx,ny}); px=x; py=y; };
  const step=2.2;
  for(let x=-a;x<=a;x+=step) push(cx+x, cy+R, 0, 1);                                        // ホームストレッチ（左→右）
  for(let ph=Math.PI/2; ph>=-Math.PI/2; ph-=0.03) push(cx+a+R*Math.cos(ph), cy+R*Math.sin(ph), Math.cos(ph), Math.sin(ph)); // 第1・2コーナー
  for(let x=a;x>=-a;x-=step) push(cx+x, cy-R, 0, -1);                                       // 向正面（右→左）
  for(let ph=-Math.PI/2; ph>=-Math.PI*1.5; ph-=0.03) push(cx-a+R*Math.cos(ph), cy+R*Math.sin(ph), Math.cos(ph), Math.sin(ph)); // 第3・4コーナー
  push(cx-a, cy+R, 0, 1);
  const total=s, straightPx=2*a, cornerPx=Math.PI*R;
  const finS=straightPx*0.82;
  courseCache={key,pts,total,cx,cy,a,R,trackW,finS,straightPx,cornerPx};
  return courseCache;
}
function courseAt(C,s,lat){
  const L=C.total; s=((s%L)+L)%L;
  const pts=C.pts,N=pts.length-1;
  let lo=0,hi=N;
  while(lo<hi){const mid=(lo+hi)>>1; if(pts[mid].s<s)lo=mid+1; else hi=mid;}
  const i=Math.max(1,lo), a=pts[i-1], b=pts[i];
  const f=(s-a.s)/Math.max(0.0001,b.s-a.s);
  const x=a.x+(b.x-a.x)*f, y=a.y+(b.y-a.y)*f;
  const tx=b.x-a.x, ty=b.y-a.y, tl=Math.hypot(tx,ty)||1;
  const nx=a.nx+(b.nx-a.nx)*f, ny=a.ny+(b.ny-a.ny)*f; // 外向き法線（サンプルに保持）
  const hw=C.trackW/2-3;
  return {x:x+nx*lat*hw, y:y+ny*lat*hw, cx:x, cy:y, tx:tx/tl, ty:ty/tl, depth:clamp((y-(C.cy-C.R))/(2*C.R),0,1)};
}
function latAt(h,u){ // 横位置：スタートの散らばり→道中の基本コース→終盤の外回し
  const settle=clamp(u/0.22,0,1);
  let lat=h._lat0+(h._latIn-h._lat0)*settle;
  if(h._latSwing>0){
    const sw=clamp((u-0.56)/0.17,0,1)*(1-clamp((u-0.93)/0.06,0,1)*0.5);
    lat+=h._latSwing*sw;
  }
  lat+=Math.sin(h._gate*2.39)*0.07;
  return clamp(lat,-0.95,0.95);
}
/* ============ 見た目の進路（表示専用レイヤー） ============
   シミュレーション（progAt／着順・着差）は一切変えない。その上で、
   レース開始時に「表示用の進路」を全馬ぶん事前計算してキーフレーム化する。
   追い越しの作り方は実馬そのもの：
   ・前が壁なら、まず減速して前の馬の直後につけ、そのまま付きながら
     左右のスキマが「開き続ける」のを待つ（スキマ探し）。一瞬空いた
     だけでは動かず、技術に応じた確認時間（上手い騎手・反応の良い馬で
     約0.35秒／下手で約1.1秒）ずっと空いていた側にだけ進路を取る。
     両側とも開かなければ、減速したまま包まれ続けて抜けない。
     開きかけた側へは、待つ間わずかに寄せて構える。
   ・進路変更は一度決めた側に固定する（左右へのフラつき・目標の
     行き来をしない）。途中で塞がれた場合だけ静かに諦めて元の
     進路に戻る。
   ・縦も横も「速度」を持って積分する：縦は加速度・減速度に上限を
     持たせ、前走馬との間隔に応じた追従制御でなめらかに減速して
     直後で落ち着き、空けば少しずつ加速して遅れを取り戻す（壁への
     急停止や、空いた瞬間の急加速はしない）。横も速度・加速度に
     上限を持ち、ブレーキ距離で寄せて止まる。
   ・計算刻みは 0.05 秒と細かくし、補間は隣接4点の Catmull-Rom
     （区間両端の範囲にクランプ）で速度が連続する。キーフレーム
     境界ごとに速度がゼロへ戻る補間は使わない＝カクつかない。
   ・表示位置は本来の progAt を決して上回らない（sim より前に
     出ない）。馬同士の押し分けも速度ゼロ化や瞬間移動はせず、
     1ステップわずかずつ開く。
   ・抜けやすさの技術差：騎手の技術が高いほど先読みが遠く・狭い
     隙間を使え・スキマの確認が早く・立て直しの加速も速い。
     馬の賢さ（反応）と瞬発力も後押しする */
function pathSkillOf(h){
  const jk=jockOf(h);
  const jk01=clamp(((jk?jk.skill:82)-78)/20,0,1);      // 騎手の技術 78→0 / 98→1
  const smt01=clamp((h.smt||60)/100,0,1);              // 馬の賢さ（反応）
  const bst01=clamp((h.bst||60)/100,0,1);              // 馬の瞬発
  let sk=0.45*jk01+0.30*smt01+0.25*bst01;
  if(typeof traitOf==="function"&&traitOf(h,"gatepro")) sk+=0.05;
  return clamp(sk,0.05,1);
}
function buildVisPath(){
  const sim=raceState.sim, r=raceState.race;
  if(!sim||!r){ raceState.vis=null; return; }
  const dist=r.dist, dt=0.05, tEnd=raceEndT(), tWin=sim.tWin;
  const n=Math.max(2,Math.ceil(tEnd/dt)+1);
  const GAPMIN=2.55;                                    // 前走馬との最小間隔(m)：これ以上は絶対に詰めない
  const GAPDES=3.15;                                    // 追従時の目標間隔(m)：ここで速度が釣り合う
  const LW=v=>v*4.6;                                    // 横位置（正規化）→メートル換算（3Dの広がりと一致）
  const LANE=0.30;                                      // 進路変更1回ぶんの横移動量（正規化：約1.4m）
  const simV=(h,t)=>{ const e=0.06, t0=Math.max(0,t-e); return Math.max(0,(progAt(h,t+e,tWin)-progAt(h,t0,tWin))/((t+e)-t0))*dist; }; // sim 本来の速度(m/秒)
  const horses=sim.all.map(h=>{
    const p0=progAt(h,0,tWin);
    return {h, sk:pathSkillOf(h), s:p0*dist, v:simV(h,0), l:latAt(h,p0), lv:0,
      mode:"free", holdL:latAt(h,p0), openT:[0,0], targetL:latAt(h,p0), reactT:0, abortT:0,
      frames:new Float32Array(n*2)};
  });
  const freeAt=(o,cand,need,aheadM)=>{                  // その横位置に、本当にスキマがあるか
    if(cand<-0.93||cand>0.93) return false;
    for(const q of horses){ if(q===o)continue; const dp=q.s-o.s;
      if(dp>-3.2&&dp<aheadM&&Math.abs(LW(q.l-cand))<need) return false; }
    return true;
  };
  for(let i=0;i<n;i++){
    const t=Math.min(i*dt,tEnd);
    if(i===0){ horses.forEach(o=>{ o.frames[0]=o.s/dist; o.frames[1]=o.l; }); continue; } // 初回は初期状態そのもの（時刻ずれを作らない）
    /* 先行している馬から順に確定させ、後ろの馬は確定済みの前の馬に合わせる */
    const order=[...horses].sort((a,b)=>b.s-a.s);
    for(const o of order){
      const tp=progAt(o.h,t,tWin)*dist;
      const vb=simV(o.h,t);
      const aheadM=6.5+5.0*o.sk;                        // 先読み距離：技術が高いほど遠くから壁とスキマを読む
      /* 前の壁：自分の進路帯で最も近い馬 */
      let blk=null, blkGap=Infinity;
      for(const q of horses){ if(q===o)continue; const g=q.s-o.s;
        if(g>0.2&&g<aheadM&&Math.abs(LW(q.l-o.l))<1.15&&g<blkGap){ blk=q; blkGap=g; } }
      /* ---- 縦：速度で積分する。壁があれば間隔に応じた追従制御で減速 ---- */
      let vT=vb;
      const debt=tp-o.s;
      if(debt>0.25){                                    // 遅れの取り戻しは速度の上乗せで少しずつ（空いた瞬間に跳ねない）
        let cap=vb*0.16;
        if(t>tWin*0.82) cap=vb*(0.16+0.20*(t/tWin-0.82)/0.18); // 終盤は強めて着順・着差と合わせる
        vT+=Math.min(debt*0.45, cap)*clamp(debt/1.2,0,1); // 借りが尽きる手前で上乗せを絞り、速度が段差なく本来の速度へ戻る（カクつき防止）
      }
      let accDn=3.4;                                    // 減速（ブレーキ）の上限。加速は技術で差がつく
      if(blk){
        vT=Math.min(vT, Math.max(0, blk.v+(blkGap-GAPDES)*0.85)); // 目標間隔より狭いほど強く減速し、直後で落ち着く
        if(blkGap<GAPMIN){ vT=Math.min(vT, blk.v*Math.max(0,blkGap/GAPMIN)); accDn=6.0; } // 詰まり切ったら強めのブレーキ（それでも速度は連続に落とす：速度の段差＝カクつきを作らない）
      }
      const accUp=(2.1+1.4*o.sk)*dt;
      o.v+=clamp(vT-o.v, -accDn*dt, accUp);
      if(o.v<0) o.v=0;
      o.s+=o.v*dt;
      if(o.s>tp){ o.s=tp; o.v=Math.min(o.v, vb); }      // sim より前に出ない
      if(blk&&o.s>blk.s-1.9){ const back=Math.min(o.s-(blk.s-1.9), 0.06); o.s-=back; o.v=Math.min(o.v, blk.v+0.3); } // 最終安全弁：重なりそうな時だけ1ステップ最大6cmの緩やかな押し戻し（瞬間移動・凍結は作らない）。速度も前走馬に寄せておき、次ステップで目標速度と開きが出て急加速に見えるのを防ぐ
      /* ---- 横：状態機械（free／follow＝減速してスキマ探し／change＝進路変更） ---- */
      const baseL=latAt(o.h, clamp(tp/dist,0,1));
      let tgt;
      if(o.mode==="change"){
        tgt=o.targetL;                                  // 決めた側に固定（フラつかない）
        const need=1.55-0.35*o.sk;
        if(!freeAt(o,o.targetL,need,aheadM)) o.abortT+=dt; else o.abortT=0;
        if(o.abortT>0.5){ o.mode="follow"; o.holdL=o.l; o.openT=[0,0]; tgt=o.l; } // 塞がれ続けたら静かに諦める
        if(o.mode==="change"&&Math.abs(o.targetL-o.l)<0.035){ o.mode=blk?"follow":"free"; o.holdL=o.l; o.openT=[0,0]; tgt=blk?o.l:baseL; } // 目標レーンに着いたら変更完了
        if(o.mode==="change"){ /* 進路の途中に馬がいたら割り込まず、その場で待つ */
          for(const q of horses){ if(q===o)continue;
            if(Math.abs(q.s-o.s)<2.2 && Math.abs(LW(q.l-o.l))<1.0 && Math.sign(q.l-o.l)===Math.sign(o.targetL-o.l)){ tgt=o.l; break; } }
        }
      } else if(blk){
        if(o.mode!=="follow"){ o.mode="follow"; o.holdL=o.l; o.openT=[0,0]; }
        /* スキマ探し：左右それぞれ「開き続けている時間」を数え、
           確認時間を超えた側にだけ動く。一瞬の空きでは動かない */
        const need=1.55-0.35*o.sk;                      // 抜くのに要る横クリアランス：技術が高いほど狭くて済む
        const cands=[blk.l-LANE, blk.l+LANE];
        for(let sd=0;sd<2;sd++){
          if(cands[sd]>=-0.93&&cands[sd]<=0.93&&freeAt(o,clamp(cands[sd],-0.93,0.93),need,aheadM)) o.openT[sd]+=dt;
          else o.openT[sd]=Math.max(0,o.openT[sd]-2*dt);
        }
        const confirmT=1.15-0.80*o.sk;                  // 確認時間：技術が高いほど短い＝早くスキマを使える
        const best=o.openT[1]>o.openT[0]?1:0;
        if(o.openT[best]>=confirmT){
          o.mode="change"; o.targetL=clamp(cands[best],-0.93,0.93);
          o.reactT=0.30-0.18*o.sk; o.abortT=0; tgt=o.l; // 決断から動き出しまで一呼吸（反応）
        } else {
          /* まだ開かない：減速したまま付き、開きかけた側へわずかに寄せて構える */
          const lean=(o.openT[best]>0.12)? (best===1?1:-1)*0.085*(o.openT[best]/confirmT) : 0;
          tgt=clamp(o.holdL+lean,-0.93,0.93);
        }
      } else {
        o.mode="free"; o.openT=[0,0]; tgt=baseL;
      }
      /* 隣に馬がいる横移動はしない：縦に近い馬と交差する目標なら、今の進路のまま待つ */
      if(o.mode!=="change"){
        for(const q of horses){ if(q===o)continue;
          if(Math.abs(q.s-o.s)<2.6 && Math.abs(LW(q.l-tgt))<1.05 && Math.abs(LW(q.l-tgt))<Math.abs(LW(q.l-o.l))){ tgt=o.l; break; } }
      }
      if(o.reactT>0){ o.reactT-=dt; tgt=o.l; }
      /* 横の速度制御：上限・加速度つき。目標手前で減速して止まる */
      const vmax=0.15+0.09*o.sk;                        // 横速度の上限（正規化/秒：約0.7〜1.1m/秒＝無理のない寄せ）
      const acc=0.32+0.28*o.sk;                         // 横加速度（正規化/秒²）
      const distL=tgt-o.l;
      const brakeV=Math.sqrt(2*acc*Math.abs(distL));    // 目標でちょうど止まれる速度
      const desV=clamp(Math.sign(distL)*Math.min(vmax,brakeV),-vmax,vmax);
      o.lv+=clamp(desV-o.lv,-acc*dt,acc*dt);
      let stepL=o.lv*dt;
      if(Math.abs(stepL)>Math.abs(distL)){ stepL=distL; o.lv=0; }
      if(Math.abs(distL)<0.003) o.lv=0;
      o.l=clamp(o.l+stepL,-0.95,0.95);
      o.frames[i*2]=o.s/dist; o.frames[i*2+1]=o.l;
    }
    /* 横の重なり解消：速度をゼロ化したり瞬間に押し出したりせず、
       1ステップ最大 0.5/秒 相当だけ少しずつ開く（主に後ろの馬が下がる） */
    for(let a=0;a<horses.length;a++) for(let b=a+1;b<horses.length;b++){
      const A=horses[a], B=horses[b];
      const ds=Math.abs(A.s-B.s); if(ds>3.2) continue;
      const need=0.09+0.17*(1-ds/3.2);
      const dl=B.l-A.l;
      if(Math.abs(dl)<need){
        const behind=A.s<=B.s?A:B, ahead=behind===A?B:A;
        const sgn=(behind.l-ahead.l)>=0?1:-1;
        const push=Math.min(need-Math.abs(dl), 0.35*dt);
        behind.l=clamp(behind.l+sgn*push*0.75,-0.95,0.95);
        ahead.l=clamp(ahead.l-sgn*push*0.25,-0.95,0.95);
        behind.frames[i*2+1]=behind.l; ahead.frames[i*2+1]=ahead.l;
      }
    }
  }
  const map=new Map(); horses.forEach(o=>map.set(o.h,o.frames));
  raceState.vis={dt:dt, n:n, frames:map, tEnd:tEnd};
}
/* 表示用の位置（prog／横位置）を時刻から引く。無い場合は null（従来計算にフォールバック） */
function visAt(h,t){
  const v=raceState.vis; if(!v||!v.frames.has(h)) return null;
  const fr=v.frames.get(h), n=v.n;
  const f=clamp(t/v.dt,0,n-1), i=Math.min(Math.floor(f),n-2), u=f-i;
  const i0=i-1, i3=i+2;
  /* 端点は複製すると接線が半分になって速度段差が出るため、鏡像で外挿する */
  const P=(idx,k)=>{ if(idx<0) return 2*fr[k]-fr[2+k]; if(idx>n-1) return 2*fr[(n-1)*2+k]-fr[(n-2)*2+k]; return fr[idx*2+k]; };
  /* Catmull-Rom補間（隣接4点）：キーフレーム境界でも速度が連続し、
     境界ごとに速度がゼロへ戻る脈動（カクつき）が出ない。
     区間両端の値の範囲にクランプし、行き過ぎも防ぐ */
  const cr=(p0,p1,p2,p3)=>{
    const val=0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u);
    return clamp(val, Math.min(p1,p2), Math.max(p1,p2));
  };
  return { p:cr(P(i0,0), P(i,0), P(i+1,0), P(i3,0)),
           l:cr(P(i0,1), P(i,1), P(i+1,1), P(i3,1)) };
}
/* ============ 中継カメラ（テレビ中継風） ============
   カメラ経路は再生前に全区間ぶん事前計算し、中央移動平均で平滑化して焼き込む。
   再生中は再生経過時刻で経路を引くだけなので、目標を毎フレーム追いかける補正が
   原理的に発生せず、遅れも小刻みな拡縮も起きない（震え対策の本命）。
   focus=先頭馬の位置(m)、rel=1mあたりの画面幅（キャンバス幅比） */
function buildCameraPath(){
  const sim=raceState.sim; if(!sim)return;
  /* シミュレーション時刻を横軸にサンプルする（再生速度に依存しない経路）
     視点は3種ぶん事前に経路を計算して平滑化しておく：
       leader=先頭中心（従来の中継カメラ）／ mine=自厩舎馬中心 ／ all=全体（先頭〜最後方） */
  const total=Math.max(sim.tMax+2.5, sim.tWin+6), dt=0.25, n=Math.max(2,Math.ceil(total/dt)+1);
  const r=raceState.race, mine=raceState.mine;
  const owns=sim.all.filter(h=>!h.rival); // 自厩舎馬（複数頭なら最も先行している馬を追う）
  const LF=[], LR=[], MF=[], MR=[], AF=[], AR=[], JF=[], JR=[];
  for(let i=0;i<n;i++){
    const simT=Math.min(i*dt,total);
    const ps=sim.all.map(h=>progAt(h,simT,sim.tWin)*r.dist).sort((a,b)=>b-a);
    /* 先頭中心 */
    let back=ps[Math.min(5,ps.length-1)];
    if(mine) back=Math.min(back, progAt(mine,simT,sim.tWin)*r.dist);
    const spread=Math.max(0,ps[0]-back);
    LF.push(Math.min(ps[0], r.dist+90)); // ゴール後も焦点は勝ち馬のウイニングランに同調して滑らかに進み、流し終わる頃に止まる
    LR.push(clamp(0.94/(spread+18), 0.010, 0.027)); // 上位6頭＋自厩舎馬が画角に収まる拡縮
    /* 自分の馬中心：自馬を焦点にし、周りの馬群が少し見える拡縮。自馬が後方でも画面外に出ない */
    if(owns.length){
      const mpos=Math.max(...owns.map(h=>progAt(h,simT,sim.tWin)*r.dist));
      MF.push(Math.min(mpos, r.dist+90));
      const near=ps.filter(p=>Math.abs(p-mpos)<=42);
      const lspread=near.length?Math.max(...near)-Math.min(...near):16;
      MR.push(clamp(0.80/(Math.max(lspread,26)+30), 0.010, 0.020)); // 自馬視点は先頭視点より引いた画角にする
    } else { MF.push(LF[LF.length-1]); MR.push(LR[LR.length-1]); }
    /* 全体：先頭と最後方の真ん中を焦点にし、全頭が収まるまで引く */
    const aspread=Math.max(0, ps[0]-ps[ps.length-1]);
    AF.push((ps[0]+ps[ps.length-1])/2);
    AR.push(clamp(0.96/(aspread+22), 0.0035, 0.027));
    /* 騎手視点：自馬の位置に密着し、前方（進行方向）を広く取るタイトな画角 */
    if(owns.length){
      const jp=Math.max(...owns.map(h=>progAt(h,simT,sim.tWin)*r.dist));
      JF.push(Math.min(jp, r.dist+90));
      JR.push(0.052);
    } else { JF.push(LF[LF.length-1]); JR.push(0.03); }
  }
  const blurN=a=>{ const R=6, out=new Array(a.length);
    for(let i=0;i<a.length;i++){ let s=0; for(let k=-R;k<=R;k++) s+=a[clamp(i+k,0,a.length-1)]; out[i]=s/(2*R+1); } return out; };
  const B=a=>blurN(blurN(a));
  raceState.camPath={dt,total,paths:{
    leader:{F:B(LF),Rp:B(LR),anchor:0.68},
    mine:{F:B(MF),Rp:B(MR),anchor:0.50},
    all:{F:B(AF),Rp:B(AR),anchor:0.50},
    jockey:{F:B(JF),Rp:B(JR),anchor:0.30},
  }};
}
function camSample(mode,e){
  const cp=raceState.camPath; if(!cp)return null;
  const p=cp.paths[mode]||cp.paths.leader;
  const x=clamp(e,0,cp.total)/cp.dt, i=Math.min(Math.floor(x),p.F.length-2), fr=x-i;
  return {f:p.F[i]+(p.F[i+1]-p.F[i])*fr, rel:p.Rp[i]+(p.Rp[i+1]-p.Rp[i])*fr, anchor:p.anchor};
}
function camAt(e){
  if(!raceState.camPath)return null;
  const cur=camSample(raceState.camMode||"leader", e);
  const bl=raceState.camBlend; // 視点切替時は現在位置から約0.7秒かけて滑らかに移行する（ジャンプや震えを出さない）
  if(bl){
    const k=clamp((performance.now()-bl.t0)/700,0,1), s=k*k*(3-2*k);
    if(k>=1){ raceState.camBlend=null; return cur; }
    return {f:bl.from.f+(cur.f-bl.from.f)*s, rel:bl.from.rel+(cur.rel-bl.from.rel)*s, anchor:bl.from.anchor+(cur.anchor-bl.from.anchor)*s};
  }

}

function cycleMineTarget(){

  const i=owns.indexOf(raceState.mine);

function setCamMode(mode){
  if(!["leader","mine","all","jockey"].includes(mode))return;
  if((raceState.camMode||"leader")===mode){ syncCamBtns(); return; }
  const cur=camAt(raceState.simT||0); // 切替前のカメラ位置を起点にブレンド開始
  /* 焦点（距離・レーン位置）の切替元も記録する。最後の直線の真横画角では
     カメラの基準点そのものが焦点馬なので、ここを混ぜないと視点ボタンを
     押した瞬間に画角が跳ね、「切り替わらない／切り替えられない」ように見えた */
  let fromS=cur?cur.f:0, fromLat=0;
  if(raceState.sim){
    const prevMode=raceState.camMode||"leader";
    const leadP=raceState.sim.all.reduce((m,h)=>h._prog>m._prog?h:m, raceState.sim.all[0]);
    if(prevMode==="mine"&&raceState.mine){ fromS=(raceState.mine._prog||0)*(raceState.race?raceState.race.dist:0); fromLat=latAt(raceState.mine, clamp(raceState.mine._prog,0,1))*4.6; }
    else if(prevMode==="all"){ fromS=cur?cur.f:fromS; fromLat=0; }
    else { fromS=(leadP._prog||0)*(raceState.race?raceState.race.dist:0); fromLat=latAt(leadP, clamp(leadP._prog,0,1))*4.6; }
  }
  raceState.camFocusBlend={t0:performance.now(), fromS, fromLat};
  raceState.camMode=mode; S.camMode=mode; saveAuto();
  if(cur) raceState.camBlend={t0:performance.now(), from:cur};

  if(raceState.phase==="run"&&$("#racecv")){ try{ drawRace(raceState.simT||0); }catch(e){} }
}

/* ============ 3Dコース経路（直線＋コーナーの実形状） ============
   従来の3D表示は全区間が真っ直ぐな直線で、コーナーが存在しなかった。
   ここではレース距離を「直線→半円コーナー（第1・2コーナー）→向正面→
   半円コーナー（第3・4コーナー＝最終コーナー）→ホーム直線（実直線長）」
   の区間列に分解し、各地点の位置・進行方向・曲率を解析的に返す。
   コーナー半径は競馬場の直線長から決める（小回り場はきつく、大回り場は緩く）。
   短距離戦（直線＋最終コーナーだけで距離が埋まる場合）は最終コーナーのみ。
   回り方向は COURSE_INFO の左回り／右回りに合わせる */
let racePath=null;
function buildRacePath(r){
  const home=(r&&r.straight)||(typeof COURSE_STRAIGHT!=="undefined"&&r?COURSE_STRAIGHT[r.course]:0)||350;
  let R= home<=300? 88 : home>=470? 135 : 110;
  const sign= (typeof COURSE_INFO!=="undefined"&&r&&COURSE_INFO[r.course]&&COURSE_INFO[r.course].dir==="左回り")? 1 : -1;
  let arc=Math.PI*R;
  const dist=r.dist, post=140;
  /* 区間長の合計がちょうどレース距離になるよう配分する：
     2コーナー分の余裕があれば 第1・2コーナー＋最終コーナー、
     無ければ最終コーナーのみ。直線が距離の大半を占める超短距離では
     コーナーの弧を available に合わせて縮める */
  const pre2=dist-home-2*arc, pre1=dist-home-arc;
  const raw=[];
  if(pre2>=arc*0.9){ raw.push(["s",pre2*0.42],["a",arc],["s",pre2*0.58],["a",arc]); }

    const s=vP(h)*r.dist, PA=pathAt(s), lat=vL(h)*4.6;

    const push=(r.dist-s)<=(raceState.geo?raceState.geo.homeM:450);

}
/* ============ コース図（ミニマップ）のデータ ============
   地図は実際のコース経路（racePath：3D表示と同一データ）から作る。
   ・コースごとの直線長・コーナー半径・回り方向（右回り／左回り）がそのまま形になる
   ・最終コーナー（最後の弧の区間）と最後の直線（弧の終わり〜ゴール）は
     経路の実区間から切り出すので、実際のコース形状と位置が一致する
   ・馬のドットは表示用の進路（visAt）と同じ位置＝画面の馬と連動する
   静的な部分（経路・区間・外接矩形）はレースごとにキャッシュする */
function raceMapData(){
  const r=raceState.race, sim=raceState.sim; if(!r||!sim) return null;
  if(!racePath||racePath.dist!==r.dist||racePath.key.split("|")[0]!==String(r.id||r.name)) buildRacePath(r);
  const P=racePath; if(!P) return null;
  let st=raceState._mapCache;
  if(!st||st.key!==P.key){
    const pts=[]; const step=Math.max(4,P.total/170);
    for(let s=0;s<=P.total;s+=step){ const A=pathAt(s); pts.push({x:A.x, z:A.z, s:s}); }
    const lastA=pathAt(P.total); if(pts[pts.length-1].s<P.total-0.01) pts.push({x:lastA.x, z:lastA.z, s:P.total});
    let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
    pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); });
    const arcs=P.segs.filter(sg=>sg.ty==="a");
    const la=arcs[arcs.length-1];
    const goalA=pathAt(r.dist);
    st={key:P.key, pts:pts, minX:minX, minZ:minZ, bw:Math.max(10,maxX-minX), bh:Math.max(10,maxZ-minZ),
      corner: la? [la.s0, la.s0+la.len] : null,
      home: la? [la.s0+la.len, r.dist] : [0, r.dist],
      goal:{x:goalA.x, z:goalA.z},
      dir:(typeof COURSE_INFO!=="undefined"&&COURSE_INFO[r.course])?COURSE_INFO[r.course].dir:""};
    raceState._mapCache=st;
  }
  const t=raceState.simT||0;
  const items=sim.all.map(h=>{
    const vv=visAt(h,t);
    const s=clamp((vv? vv.p : (h._prog||0))*r.dist, 0, P.total);
    const A=pathAt(s);
    const lat=(vv? vv.l : latAt(h, clamp(h._prog,0,1)))*4.6;
    return {h:h, x:A.x+A.px*lat, z:A.z+A.pz*lat};
  });

}
/* 枠色（JRA帽子色）：馬番と出走頭数から枠番を求めて色を返す */
const CAP_COLORS=[["#f5f5f5","#222222"],["#222222","#ffffff"],["#d42b1e","#ffffff"],["#2056ae","#ffffff"],["#f7d117","#222222"],["#009944","#ffffff"],["#f08300","#222222"],["#f19ec2","#222222"]];
function capChipColor(gate,n){
  let bracket=gate;
  if(n&&n>8){
    const base=Math.floor(n/8), rem=n%8; let acc=0; bracket=n;
    for(let b=1;b<=8;b++){ const cnt=base+((rem>0&&b>8-rem)?1:0); acc+=cnt; if(gate<=acc){ bracket=b; break; } }
  }
  const c=CAP_COLORS[clamp(bracket,1,8)-1];
  return {bg:c[0], fg:c[1]};
}
/* 隊列パネル（右上）とコースマップ（左下）の描画。2D表示では本キャンバスへ、
   3D表示では上に重ねたオーバーレイキャンバスへ描く（描き先のctxだけが違う共通処理）。
   o: {items, iMap, map, leader, remain, leadH, dist}
   items は {h, lat} を持ち、2D経路では x/y/s（半透明化の判定用）も持つ。
   3D経路では画面位置が2Dと違うため iMap=null を渡し、半透明化は行わない。
   map は raceMapData()（実際のコース経路に基づくコース図データ） */
function drawRacePanels(ctx,W,H,o){
  const items=o.items, leader=o.leader, remain=o.remain, leadH=o.leadH, dist=o.dist;
  /* 右上：帽子アイコンによる隊列表示＋残り距離。
     先頭馬の体・頭上のダイヤ・馬名ラベルがこの枠に入る時は枠ごと半透明化し、先頭馬を常に完全に見せる */
  const fpW=164, fpX=W-fpW-8, fpY=8, fpH=78;
  let fpAlpha=1;
  { const li=o.iMap?o.iMap.get(leadH):null;
    if(li){ const hx0=li.x-86*li.s, hx1=li.x+94*li.s, hy0=li.y-84*li.s-40, hy1=li.y+12*li.s;
      if(hx1>fpX-4&&hx0<fpX+fpW+4&&hy1>fpY-4&&hy0<fpY+fpH+4) fpAlpha=0.14; } }
  if(raceState.showForm){ ctx.save(); ctx.globalAlpha=fpAlpha;
  ctx.fillStyle="rgba(8,22,12,.80)"; ctx.beginPath(); ctx.roundRect(fpX,fpY,fpW,fpH,9); ctx.fill();
  ctx.font="bold 9.5px sans-serif"; ctx.fillStyle="#bfe3c8"; ctx.textAlign="left"; ctx.fillText("隊列", fpX+9, fpY+14);
  ctx.font="bold 13px sans-serif"; ctx.fillStyle="#ffe9a8"; ctx.textAlign="right";
  ctx.fillText(leader>=1?"ゴール":("残り "+remain+"m"), fpX+fpW-9, fpY+15);
  items.forEach(it=>{
    const behind=Math.max(0,(leader-it.h._prog)*dist);
    const cx2=fpX+fpW-16-Math.min(fpW-36, behind*2.0), cy2=fpY+26+((it.lat+1)/2)*(fpH-38);
    const sk=silkOf(it.h);
    ctx.fillStyle=sk.c1; ctx.beginPath(); ctx.arc(cx2,cy2,7.5,Math.PI,0); ctx.fill();
    ctx.fillRect(cx2-8.5,cy2-1,17,2.6);
    if(it.h===raceState.mine||isMine(it.h)){ ctx.strokeStyle="#ffd94d"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx2,cy2-1,10,Math.PI*0.92,Math.PI*2.08); ctx.stroke(); }
    ctx.fillStyle="#fff"; ctx.font="bold 7.5px sans-serif"; ctx.textAlign="center";
    ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=2; ctx.strokeText(String(it.h._gate),cx2,cy2-2.5); ctx.fillText(String(it.h._gate),cx2,cy2-2.5);
  });
  ctx.restore(); } // 隊列表示ここまで（半透明化の復帰）
  /* コースマップ（周回位置）：全画面サイズ共通で左下の隅に小さく置く。
     左下は先頭馬（カメラ前方＝右寄り固定）の通り道から最も遠く、下部の実況字幕帯（下64px）の
     上に収まる。さらに、後続馬が枠に差し掛かったら枠ごと半透明化して馬を隠さない。
     表示ON/OFFはレース下部の「コース図」ボタンで切り替える */
  if(raceState.showMap&&o.map){
    const mp=o.map;
    const smallScr=W<560;
    const mmW= smallScr?118:150, mmH= smallScr?66:84, mmX=8, mmY=H-64-mmH-6;
    let mmAlpha=1;
    for(const it of items){
      if(it.x==null) continue; // 3D経路では画面位置を持たないので半透明化しない
      const hx0=it.x-86*it.s, hx1=it.x+94*it.s, hy0=it.y-84*it.s-40, hy1=it.y+26*it.s;
      if(hx1>mmX-4&&hx0<mmX+mmW+4&&hy1>mmY-4&&hy0<mmY+mmH+4){ mmAlpha= it.h===leadH?0.12:Math.min(mmAlpha,0.22); }
    }
    ctx.save(); ctx.globalAlpha=mmAlpha;
    ctx.fillStyle="rgba(8,22,12,.78)"; ctx.beginPath(); ctx.roundRect(mmX,mmY,mmW,mmH,9); ctx.fill();
    /* 実際のコース経路（真上から見た x/z）を、縦横比を保って枠内へ収める。
       経路データがコースの回り方向・直線長・コーナー位置をそのまま持つため、
       右回りは右回りに、最終コーナーと最後の直線は実位置に描かれる */
    const pad=8, iw=mmW-pad*2, ih=mmH-pad*2;
    const sc=Math.min(iw/mp.bw, ih/mp.bh)||0.01;
    const ox=mmX+pad+(iw-mp.bw*sc)/2, oy=mmY+pad+(ih-mp.bh*sc)/2;
    const MX=p=>ox+(p.x-mp.minX)*sc, MY=p=>oy+(p.z-mp.minZ)*sc;
    const trace=(range,col,lw)=>{
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath();
      let started=false;
      mp.pts.forEach(p=>{ if(range&&(p.s<range[0]-0.01||p.s>range[1]+0.01))return; const mx=MX(p), my=MY(p); if(!started){ ctx.moveTo(mx,my); started=true; } else ctx.lineTo(mx,my); });

    if(mp.corner) trace(mp.corner,"#f5b90d",2.4);            // 最終コーナー（実区間）
    trace(mp.home,"#bfe3c8",2.2);                            // 最後の直線（実区間）
    const st0=mp.pts[0];
    ctx.fillStyle="#9aa5a0"; ctx.beginPath(); ctx.arc(MX(st0),MY(st0),2,0,7); ctx.fill(); // スタート
    ctx.fillStyle="#ff5a4d"; ctx.beginPath(); ctx.arc(MX(mp.goal),MY(mp.goal),3,0,7); ctx.fill(); // ゴール
    mp.items.forEach(it=>{ ctx.fillStyle= isMine(it.h)? "#ffd94d" : "#fff";
      ctx.beginPath(); ctx.arc(MX(it),MY(it), isMine(it.h)?3.2:2.2, 0, 7); ctx.fill(); });
    ctx.font="bold 9px sans-serif"; ctx.fillStyle="#bfe3c8"; ctx.textAlign="left";
    ctx.fillText("コース"+(mp.dir?"・"+mp.dir:""), mmX+9, mmY+13);
    ctx.restore();
  }
}

    if(!img||!img.complete||!img.naturalWidth) return false;
    const w=hh*img.naturalWidth/img.naturalHeight; if(!(w>0)) return false;
    const period=2*w; let start=-(((off%period)+period)%period); if(start>0)start-=period;
    let idx=Math.round((-start)/w);
    for(let x=start;x<W;x+=w,idx++){
      ctx.save();
      if(idx%2){ ctx.translate(x+w,y); ctx.scale(-1,1); ctx.drawImage(img,0,0,w,hh); }
      else ctx.drawImage(img,x,y,w,hh);
      ctx.restore();
    }
    return true;
  };
  tileImg(bgImgs.far, 0, trackTop+22, scrollPx*0.12);                     // 遠景：空とスタンドと山並み
  tileImg(bgImgs.mid, trackTop+2-H*0.335*0.46, H*0.335, scrollPx*0.45);   // 中景：白い柵と樹木（柵がトラック際の高さに合うよう配置）
  /* 内側コース（芝開催では内側にダートコースが見える） */
  ctx.fillStyle= surfDirt? "#7fae5f" : "#c9ab72"; ctx.fillRect(0,skyH,W,H*0.055);
  ctx.fillStyle="rgba(255,255,255,.10)"; ctx.fillRect(0,skyH,W,3);
  /* コーナー区間：遠景にカーブしたコースとラチを描く */
  if(seg==="c12"||seg==="c34"){
    ctx.save(); ctx.beginPath(); ctx.rect(0,skyH,W,H*0.24); ctx.clip();
    ctx.strokeStyle= surfDirt? "#b98f56" : "#8cc96a"; ctx.lineWidth=H*0.13;
    ctx.beginPath(); ctx.moveTo(-30,H*0.52); ctx.quadraticCurveTo(W*0.52,H*0.13,W+30,H*0.46); ctx.stroke();
    ctx.strokeStyle="#f2f2ea"; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(-30,H*0.455); ctx.quadraticCurveTo(W*0.52,H*0.065,W+30,H*0.395); ctx.stroke();
    ctx.strokeStyle="rgba(242,242,234,.55)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-30,H*0.575); ctx.quadraticCurveTo(W*0.52,H*0.185,W+30,H*0.515); ctx.stroke();
    ctx.restore();
  }
  /* 馬場：縞刈り／ハロー跡がカメラに同期して流れる */
  ctx.fillStyle= surfDirt? "#c8a468" : (gi>=2?"#5d8a48":"#6cab4e"); ctx.fillRect(0,trackTop,W,H-trackTop);
  const stripePx=6*pxPerM, soff=-((camLeft*pxPerM)%(stripePx*2));
  ctx.fillStyle= surfDirt? "rgba(120,84,40,.10)" : "rgba(255,255,255,.055)";
  for(let x=soff-stripePx*2;x<W+stripePx;x+=stripePx*2) ctx.fillRect(x,trackTop,stripePx,H-trackTop);
  if(surfDirt){ ctx.strokeStyle="rgba(120,84,40,.16)"; ctx.lineWidth=1.2;
    for(let y=trackTop+9;y<H;y+=11){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } }
  /* コーナー区間では、馬の走行ゾーンそのものがカーブして見えるよう、
     足元を通る幅広のカーブ帯と内外のラチを馬より先に描く（第11次）。
     従来は遠景の細いカーブだけで、しかも馬場の塗りで下半分が消えて
     いたため、馬は直線を走っているようにしか見えなかった */
  if(seg==="c12"||seg==="c34"){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,trackTop,W,H-trackTop); ctx.clip();
    ctx.strokeStyle= surfDirt? "#bd9257" : "#79b657"; ctx.lineWidth=H*0.36;
    ctx.beginPath(); ctx.moveTo(-40,H*0.62); ctx.quadraticCurveTo(W*0.50,H*0.04,W+40,H*0.57); ctx.stroke();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=5.2;
    ctx.beginPath(); ctx.moveTo(-40,H*0.445); ctx.quadraticCurveTo(W*0.50,-H*0.135,W+40,H*0.395); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=4.2;
    ctx.beginPath(); ctx.moveTo(-40,H*0.795); ctx.quadraticCurveTo(W*0.50,H*0.215,W+40,H*0.745); ctx.stroke();
    ctx.restore();
  }
  /* ラチ（柵）：横バー＋支柱を実距離同期で描く。従来は1〜3pxの細線で
     芝に埋もれて「柵がない」ように見えたため、バーを太くし、影付きで
     輪郭を立て、支柱もバーとは別に太く描く（2D柵強化） */
  const post=(yTop,yBot,col,lw)=>{ const m0=Math.floor(camLeft/25)*25;
    ctx.strokeStyle="rgba(10,30,14,.28)"; ctx.lineWidth=lw+2.2;
    ctx.beginPath(); ctx.moveTo(0,yTop+1.6); ctx.lineTo(W,yTop+1.6); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(0,yTop); ctx.lineTo(W,yTop); ctx.stroke();
    ctx.lineWidth=Math.max(2.2,lw*0.72);
    for(let m=m0;m<camLeft+visW+25;m+=25){ const x=(m-camLeft)*pxPerM; ctx.beginPath(); ctx.moveTo(x,yTop); ctx.lineTo(x,yBot); ctx.stroke(); } };
  post(trackTop+6, trackTop+22, "#ffffff", 4.6);
  post(trackTop+14, trackTop+22, "rgba(255,255,255,.78)", 3.2); // 遠ラチ2段目
  /* 距離標（残り1000/800/600/400/200m）とゴール：すべて実位置同期 */
  [[1000],[800],[600],[400],[200]].forEach(([rm])=>{
    if(rm>=r.dist)return;
    const x=(r.dist-rm-camLeft)*pxPerM; if(x<-20||x>W+20)return;
    ctx.fillStyle="#e8e8e2"; ctx.fillRect(x-1.6,trackTop+16,3.2,H*0.15);
    ctx.fillStyle="#c22f24"; ctx.beginPath(); ctx.arc(x,trackTop+13,10,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 9.5px sans-serif"; ctx.textAlign="center"; ctx.fillText(String(rm/100), x, trackTop+16.5);
  });
  const goalX=(r.dist-camLeft)*pxPerM;
  if(goalX>-30&&goalX<W+30){
    ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(goalX,trackTop+4); ctx.lineTo(goalX,H); ctx.stroke();
    ctx.fillStyle="#c22f24"; ctx.beginPath(); ctx.arc(goalX,trackTop+8,7,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(goalX,trackTop+8,2.8,0,7); ctx.fill();
    ctx.font="bold 10px sans-serif"; ctx.fillStyle="#fff"; ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=3;
    ctx.fillText("GOAL", goalX, trackTop-3); ctx.shadowBlur=0;
  }
  /* ===== 馬（中継カメラ・横から） ===== */
  const items=sim.all.map(h=>{
    const lat=vL2(h), d=(lat+1)/2; // 0=奥（内） 1=手前（外）
    const vm=vP2(h)*r.dist;
    /* コーナーの奥行き：各馬が今いる区間で画面上の高さと大きさを変える。
       ホーム直線（手前・大きい）→第1・2コーナーで奥へ回り込み→向正面
       （奥・小さい）→第3・4コーナーで手前へ戻ってくる。これにより2D表示でも
       コーナーを回る動きが位置と縮尺の変化として見える */
    const segSh=(((startS+vm/mPerPx)%C.total)+C.total)%C.total;
    let depth0=0;
    if(segSh<C.straightPx) depth0=0;
    else if(segSh<C.straightPx+C.cornerPx) depth0=(segSh-C.straightPx)/C.cornerPx;
    else if(segSh<2*C.straightPx+C.cornerPx) depth0=1;
    else depth0=1-(segSh-(2*C.straightPx+C.cornerPx))/C.cornerPx;
    const yHome=H*0.455 + d*H*0.335, yBack=H*(0.375 + d*0.055);
    const y=yHome*(1-depth0)+yBack*depth0;
    const s=pxPerM*0.0878*(0.78+0.45*d)*((1-depth0)+depth0*0.62);
    return {h, lat, x:(vm-camLeft)*pxPerM, y, s, depth0, vm};
  });
  const iMap=new Map(items.map(it=>[it.h,it]));
  if(!raceState.ord||raceState.ord.length!==sim.all.length) raceState.ord=[...sim.all].sort((a,b)=>iMap.get(a).y-iMap.get(b).y);
  raceState.ord.sort((a,b)=>Math.round(iMap.get(a).y/7)-Math.round(iMap.get(b).y/7)); // 安定ソート（帯量子化）
  raceState._lblList=[];
  raceState.ord.forEach(h=>{
    const it=iMap.get(h); if(it.x<-300||it.x>W+300)return;
    const ph=(it.vm!=null?it.vm:posM(h))/7.0*8 + h._phase*1.27324;
    const frame=((Math.floor(ph)%8)+8)%8;
    const frac=ph-Math.floor(ph);
    const push=(1-h._prog)*r.dist<=homeM;
    drawHorseSprite(ctx,it.x,it.y,it.s,h,frame,false,surfDirt,push,frac);
    raceState._lblList.push(it);
  });
  /* 土埃・芝片パーティクル（蹄元から後方へ。ダートは土色、芝は緑の破片） */
  {
    const nowP=performance.now();
    const dtP=Math.min(0.05,(nowP-(raceState._pnow||nowP))/1000); raceState._pnow=nowP;
    if(!raceState.parts) raceState.parts=[];
    if(raceState.phase==="run"){
      items.forEach(it=>{
        if(it.x<-80||it.x>W+80) return;
        if(Math.random()<0.6) raceState.parts.push({x:it.x-36*it.s+rnd(-9,9), y:it.y+11*it.s, vx:rnd(-110,-45)-pxPerM*7, vy:rnd(-52,-10), t:0, life:rnd(.35,.8), sz:rnd(1.6,3.8), rot:rnd(0,6.28), vr:rnd(-4,4)});
      });
      if(raceState.parts.length>260) raceState.parts.splice(0, raceState.parts.length-260);
    }
    raceState.parts=raceState.parts.filter(p=>{
      p.t+=dtP; if(p.t>=p.life) return false;
      p.x+=p.vx*dtP; p.y+=p.vy*dtP; p.vy+=170*dtP; p.rot+=p.vr*dtP;
      const a=0.55*(1-p.t/p.life);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle= surfDirt? `rgba(168,124,66,${a})` : `rgba(96,138,62,${a})`;
      ctx.fillRect(-p.sz,-p.sz*0.38,p.sz*2,p.sz*0.76);
      ctx.restore(); return true;
    });
  }
  post(H*0.842, H*0.905, "rgba(255,255,255,.92)", 5); // 手前ラチ上段（馬より手前に描く）
  post(H*0.878, H*0.905, "#ffffff", 6.5); // 手前ラチ下段（馬より手前に描く）
  /* 近景：芝の質感タイル（最も速く流れる前景の帯） */
  { const gh=H*0.085;
    ctx.save();
    if(surfDirt){ ctx.globalAlpha=0.55; try{ ctx.filter="sepia(.65) saturate(.75) brightness(.94)"; }catch(e){} }
    tileImg(bgImgs.grass, H-gh, gh, scrollPx*1.5);
    ctx.restore();
  }
  /* ===== 中継HUD ===== */
  let zone;
  if(leader>=1) zone="ゴールイン！";
  else if(remL<=homeM) zone="最後の直線";
  else if(seg==="c34") zone= remL-homeM>c34M/2 ? "第3コーナー" : "第4コーナー";
  else if(seg==="back") zone="向正面";
  else if(seg==="c12") zone="第1・2コーナー";
  else zone= leader<0.05 ? "スタート" : "直線";
  const remain=Math.max(0,Math.round(remL/50)*50);

  /* ===== 3D表示（走行中・Three.jsが使える場合）。情報バーは2D版と共通仕様 =====
     3D側で例外が出てもレース自体は止めない：2D表示へ切り替えて描画を続ける */
  if(ensureGL()){
    try{
      $("#racegl").style.display="block"; const cv2=$("#racecv"); if(cv2) cv2.style.visibility="hidden";
      render3DFrame(el, cam);
      const srt3=[...sim.all].sort((a,b)=>b._prog-a._prog);
      const pb3=$("#posbar");
      if(pb3){ const str=srt3.slice(0,6).map((h,i)=>{ const mc=capChipColor(h._gate, sim.all.length);
        return `<span class="poschip"><span class="gnum" style="background:${mc.bg};color:${mc.fg}">${h._gate}</span> ${i+1}位 ${esc(h.name)}</span>`; }).join("");
        const _nv3=remain+"m|"+str; if(pb3._v!==_nv3){ pb3._v=_nv3; pb3.innerHTML=`<span class="poschip" style="background:#ffc800;color:#3c3c3c">残り ${remain}m</span>`+str; } }
      const rh3=$("#racehud");
      if(rh3){ const lines=[];
        const mineList = raceState.mine? [raceState.mine] : sim.all.filter(h=>!h.rival&&S.horses.some(x=>x.id===h.id));
        mineList.forEach(h=>{ const pos=srt3.indexOf(h)+1; if(pos>0) lines.push(`<b>${esc(h.name)}</b> ${pos}番手`); });
        /* 3D表示でも「いまどこを走っているか」（区間名＋残り距離）を常時出す。
           以前は2D表示でしか区間名が出ず、3Dでは現在地が分からなかった */
        const zoneTxt= leader>=1? "ゴールイン！" : zone+"／残り "+remain+"m";
        const posTxt= lines.length? lines.join(" ／ ") : (srt3[0]? "先頭 "+esc(srt3[0].name) : "");
        const _nv=zoneTxt+"|"+posTxt; if(rh3._v!==_nv){ rh3._v=_nv; rh3.innerHTML=`<span class="rh-rem">${zoneTxt}</span>`+(posTxt?`<span class="rh-pos">${posTxt}</span>`:""); } }
      /* 隊列パネル・コースマップは2Dキャンバス専用だったため3Dでは出なかった。
         オーバーレイキャンバスへ同じ描画を重ねて、3Dでも常時表示する */
      drawGlPanels(W,H,sim,leader,remain,leadH,r.dist);
      return;
    }catch(e){
      GLbroken=true;
      const gErr=$("#racegl"); if(gErr) gErr.style.display="none";
      const cErr=$("#racecv"); if(cErr) cErr.style.visibility="visible";
      const ovE=$("#raceov"); if(ovE){ const ocx=ovE.getContext("2d"); if(ocx) ocx.clearRect(0,0,ovE.width,ovE.height); } // 2Dへ切替えたら重ね描画は消す（2D側が本体に描く）
      /* このフレームは下の2D描画にそのままフォールスルーする */
    }
  }
  ctx.font="bold 12px sans-serif"; ctx.textAlign="left";
  const dl= leader>=1? "ゴールイン！" : zone+"／残り "+remain+"m";
  const dtw=ctx.measureText(dl).width;
  ctx.fillStyle="rgba(10,28,16,.82)"; ctx.beginPath(); ctx.roundRect(6,6,dtw+16,21,8); ctx.fill();
  ctx.fillStyle="#ffe9a8"; ctx.fillText(dl, 14, 21);
  /* 傾向＋ペース表示（1000m通過） */
  if(raceState.trendInfo){
    const tl2=`${raceState.trendInfo}／${raceState.paceInfo||""} 1000m ${raceState.pace1000||"-"}`;
    ctx.font="bold 11px sans-serif"; const tw2=ctx.measureText(tl2).width;
    ctx.fillStyle="rgba(10,28,16,.78)"; ctx.beginPath(); ctx.roundRect(6,30,tw2+14,19,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillText(tl2, 13, 43);
  }
  drawRacePanels(ctx,W,H,{items, iMap, map:raceMapData(), leader, remain, leadH, dist:r.dist});
  /* ===== マーカー＆馬名ラベル ===== */
  const srt=[...sim.all].sort((a,b)=>b._prog-a._prog);
  const diamond=(x,y,sz,col)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
    ctx.fillStyle=col; ctx.fillRect(-sz/2,-sz/2,sz,sz); ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=1.4; ctx.strokeRect(-sz/2,-sz/2,sz,sz); ctx.restore(); };
  const bobM=Math.sin(el*2.4)*1.6; // マーカーだけの緩やかな浮遊（馬本体は動かさない）
  raceState._lblList.forEach(it=>{
    const topY=it.y-84*it.s;
    if(it.h===leadH && !isMine(it.h)) diamond(it.x, topY-16+bobM, 13, "#ef7d1a");
    if(isMine(it.h) && S.markOn!==false){ const mk=it.h.mark||{shape:"diamond",color:"#ffc800"}; drawMark(ctx, it.x, topY-18+bobM, 16, mk); }
  });
  const lblSet=new Set(srt.slice(0,6)); (raceState.owns||[]).forEach(h=>lblSet.add(h)); if(raceState.mine)lblSet.add(raceState.mine);
  ctx.font="bold 10px sans-serif"; ctx.textAlign="center";
  const drawLabel=it=>{
    if(!lblSet.has(it.h))return;
    const mine=isMine(it.h);
    const txt=it.h._gate+" "+it.h.name+(mine?"（自厩舎）":"");
    const wdt=ctx.measureText(txt).width+12;
    const lx=Math.round(it.x*2)/2, ly=Math.round((it.y-84*it.s-30)*2)/2;
    ctx.fillStyle= mine? "rgba(146,106,10,.92)" : "rgba(8,24,12,.78)";
    ctx.beginPath(); ctx.roundRect(lx-wdt/2, ly-9, wdt, 15, 7.5); ctx.fill();
    ctx.fillStyle= mine? "#fff3c4" : "#ffffff"; ctx.fillText(txt, lx, ly+2.5);
  };
  raceState._lblList.forEach(it=>{ if(!isMine(it.h))drawLabel(it); });
  raceState._lblList.forEach(it=>{ if(isMine(it.h))drawLabel(it); }); // 自厩舎のラベルは最後＝最前面
  /* 下部：実況字幕 */
  drawSubtitle(ctx,W,H);
  /* 順位バー（DOM）：並びが変わった時だけ書き換え */
  const pb=$("#posbar");
  if(pb){ const str=srt.slice(0,6).map((h,i)=>`<span class="p ${isMine(h)?"me":""}">${i+1} ${h._gate}.${esc(h.name)}</span>`).join("");
    if(str!==raceState._pbStr){ raceState._pbStr=str; pb.innerHTML=str; } }
  /* 大きな表示：残り距離と自馬の位置だけを常時出す */
  const rh=$("#racehud");
  if(rh){ const ownPos=(raceState.owns||[]).map(h=>({h, i:srt.indexOf(h)})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i);
    const hs= leader>=1? "ゴールイン！" : "残り "+remain+"m";
    const ps= ownPos.length? "自馬 "+ownPos.map(x=>`${x.h._gate}番 ${x.i+1}番手`).join("／") : (srt[0]? "先頭 "+srt[0].name : "");
    const hstr=hs+"|"+ps;
    if(hstr!==raceState._hudStr){ raceState._hudStr=hstr; rh.innerHTML=`<span class="rh-rem">${hs}</span>`+(ps?`<span class="rh-pos">${ps}</span>`:""); } }
}

/* ============ 馬スプライト（描き済みコマ送り方式） ============
   震え対策の核：レース中に馬のパーツを計算して描くことは一切しない。
   ギャロップ8コマ分の「完成した馬絵」を、レース開始前にオフスクリーンCanvasへ
   3倍解像度で描き上げてキャッシュし、再生中は走行距離に応じてコマを選んで
   drawImage で貼るだけにする。上下動（ボブ）は各コマの絵に内包済みで、
   再生側で sin 波の追加変形・回転・拡大縮小は一切行わない。 */
const SPR_SS=3;                 // スプライトのスーパーサンプル倍率
const SPR_AX=-80, SPR_AY=-80;   // スプライト原点（馬の接地アンカー）から見た左上（単位座標）
const SPR_W=168, SPR_H=104;     // スプライトが表す単位座標の広さ
/* ギャロップ8コマのポーズ定義（静止画としての完成ポーズ。再生側では一切補間しない）
   legs: [前脚・奥, 前脚・手前, 後脚・奥, 後脚・手前]、各 [上脚の角度°, 蹄までの絶対角度°]（下向き=0、前=+）
   bob: 体全体の上下（絵に焼き込み済み）、neck: 首の伸び、tail: 尾の流れ量、dust: 蹴り上げを描くコマ */
const GALLOP=[
 {bob:-3.5, neck:3.0, tail:0.6, dust:false, legs:[[-32, 58],[-24, 66],[ 30,-52],[ 38,-44]]}, // 0 収縮・空中（脚をたたむ）
 {bob:-1.5, neck:2.0, tail:0.8, dust:false, legs:[[ 30, 26],[ 38, 34],[-52,-16],[-44, -8]]}, // 1 前脚リーチ／後脚は蹴り終わり
 {bob: 0.8, neck:1.0, tail:1.0, dust:true , legs:[[  2, -4],[ 10,  4],[ 16,-30],[ 24,-22]]}, // 2 前脚接地（体重が乗る）
 {bob: 0.0, neck:1.0, tail:1.1, dust:false, legs:[[-30,-22],[-22,-14],[ 44,-58],[ 52,-50]]}, // 3 前脚は離れ、後脚が前に振り込む
 {bob: 0.8, neck:0.5, tail:1.0, dust:true , legs:[[-44, 20],[-36, 30],[  4, -2],[ 12,  6]]}, // 4 後脚接地（体重が乗る）
 {bob:-1.0, neck:1.0, tail:0.9, dust:false, legs:[[-18, 44],[-10, 54],[-40,-30],[-32,-22]]}, // 5 後脚の蹴り出し／前脚は折って前へ
 {bob:-3.0, neck:3.5, tail:0.5, dust:false, legs:[[ 42, 40],[ 48, 46],[-56,-48],[-48,-40]]}, // 6 伸展・空中（全身が伸び切る）
 {bob:-2.0, neck:2.0, tail:0.7, dust:false, legs:[[  6, 52],[ 14, 60],[ -8,-56],[  0,-48]]}, // 7 着地へ向けて脚を畳み始める
];
/* ===== CGスプライト（画像生成シートをスライスした実素材） =====
   毛色ごとに生成した8コマのギャロップシート（同一馬・同一絵柄・脚位置のみ変化）を
   セル単位に整列済みの画像から切り出し、勝負服の色/模様とゼッケンを重ねて使う。
   生成シートで絵柄が崩れた芦毛は、鹿毛シートと同一個体のまま色調変換したものを採用。 */
const SHEET_OF_COAT=["bay","darkbay","chestnut","darkbay","grey","chestnut","grey"];
const SHEET_FILTER=["none","none","none","brightness(.48) saturate(.6)","none","brightness(.64) saturate(1.06)","brightness(1.17) saturate(.5)"];
const sheetImgs={};
[["bay","assets/gallop-bay.webp"],["darkbay","assets/gallop-darkbay.webp"],["chestnut","assets/gallop-chestnut.webp"],["grey","assets/gallop-grey.webp"]].forEach(([k,src])=>{ const im=new Image(); im.src=src; sheetImgs[k]=im; });
const bgImgs={};
[["far","assets/bg-far.webp"],["mid","assets/bg-mid.webp"],["grass","assets/bg-grass.webp"]].forEach(([k,src])=>{ const im=new Image(); im.src=src; bgImgs[k]=im; });
function hexRgb(hex){ const n=parseInt((hex||"#000000").slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function composeSheetSprite(h,frame){
  const ci=clamp(h.coat||0,0,6), img=sheetImgs[SHEET_OF_COAT[ci]];
  if(!img||!img.complete||!img.naturalWidth) return null;
  const W3=SPR_W*SPR_SS, H3=SPR_H*SPR_SS;
  const cv=document.createElement("canvas"); cv.width=W3; cv.height=H3;
  const ctx=cv.getContext("2d");
  try{ ctx.filter=SHEET_FILTER[ci]; }catch(e){}
  ctx.drawImage(img, frame*W3, 0, W3, H3, 0, 0, W3, H3);
  try{ ctx.filter="none"; }catch(e){}
  /* 勝負服：騎手ゾーンの無彩色（白い勝負服・帽子）を、その馬の勝負服色＋模様に置換する */
  const silk=silkOf(h), c1=hexRgb(silk.c1), c2=hexRgb(silk.c2);
  const ZX=100, ZY=38, ZW=158, ZH=156;
  try{
    const id=ctx.getImageData(ZX,ZY,ZW,ZH), d=id.data;
    for(let py=0;py<ZH;py++) for(let px2=0;px2<ZW;px2++){
      const i=(py*ZW+px2)*4; if(d[i+3]<120) continue;
      const r=d[i],g=d[i+1],b=d[i+2], mn=Math.min(r,g,b), mx=Math.max(r,g,b);
      if(mn<158||mx-mn>30) continue; // 無彩色の明部＝白勝負服だけを対象にする
      const gx=ZX+px2, gy=ZY+py;
      let base=c1;
      if(silk.pat==="stripe"&&(Math.floor(gx/15)%2===1)) base=c2;
      else if(silk.pat==="cross"&&((gx%36>=16&&gx%36<=20)||(gy%36>=16&&gy%36<=20))) base=c2;
      else if(silk.pat==="dot"){ const dx=(gx%30)-15, dy=(gy%30)-15; if(dx*dx+dy*dy<38) base=c2; }
      else if(silk.pat==="check"&&((Math.floor(gx/14)+Math.floor(gy/14))%2===1)) base=c2;
      else if(silk.pat==="saw"&&(((gx+Math.abs((gy%24)-12))%30)<14)) base=c2;
      const shade=0.30+0.80*(mn/255);
      d[i]=Math.min(255,base[0]*shade); d[i+1]=Math.min(255,base[1]*shade); d[i+2]=Math.min(255,base[2]*shade);
    }
    ctx.putImageData(id,ZX,ZY);
  }catch(e){}
  /* ゼッケン（馬番）：従来どおりスプライトに焼き込んで一体で動かす */
  ctx.fillStyle="#f6f3ea"; ctx.beginPath(); ctx.roundRect(158,182,78,50,7); ctx.fill();
  ctx.fillStyle=silk.c1; ctx.fillRect(158,182,78,11);
  ctx.strokeStyle="#a89f88"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.roundRect(158,182,78,50,7); ctx.stroke();
  ctx.fillStyle="#17251b"; ctx.font="bold 27px sans-serif"; ctx.textAlign="center";
  ctx.fillText(String(h._gate),197,222);
  return cv;
}
const spriteCache=new Map();
function silkOf(h){ return h.rival? h.silk : SILKS[S.silk]; }
function spriteKey(h,frame,push,dirt){
  const sk=silkOf(h);
  return [h.coat, sk.c1, sk.c2, sk.pat, h._gate, frame, push?1:0, dirt?1:0].join("|");
}
function getHorseSprite(h,frame,push,dirt){
  const key=spriteKey(h,frame,push,dirt);
  let cv=spriteCache.get(key);
  if(!cv){ cv=composeSheetSprite(h,frame)||renderHorseSprite(h,frame,push,dirt); spriteCache.set(key,cv); }
  return cv;
}
function preRenderRaceSprites(all,dirt){
  all.forEach(h=>{ for(let f=0;f<8;f++){ getHorseSprite(h,f,false,dirt); getHorseSprite(h,f,true,dirt); } });
}
function renderHorseSprite(h,frame,push,dirt){
  const c=COATS[h.coat], silk=silkOf(h), P=GALLOP[frame];
  const cv=document.createElement("canvas");
  cv.width=SPR_W*SPR_SS; cv.height=SPR_H*SPR_SS;
  const ctx=cv.getContext("2d");
  ctx.scale(SPR_SS,SPR_SS); ctx.translate(-SPR_AX,-SPR_AY);
  ctx.lineCap="round"; ctx.lineJoin="round";
  /* 蹴り上げ（接地コマのみ、控えめに絵へ焼き込む） */
  if(P.dust){
    ctx.fillStyle= dirt? "rgba(198,160,102,.20)" : "rgba(110,130,70,.16)";
    ctx.beginPath(); ctx.ellipse(-48,17,10,3.0,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-36,18.5,6,2.0,0,0,7); ctx.fill();
    ctx.fillStyle= dirt? "rgba(160,120,64,.25)" : "rgba(90,110,58,.20)";
    ctx.beginPath(); ctx.ellipse(-54,15,4.5,1.8,0,0,7); ctx.fill();
  }
  ctx.save(); ctx.translate(0,P.bob); // ボブはこのコマの絵の一部（再生側では動かさない）
  /* 尾：流れる一枚の形状として描く */
  const tl=P.tail;
  ctx.fillStyle=c.mane;
  ctx.beginPath();
  ctx.moveTo(-40,-30);
  ctx.quadraticCurveTo(-58,-27-tl*2, -68,-16-tl*3);
  ctx.quadraticCurveTo(-70,-8-tl*2, -62,-2-tl);
  ctx.quadraticCurveTo(-56,-12, -47,-14);
  ctx.quadraticCurveTo(-40,-18, -40,-30); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(-46,-26); ctx.quadraticCurveTo(-56,-20-tl*2,-60,-10-tl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-43,-21); ctx.quadraticCurveTo(-52,-16-tl,-55,-7); ctx.stroke();
  /* 脚：ポーズ表の角度から膝・蹄を置く（この描き上げ時のみ計算し、絵として固定する） */
  const leg=(hipX,hipY,ang,col,w)=>{
    const a1=ang[0]*Math.PI/180, aT=ang[1]*Math.PI/180;
    const kx=hipX+Math.sin(a1)*16, ky=hipY+Math.cos(a1)*16;
    const hx=kx+Math.sin(aT)*17, hy=ky+Math.cos(aT)*17;
    ctx.strokeStyle=col; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(hipX,hipY); ctx.lineTo(kx,ky); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.14)"; ctx.lineWidth=w*0.38;
    ctx.beginPath(); ctx.moveTo(hipX,hipY-1); ctx.lineTo(kx,ky-1); ctx.stroke();
    ctx.fillStyle="#221812"; // 蹄
    ctx.beginPath(); ctx.ellipse(hx+1.5,hy+0.5,4.2,2.4,-0.15,0,7); ctx.fill();
  };
  leg(-30,-13,P.legs[2],c.dark,5.0);  // 後脚・奥
  leg( 30,-13,P.legs[0],c.dark,5.0);  // 前脚・奥
  /* 胴体：背は明るく腹は暗い3段グラデーション＋光の帯 */
  const bg=ctx.createLinearGradient(0,-42,0,-4);
  bg.addColorStop(0,c.body); bg.addColorStop(0.34,c.body); bg.addColorStop(0.72,c.dark); bg.addColorStop(1,c.dark);
  const bgHi=ctx.createLinearGradient(0,-42,0,-26);
  bgHi.addColorStop(0,"rgba(255,255,255,.34)"); bgHi.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(-44,-24); ctx.quadraticCurveTo(-46,-36,-30,-37); ctx.quadraticCurveTo(0,-41,30,-37);
  ctx.quadraticCurveTo(45,-35,44,-24); ctx.quadraticCurveTo(43,-12,28,-10); ctx.quadraticCurveTo(0,-7,-28,-10);
  ctx.quadraticCurveTo(-43,-12,-44,-24); ctx.fill();
  ctx.fillStyle=bgHi; // 背のハイライト帯
  ctx.beginPath();
  ctx.moveTo(-44,-24); ctx.quadraticCurveTo(-46,-36,-30,-37); ctx.quadraticCurveTo(0,-41,30,-37);
  ctx.quadraticCurveTo(45,-35,44,-24); ctx.quadraticCurveTo(20,-30,-20,-29.5);
  ctx.quadraticCurveTo(-40,-28.5,-44,-24); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.16)"; // 腹側の陰
  ctx.beginPath();
  ctx.moveTo(-42,-16); ctx.quadraticCurveTo(0,-11,42,-16); ctx.quadraticCurveTo(43,-12,28,-10); ctx.quadraticCurveTo(0,-7,-28,-10);
  ctx.quadraticCurveTo(-41,-12,-42,-16); ctx.fill();
  /* 筋肉のラインと陰影 */
  ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(28,-34); ctx.quadraticCurveTo(36,-24,30,-13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,-35); ctx.quadraticCurveTo(-36,-25,-31,-13); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(-30,-33.5); ctx.quadraticCurveTo(0,-38.5,30,-33.5); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.10)"; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(14,-36); ctx.quadraticCurveTo(13,-24,15,-13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,-36.5); ctx.quadraticCurveTo(-15,-24,-13,-12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(34,-16); ctx.quadraticCurveTo(24,-11,12,-10.5); ctx.stroke(); // 肩の筋肉
  ctx.beginPath(); ctx.moveTo(-36,-17); ctx.quadraticCurveTo(-27,-11,-16,-10.5); ctx.stroke(); // 臀部の筋肉
  leg(-32,-12,P.legs[3],c.body,5.6);  // 後脚・手前
  leg( 32,-12,P.legs[1],c.body,5.6);  // 前脚・手前
  /* 首と頭 */
  const st=P.neck;
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.moveTo(34,-34); ctx.quadraticCurveTo(48,-44,57+st,-41); ctx.quadraticCurveTo(63+st,-39,61+st,-33);
  ctx.quadraticCurveTo(52+st,-25,42,-21); ctx.quadraticCurveTo(35,-26,34,-34); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.15)"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(40,-23); ctx.quadraticCurveTo(50,-27,58+st,-32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(55+st,-42); ctx.lineTo(59+st,-48.5); ctx.lineTo(62+st,-41); ctx.closePath(); ctx.fillStyle=c.dark; ctx.fill();
  ctx.fillStyle="#14100c"; ctx.beginPath(); ctx.arc(57+st,-36,1.7,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(57.6+st,-36.6,0.6,0,7); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(61.5+st,-32.5,1.5,0,7); ctx.fill();
  /* 顔の白斑（流星）：馬ごとに固定 */
  const sprSeed=Math.abs((h.id||0)*13+((h.name||"").charCodeAt(0)||0));
  if(sprSeed%4===1||sprSeed%4===3){ ctx.fillStyle="rgba(255,252,244,.92)"; ctx.beginPath(); ctx.moveTo(56+st,-41); ctx.quadraticCurveTo(59+st,-40,58.5+st,-35); ctx.quadraticCurveTo(57+st,-38,56+st,-41); ctx.fill(); }
  if(sprSeed%4===3){ ctx.fillStyle="rgba(255,252,244,.85)"; ctx.beginPath(); ctx.ellipse(61+st,-31.5,1.7,1.1,0.4,0,7); ctx.fill(); }
  /* たてがみ：首に沿う一枚の流れとして描く */
  ctx.fillStyle=c.mane;
  ctx.beginPath();
  ctx.moveTo(33,-37);
  ctx.quadraticCurveTo(40,-46,50+st,-45);
  ctx.quadraticCurveTo(54+st,-44.6,55+st,-42);
  ctx.quadraticCurveTo(47+st,-41,42,-36);
  ctx.quadraticCurveTo(37,-32,34,-31);
  ctx.quadraticCurveTo(32,-34,33,-37); ctx.fill();
  /* ゼッケン（馬番は絵に焼き込み＝常にスプライトと一体で動く） */
  ctx.fillStyle="#f6f3ea"; ctx.fillRect(-14,-33,27,19);
  ctx.fillStyle=silk.c1; ctx.fillRect(-14,-33,27,3.6);
  ctx.strokeStyle="#a89f88"; ctx.lineWidth=1; ctx.strokeRect(-14,-33,27,19);
  ctx.fillStyle="#17251b"; ctx.font="bold 14px sans-serif"; ctx.textAlign="center";
  ctx.fillText(String(h._gate),0.5,-17.5);
  /* 鞍 */
  ctx.fillStyle="#5a3d22"; ctx.fillRect(-11,-35.5,21,3); ctx.fillRect(9,-34,3.4,6);
  /* 騎手：通常は追い込み姿勢、直線用スプライト（push）では前傾を深くしムチを構える */
  ctx.save(); ctx.translate(0,push?-1.2:0); ctx.rotate(push?0.05:0);
  ctx.strokeStyle="#31435c"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-2,-30); ctx.lineTo(9,-19); ctx.stroke();
  ctx.fillStyle="#e8e4da"; ctx.fillRect(6,-21,7,4); // ブーツ
  ctx.fillStyle=silk.c1;
  ctx.beginPath();
  if(push){ ctx.moveTo(-10,-31); ctx.quadraticCurveTo(-13,-47,-3,-51); ctx.quadraticCurveTo(7,-52,11,-45); ctx.lineTo(7,-30); }
  else    { ctx.moveTo(-10,-31); ctx.quadraticCurveTo(-12,-48,-2,-51); ctx.quadraticCurveTo(8,-52,10,-44); ctx.lineTo(6,-30); }
  ctx.closePath(); ctx.fill();
  if(silk.pat==="stripe"){ctx.fillStyle=silk.c2; ctx.fillRect(-4,-51,3.4,20); ctx.fillRect(3,-51,3.4,20);}
  if(silk.pat==="cross"){ctx.fillStyle=silk.c2; ctx.fillRect(-1.6,-51,3.4,20); ctx.fillRect(-9,-43,17,3.4);}
  if(silk.pat==="dot"){ctx.fillStyle=silk.c2; ctx.beginPath(); ctx.arc(-4,-45,2.2,0,7); ctx.arc(4,-37,2.2,0,7); ctx.fill();}
  if(silk.pat==="check"){ctx.fillStyle=silk.c2; ctx.fillRect(-8,-51,5,5); ctx.fillRect(1,-46,5,5); ctx.fillRect(-8,-41,5,5);}
  if(silk.pat==="saw"){ctx.fillStyle=silk.c2; ctx.beginPath(); ctx.moveTo(-11,-31); ctx.lineTo(-6,-38); ctx.lineTo(-1,-31); ctx.lineTo(4,-38); ctx.lineTo(8,-31); ctx.closePath(); ctx.fill();}
  /* 勝負服の陰影：下半分に薄い影、上端に光 */
  ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.moveTo(-11,-33); ctx.lineTo(9,-33); ctx.lineTo(7,-30); ctx.lineTo(-10,-31); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-9,-49); ctx.quadraticCurveTo(0,-52,8,-46); ctx.stroke();
  /* 腕と手綱 */
  ctx.strokeStyle=silk.c1; ctx.lineWidth=4.4;
  ctx.beginPath(); ctx.moveTo(4,-46); ctx.quadraticCurveTo(16,-42,30,-35); ctx.stroke();
  ctx.strokeStyle="rgba(40,26,14,.8)"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(30,-35); ctx.lineTo(56+st,-34); ctx.stroke();
  if(push){ /* ムチ：直線では構えた姿勢で固定 */
    ctx.strokeStyle="#3a2c1c"; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(2,-47); ctx.lineTo(-9,-52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9,-52); ctx.lineTo(-13,-49); ctx.stroke();
  }
  /* 頭と帽子 */
  ctx.fillStyle="#f0c8a0"; ctx.beginPath(); ctx.arc(0,-55,4.8,0,7); ctx.fill();
  ctx.fillStyle=silk.c1; ctx.beginPath(); ctx.arc(0,-56.5,5,Math.PI,0); ctx.fill(); ctx.fillRect(-5.4,-57.5,11.4,2.2);
  ctx.fillStyle=silk.c2; ctx.fillRect(-5.4,-53.6,11.4,1.4);
  ctx.restore(); // 騎手
  ctx.restore(); // ボブ

}
/* 再生側の描画：柔らかい影（接地アンカーに固定）＋スプライトを貼るだけ。
   コマ間はクロスフェードで補間し、上下動はスプライト内の動きだけに任せる（追加の sin 変形は一切なし） */
function drawHorseSprite(ctx,x,y,s,h,frame,flip,dirt,push,frac){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="rgba(15,40,15,.15)";
  ctx.beginPath(); ctx.ellipse(2*s,12*s,60*s,7*s,0,0,7); ctx.fill();
  ctx.fillStyle="rgba(15,40,15,.22)";
  ctx.beginPath(); ctx.ellipse(2*s,12*s,45*s,4.8*s,0,0,7); ctx.fill();
  ctx.scale(flip?-s:s, s);
  ctx.drawImage(getHorseSprite(h,frame,push,dirt), SPR_AX, SPR_AY, SPR_W, SPR_H);
  if(frac&&frac>0.04){
    ctx.globalAlpha=frac;
    ctx.drawImage(getHorseSprite(h,(frame+1)%8,push,dirt), SPR_AX, SPR_AY, SPR_W, SPR_H);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

let lastComm="";
function updateCommentary(simT){
  const sim=raceState.sim, r=raceState.race; if(!sim)return;
  const srt=[...sim.all].sort((a,b)=>b._prog-a._prog);
  const lead=srt[0], prog=lead._prog; let msg="";
  const rem=(1-prog)*r.dist; // 先頭の残り距離(m)。区間判定はコース形状と一致させる
  const geo=raceState.geo||{homeM:450, c34M:280};
  const mine=raceState.mine;
  const myPos=mine? srt.indexOf(mine)+1 : 0;
  const closer=[...sim.all].filter(h=>tacOf(h).pos<=0.36).sort((a,b)=>b._prog-a._prog)[0];
  if(simT<0.4) msg="スタート！ "+lead.name+"（作戦："+tacOf(lead).n+"）が先頭へ。"+(closer&&closer!==lead?closer.name+"は後方で脚を溜める。":"");
  else if(prog>=1) msg="ゴールイン！ 勝ったのは "+sim.sorted[0].name+"！";
  else if(rem<=100) msg="残り100m！ "+lead.name+"と"+(srt[1]?srt[1].name:"")+"の叩き合い！"+(closer&&closer!==lead&&closer!==srt[1]?" "+closer.name+"も猛追！":"");
  else if(rem<=geo.homeM){ // 最後の直線：ここが勝負の中心
    if(rem>geo.homeM*0.55) msg="直線向いて！ "+lead.name+"が先頭で粘る。"+(closer&&closer!==lead?"外から"+closer.name+"が伸びてくる！":"")+(mine&&myPos<=3?` ${mine.name}も前を追う！`:"");
    else msg="直線の攻防！ "+lead.name+"が粘る。"+(closer&&closer!==lead?closer.name+"が外から迫る！":"")+(srt[1]&&srt[1]!==closer?" "+srt[1].name+"も食い下がる！":"");
  }
  else if(rem<=geo.homeM+geo.c34M){ const c4=rem<=geo.homeM+geo.c34M/2;
    msg=(c4?"最終コーナー！ ":"第3コーナー。")+"先頭は"+lead.name+"。"+(closer&&closer!==lead?closer.name+"が外を回って進出！":"");
  }
  else if(prog<0.4) msg=raceState.paceInfo+"。"+lead.name+"がハナ、2番手"+(srt[1]?srt[1].name:"")+"。"+(mine?`自厩舎${mine.name}は${myPos}番手（作戦：${tacOf(mine).n}）。`:"");
  else msg="向正面。"+lead.name+"先頭、"+(srt[1]?srt[1].name:"")+"が追走。"+(closer?" "+closer.name+"は後方で脚を溜めている。":"");
  if(msg!==lastComm){ lastComm=msg; raceState.subtitle=msg; raceState.subName=lead.name; const c=$("#commentary"); if(c)c.textContent="🎙 "+msg; }
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec-m*60;
  return m+":"+s.toFixed(1).padStart(4,"0");
}
function marginLabel(len){ // len: 馬身換算の着差（アニメーション上の実測距離から算出済み）
  if(len===undefined||len===null) return "―";
  if(len<0.08) return "ハナ差"; if(len<0.18) return "アタマ差"; if(len<0.35) return "クビ差";
  if(len<0.62) return "1/2馬身"; if(len<0.9) return "3/4馬身";
  if(len>=10) return "大差";
  const v=Math.round(len*2)/2; return (v>=4? Math.round(len) : v)+"馬身";
}
function betHit(bet, top){ // top: 着順の馬番配列
  const p=bet.picks;
  switch(bet.type){
    case "tan": return p[0]===top[0];
    case "fuku": return top.slice(0,3).includes(p[0]);
    case "umaren": return p.includes(top[0])&&p.includes(top[1]);

      ${ownResults.length? ownResults.map(o=>`<div class="mt"><b>${esc(o.h.name)}</b><dl class="kv"><dt>疲労</dt><dd>${dlt(o.stateChange.fatB,o.stateChange.fatA,"")}</dd><dt>調子</dt><dd>${dlt(o.stateChange.condB,o.stateChange.condA,"")}</dd><dt>馬体重</dt><dd>${dlt(o.stateChange.weightB,o.stateChange.weightA,"kg")}</dd></dl>${o.stateChange.fatA>=75?`<p class="small">疲労がかなり溜まっています。休養や放牧で回復させましょう。</p>`:""}</div>`).join("") : `<p class="small">観戦レースのため、自厩舎馬の状態変化はありません。</p>`}</div>
    `)}

    const cv=$("#racecv"); if(cv){ drawRace(raceEndT()); }

/* ============ 馬券 ============ */
const BET_TYPES=[
 {id:"tan",n:"単勝",need:1},{id:"fuku",n:"複勝",need:1},{id:"umaren",n:"馬連",need:2},
 {id:"umatan",n:"馬単",need:2},{id:"sanfuku",n:"三連複",need:3},{id:"santan",n:"三連単",need:3},
];
const betState={raceId:null, field:null, type:"tan", picks:[], stake:10, includeMine:false};
function betOdds(field,race){
  /* 人気・単勝/複勝オッズは出馬表と同じ公開情報スコアから決める（能力値は使わない）。
     出馬表で凍結済みの値があればそれを使い、画面ごとに変わらないようにする */
  freezePopularity(field,race);
  const P=h=>h._p;
  const ordered=(a,b)=>P(a)*P(b)/Math.max(0.05,1-P(a));
  const trio=(a,b,c)=>ordered(a,b)*P(c)/Math.max(0.05,1-P(a)-P(b));
  betState.comboOdds=(type,picks)=>{
    const hs=picks.map(g=>field.find(h=>h._gate===g)); if(hs.some(h=>!h))return 0;
    if(type==="tan")return hs[0]._tanOdds;
    if(type==="fuku")return hs[0]._fukuOdds;
    if(type==="umaren")return +clamp(0.8/Math.max(0.001,ordered(hs[0],hs[1])+ordered(hs[1],hs[0])),1.2,900).toFixed(1);
    if(type==="umatan")return +clamp(0.8/Math.max(0.001,ordered(hs[0],hs[1])),1.5,1500).toFixed(1);
    if(type==="sanfuku"){let s=0; const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]; perms.forEach(pm=>s+=trio(hs[pm[0]],hs[pm[1]],hs[pm[2]])); return +clamp(0.8/Math.max(0.001,s),2,3000).toFixed(1);}
    if(type==="santan")return +clamp(0.8/Math.max(0.001,trio(hs[0],hs[1],hs[2])),3,9000).toFixed(1);
    return 0;
  };
}
function buildBetField(r){
  /* 出馬表と同一の固定フィールドを使う（相手馬・枠順をレース画面と一致させる） */
  const field=[...fixedRivalsFor(r)];
  const mine=S.horses.find(h=>h.id===S.selected);
  if(betState.includeMine&&mine&&!eligible(mine,r)&&!field.includes(mine)) field.push(mine);
  fixGates(field);
  betOdds(field,r);
  betState.field=field; betState.picks=[];
}

  ${S.betHistory.length?`<div class="mt">${S.betHistory.slice(0,8).map(x=>`<div class="small">${x.hit?"的中":"不的中"} ${esc(x.label)} 購入${fmt(x.stake)}万 → ${fmt(x.pay)}万</div>`).join("")}</div>`:`<p class="small mt">まだ馬券の購入履歴はありません。</p>`}</div>`);

      <span class="small">＝ <b id="bet-stake-man">${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円</b>（100円単位・100円未満は切り捨て）</span>

      const bb2=$("#btn-buybet"); if(bb2){ bb2.disabled=!(od&&betState.stake>0); const amt=$("#btn-buybet-amt"); if(amt)amt.textContent=man+"万円"; }

  }
  /* 馬券画面の作戦セレクト：所有馬オブジェクトを直接書き換えるため出馬表と双方向に連動し、離れても保持される */

    if(S.funds<betState.stake){alert2("資金が足りません",`購入金額 ${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円 が資金 ${fmt(S.funds)}万円 を超えています。`);return;}
    if(betState.stake>betCapLeft(r.id)){alert2("購入上限に達しています",`馬券の購入は1レース合計で資金の${BET_CAP_PCT}%・最大${fmt(BET_CAP_ABS)}万円までです（このレースはあと ${fmt(betCapLeft(r.id))}万円 まで買えます）。`);return;}
    const odds=betState.comboOdds(betState.type,betState.picks);
    S.funds-=betState.stake; ledOut("betbuy",betState.stake); S.betStats.bought+=betState.stake; S.betStats.count++;
    S.bets.push({raceId:r.id, raceName:r.name, type:betState.type, picks:[...betState.picks], stake:betState.stake, odds});
    if(auInit())auBetBuy();
    log(`馬券購入：${r.name} ${bt2.n} ${betState.picks.join("-")} ${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円`);
    renderAll();
  });
  const run=(skip)=>{
    const mine=betState.field.find(h=>!h.rival)||null;
    if(mine){ const fee=JOCKEYS[mine.jockey].fee; /* 騎乗料はstartRace内で処理 */ }
    startRace(r, mine, [...betState.field]);
    if(skip){ cancelAnimationFrame(raceState.raf); finishRace(); }
  };
  const rb=$("#btn-runbet"); if(rb)rb.addEventListener("click",()=>run(false));
  const sb=$("#btn-skipbet"); if(sb)sb.addEventListener("click",()=>run(true));
}

/* ============ 秘書 ============ */
const SEC_NAME="秘書・佐倉 澪";
function secretaryState(){
  const B=(label,view,hid,race,tid,anchor)=>({label,view,hid,race,tid,anchor});
  /* その馬への「いまの提案調教」。ボタンを押すと汎用の調教画面ではなく、この調教そのものへ着地する */
  const sugTid=h=>{ try{ const r=trainerSuggest(h)[0]; return r?r.tid:undefined; }catch(e){ return undefined; } };
  /* 「レースへ」のような汎用ボタンでも、押せば今週出走できる馬のレースの
     作戦画面（出馬表）まで着地させるための先行検索（第14次：全提案を遷移に統一） */
  const firstEnterable=()=>{ for(const h of S.horses){ const r=S.races.find(x=>!eligible(h,x)); if(r) return {h, r}; } return null; };
  const raceBtn=(label)=>{ const fe=firstEnterable(); return fe? B(label,"race",fe.h.id,fe.r.id) : B(label,"race"); };
  const betBtn=(label)=>B(label,"bet",undefined,(S.races[0]||{}).id||undefined,undefined,"bet-form");
  const ev=S.lastEvent;
  if(raceState.phase==="done") return {face:"normal", text:`レースが終了しました。レース終了画面で結果を確認したら、「帰る」ボタンで厩舎に戻ってくださいね。`, btns:[]};
  if(raceState.phase==="done"&&ev&&ev.type==="win") return {face:"smile", text:`やりましたね！ ${ev.name}が${ev.race}を勝ちました！この調子でいきましょう。`, btns:[B("結果を見る","race"),B("厩舎へ","stable")]};
  if(raceState.phase==="done"&&ev&&ev.type==="betwin") return {face:"smile", text:`馬券が的中しました！払戻${fmt(ev.pay)}万円です。お見事でしたね。`, btns:[B("結果を見る","race"),betBtn("馬券へ")]};
  if(raceState.phase==="done"){ const dh=S.horses.find(h=>h.fat>=60)||S.horses.find(h=>h.trainsLeft>0); return {face:"normal", text:`レースお疲れさまでした。馬の疲労が溜まっていますので、様子を見てあげてください。`, btns:[B("結果を見る","race"), dh? B("調教・休養へ","train",dh.id,undefined,sugTid(dh)) : B("調教・休養へ","train")]}; }
  /* エントリーがある週は、そのレースを軸に案内する（最優先の予定） */
  const ne=nearestEntry();
  if(ne){
    if(ne.left<=0){ const rNow=S.races.find(x=>x.name===ne.e.name); return {face:"smile", text:`今週、${ne.h.name}がエントリー中の「${ne.e.name}」に出走します！出馬表で作戦を確認して出走しましょう。このレースを走るか、エントリーを取り消すまで週は進みません。`, btns:[B("出走する","race",ne.h.id, rNow?rNow.id:undefined),B("調教する","train",ne.h.id,undefined,sugTid(ne.h))]}; }
    return {face:"normal", text:`${ne.h.name}の「${ne.e.name}」（${ne.e.course} ${ne.e.surf}${ne.e.dist}m）まであと${ne.left}週です。いまの調教はこのレースに向けた仕上げが中心になります。${allEntries().length>1?`ほかにもエントリーが${allEntries().length-1}件あります。`:""}`, btns:[B("調教で仕上げる","train",ne.h.id,undefined,sugTid(ne.h)), (S.races.find(x=>x.name===ne.e.name)? B("エントリーを確認","race",ne.h.id,(S.races.find(x=>x.name===ne.e.name)||{}).id) : Object.assign(B("エントリーを確認","stable",ne.h.id),{detail:true}))]};
  }
  if(S.sale){ const SN={young:"幼駒セール（当歳）",mare:"繁殖牝馬セール",overseas:"海外トレーニングセール"}[S.sale.kind]; return {face:"smile", text:`今週は${SN}が開催中です！牧場タブから上場馬を見られます。関係者のオススメ評価も付いていますよ。`, btns:[B("セールを見る","farm",undefined,undefined,undefined,"farm-sale"),B("厩舎へ","stable")]}; }
  if((month()===5||month()===6)&&(S.mares||[]).some(m=>!m.pregnant)){ return {face:"normal", text:`いまは種付けの季節（5〜6月）です。生産タブで配合評価を見て、種付けを登録しましょう。受胎は月末に判明し、翌年4月に幼駒が生まれます。`, btns:[B("生産へ","breed",undefined,undefined,undefined,"breed-form"),B("厩舎へ","stable")]}; }
  const injured=S.horses.find(h=>h.injured>0);
  if(injured) return {face:"worried", text:`${injured.name}が故障で休養中です…。放牧でしっかり治してあげましょう。`, btns:[B(`${injured.name}の様子を見る`,"train",injured.id,undefined,sugTid(injured))]};

/* ============ アカウント連携（名前＋パスワード／クラウド保存） ============
   サーバー側は同一オリジンの /api（Vercel Functions）が担う：
   ・POST /api/register {name,password} → {token, name} / {error}
   ・POST /api/login    {name,password} → {token, name, save, updatedAt}

   トークンはこの端末の localStorage に保持し、次回起動時にログイン状態を復元する。
   APIに届かない環境（Museカード内など）ではアカウント機能だけが無効になり、
   ローカル保存と引き継ぎコードは従来どおり使える（ゲームは止まらない）。 */
const ACCT_KEY="keibaGemu_account";
let cloudAvail=null; /* null=未確認 / true=APIあり / false=この環境では使えない */
let acctBusy=false, acctMsg="", acctPushTimer=null, acctPendingRender=false;
/* iPad Safari対策の中核：アカウント欄の再描画を「安全なタイミング」まで保留する。
   入力欄にフォーカスがある間／送信中／送信直後（キーボードが閉じ切るまで）は
   フォームの innerHTML を差し替えない。フォーカス中の入力要素がDOMから消えると
   Safari の画面プロセスが落ち、ページが再読み込み・白画面になることがあるため。
   保留した再描画は、安全になるまで短い間隔で再試行して必ず反映する */
let acctHoldUntil=0, acctRenderTimer=null;
function acctInputFocused(){ const ae=document.activeElement; return !!(ae&&(ae.id==="acct-name"||ae.id==="acct-pass")); }
function acctBlurInputs(){ ["acct-name","acct-pass"].forEach(id=>{ const e=document.getElementById(id); if(e){ try{ e.blur(); }catch(_){} } }); }
function acctHold(ms){ acctHoldUntil=Math.max(acctHoldUntil, Date.now()+(ms||600)); }
function acctRenderBlocked(){ return acctInputFocused()||acctBusy||Date.now()<acctHoldUntil; }
function scheduleAcctRender(){
  if(acctRenderTimer) return;
  const tick=()=>{ acctRenderTimer=null; if(!$("#acct-box")) return;
    if(acctRenderBlocked()){ acctRenderTimer=setTimeout(tick,160); return; }
    renderAcctBox(); };
  acctRenderTimer=setTimeout(tick,90);

/* 応答後の画面更新（確認ダイアログ表示など）は、入力欄がフォーカスを失い

function acctWaitSafe(){ return new Promise(res=>{ let n=0; const chk=()=>{ if(!acctRenderBlocked()||++n>50) return res(); setTimeout(chk,140); }; chk(); }); }
/* フォーカスが外れたら、保留していたアカウント欄の再描画を反映する */

function acctGet(){ try{ const a=JSON.parse(localStorage.getItem(ACCT_KEY)||"null"); return (a&&a.name&&a.token)?a:null; }catch(e){ return null; } }
function acctSet(a){ try{ if(a) localStorage.setItem(ACCT_KEY, JSON.stringify(a)); else localStorage.removeItem(ACCT_KEY); }catch(e){} }
async function acctApi(path, body, token){
  const ctl=("AbortController" in window)? new AbortController():null;
  const to=ctl? setTimeout(()=>ctl.abort(), 9000):null;
  try{
    const res=await fetch(path,{method:"POST", headers:Object.assign({"Content-Type":"application/json"}, token?{"Authorization":"Bearer "+token}:{}), body:JSON.stringify(body||{}), signal:ctl?ctl.signal:undefined});
    const text=await res.text();
    let data=null; try{ data=JSON.parse(text); }catch(e){}
    if(data==null) throw new Error("noapi"); /* JSONで返らない＝APIの無い環境 */
    return {status:res.status, data};
  } finally { if(to) clearTimeout(to); }
}

/* セールを終了する：購入済みの馬は既に自厩舎（繁殖牝馬／幼駒）へ移っていて
   確定済みなので、そのまま残す。残りの上場は終了扱いにして S.sale を畳み、
   牧場の通常画面（トップ）へ戻る。同じ週の再生成は saleWeekKey が開催週の
   キーのままなので起きない。終了は取り消せないため、誤タップ防止に
   確認ダイアログを挟む */
function endSale(){
 if(!S.sale)return;
 const SN={young:"幼駒セール（当歳）",mare:"繁殖牝馬セール",overseas:"海外トレーニングセール"}[S.sale.kind]||"セール";
 const remain=S.sale.list.length;
 showOverlay(`<h2>セールを終了しますか？</h2><div class="ov-body"><div style="text-align:left"><p>${SN}を終了します。残りの上場 ${remain}頭 は終了扱いになり、今週は再開できません。</p><p class="small">購入済みの馬はそのまま確定します（返金・返品はありません）。</p></div></div><div class="ov-foot"><button class="btn ghost" id="sale-end-cancel">やめる</button><button class="btn red" id="sale-end-ok">セールを終了する</button></div>`);
 const cn=$("#sale-end-cancel"); if(cn)cn.addEventListener("click",()=>{ $("#overlay").style.display="none"; });
 const ok=$("#sale-end-ok"); if(ok)ok.addEventListener("click",()=>{
  S.sale=null; PG.farmSale=0;
  $("#overlay").style.display="none";
  log(`🔨 ${SN}を終了した（残り${remain}頭は終了扱い）`);
  UI.farm="top"; saveAuto(true); renderAll();
  toast("セールを終了しました");
 });
}
function saleBuy(i, instant){
 const it=S.sale&&S.sale.list[i]; if(!it)return;
 const price=instant? Math.round(it.price*1.35) : it.price;
 if(!instant && Math.random()<0.35){ alert2("落札できませんでした","他の参加者に競り負けました。一発購入なら確実に落札できます。"); return; }
 if(it.charmPrice){ /* お守り付き：消費なしで入手（非常に高額設定） */ }
 else if(S.funds<price){ alert2("資金が足りません",`${fmt(price)}万円が必要です。`); return; }
 else { S.funds-=price; ledOut("buy",price); }
 S.sale.list.splice(i,1);
 if(it.saleKind==="mare"){ S.mares.push(it); log(`セールで繁殖牝馬「${it.name}」を落札`); }
 else { it.age=Math.max(0,it.age); S.youngStock.push(it); it.known=40; log(`セールで幼駒「${it.name}」を落札（牧場で育成）`); }
 if(!Array.isArray(S.saleHist))S.saleHist=[];
 S.saleHist.unshift({name:it.name, price, week:S.week, buyer:"自厩舎"}); if(S.saleHist.length>12)S.saleHist.length=12;
 if(price>=1500) pushNews(`セールで${it.name}が高額落札`, `あなたの厩舎が ${fmt(price)}万円 で${it.name}を落札した（父 ${esc(it.sire||"")}）。${lineHeatOf(it.sire)>1.05?"父系の流行も後押しした取引で、":""}関係者の注目を集める取引となった。`);
 renderAll();
}

function renderRank(){
  const el=$("#v-rank"); if(!el)return;
  refreshHallOfFame();
  const hallIds=new Set((S.hallOfFame||[]).map(x=>x.id));
  const seenIds=new Set();
  const poolHorses=ownHorsePool().filter(h=>{ if(h.id==null) return true; if(seenIds.has(h.id)) return false; seenIds.add(h.id); return true; });
  const mine=poolHorses.map(h=>{ensureFullHorse(h); return {name:h.name,sex:h.sex,age:h.age,wins:h.wins,races:h.races,earnings:h.earnings,rating:ratingOf(h),mine:true,hall:hallIds.has(h.id),id:h.id};});
  (S.hallOfFame||[]).forEach(rec=>{ if(!poolHorses.some(h=>h.id===rec.id)) mine.push({name:rec.name,sex:rec.sex,age:rec.age,wins:rec.wins,races:rec.races,earnings:rec.earnings,rating:rec.rating,mine:true,hall:true,gone:true,id:rec.id}); });
  const world=(S.worldHorses&&S.worldHorses.length?S.worldHorses:defaultWorld()).map(w=>({...w, rating:(w.rating!=null? w.rating : Math.round((w.spd+w.sta+w.bst)/3 + w.wins*2)), mine:false}));
  let pool=[...mine,...world];
  if(rankFilter==="legend") pool=pool.filter(x=>x.legend||x.hall);
  if(rankFilter==="current") pool=pool.filter(x=>x.current||(x.mine&&!x.gone));
  if(rankFilter==="mine") pool=pool.filter(x=>x.mine);
  const byEarn=[...pool].sort((a,b)=>b.earnings-a.earnings||b.rating-a.rating);
  const byRating=[...pool].sort((a,b)=>b.rating-a.rating||b.earnings-a.earnings);
  const passBadge=(h)=>{
    if(!h.mine) return "";
    const ab=legendAboveBelow(h.earnings||0);
    if(ab.isTop) return `<span class="passbadge">歴代名馬の頂点超え</span>`;
    if(ab.below) return `<span class="passbadge">${esc(ab.below.n)}超え</span>`;
    return "";
  };
  const rowMain=(h,i,mode)=>{
    const sub= h.legend? `${h.sex}・${h.born}年生` : h.current? `${h.sex}${h.age}歳・現役` : `${h.sex}${h.age}歳`;
    return `<tr class="${h.mine?"rank-me":""} ${h.legend?"legendrow":""}" ${h.legend?`data-leg="${esc(h.name)}"`:""}><td class="num">${i+1}</td><td>${esc(h.name)}${h.mine?"（自厩舎）":""}${h.hall?` <span class="passbadge">殿堂入り</span>`:""}${mode==="earn"?passBadge(h):""}${h.legend?` <span class="small">▾</span>`:""}</td><td>${sub}</td><td class="num">${h.races}戦${h.wins}勝</td>${mode==="earn"?`<td class="r">${fmt(h.earnings)}万円</td><td class="num">${h.rating}</td>`:`<td class="num">${h.rating}</td><td class="r">${fmt(h.earnings)}万円</td>`}</tr>`;
  };
  const detailRow=(h)=>{
    if(!h.legend||rankOpen!==h.name) return "";
    return `<tr class="legend-detail"><td></td><td colspan="5"><b>主な勝鞍（G1）</b>：${esc(h.g1)}<br>父 ${esc(h.sire)}／母 ${esc(h.dam)}／毛色 ${esc(h.coatName||"")}／主戦 ${esc(h.rider)}／脚質 ${esc(h.style)}（当ゲーム解釈）／代表距離 ${h.dmin}〜${h.dmax}m・${h.dept}<br>獲得賞金 ${fmt(h.earnings)}万円は海外・地方分を含む生涯総額（実額）。レーティング ${h.rating} は当ゲーム換算。</td></tr>`;
  };
  const table=(list,mode,cols,key)=>{ const rows=list.map((h,i)=>rowMain(h,i,mode)+detailRow(h)); return `<div class="panel" style="padding:6px 10px"><table><tr><th class="num">順位</th><th>馬名</th><th>性・生年</th><th class="num">戦績</th>${cols}</tr>${pageSlice(key,rows,10).join("")||`<tr><td colspan="6" class="small">該当する馬がいません。</td></tr>`}</table></div>`+pagerHTML(key,rows.length,10); };
  el.innerHTML=subnavHTML("rank",[["earn","賞金順"],["rating","レーティング順"]])
  + worldPanelsHTML()
  + `<div class="ranktabs">${[["all","すべて"],["legend","歴代名馬"],["current","現役実在馬"],["mine","自厩舎"]].map(([k,n])=>`<button data-rf="${k}" class="${rankFilter===k?"on":""}">${n}</button>`).join("")}</div>`
  + panelHTML("rank","earn",`<h2 class="sec">獲得賞金順 <span class="tag">実額・生年併記</span></h2><p class="small">歴代名馬は行を押すと血統・主戦・主な勝鞍が見られます。自厩舎馬が歴代名馬の賞金を抜くと「○○超え」の印が付きます。自厩舎馬は、獲得賞金 ${fmt(hallThresholds().earn)}万円以上／レーティング ${hallThresholds().rating}以上／G1 2勝以上のいずれかに達すると「殿堂入り」し、歴代名馬タブにも実在馬と並んで表示されます（引退・繁殖入りした後も残ります）。</p>${table(byEarn,"earn",`<th class="r">獲得賞金</th><th class="num">レーティング</th>`,"rankEarn")}`)
  + panelHTML("rank","rating",`<h2 class="sec">レーティング順 <span class="tag">歴代名馬は当ゲーム換算</span></h2><p class="small">自厩舎馬のレーティングは、能力素地（最大約59点）に、通算勝率（最大22点）、G1勝利（1勝5.5点・最大17点）、重賞勝利（最大10点）、G1複勝率（最大6点）、獲得賞金（最大7点）を加えて算出します。出走数や勝利数の多さだけでは上がらず、殿堂入りライン（${hallThresholds().rating}点）は複数のG1を勝つ歴史的名馬クラスが届く水準です。</p>${table(byRating,"rating",`<th class="num">レーティング</th><th class="r">獲得賞金</th>`,"rankRate")}<p class="small mt">出典：戦績・獲得賞金・主な勝鞍・血統は JRA公式（競馬の殿堂／競走馬情報）、netkeiba、JBIS の公開情報に基づく実データ。獲得賞金は海外・地方分を含む生涯総額の実額で、時代により賞金水準が異なるため生年を併記しています（換算調整はしていません）。歴代名馬のレーティングと脚質・距離帯は当ゲーム内の換算・解釈です。</p>`);
  el.querySelectorAll("[data-rf]").forEach(b=>b.addEventListener("click",()=>{ rankFilter=b.dataset.rf; renderAll(); }));
  el.querySelectorAll("[data-leg]").forEach(r=>r.addEventListener("click",()=>{ rankOpen= rankOpen===r.dataset.leg? null : r.dataset.leg; renderAll(); }));
}

function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#3c3c3c;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88vw;text-align:center"; document.body.appendChild(t); } t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.display="none"; },2300); }
function fnv1a(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16).padStart(8,"0"); }
async function sha256hex(str){ try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return fnv1a(str)+fnv1a("~"+str)+fnv1a("#"+str); } }
function b64enc(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(str){ const bin=atob(str.replace(/\s+/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function gzEnc(u8){ if(!window.CompressionStream) return null; try{ const buf=await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); return new Uint8Array(buf); }catch(e){ return null; } }
async function gzDec(u8){ if(!window.DecompressionStream) return null; try{ const buf=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(); return new Uint8Array(buf); }catch(e){ return null; } }

async function issueTransferCode(pass){
  const json=JSON.stringify(saveData());
  let bytes=new TextEncoder().encode(json); let mode="P";
  const gz=await gzEnc(bytes); if(gz&&gz.length<bytes.length){ bytes=gz; mode="G"; }
  const chk=fnv1a(json);
  let head="KMG1."+mode+"-", verify="";
  if(pass){ verify=(await sha256hex("kmg-pass:"+pass)).slice(0,10); head="KMG1."+mode+"K"; const ks=await passStream(pass, bytes.length); bytes=bytes.map((b,i)=>b^ks[i]); }

async function parseTransferCode(code, pass){
  const seg=String(code||"").trim().split(".");
  if(seg[0]!=="KMG1"||seg.length<4) throw new Error("形式が違います（引き継ぎコードではないか、バージョンが異なります）");
  const mode=seg[1][0], locked=seg[1][1]==="K";
  let i=2, verify=""; if(locked){ verify=seg[2]; i=3; }
  const chk=seg[i], payload=seg[i+1];
  if(!chk||!payload) throw new Error("コードが途中で切れています");
  if(locked){ if(!pass) throw new Error("このコードには合言葉が必要です"); const v=(await sha256hex("kmg-pass:"+pass)).slice(0,10); if(v!==verify) throw new Error("合言葉が違います"); }
  let bytes; try{ bytes=b64dec(payload); }catch(e){ throw new Error("コードが壊れています（復号できません）"); }
  if(locked){ const ks=await passStream(pass, bytes.length); bytes=bytes.map((b,j)=>b^ks[j]); }
  if(mode==="G"){ const dec=await gzDec(bytes); if(!dec) throw new Error("コードが壊れています（展開できません）"); bytes=dec; }
  const text=new TextDecoder().decode(bytes);
  if(fnv1a(text)!==chk) throw new Error("コードが壊れています（チェックサム不一致）");
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("コードが壊れています（データ化できません）"); }
  if(!d||!Array.isArray(d.horses)) throw new Error("セーブデータではありません");
  return d;
}

function guideSteps(){
  const ne=nearestEntry();
  const raceDue=!!(ne&&ne.left<=0);
  const trainedAll=!S.horses.some(h=>h.trainsLeft>0&&(h.injured||0)===0);
  const hasEntry=S.horses.some(h=>h.entry);
  const racedDone=raceState.phase==="done";
  const steps=[
    {n:"週の確認", done:true},
    {n:"調教・育成", done:trainedAll},
    {n:"出走準備", done:hasEntry||racedDone},
    {n:"レース", done:racedDone, na:!raceDue&&!racedDone},
    {n:"結果", done:false, na:!raceDue&&!racedDone},
    {n:"次の週へ", done:false},
  ];
  let cur=steps.findIndex(s=>!s.done&&!s.na);
  if(raceDue) cur=3;
  if(racedDone) cur=4;
  if(cur<0) cur=5;
  if(trainedAll&&!raceDue&&!racedDone) cur=5;
  return {steps, cur, raceDue, trainedAll, hasEntry};
}
