/* 調教師：方針に個性を持つ（スピード重視だが疲労管理は堅実） */
const TRAINER={name:"高橋 健一", policy:"スピード重視", desc:"若馬のスピード育成が得意。ただし疲労が溜まった馬には無理をさせない堅実派",
 ranks:{train:"A",eye:"B",idea:"B",cond:"A",weight:"B"},
 dist:{sprint:"B",mile:"A",middle:"A",long:"C"},
 traits:["若手戦に強い","大レース","軽め調教","気合鼓舞"]};
const TRAINER_TRAIT_FX={"スパルタ":1,"軽め調教":1,"気性難":1};
function trainerSuggest(h){
  ensureFullHorse(h); const out=[]; const add=(tid,reason)=>{ if(tid&&!out.some(o=>o.tid===tid)&&out.length<3) out.push({tid,reason}); };
  if(h.injured>0){ add("bokujou",`故障の休養中です。まずは放牧でしっかり治しましょう。`); return out; }
  if(h.fat>=75) add("bokujou",`疲労が${h.fat}と限界に近い。ここは放牧で抜くのが先決です。`);
  else if(h.fat>=55) add("pool",`疲労が${h.fat}あります。プールなら脚への負担が少なく、スタミナも維持できます。`);
  /* 目標レースから：エントリー中ならそのレースの距離・馬場に向けた仕上げを最優先で提案する */
  const ent=entryOf(h);
  const sg=suggestNextRace(h); const tr= ent || (sg?sg.race:null);
  if(tr){
    const pre= ent? `エントリー中「${tr.name}」まであと${Math.max(0,ent.absWeek-S.week)}週。` : `次走「${tr.name}」に向けて。`;
    if(tr.dist>=2200) add("longwood",`${pre}${tr.dist}mの長距離戦なので、スタミナを付ける長距離ウッドで仕上げましょう。`);
    else if(tr.dist<=1400) add("saka",`${pre}${tr.dist}mの短距離戦なので、スピードを磨く坂路で仕上げましょう。`);
    else if(tr.surf==="ダート") add("dirt",`${pre}ダート${tr.dist}mに向けて、パワーを付けるダート調教で仕上げましょう。`);
    else add("wood",`${pre}${tr.surf}${tr.dist}mに向けて、瞬発力を上げるウッドで仕上げましょう。`);
  }
  /* 弱点改善 */
  const w0=weaknessesOf(h)[0];
  if(w0) add(w0.train, `弱点改善：${w0.why}。`);
  /* 作戦のずれ */
  const fit=tacFit(h,tacOf(h));
  if(fit<0.5) add((TRAINS.find(t=>t.tac===tacOf(h).fam)||{}).id, `作戦「${tacOf(h).n}」と脚質の相性がまだ浅いです。${tacOf(h).fam}訓練で適性を上げましょう。`);
  /* 調子 */
  if(h.cond<45) add("turf",`調子が${h.cond}と低めです。芝コースの軽めの追い切りで気分を上げましょう。`);
  /* 若馬の基礎固め（調教師の方針：スピード重視） */
  if(h.age<=3) add("saka",`${h.age}歳の成長期です。方針として、まずは坂路でスピードの基礎を固めたいところです。`);
  if(!out.length) add("awase",`状態は良好です。併せ馬で勝負根性をさらに伸ばしましょう。`);
  return out.slice(0,3);
}
function doTrain(tid, quiet, targetH){
  const h=targetH||selHorse(); const t=TRAINS.find(x=>x.id===tid); if(!h||!t)return null;
  if(S.funds<t.cost){ if(!quiet)alert2("資金が足りません","調教費用が不足しています。"); return null; }
  S.funds-=t.cost; if(!quiet)h.trainsLeft--; // quiet=指示による自動実行（週送り側で回数管理）
  ensureFullHorse(h);
  const weakKey=weakestStatKey(h); // 弱点補正：最も低い能力は対応調教で伸びが1.6倍
  let tMul=(TRAINER.ranks? (0.9+rankVal(TRAINER.ranks.train)*0.04):1) * (h.personality==="真面目"?1.12:1);
  if(TRAINER.traits.includes("スパルタ")&&!["rest","bokujou"].includes(tid)&&tid!=="pool"){ tMul*= (h.hlt>=65&&!(h.flags||[]).includes("leganx"))?1.25:0.8; }
  if(TRAINER.traits.includes("軽め調教")&&["rest","bokujou","pool"].includes(tid)){ tMul*=1.2; }
  if(TRAINER.traits.includes("気性難")&&(h.temper==="激"||h.temper==="荒い")){ tMul*=1.1; }
  const up=(k,v)=>{h[k]=clamp(Math.round(h[k]+grow(h, k===weakKey?v*1.6*tMul:v*tMul)),20,99);};
  let msg="";
  if(tid==="saka"){up("spd",rnd(1,2.4)); up("pow",rnd(.8,2)); h.fat+=ri(14,22); h.cond+=ri(0,4); msg="坂路でスピードとパワーが向上";}
  if(tid==="wood"){up("spd",rnd(.8,2)); up("bst",rnd(1,2.4)); h.fat+=ri(12,20); h.cond+=ri(0,4); ensureTrendApt(h).kire=clamp(ensureTrendApt(h).kire+2,20,96); msg="ウッドで瞬発力が向上（切れ味適応＋2）";}
  if(tid==="pool"){up("sta",rnd(1.2,2.6)); h.fat+=ri(5,9); msg="プールでスタミナが向上";}
  if(tid==="turf"){up("bst",rnd(1.6,3)); up("spd",rnd(.4,1.2)); h.fat+=ri(12,18); h.cond+=ri(3,8); ensureTrendApt(h).kire=clamp(ensureTrendApt(h).kire+3,20,96); msg="芝コースで切れ味が向上（切れ味適応＋3）";}
  if(tid==="dirt"){up("pow",rnd(1.6,3)); up("sta",rnd(.8,1.8)); h.fat+=ri(18,26); ensureTrendApt(h).shoumo=clamp(ensureTrendApt(h).shoumo+2,20,96); h.heavyProg=(h.heavyProg||0)+1; if(h.heavyProg>=2&&h.heavy!=="S"){ const order=["C","B","A","S"]; const ix=order.indexOf(h.heavy); if(ix>=0&&ix<3){h.heavy=order[ix+1]; h.heavyProg=0; msg="ダートでパワーが向上（消耗戦適応＋2／重馬場適性が "+h.heavy+" に改善！）";} else msg="ダートでパワーが向上（消耗戦適応＋2）"; } else msg="ダートでパワーが向上（消耗戦適応＋2／重馬場適性 改善中 "+(h.heavyProg||0)+"/2）";}
  if(tid==="awase"){up("gut",rnd(1.6,3)); ["spd","sta","pow","bst"].forEach(k=>up(k,rnd(.3,.9))); h.fat+=ri(18,26); h.cond+=ri(2,6); msg="併せ馬で根性が向上";}
  if(tid==="gate"){up("men",rnd(.8,1.8)); up("smt",rnd(.6,1.4)); h.fat+=ri(4,8); msg="ゲート練習でスタートの反復を確認";}
  if(tid==="longwood"){up("sta",rnd(1.6,3)); up("bst",rnd(.6,1.4)); h.fat+=ri(18,26); const ta2=ensureTrendApt(h); ta2.jizoku=clamp(ta2.jizoku+3,20,96); if(h.dmax<h.dmaxCap){h.dmax=Math.min(h.dmaxCap,h.dmax+40); h.bestDist=Math.round((h.dmin+h.dmax)/2/100)*100; msg=`長距離ウッドでスタミナが向上（持続力適応＋3／適性距離の上限が ${h.dmax}m に延びた）`;} else msg="長距離ウッドでスタミナが向上（持続力適応＋3）";}
  if(tid==="mental"){up("men",rnd(1.4,2.8)); up("smt",rnd(1,2.2)); h.fat+=ri(4,8); h.cond+=ri(1,4); msg="メンタル調教で精神力と賢さが向上";}
  if(t && t.tac){ // 作戦訓練：目標の適性が伸び、他は少しずつ薄れる。最大が入れ替わると得意作戦が変わる
    const apt=ensureTacApt(h); const before=bestTacStyle(h);
    apt[t.tac]=clamp(apt[t.tac]+ri(7,11),0,100);
    STYLES.forEach(s=>{ if(s!==t.tac) apt[s]=clamp(apt[s]-ri(1,4),10,100); });
    h.fat+=ri(12,18); h.cond+=ri(0,3);
    const after=bestTacStyle(h);
    if(after!==before){ h.style=after; if(h.tactic&&tacOf(h).fam!==after) h.tactic=TAC_BY_STYLE[after]; msg=`${t.tac}訓練を重ね、得意作戦が「${before}」から「${after}」に変わった！`; }
    else msg=`${t.tac}訓練：${t.tac}適性が ${apt[t.tac]} に上昇（得意は「${after}」）`;
  }
  /* 特性習得の進捗：同じ系統の調教を繰り返すと進捗が溜まり、need回で習得（別枠・最大2つ／全体8個まで） */
  if(t.learn){
    const track=LEARN_TRACKS.find(x=>x.trait===t.learn);
    if(track && !traitOf(h,t.learn) && (h.learned||[]).length<LEARN_CAP && h.traits.length<TRAIT_MAX){
      h.learnProg[t.learn]=(h.learnProg[t.learn]||0)+1;
      if(h.learnProg[t.learn]>=track.need){
        h.learned.push(t.learn); if(!h.traits.includes(t.learn))h.traits.push(t.learn);
        msg+=` ― 特性「${traitName(t.learn)}」を習得した！`;
        log(`${h.name} が特性「${traitName(t.learn)}」を習得`);
      } else {
        msg+=`（特性「${traitName(t.learn)}」習得まで あと${track.need-h.learnProg[t.learn]}回）`;
      }
    }
  }
  /* 特別調教：対応特性の上位進化の進捗＋育成度ゲージ */
  if(tid.indexOf("sp_")===0){
    gainGauge(h, 34, false); const gk=pick(["spd","sta","pow","bst"]); if(h.gauges)h.gauges[gk]=clamp((h.gauges[gk]||0)+34,0,100);
    const great=Math.random()< (0.05+facEffect("recept")*0.025);
    Object.keys(EVO).forEach(base=>{ const ev=EVO[base];
      const match = ev.train===tid || (tid==="sp_dist"&&ev.train==="sp_dist") || (tid==="sp_big"&&ev.train==="sp_big") || (tid==="sp_tokyo"&&base==="tokyopro") || (tid==="sp_nakayama"&&base==="nakayamapro") || (tid==="sp_kyoto"&&base==="kyotopro") || (tid==="sp_hanshin"&&base==="hanshinpro") || (tid==="sp_saka"&&base==="slope") || (tid==="sp_start"&&(base==="gatepro"||base==="inner")) || (tid==="sp_heal"&&(base==="recover"||base==="sequential")) || (tid==="sp_mind"&&base==="stablemind");
      if(match && traitOf(h,base) && !traitOf(h,ev.up)){ h.evoProg[base]=(h.evoProg[base]||0)+(great?2:1); msg+=`（「${traitName(base)}」の進化進捗 ${Math.min(3,h.evoProg[base])}/3${great?"・大成功！":""}）`; if(h.evoProg[base]>=3) doEvolve(h,base); }
    });
    if(tid==="sp_heal"){ h.fat-=18; msg+=" 特別調教：回復管理で疲労が取れた"; }
    else if(tid==="sp_start"){ up("smt",rnd(.6,1.4)); h.fat+=ri(5,9); msg+=" 特別調教：スタートを反復した"; }
    else if(tid==="sp_saka"){ up("pow",rnd(1,2)); h.fat+=ri(12,18); msg+=" 特別調教：坂路で鍛えた"; }
    else if(t.course){ up("bst",rnd(.6,1.4)); h.fat+=ri(8,12); msg+=` 特別調教：${t.course}コースを想定した`; }
    else { up("men",rnd(.6,1.4)); h.fat+=ri(6,10); msg+=" 特別調教をこなした"; }
  }
  if(tid==="rest"){h.fat-=25; h.cond-=ri(2,5); msg="厩舎で休養し疲労が回復";}
  if(tid==="bokujou"){h.fat-=60; h.cond=ri(50,65); h.weight=clamp(h.weight+ri(-8,8),420,540); if(h.injured>0)h.injured=Math.max(0,h.injured-2); msg="放牧でリフレッシュ";}
  h.fat=clamp(h.fat * (1-facEffect("steamer")*0.02),0,100); h.cond=clamp(h.cond,0,100);
  if(h.fat>=92 && !["rest","bokujou"].includes(tid) && Math.random()<(0.4-((h.hlt||60)-60)*0.004 - facEffect("vet")*0.03 - ((h.flags||[]).includes("leganx")?-0.08:0))){
    h.injured=Math.max(1,ri(3,6)-Math.floor(facEffect("vet"))); msg+=" ― しかし故障が発生！ 休養が必要";
    log(`${h.name} が調教中に故障（${h.injured}週休養）`);
  } else log(`${h.name}：${msg}`);
  if(!quiet)renderAll();
  return msg;
}

/* ---- 生産：配合評価（当ゲーム独自計算） ---- */
let breedSel={s:null,m:null,sim:false};
function sireStats(s){ if(s.own){ensureFullHorse(s.own); return {spd:s.own.spd,sta:s.own.sta,pow:s.own.pow,bst:s.own.bst,gut:s.own.gut,flx:s.own.flx,smt:s.own.smt,hlt:s.own.hlt,trend:s.own.trendApt};}
  return {spd:72+(s.spd||0)*2, sta:72+(s.sta||0)*2, pow:72+(s.pow||0)*2, bst:72+(s.bst||0)*2, gut:72+(s.gut||0)*2, flx:68, smt:66, hlt:70, trend:null}; }
function evalBreed(s,m){
  if(!s||!m)return null; ensureFullHorse(m);
  const ss=sireStats(s);
  const avg=k=>Math.round((ss[k]+m[k])/2);
  const total=Math.round((avg("spd")+avg("sta")+avg("pow")+avg("bst")+avg("gut")+avg("flx")+avg("smt"))/7);
  const rank= total>=78?"S":total>=71?"A":total>=64?"B":total>=57?"C":"D";
  const sireHorse=s.own||{name:s.name, health:75, coat:null};
  const th=theorize(s.name, m, sireHorse, m);
  const explosion=clamp(30+th.burst*6+Math.round((ss.spd-60)*0.3),5,99);
  const trendChild={kire:Math.round(((ss.trend?ss.trend.kire:55)+(m.trendApt?m.trendApt.kire:55))/2), jizoku:Math.round(((ss.trend?ss.trend.jizoku:55)+(m.trendApt?m.trendApt.jizoku:55))/2), shoumo:Math.round(((ss.trend?ss.trend.shoumo:55)+(m.trendApt?m.trendApt.shoumo:55))/2)};
  const domTrend=Object.keys(trendChild).reduce((b,k)=>trendChild[k]>trendChild[b]?k:b,"kire");
  return {total,rank,explosion,risk:th.danger*10,theory:th,trendChild,domTrend, expect:{spd:avg("spd"),sta:avg("sta"),pow:avg("pow"),bst:avg("bst"),gut:avg("gut")}};
}
function breedEvalHTML(s,m){
  const ev=evalBreed(s,m); if(!ev)return `<p class="small">繁殖牝馬を選ぶと配合評価が表示されます。</p>`;
  const th=ev.theory; const P=pedigreeOf(s.name,m);
  const dangerStars="★".repeat(Math.min(5,Math.ceil(th.danger/2)))+"☆".repeat(Math.max(0,5-Math.ceil(th.danger/2)));
  const pedRow=(a,label)=> a? `<td><b style="${th.inbred&&th.inbred.names.includes(a.name)?"color:#b02020":""}">${esc(a.name)}</b>${a.damSire?'<span class="mk hot">母</span>':""}${th.inbred&&th.inbred.full.includes(a.name)?'<span class="mk hot">全</span>':""}<span class="mk">${a.parent}</span>${a.grade?`<span class="mk hot">${a.grade}種牡馬</span>`:""}<span class="mk">${a.type==="SP"?"SP":a.type==="ST"?"ST":"中間"}</span><span class="mk">${lineOf(a.name).pop}</span>${(a.factors||[]).map(f=>`<span class="mk">${ABNAME[f]}</span>`).join("")}</td>`:`<td>―</td>`;
  const g2=P.anc.filter(a=>a.gen===2), g3=P.anc.filter(a=>a.gen===3).slice(0,4);
  const ss=sireStats(s); const sirePts=Math.round((ss.spd+ss.sta+ss.pow+ss.bst+ss.gut+ss.flx+ss.smt+ss.hlt)/8);
  ensureFullHorse(m); const damPts=Math.round(ABS9.reduce((a,[k])=>a+(m[k]||0),0)/9);
  const sL=lineOf(s.name), dL=lineOf(m.sire||"");
  const facSet=[...new Set([...(P.sire.factors||[]),...(P.damSire.factors||[])])];
  const facProb=facSet.map(f=>{
    const cnt=P.anc.filter(a=>(a.factors||[]).includes(f)).length;
    const inSire=(P.sire.factors||[]).includes(f), inDam=(P.damSire.factors||[]).includes(f);
    const prob=clamp(12+cnt*16+(inSire?14:0)+(inDam?14:0),10,92);
    return {f,prob,cnt};
  });
  const vigor=P.anc.filter(a=>a.gen>=2&&(a.grade||(a.factors||[]).length)).slice(0,6);
  const subTxt=Object.keys(th.sub||{}).length? Object.keys(th.sub).map(k=>`${ABNAME[k]} <span class="stars">${"★".repeat(Math.min(5,th.sub[k]))}</span>`).join("／") : "なし";
  const modTxt=Object.keys(th.mods||{}).length? Object.keys(th.mods).map(k=>`${k==="life"?"競走寿命":ABNAME[k]} +${th.mods[k]}`).join("／") : "なし";
  const nickTxt = NICKS[P.sire.name+"×"+P.damSire.name] ? `<span style="color:#20548f;font-weight:800">繁栄</span>` : (P.sire.parent===P.damSire.parent? `<span style="color:#1d7a3c;font-weight:800">安定</span>` : `<span style="color:#b02020;font-weight:800">衰退寄り</span>`);
  return `<div class="parentgrid">
   <div class="parentcard"><div class="small">父（種牡馬）</div><div class="pc-name">${esc(s.name)}</div>
    <div class="small">系統：${sL.parent}／${sL.type==="SP"?"SP系統":sL.type==="ST"?"ST系統":"中間"}${sL.grade?`／${sL.grade}種牡馬`:""}／${sL.pop}</div>
    <div class="small">因子：${(sL.factors||[]).map(f=>`<span class="trait plus">${ABNAME[f]}</span>`).join(" ")||"なし"}</div>
    <div class="small">素質点 <b style="font-size:16px">${sirePts}</b>／種付料 ${s.fee?fmt(s.fee)+"万円":"自家（無料）"}</div></div>
   <div class="parentcard"><div class="small">母（繁殖牝馬）</div><div class="pc-name">${esc(m.name)}</div>
    <div class="small">母父系統：${dL.parent}／${dL.type==="SP"?"SP系統":dL.type==="ST"?"ST系統":"中間"}／牝系：${m.famousDam?"名牝系":(m.damLine==="主流"?"主流牝系":"一般牝系")}</div>
    <div class="small">因子：${(dL.factors||[]).map(f=>`<span class="trait plus">${ABNAME[f]}</span>`).join(" ")||"なし"}／戦績 ${m.races}戦${m.wins}勝</div>
    <div class="small">素質点 <b style="font-size:16px">${damPts}</b>／芝${m.turf} ダ${m.dirt}／距離 ${m.dmin}〜${m.dmax}m</div></div>
  </div>
  <div class="evalgrid">
   <div class="evalbox"><div class="el">総合評価（産駒期待値）</div><div class="ev">${ev.rank} <span style="font-size:14px">${ev.total}</span></div><div class="small">期待 速${ev.expect.spd} ス${ev.expect.sta} パ${ev.expect.pow} 瞬${ev.expect.bst} 根${ev.expect.gut}</div></div>
   <div class="evalbox"><div class="el">爆発力（理論込み）</div><div class="ev">${ev.explosion}</div><div class="small">理論の爆発力 ${th.burst} 点 <span class="stars">${starsStr(Math.round(th.burst/12*5))}</span></div></div>
   <div class="evalbox"><div class="el">危険度</div><div class="ev"><span class="stars">${dangerStars}</span></div><div class="small">${th.danger>=6?"近親が濃い。健康・気性・脚部に注意":th.danger>=3?"やや近親寄り（両親の健康で軽減済み）":"リスクは低め"}</div></div>
   <div class="evalbox"><div class="el">傾向の出やすさ</div><div class="ev" style="font-size:16px">${TRENDS[ev.domTrend].n}</div><div class="small">切${ev.trendChild.kire}／持${ev.trendChild.jizoku}／消${ev.trendChild.shoumo}／ニックス傾向 ${nickTxt}</div></div>
  </div>
  <details class="fold"><summary>配合理論・血統表をくわしく見る</summary><div class="foldbody"><div class="mt"><b>成立する配合理論</b>${th.theories.length? th.theories.map(x=>`<div class="theoryrow"><span class="trait plus">${x.n}</span> <span class="stars">${starsStr(x.spdStar||0)}</span> <span class="small">爆発力寄与 ${x.spdStar? "★×"+x.spdStar : "スピード以外"}</span><br><span class="small">${x.txt}</span></div>`).join("") : `<div class="small">成立する理論はありません</div>`}</div>
  <div class="mt"><b>活力源化</b><div class="small">${vigor.length? vigor.map(a=>`${esc(a.name)}（${a.gen}代・${a.grade?a.grade+"種牡馬・":""}${(a.factors||[]).map(f=>ABNAME[f]).join("／")||"因子なし"}）`).join("、") : "対象となる先祖はいません"}<br>格付けのある先祖や因子を持つ先祖が、産駒の生命力（競走寿命）を底上げします。</div></div>
  <div class="mt"><b>因子の遺伝確率</b><div style="margin-top:5px">${facProb.length? facProb.map(x=>{ const d=Math.round(30+x.prob*0.55); return `<span style="display:inline-block;text-align:center;margin:0 7px 4px 0"><span class="faccirc" style="width:${d}px;height:${d}px;font-size:${d>=52?14:11.5}px">${x.prob}%</span><br><span class="small">${ABNAME[x.f]}</span></span>`; }).join("") : '<span class="small">継承しうる因子はありません</span>'}<div class="small">丸の大きさ＝遺伝確率（血統内にその因子を持つ先祖が多いほど高くなります）</div></div></div>
  ${breedSel.sub?`<div class="mt panel" style="background:var(--panel2)"><b>サブパラ評価</b><div class="small" style="margin-top:4px">能力補正の内訳：${modTxt}<br>サブパラ爆発：${subTxt}<br>産駒の傾向適応の目安：切れ味 ${ev.trendChild.kire}／持続力 ${ev.trendChild.jizoku}／消耗戦 ${ev.trendChild.shoumo}</div></div>`:`<div class="mt small">能力補正・サブパラ爆発の内訳は「サブパラ評価」ボタンで表示できます。</div>`}
  <table class="pedigree mt"><tr><th>世代</th><th>父系</th><th>母系</th></tr>
  <tr><td>1代</td>${pedRow(P.anc[0])}${pedRow(P.anc[1])}</tr>
  <tr><td>2代</td>${pedRow(g2[0])}${pedRow(g2[1])}</tr>
  <tr><td>3代</td>${pedRow(g3[0])}${pedRow(g3[2])}</tr></table>
  <p class="small">血統表：赤字はインブリード対象の先祖、「全」は全きょうだい、「母」は母系。系統マーク（親系統／SP・ST／格付け／流行／能力因子）つき。</p></div></details>`;
}

  if(m.pregnant){ alert2("種付けできません",`${esc(m.name)} は今年すでに種付け済みです。`); return; }

/* 血統支配率と系統確立 */
function lineDominance(){
 const counts={}; let total=0;
 const add=(name)=>{ const L=lineOf(name); counts[L.parent]=(counts[L.parent]||0)+1; total++; };
 (S.horses||[]).forEach(h=>add(h.sire)); (S.mares||[]).forEach(h=>add(h.sire)); (S.youngStock||[]).forEach(h=>add(h.sire));
 return Object.keys(counts).map(k=>({line:k, pct: total? Math.round(counts[k]/total*100):0})).sort((a,b)=>b.pct-a.pct);
}
function lineStatus(line){
 const d=lineDominance().find(x=>x.line===line); const pct=d?d.pct:0;
 if(S.overseasFarm||pct>=45) return "世界系統";
 if(pct>=30) return "親系統（確立）";
 if(pct>=18) return "子系統（確立）";
 return "未確立";
}

function weakestTrainId(h){
 const wk=weakestStatKey(h);

function runPlan(h){
 const p=h.plan||defaultPlan(); const rep=[];
 let tid=null, why="";
 const ent=h.entry; const weeksLeft=ent? ent.absWeek-S.week : 99;
 const sinceRace = h.restW!=null? h.restW : 99;
 if(ent && ent.absWeek===S.week){ rep.push(`${h.name}：今週は出走週のため調教は軽め（レース優先）`); doTrain("rest",true,h); S.weekReport.push(rep[0]); return; }
 if(h.injured>0){ doTrain("bokujou",true,h); S.weekReport.push(`${h.name}：故障中のため放牧（指示より療養を優先）`); return; }
 if(h.fat>p.fatTh){ tid=p.fatAct==="light"?"pool":(p.fatAct==="rest"?"rest":"bokujou"); why=`疲労が${Math.round(h.fat)}のため${FAT_ACTS[p.fatAct]}に切替`; }
 else if(p.preRace && ent && weeksLeft<=1){ tid="rest"; why= weeksLeft===0?"レース週のため軽めに調整":"レース前週のため軽めに調整"; }
 else if(p.postRest>0 && sinceRace>=0 && sinceRace<p.postRest && h.races>0){ tid="pool"; why=`レース後${sinceRace}週目のため軽めに調整`; }
 else if(p.goalTrait && !traitOf(h,p.goalTrait)){ const lt=LEARN_TRACKS.find(x=>x.trait===p.goalTrait); tid=lt?lt.train:"awase"; why=`特性「${traitName(p.goalTrait)}」の習得を目指す`; }
 else if(p.weakFocus){ tid=weakestTrainId(h); why=`弱点（${ABNAME[weakestStatKey(h)]||""}）を重点`; }
 else { tid=p.repeat; }
 const tname=(TRAINS.find(x=>x.id===tid)||{}).n||tid;
 const msg=doTrain(tid,true,h);
 if(msg!=null){ S.weekReport.push(`${h.name}：${tname}を実行${why?`（${why}）`:""}`); h.trainsLeft=2; }
}

 /* 受胎判定は月末 */
 if(wk===4){ (S.pregnant||[]).filter(p=>!p.judged).forEach(p=>{
   const sireH=(S.stallions||[]).find(x=>x.name===p.sireName)||(S.horses||[]).find(x=>x.name===p.sireName);

   else { if(mare)mare.pregnant=false; log(`繁殖牝馬の受胎は叶いませんでした（父：${p.sireName}）${mo===5?"。6月に再種付けできます":""}`); S.pregnant=S.pregnant.filter(x=>x!==p); }
 }); }
 /* 誕生：翌年4月第1週 */
 if(mo===4&&wk===1){ (S.pregnant||[]).filter(p=>p.ok&&p.dueYear===year()).forEach(p=>{
   const mare=(S.mares||[]).find(m=>m.id===p.mareId); if(mare)mare.pregnant=false;
   const foal=makeFoalFromTheory(p); if(foal){ S.youngStock.push(foal); S.foals=(S.foals||0)+1; log(`🎉 幼駒が誕生しました：${foal.name}（父 ${p.sireName} × 母 ${mare?mare.name:""}）。牧場タブで育成中`); }
   S.pregnant=S.pregnant.filter(x=>x!==p);
 }); }
 /* 幼駒の自動育成（1歳1月から牧場長が育成。能力は少しずつ判明） */
 (S.youngStock||[]).forEach(y=>{
   y.bredWeeks=(y.bredWeeks||0)+1;
   const reveal=clamp(18+y.bredWeeks*3 + facEffect("group")*2 + rankVal(FARM_MANAGER.ranks.breakin)*1.5,0,100);
   y.known=Math.max(y.known||0, Math.round(reveal));
   const growFac={saka:"pow",track:"bst",kado:"flx",gatef:"gut",pool_f:"sta",longe:"men",flower:"smt",merit:"smt",grass:"hlt"};
   Object.keys(growFac).forEach(fid=>{ const e=facEffect(fid); if(e>0 && Math.random()<0.30){ const k=growFac[fid]; y[k]=clamp(y[k]+ (Math.random()<0.5?1:0) + (e>=2?1:0),20,99); } });
   if(FARM_MANAGER.policy==="スピード重視"&&Math.random()<0.2) y.spd=clamp(y.spd+1,20,99);
   if(Math.random()<0.5) y.cond=clamp((y.cond||60)+ri(-3,4),20,100);
 });
 /* セール開催週の上場生成 */
 const saleKey=year()+"-"+mo+"-"+wk;

function saleEval(kind, h){
 const trueScore=(h.spd+h.sta+h.pow+h.bst+h.gut)/5;
 const noise=(base,acc)=>{ const n=pick([-2,-1,0,0,1,2]); return n===0?"◎":(Math.abs(n)===2&&Math.random()<acc?"☆":(n>0?"◎":"△")); };
 if(kind==="sec"){ const est=(h.dmin+h.dmax); return trueScore>=78?"☆":trueScore>=70?"◎":trueScore>=62?"○":trueScore>=55?"△":""; }
 if(kind==="mgr"){ const est=(h.men+h.hlt)/2; return est>=80?"☆":est>=72?"◎":est>=64?"○":est>=56?"△":""; }
 const est=trueScore; return est>=80?"☆":est>=72?"◎":est>=64?"○":est>=56?"△":"";
}
function genSale(kind){
 const list=[];

 for(let i=0;i<n;i++){
   let h;
   if(kind==="mare"){ h=newHorse({base:ri(56,72), age:ri(5,9), sex:"牝"}); h.price=ri(300,2400); h.saleKind="mare"; }
   else if(kind==="overseas"){ h=newHorse({base:ri(64,84), age:1}); h.sire=pick(["海外・欧州スタミナ種牡馬","海外・米国ダート種牡馬"]); h.price=ri(900,4200); h.saleKind="young"; if(Math.random()<0.2){ h.charmPrice=true; h.price*=3; } }
   else { h=newHorse({base:ri(58,80), age:0}); h.price=ri(250,1800); h.saleKind="young"; }
   h.saleEvals={sec:saleEval("sec",h), mgr:saleEval("mgr",h), tr:saleEval("tr",h)};
   list.push(h);
 }
 return {kind, list};
}
function makeFoalFromTheory(p){
 const mare=(S.mares||[]).find(m=>m.id===p.mareId);
 const T=p.theory||{burst:0,danger:0,mods:{}};
 const stRec=(S.stallions||[]).find(x=>x.name===p.sireName); const sireH=stRec?stRec.own:null;
 const base=58+Math.min(10,T.burst)+ri(-4,6);
 const f=newHorse({base, age:0, sire:p.sireName, dam:mare?mare.name:""});
 f.name=(mare?mare.name.slice(0,3):"幼駒")+ri(1,99);
 if(mare){ ["spd","sta","pow","bst","gut","flx","men","smt","hlt"].forEach(k=>{ const sv=sireH?sireH[k]:(mare[k]+8); f[k]=clamp(Math.round((sv+mare[k])/2+gauss()*5),25,97); }); f.turf=mare.turf; f.dirt=mare.dirt; f.heavy=mare.heavy; }
 /* 父系因子の活性化：受胎確定時に表示された父系因子は確実に上昇 */
 ((p.theory&&p.theory.sireFactors)||[]).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+ri(3,6),20,99); });
 Object.keys(T.sub||{}).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+T.sub[k],20,99); });
 Object.keys(T.mods||{}).forEach(k=>{ if(ABNAME[k]) f[k]=clamp(f[k]+T.mods[k]*2,20,99); });
 if(T.danger>=4){ f.hlt=clamp(f.hlt-ri(4,10),20,99); if(Math.random()<0.35&&!f.flags.length)f.flags=["leganx"]; if(Math.random()<0.3)f.temper=pick(["激","荒い","普通"]); }
 if(T.mods&&T.mods.life){ f.longLife=true; }
 f.known=12; f.bredWeeks=0; f.theoryNames=(T.theories||[]).map(t=>t.n);
 if(mare&&mare.famousDam&&Math.random()<0.2) f.inheritUnique=true;
 return f;
}
function nextWeek(){
  if(S.gameover)return;
  if(typeof raceState!=="undefined"&&(raceState.phase==="run"||raceState.phase==="done"))return; // レース中・レース終了画面からは進めない（帰ってから厩舎で）
  /* エントリーしたレースの週は、走るか取り消すまで絶対に過ぎられない（最も近いレース週で必ず止まる） */
  if(blockedEntries().length){ showEntryBlock(); return; }
  const prevYear=year();
  S.funds-=upkeep();
  /* 施設の月維持費（月初週に徴収） */
  if(S.week%4===3){ let fm=0; FACILITIES.forEach(f=>{ fm+= (facBuilding(f.id)>0?0:facLv(f.id))*f.maint; }); if(S.overseasFarm)fm*=2; if(fm>0){ S.funds-=fm; log(`牧場施設の月維持費 ${fm}万円 を支払い`); } }
  /* 施設の工事進行 */
  Object.keys(S.building||{}).forEach(id=>{ if(S.building[id]>0){ S.building[id]--; if(S.building[id]<=0){ const f=FACILITIES.find(x=>x.id===id); log(`🏗 施設「${f?f.n:id}」が完成した`); } } });
  S.week++;
  /* 調教の指示による自動実行（手動で調教した馬＝trainsLeft<2 の馬はその週は手動優先で自動実行しない） */
  S.weekReport=[];
  S.horses.forEach(h=>{
    const manual = h.trainsLeft<2;
    h.trainsLeft=2;
    if(h.races>0) h.restW=(h.restW==null?1:h.restW+1);
    h.fat=clamp(h.fat-ri(4,10)-facEffect("shoyo")*1.5,0,100);
    h.cond=clamp(h.cond+ri(-6,6)+ (TRAINER.ranks? (rankVal(TRAINER.ranks.cond)-3):0),15,100);
    h.weight=clamp(h.weight+ri(-4,4) - (TRAINER.ranks? (rankVal(TRAINER.ranks.weight)-3):0),420,540);
    if(h.injured>0)h.injured=Math.max(0,h.injured-(facEffect("walker")>0?1:0)*0+ (facEffect("vet")>0&&S.week%2===0?1:0));
    if(!manual && !h.retired) runPlan(h);
    /* 気合乗り（性格で振れ幅が変わる） */
    const swing={熱血:26,強気:18,真面目:8,従順:10,頑固:14,臆病:16}[h.personality]||12;
    h.kiai=clamp(50+Math.round((h.cond-60)*0.5)+ri(-swing,swing),5,100);
    if(Array.isArray(h.hist)){ h.hist.push({c:h.cond, f:Math.round(h.fat)}); if(h.hist.length>24)h.hist.shift(); }
  });
  /* 友好度の自然減衰（長く依頼していない騎手） */
  JOCKEYS.forEach(j=>{ const st=(S.jockStats||{})[j.id]; const last=st?st.last:-99; if(S.week-last>16 && friendshipOf(j.id)>5) addFriendship(j.id,-1); });
  /* 受胎判定（月末）・誕生（翌年4月）・幼駒育成 */
  farmWeekly();
  if(S.week%48===0){ // 年明け加齢＆成長・衰え
    S.horses.forEach(h=>{
      h.age++;
      const peakAge={"早熟":3,"早め":4,"遅め":5,"晩成":5,"覚醒":6}[h.growth]||4;
      ["spd","sta","pow","bst","gut"].forEach(k=>{
        if(h.age<=peakAge) h[k]=clamp(h[k]+ri(1,4),20,99);
        else if(h.age>=7) h[k]=clamp(h[k]-ri(1,4)*(S.onsenGuard?0.5:1),20,99);
      });
    });
    (S.youngStock||[]).forEach(y=>{ y.age=(y.age||0)+1; });
  }
  if(S.week%4===0) refreshMarket();
  genRaces();
  log(`${year()}年目${month()}月第${weekInMonth()}週：維持費 ${upkeep()}万円 を支払い`);
  if(S.funds<0 && S.horses.length===0){ gameOver(); return; }
  if(S.funds< -500){ gameOver(); return; }
  renderAll();
  if(year()!==prevYear){ // 年末処理：表彰・引退勧告・世代更新をまとめて出す
    const sortedW=[...S.horses].sort((a,b)=>(b.yearWins||0)-(a.yearWins||0));
    const sortedE=[...S.horses].sort((a,b)=>(b.yearEarnings||0)-(a.yearEarnings||0));
    const data={year:prevYear, mostWins:sortedW[0]&&(sortedW[0].yearWins||0)>0?sortedW[0]:null, topEarner:sortedE[0]&&(sortedE[0].yearEarnings||0)>0?sortedE[0]:null,
      retire:S.horses.filter(h=>h.age>=7||(h.age>=6&&h.wins===0&&h.races>=6)),
      aged:S.horses.slice()};
    S.horses.forEach(h=>{h.yearWins=0; h.yearEarnings=0;});
    saveAuto();
    setTimeout(()=>showYearEnd(data),60);
  }
}

/* ============ レース ============ */
/* 開催時点の馬齢：馬齢は年明けに+1されるため、開催（月・週）が今より前なら翌年開催として+1歳で判定する */
function ageAtRaceMonth(h,raceMonth,raceWeek){
  if(raceMonth==null) return h.age;
  const nowIdx=(month()-1)*4+(weekInMonth()-1), raceIdx=(raceMonth-1)*4+((raceWeek||1)-1);
  return h.age + (raceIdx<nowIdx?1:0);
}
/* 開催までの週数（年間48週で循環） */
function weeksUntilRace(g){
  const nowIdx=(month()-1)*4+(weekInMonth()-1), raceIdx=(g.month-1)*4+((g.week||1)-1);
  return (raceIdx-nowIdx+48)%48;
}
/* 出走条件チェック（age=判定に使う馬齢／weeksAhead=開催までの週数。将来のレースでは故障・疲労は回復見込みを加味する） */
function eligibleAt(h,r,age,weeksAhead){
  const wk=weeksAhead||0;
  if(h.injured>0 && wk<h.injured) return "故障休養中";
  if(age<2) return "1歳は出走不可";
  /* 2歳戦は6月開始：1〜5月に開催されるレース（3歳・古馬戦）には、年齢条件以前に2歳馬は出走できない */
  const rMonth=(r.month!=null?r.month:null);
  if(age===2 && rMonth!=null && rMonth<6) return "2歳戦は6月から（1〜5月は開催なし）";
  /* 3歳未勝利は9月で終了（秋以降は組まれない） */
  if(r.age===3 && r.cls===1 && rMonth!=null && rMonth>=10) return "3歳未勝利は9月で終了";
  if(r.age && age!==r.age) return r.age+"歳限定";
  if(r.ageMin && age<r.ageMin) return r.ageMin+"歳以上限定";
  if(r.sex==="牝" && h.sex!=="牝") return "牝馬限定";
  if(r.sex==="牡騸" && h.sex==="牝") return "牡・騸馬限定";
  /* sex未指定（牡牝混合）は牡・牝・騸いずれも可 */
  const hc = h.races===0?0 : h.wins===0?1 : clamp(1+h.wins,2,5);
  if(r.cls===0 && h.races>0) return "新馬戦はデビュー馬のみ";
  if(r.cls===1 && h.wins>0) return "未勝利は未勝利馬のみ";
  if(r.cls>=2 && r.cls<=5 && hc<r.cls) return "クラスが足りない";
  if(r.minWins!=null){ if(h.wins<r.minWins) return "実績が足りない（"+r.minWins+"勝以上が必要）"; }
  else if(r.cls>=6 && hc<4 && h.wins<3) return "実績が足りない（3勝以上）";
  if(h.fat>=85 && wk<3) return "疲労が限界";
  return "";
}
function eligible(h,r){
  return eligibleAt(h,r,h.age,0);
}
function makeRivals(r){
  let n=clamp((r.maxField||16)-1,7,17); const out=[]; // 自厩舎馬1頭を加えてフルゲートになる頭数
  /* 実在馬の注入（主要G1） */
  if(r.cls===8 && REAL_FIELDS[r.name]){ REAL_FIELDS[r.name].forEach(nm=>{ const rh=makeRealRival(nm); if(rh && out.length<n){ out.push(rh); } }); }
  if(r.overseas){ [["カランダガン",0],["クロワデュノール",0]].forEach(([nm])=>{ const rh=makeRealRival(nm); if(rh&&out.length<n-2) out.push(rh); }); }
  const baseByCls=[52,54,60,65,70,76,82,88,93][r.cls];
  for(let i=out.length;i<n;i++){
    const h=newHorse({base:baseByCls+gauss()*7, age:r.age||(r.ageMin?ri(r.ageMin,r.ageMin+2):pick([3,3,4,4,5,6]))});
    if(r.sex==="牝")h.sex="牝"; if(r.sex==="牡騸"&&h.sex==="牝")h.sex="牡";
    h.name=pick(HORSE_NAMES)+pick(HORSE_NAMES2)+(Math.random()<0.4?pick(["II","III","・"+ri(2,9)]):"");
    if(r.cls===0){h.races=0; h.wins=0;}
    else if(r.cls===1){h.races=r.age===2?ri(1,3):ri(1,8); h.wins=0;}
    else {h.races=ri(2,20); h.wins=clamp(Math.round(h.races*rnd(0.05,0.3)),0,9);}
    h.rival=true; h.silk=RIVAL_SILKS[i%RIVAL_SILKS.length]; h.jockey=ri(0,JOCKEYS.length-1);
    // NPCの作戦：本脚質に合う作戦が中心、たまに隣接作戦
    const nat=TAC_BY_STYLE[h.style]; const ti=TACTICS.findIndex(t=>t.id===nat);
    const roll=Math.random();
    h.tactic = roll<0.68 ? nat : TACTICS[clamp(ti+(Math.random()<0.5?-1:1),0,TACTICS.length-1)].id;
    h.tactic2 = Math.random()<0.62 ? "normal" : pick(["slow","front","late"]);
    if(Math.random()<0.07){ h.special=pick(["tame","insnipe","makuri2","saikouhou"]); }
    h.earnings=h.wins*ri(300,1500);
    /* 公開レコード（人気算出用）：重賞勝ち・休養期間・前走馬体重を用意する */
    h.gWins= r.cls>=6? clamp(Math.round(h.wins*rnd(0.2,0.6)),0,3) : 0;
    h.restW= h.races>0? (Math.random()<0.12? ri(18,40) : ri(2,12)) : null;
    h.wPrev= h.races>0? clamp(h.weight + (Math.random()<0.12? pick([-1,1])*ri(15,28) : ri(-8,8)),420,540) : null;
    ensurePublicRecord(h);
    out.push(h);
  }
  return out;
}

/* ============ 出馬表：自厩舎馬ごとの設定パネル（作戦・特殊作戦・騎手・マーク・観戦） ============ */

function drawCard(r){
  const hid=+($("#entry-horse")?$("#entry-horse").value:0)||S.selected;
  const mine=S.horses.find(x=>x.id===hid);
  if(!raceState.rivals || raceState.rivalRace!==r.id){ raceState.rivals=makeRivals(r); raceState.rivalRace=r.id; S.horses.forEach(h=>h._cardReady=false); }
  const all=[...raceState.rivals];
  if(mine) all.push(mine);

/* ---- レースシミュレーション ---- */
const raceState={phase:"idle", rivals:null, rivalRace:null, card:null, sim:null, race:null, mine:null, raf:0, t0:0, done:false, betResults:null, paceInfo:"", showMap:true, showForm:true};
function startRace(r,mine,field){
  if(mine){
    const er=eligible(mine,r);
    if(er){ alert2("出走条件を満たしていません",`${esc(mine.name)}は「${esc(r.name)}」に出走できません（${er}）。条件に合うレースを選んでください。`); return; }
    const effJ = mine.reqJockey!=null? mine.reqJockey : mine.jockey;
    const jockFee=JOCKEYS[effJ].fee + (r.overseas? (r.travel||0) : 0);
    if(S.funds<jockFee){alert2("資金不足",r.overseas?"騎乗料と遠征費が払えません。":"騎乗料が払えません。騎手を変更してください。");return;}
    S.funds-=jockFee; mine._effJockey=effJ;
  }
  let all=field;
  if(!all){ all=makeRivals(r); if(mine)all.push(mine); }
  all.forEach((h,i)=>{ if(!h._gate)h._gate=i+1; });
  /* --- 展開（ペース）判定：前に行く馬の頭数で決まる --- */
  const fronts=all.filter(h=>tacOf(h).pos>=0.8);
  const slowCaller=fronts.length===1 && (tacOf(fronts[0]).id==="ohnige"||fronts[0].tactic2==="slow");
  let pace; // -1:スロー 0:平均 1:ハイ

  raceState.paceInfo = paceLabel(pace);
  raceState.paceVal=pace; raceState.pace1000=pace1000Text(pace);
  const trend=determineTrend(r,all); raceState.trend=trend; raceState.trendInfo=TRENDS[trend.key].n;
  const groundPen=[0,0.012,0.03,0.055][GROUNDS.indexOf(r.ground)];
  all.forEach(h=>{
    ensureFullHorse(h);
    const tac=tacOf(h), t2=tac2Of(h);
    const fit=tacFit(h,tac); // 0..1 作戦適性（調教で伸ばした脚質ほど消耗しない）
    let ab=ability(h,r,jockOf(h));
    ab *= trendMul(h,trend.key); // 傾向適応：低いと実力を発揮しにくい
    // 特性（小さく効く）
    if(traitOf(h,"bigstage")&&r.cls>=6)ab+=1.3;
    if(traitOf(h,"lastleg")&&trend.key==="kire")ab+=1.0;
    if(traitOf(h,"stayer")&&trend.key==="jizoku")ab+=1.0;
    if(traitOf(h,"crowd")&&trend.key==="shoumo")ab-=0.9;
    if(traitOf(h,"transport")&&["函館","札幌","小倉","新潟"].includes(r.course))ab-=0.8;
    if(traitOf(h,"inner")&&h._gate>=1&&h._gate<=3)ab+=0.8;
    if(traitOf(h,"slowstart"))ab-=0.5; // 出遅れ分は直線の伸びで一部戻る（_last3側）
    if(traitOf(h,"gatepro"))ab+=0.7; // 習得特性「ゲート上手」：スタートと序盤の位置取りが良くなる
    if(traitOf(h,"endure")&&trend.key==="shoumo")ab+=1.1; // 習得特性「消耗戦巧者」
    // 作戦の温存度：温存が高い作戦は長距離・消耗戦で失速しにくい
    if(r.dist>=2200)ab+= (tac.reserve-35)*0.012;
    const calmSave= traitOf(h,"calm")?0.45:1; // 折り合い上手は合わない作戦の消耗を軽減
    ab -= (1-fit)*3.4*calmSave;                       // 合わない作戦は消耗して能力を落とす
    if(pace>=0.9){ if(tac.pos>=0.62)ab-=1.7; if(tac.pos<=0.36)ab+=1.1; }  // ハイ：前崩れ・差し有利
    if(pace<=-0.8){ if(tac.pos>=0.62)ab+=1.2; if(tac.pos<=0.36)ab-=0.9; } // スロー：前残り・差し届かず
    if(t2.id==="slow"&&tac.pos>=0.5)ab+= pace>=0.9?0.4:0.8;               // ペースを落とす
    if(t2.id==="front"){ if(tac.pos>=0.5)ab+=0.9; else ab-=0.6; }          // 前残りを狙う
    if(t2.id==="late"){ ab+=(h.bst-60)*0.022; if(tac.pos>=0.62)ab-=1.0; }  // 直線一気は後方でこそ
    // 新系統の補正（能力定義・騎手/調教師・気性・走法・性格・弱点・特性・特殊作戦・絆）
    const stName= tac.pos>=0.85?"逃げ":tac.pos>=0.6?"先行":tac.pos>=0.38?"差し":"追い込み";
    const jkE = (mine&&h===mine)? JOCKEYS[h._effJockey!=null?h._effJockey:h.jockey] : jockOf(h);
    const rm=raceMods(h,r,ab,jkE,{style:stName, heavyIdx:GROUNDS.indexOf(r.ground), field:all.length,
      gate:h._gate||9, pop:h._pop||9, heat:all.some(x=>x!==h&&x.real), rng:Math.random,
      isMain: !!(mine&&h===mine&&(h._effJockey==null||h._effJockey===h.jockey)), isSub: !!(mine&&h===mine&&h._effJockey!=null&&h._effJockey!==h.jockey),
      special:h.special||null, tacMismatch: fit<0.6});
    ab*=rm.mul; h._rmL3=rm.l3; h._kaka=rm.kaka;
    ab += gauss()*0.55;                      // 当日のブレは小さく（実力が着差に出る）
    h._ab=ab; h._tac=tac; h._fit=fit;
    const speed=15.55 + (ab-62)*0.0135 + rnd(-0.025,0.025);
    let time=r.dist/speed*(1+groundPen);
    if(r.dist>=2200) time*=1+Math.max(0,58-h.sta)*0.00045*(0.45+tac.pos); // 長距離×前×低スタミナは失速
    if(tac.id==="ohnige"&&fronts.length>=2) time*=1.012;                    // 大逃げの競り合い消耗
    h._time=time;
    // コース取り：前で運ぶ馬は内ラチ沿い、差し・追い込みは最終コーナーで外を回す。賢さが高い馬は外でもロスが小さい
    h._latIn=-0.62+(1-tac.pos)*0.78;                                   // 道中の基本コース（内〜中）
    const smartSwing= (h.smt||60)>=75?0.82 : (h.smt||60)>=55?1.0 : 1.18;
    h._latSwing= (tac.pos<=0.36?0.85 : tac.pos<=0.55?0.35 : 0)*smartSwing;          // 終盤に外へ出す幅
    h._lat0=(((h._gate-1)%6)/5-0.5)*1.1;                               // スタート直後の横の散らばり
    const avgLat=h._latIn+h._latSwing*0.35;
    h._time*= 1 + Math.max(0,avgLat+0.5)*0.0016;                       // 外を回す分だけ距離ロス
    let skew=(tac.pos-0.48)*0.36 + gauss()*0.018;
    if(t2.id==="late")skew-=0.045; if(t2.id==="front")skew+=0.02;
    if(traitOf(h,"startpro"))skew+=0.012; if(traitOf(h,"startkami"))skew+=0.022; if(traitOf(h,"gatepro"))skew+=0.008;
    if((h.flags||[]).includes("slowgate"))skew-=0.03;
    if(h.stride==="ピッチ")skew+=0.008;
    if(h.special==="makuri2")skew+=0.035; if(h.special==="saikouhou")skew-=0.05; if(h.special==="tame")skew+=0.01;
    h._skew=skew;
    h._last3=clamp(36.5 - (h.bst-60)*0.085 - (tac.pos<=0.36?0.7:0) - (t2.id==="late"?0.5:0) - (traitOf(h,"slowstart")?0.35:0) - (traitOf(h,"duel")?0.3:0) - (traitOf(h,"duelkami")?0.55:0) - (traitOf(h,"lastleg")&&trend.key==="kire"?0.3:0) - (traitOf(h,"goukyaku")&&trend.key==="kire"?0.55:0) + (GROUNDS.indexOf(r.ground))*0.5 + gauss()*0.4, 31.5, 41) + (h._rmL3||0);
    h._prog=0; h._phase=rnd(0,6.28);
  });
  const sorted=[...all].sort((a,b)=>a._time-b._time);
  /* 着差は「勝ち馬がゴールした瞬間に各馬が残していた距離」から換算する。
     アニメーションの位置関数 progAt と同一データなので、画面の間隔と結果が一致する */
  const tWin=sorted[0]._time;
  sorted.forEach(h=>{ h._margin = h===sorted[0] ? 0 : (1-progAt(h,tWin,tWin))*r.dist/2.4; }); // 1馬身=2.4m
  raceState.sim={all, sorted, tMax:sorted[sorted.length-1]._time, tWin:sorted[0]._time};
  raceState.race=r; raceState.mine=mine||null; raceState.phase="run"; raceState.done=false; raceState.betResults=null;
  raceState.camPath=null; raceState.geo=null;
  raceState.simT=0; raceState.lastNow=null; raceState.rate=[1,2,4].includes(S.raceSpeed)?S.raceSpeed:1; // 再生速度（前回選択を引き継ぐ・既定はそのまま1倍）
  raceState.camMode=["leader","mine","all"].includes(S.camMode)?S.camMode:"leader"; raceState.camBlend=null; // 視点（前回選択を引き継ぐ・既定は先頭）
  raceState.ord=null; raceState._pbStr=""; raceState._lblList=null;
  preRenderRaceSprites(all, r.surf==="ダート");
  raceState.titleImg=new Image(); raceState.titleImg.src="assets/scene-racecourse.webp"; // 全馬・全コマを先に描き上げておく（レース中の新規描画＝カクつきを防ぐ）
  /* サウンド：レース用BGMへ切替、歓声は小さく開始。G1はファンファーレ導入 */
  if(auInit()){ auSetMode("race"); auSetCrowd(0.12,0.8); AU.hoofM=-99; raceState._gateSnd=false; if(r.cls===8) auFanfare(); }
  switchView("race"); renderRaceScreen($("#v-race"));
  raceState.elapsed=0; raceState.subtitle=""; raceState.subName="";
  raceState.t0=performance.now() + (r.graded?1700:0); // 重賞はタイトルカード（1.7秒）→発馬
  buildCameraPath(); // 中継カメラ経路を再生前に平滑化して確定（シミュレーション時刻基準）
  cancelAnimationFrame(raceState.raf);
  raceState.raf=requestAnimationFrame(tickRace);
  raceState.watch = mine? (S.watchMode||"full") : "full";
  if(raceState.watch==="result"){ cancelAnimationFrame(raceState.raf); raceState.simT=raceEndT(); finishRace(); }
}
/* レース終了時刻：全馬が入線し（tMax）、勝ち馬のウイニングランが数秒見えてから遷移する */
function raceEndT(){
  const sim=(typeof raceState!=="undefined"&&raceState.sim)?raceState.sim:null;
  if(!sim) return 0;
  return Math.max(sim.tMax+2.5, sim.tWin+6);
}
function progAt(h,t,tWin){
  if(t>=h._time){ // ゴール後＝ウイニングラン：ゴール瞬間の速度（1/_time）のまま走り続け、時定数4秒で指数的に減速する
    // 初速が連続（跳ね上がらない）で、約60〜70m流しながらギャロップ→キャンターへ自然に落ち着く。倍率・加速は一切なし
    const v0=1/h._time, tau=4.0, dt=t-h._time;
    return 1 + v0*tau*(1-Math.exp(-dt/tau));
  }
  const u=clamp(t/h._time,0,1);
  /* 位置取りの癖（skew）は勝ち馬のゴール時刻に向けて滑らかに消える。
     これによりゴール瞬間の並びは着順そのものになり、着差＝画面の間隔と完全一致する。
     差し・追い込みの伸びは、癖が消えていく過程として最後の直線でそのまま見える */
  let D=1;
  const tw=tWin || (typeof raceState!=="undefined" && raceState.sim ? raceState.sim.tWin : 0);
  if(tw){ const q=clamp((t/tw-0.78)/0.22,0,1); D=1-q*q*(3-2*q); }
  return clamp(u + h._skew*u*(1-u)*D,0,1);
}
/* 再生速度：シミュレーション時刻を「実時間 × 選択倍率」でそのまま進めるだけ。
   区間ごとの裏倍率・圧縮は一切しない。
   - そのまま（1倍）：再生時刻＝シミュレーション時刻。最後の直線も実秒数どおりの長さで流れる
   - 2倍／4倍：全区間（直線含む）を表示どおりの倍率で圧縮
   レース途中の切替は次のフレームから即座に効く。選択はセーブされ次回も引き継がれる */
/* 最後の直線区間の開始時刻：先頭馬基準で残り＝直線長＋コーナー分（600〜700m）地点＝最終コーナー少し前 */
function finalStraightT(){
  const r=raceState.race, sim=raceState.sim; if(!r||!sim||!sim.sorted)return 0;
  const st=r.straight||COURSE_STRAIGHT[r.course]||350;
  const rem=clamp(st+280,600,700);
  const lead=sim.sorted[0], target=clamp(1-rem/r.dist,0.02,0.98);
  let lo=0, hi=sim.tWin;
  for(let i=0;i<24;i++){ const mid=(lo+hi)/2; if(progAt(lead,mid,sim.tWin)<target) lo=mid; else hi=mid; }
  return hi;
}
function skipToStraight(){
  if(raceState.phase!=="run"||!raceState.sim)return;
  const t=finalStraightT();
  if(raceState.simT<t){ raceState.simT=t; raceState.elapsed=t; drawRace(t); updateCommentary(t); }
  syncStraightBtn();
}
function syncStraightBtn(){
  const b=document.getElementById("btn-straight"); if(!b)return;
  const dis=raceState.phase!=="run"||!raceState.sim||raceState.simT>=finalStraightT()-0.05;
  if(raceState._sbDis!==dis){ raceState._sbDis=dis; b.disabled=dis; }
}
function tickRace(now){
  if(!raceState.camPath) buildCameraPath();
  if(raceState.t0 && now<raceState.t0){ drawTitleFrame(); raceState.lastNow=now; raceState.raf=requestAnimationFrame(tickRace); return; } // 重賞タイトルカード表示中は発走を待つ
  if(raceState.lastNow==null) raceState.lastNow=now;
  const dt=Math.min(0.25,(now-raceState.lastNow)/1000); raceState.lastNow=now; // タブ復帰時などの大きな飛びを抑える
  const simEnd=raceEndT();
  raceState.simT=Math.min((raceState.simT||0)+dt*(raceState.rate||1), simEnd);
  if(raceState.watch==="digest"&&raceState.sim){ const tw=raceState.sim.tWin, jt=finalStraightT(); if(raceState.simT>tw*0.30&&raceState.simT<jt) raceState.simT=jt; }
  raceState.elapsed=raceState.simT;
  try{ drawRace(raceState.simT); }catch(e){ /* 描画側の例外でレース進行（rAF連鎖）を止めない */ }
  updateCommentary(raceState.simT);
  syncStraightBtn();
  /* サウンド同期：発馬音／蹄音（先頭馬の走行距離＝ストライド周期）／歓声の盛り上がり */
  if(AU.ctx&&AU.ctx.state==="running"){
    const el2=raceState.simT;
    if(!raceState._gateSnd&&el2>=1.12){ raceState._gateSnd=true; auGate(); auSetCrowd(0.2,0.5); }
    if(el2>1.4&&raceState.sim){
      const leadD=Math.max(...raceState.sim.all.map(h=>h._prog))*raceState.race.dist;
      if(leadD-AU.hoofM>=6.6){ AU.hoofM=leadD; auHoof(raceState.race.surf==="ダート"); }
      const rem=raceState.race.dist-leadD, tWin=raceState.sim.tWin;
      let lvl=0.13;
      if(el2>=tWin) lvl=0.95; else if(rem<=500) lvl=0.13+ (1-rem/500)*0.55; else if(rem<=900) lvl=0.22;
      auSetCrowd(lvl,0.5);
    }
  }
  if(raceState.simT>=simEnd){ finishRace(); return; } // 全馬がラインを越え、勝ち馬が流し切ってから結果へ
  raceState.raf=requestAnimationFrame(tickRace);
}

/* ---- コース：細長いスタジアム型（長い直線＋両端の小さな半円コーナー）・左回り ----
   中心線を歩いてサンプル化する。s=0 はホームストレッチ入口（第4コーナー出口）。
   ゴールは直線の終わり寄り（直線の82%地点）に置き、4コーナー→ゴールを長く取る。 */
const LAP_M=1600;
let courseCache={key:"",pts:null,total:0,finS:0,cx:0,cy:0,a:0,R:0,trackW:40,straightPx:0,cornerPx:0};
function coursePoints(W,H){
  const key=W+"x"+H;
  if(courseCache.key===key)return courseCache;
  const cx=W/2, cy=H*0.52;
  const R=clamp(Math.min(H*0.30,(W/2-40)*0.32),44,115); // コーナー半径は小さめに（狭幅でも直線主体を保つ）
  const a=Math.max(30, W/2-40-R);                        // 直線の半長（大きく取る）
  const trackW=clamp(R*0.62,30,52);
  const pts=[]; let s=0, px=null, py=null;
  const push=(x,y,nx,ny)=>{ if(px!==null)s+=Math.hypot(x-px,y-py); pts.push({x,y,s,nx,ny}); px=x; py=y; };
  const step=2.2;
  for(let x=-a;x<=a;x+=step) push(cx+x, cy+R, 0, 1);                                        // ホームストレッチ（左→右）
  for(let ph=Math.PI/2; ph>=-Math.PI/2; ph-=0.03) push(cx+a+R*Math.cos(ph), cy+R*Math.sin(ph), Math.cos(ph), Math.sin(ph)); // 第1・2コーナー
  for(let x=a;x>=-a;x-=step) push(cx+x, cy-R, 0, -1);                                       // 向正面（右→左）
  for(let ph=-Math.PI/2; ph>=-Math.PI*1.5; ph-=0.03) push(cx-a+R*Math.cos(ph), cy+R*Math.sin(ph), Math.cos(ph), Math.sin(ph)); // 第3・4コーナー
  push(cx-a, cy+R, 0, 1);
  const total=s, straightPx=2*a, cornerPx=Math.PI*R;
  const finS=straightPx*0.82;
  courseCache={key,pts,total,cx,cy,a,R,trackW,finS,straightPx,cornerPx};
  return courseCache;
}
function courseAt(C,s,lat){
  const L=C.total; s=((s%L)+L)%L;
  const pts=C.pts,N=pts.length-1;
  let lo=0,hi=N;
  while(lo<hi){const mid=(lo+hi)>>1; if(pts[mid].s<s)lo=mid+1; else hi=mid;}
  const i=Math.max(1,lo), a=pts[i-1], b=pts[i];
  const f=(s-a.s)/Math.max(0.0001,b.s-a.s);
  const x=a.x+(b.x-a.x)*f, y=a.y+(b.y-a.y)*f;
  const tx=b.x-a.x, ty=b.y-a.y, tl=Math.hypot(tx,ty)||1;
  const nx=a.nx+(b.nx-a.nx)*f, ny=a.ny+(b.ny-a.ny)*f; // 外向き法線（サンプルに保持）
  const hw=C.trackW/2-3;
  return {x:x+nx*lat*hw, y:y+ny*lat*hw, cx:x, cy:y, tx:tx/tl, ty:ty/tl, depth:clamp((y-(C.cy-C.R))/(2*C.R),0,1)};
}
function latAt(h,u){ // 横位置：スタートの散らばり→道中の基本コース→終盤の外回し
  const settle=clamp(u/0.22,0,1);
  let lat=h._lat0+(h._latIn-h._lat0)*settle;
  if(h._latSwing>0){
    const sw=clamp((u-0.56)/0.17,0,1)*(1-clamp((u-0.93)/0.06,0,1)*0.5);
    lat+=h._latSwing*sw;
  }
  lat+=Math.sin(h._gate*2.39)*0.07;
  return clamp(lat,-0.95,0.95);
}
/* ============ 中継カメラ（テレビ中継風） ============
   カメラ経路は再生前に全区間ぶん事前計算し、中央移動平均で平滑化して焼き込む。
   再生中は再生経過時刻で経路を引くだけなので、目標を毎フレーム追いかける補正が
   原理的に発生せず、遅れも小刻みな拡縮も起きない（震え対策の本命）。
   focus=先頭馬の位置(m)、rel=1mあたりの画面幅（キャンバス幅比） */
function buildCameraPath(){
  const sim=raceState.sim; if(!sim)return;
  /* シミュレーション時刻を横軸にサンプルする（再生速度に依存しない経路）
     視点は3種ぶん事前に経路を計算して平滑化しておく：
       leader=先頭中心（従来の中継カメラ）／ mine=自厩舎馬中心 ／ all=全体（先頭〜最後方） */
  const total=Math.max(sim.tMax+2.5, sim.tWin+6), dt=0.25, n=Math.max(2,Math.ceil(total/dt)+1);
  const r=raceState.race, mine=raceState.mine;
  const owns=sim.all.filter(h=>!h.rival); // 自厩舎馬（複数頭なら最も先行している馬を追う）
  const LF=[], LR=[], MF=[], MR=[], AF=[], AR=[];
  for(let i=0;i<n;i++){
    const simT=Math.min(i*dt,total);
    const ps=sim.all.map(h=>progAt(h,simT,sim.tWin)*r.dist).sort((a,b)=>b-a);
    /* 先頭中心 */
    let back=ps[Math.min(5,ps.length-1)];
    if(mine) back=Math.min(back, progAt(mine,simT,sim.tWin)*r.dist);
    const spread=Math.max(0,ps[0]-back);
    LF.push(Math.min(ps[0], r.dist+90)); // ゴール後も焦点は勝ち馬のウイニングランに同調して滑らかに進み、流し終わる頃に止まる
    LR.push(clamp(0.94/(spread+18), 0.010, 0.027)); // 上位6頭＋自厩舎馬が画角に収まる拡縮
    /* 自分の馬中心：自馬を焦点にし、周りの馬群が少し見える拡縮。自馬が後方でも画面外に出ない */
    if(owns.length){
      const mpos=Math.max(...owns.map(h=>progAt(h,simT,sim.tWin)*r.dist));
      MF.push(Math.min(mpos, r.dist+90));
      const near=ps.filter(p=>Math.abs(p-mpos)<=42);
      const lspread=near.length?Math.max(...near)-Math.min(...near):16;
      MR.push(clamp(0.94/(Math.max(lspread,14)+18), 0.012, 0.027));
    } else { MF.push(LF[LF.length-1]); MR.push(LR[LR.length-1]); }
    /* 全体：先頭と最後方の真ん中を焦点にし、全頭が収まるまで引く */
    const aspread=Math.max(0, ps[0]-ps[ps.length-1]);
    AF.push((ps[0]+ps[ps.length-1])/2);
    AR.push(clamp(0.96/(aspread+22), 0.0035, 0.027));
  }
  const blurN=a=>{ const R=6, out=new Array(a.length);
    for(let i=0;i<a.length;i++){ let s=0; for(let k=-R;k<=R;k++) s+=a[clamp(i+k,0,a.length-1)]; out[i]=s/(2*R+1); } return out; };
  const B=a=>blurN(blurN(a));
  raceState.camPath={dt,total,paths:{
    leader:{F:B(LF),Rp:B(LR),anchor:0.68},
    mine:{F:B(MF),Rp:B(MR),anchor:0.50},
    all:{F:B(AF),Rp:B(AR),anchor:0.50},
  }};
}
function camSample(mode,e){
  const cp=raceState.camPath; if(!cp)return null;
  const p=cp.paths[mode]||cp.paths.leader;
  const x=clamp(e,0,cp.total)/cp.dt, i=Math.min(Math.floor(x),p.F.length-2), fr=x-i;
  return {f:p.F[i]+(p.F[i+1]-p.F[i])*fr, rel:p.Rp[i]+(p.Rp[i+1]-p.Rp[i])*fr, anchor:p.anchor};
}
function camAt(e){
  if(!raceState.camPath)return null;
  const cur=camSample(raceState.camMode||"leader", e);
  const bl=raceState.camBlend; // 視点切替時は現在位置から約0.7秒かけて滑らかに移行する（ジャンプや震えを出さない）
  if(bl){
    const k=clamp((performance.now()-bl.t0)/700,0,1), s=k*k*(3-2*k);
    if(k>=1){ raceState.camBlend=null; return cur; }
    return {f:bl.from.f+(cur.f-bl.from.f)*s, rel:bl.from.rel+(cur.rel-bl.from.rel)*s, anchor:bl.from.anchor+(cur.anchor-bl.from.anchor)*s};
  }
  return cur;
}

}
/* 重賞タイトルカード（発走前・空とスタンドを背にレース名を大きく） */
function drawTitleFrame(){
  const cv=$("#racecv"); if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=raceState.race; if(!r)return;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#7db8e8"); sky.addColorStop(0.55,"#bcdcf5"); sky.addColorStop(0.56,"#79a95c"); sky.addColorStop(1,"#4d7d3c");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  const ti=raceState.titleImg; if(ti&&ti.complete&&ti.naturalWidth){ const sc=Math.max(W/ti.naturalWidth,H/ti.naturalHeight), dw=ti.naturalWidth*sc, dh=ti.naturalHeight*sc; ctx.drawImage(ti,(W-dw)/2,(H-dh)/2,dw,dh); ctx.fillStyle="rgba(240,248,255,.20)"; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle="rgba(255,255,255,.75)"; // 雲
  [[0.2,0.12,60],[0.55,0.08,80],[0.82,0.16,52]].forEach(([fx,fy,rr])=>{ ctx.beginPath(); ctx.ellipse(W*fx,H*fy,rr,rr*0.28,0,0,7); ctx.fill(); });
  ctx.fillStyle="#3c4a55"; // スタンド
  ctx.beginPath(); ctx.moveTo(0,H*0.56); ctx.lineTo(W*0.34,H*0.56); ctx.lineTo(W*0.30,H*0.34); ctx.lineTo(0,H*0.40); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)"; for(let i=0;i<4;i++) ctx.fillRect(6,H*0.42+i*H*0.035,W*0.27,2);
  ctx.strokeStyle="#f2f2ea"; ctx.lineWidth=3; // 手前ラチとコースのカーブ
  ctx.beginPath(); ctx.moveTo(0,H*0.78); ctx.quadraticCurveTo(W*0.55,H*0.60,W,H*0.72); ctx.stroke();
  ctx.strokeStyle="rgba(242,242,234,.5)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H*0.86); ctx.quadraticCurveTo(W*0.55,H*0.68,W,H*0.80); ctx.stroke();
  /* グレードバッジ：月桂樹の紋章＋二重リング */
  const gl=CLASSES[r.cls];
  if(r.cls===8){ // G1は放射光で格を演出
    const rg=ctx.createRadialGradient(W/2,H*0.30,8,W/2,H*0.30,H*0.62);
    rg.addColorStop(0,"rgba(255,240,170,.5)"); rg.addColorStop(1,"rgba(255,240,170,0)");
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2,H*0.30); ctx.fillStyle="rgba(255,236,160,.16)";
    for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(7,-H*0.55); ctx.lineTo(-7,-H*0.55); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  ctx.save(); ctx.translate(W/2,H*0.20);
  ctx.strokeStyle="rgba(90,64,0,.55)"; ctx.lineWidth=4.6; ctx.beginPath(); ctx.arc(0,0,22.5,0,7); ctx.stroke();
  ctx.strokeStyle="#e9bc2e"; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(0,0,21,0,7); ctx.stroke();
  ctx.strokeStyle="rgba(255,243,176,.9)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,17.5,0,7); ctx.stroke();
  ctx.fillStyle="rgba(253,246,216,.92)"; ctx.beginPath(); ctx.arc(0,0,16.5,0,7); ctx.fill();
  ctx.strokeStyle="#8a6d10"; ctx.lineWidth=1.5; // 月桂樹（左右）
  [-1,1].forEach(sgn=>{ for(let i=0;i<5;i++){ const a=(0.55+i*0.42)*sgn; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(sgn*24.5,-2,4.6,2,-0.5*sgn,0,7); ctx.stroke(); ctx.restore(); } });
  const tgg=ctx.createLinearGradient(0,-10,0,10); tgg.addColorStop(0,"#a87e10"); tgg.addColorStop(0.5,"#7a5c08"); tgg.addColorStop(1,"#5c4300");
  ctx.fillStyle=tgg; ctx.font="bold 19px sans-serif"; ctx.textAlign="center"; ctx.fillText(gl,0,7);
  ctx.restore();

  const nm=r.name.split("（")[0];
  ctx.font="900 "+Math.min(64,W/Math.max(4.4,nm.length*1.04))+"px sans-serif"; ctx.textAlign="center";

  const gg=ctx.createLinearGradient(0,H*0.36,0,H*0.54); gg.addColorStop(0,"#ffe98a"); gg.addColorStop(0.55,"#e9bc2e"); gg.addColorStop(1,"#a87e10");
  ctx.fillStyle=gg; ctx.fillText(nm,W/2,H*0.52);
  if(r.cls===8){
    const recs=Object.keys(COURSE_RECORDS).map(k=>({k,...COURSE_RECORDS[k]})).filter(x=>{ const parts=x.k.split("|"); return parts[1]===r.surf && +parts[2]===r.dist; });
    const jr=recs.length? recs.reduce((a,b)=>a.time<=b.time?a:b) : null;
    const cr2=courseRecord(r);
    const lines=[]; if(cr2) lines.push("コースレコード "+fmtTime(cr2.time)+" "+cr2.horse+"（"+cr2.year+"年 "+cr2.race+"）");
    if(jr && (!cr2 || jr.k!==r.course+"|"+r.surf+"|"+r.dist)) lines.push("日本レコード "+fmtTime(jr.time)+" "+jr.horse);
    if(lines.length){ ctx.font="bold 12.5px sans-serif"; ctx.textAlign="center"; const tw=Math.max(...lines.map(x=>ctx.measureText(x).width))+26;
      ctx.fillStyle="rgba(10,24,14,.78)"; ctx.beginPath(); ctx.roundRect(W/2-tw/2, H*0.585, tw, lines.length*17+10, 8); ctx.fill();
      ctx.fillStyle="#ffe9a8"; lines.forEach((x,i)=>ctx.fillText(x, W/2, H*0.585+19+i*17)); }
  }
  /* 下部情報バー */
  ctx.fillStyle="rgba(10,24,14,.82)"; ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle="#ffe9a8"; ctx.font="bold 14px sans-serif"; ctx.textAlign="left";
  ctx.fillText(`${r.course}競馬場　${r.surf}${r.dist}m　馬場：${r.ground}`, 14, H-14);
  ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.fillText("まもなく発走", W-14, H-14);
}
/* 発馬ゲートのカット（レース冒頭・再生1.4秒まで） */
function drawGateScene(ctx,W,H,el){
  const r=raceState.race, sim=raceState.sim;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#8fc3ec"); sky.addColorStop(0.34,"#cfe7f7"); sky.addColorStop(0.35,"#69a24e"); sky.addColorStop(1,"#55863e");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(38,74,40,.55)"; // 遠景の木々
  for(let i=0;i<9;i++){ const tx=(i*173)%Math.max(200,W); ctx.beginPath(); ctx.arc(tx,H*0.335,16+((i*29)%13),0,7); ctx.fill(); }
  /* 馬場（直線） */
  ctx.fillStyle= r.surf==="ダート" ? "#c8a468" : "#6cab4e"; ctx.fillRect(0,H*0.44,W,H*0.56);
  ctx.fillStyle="rgba(255,255,255,.06)"; for(let x=0;x<W;x+=64) ctx.fillRect(x,H*0.44,32,H*0.56);
  ctx.strokeStyle="#f2f2ea"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,H*0.47); ctx.lineTo(W,H*0.47); ctx.stroke();
  /* ゲート本体：枠が奥へ連なる側面構図 */
  const n=sim.all.length, stallW=Math.min(37,(W*0.52)/n), x0=W*0.06, topY=H*0.30, gH=H*0.46;
  const open=clamp((el-1.12)/0.22,0,1);
  ctx.fillStyle="rgba(20,40,24,.25)"; ctx.fillRect(x0+6,topY+gH+4,n*stallW,7); // 影
  const order=[...sim.all].sort((a,b)=>a._gate-b._gate);
  const open01=clamp((el-1.12)/0.28,0,1); // 扉が開くまでは馬は枠内で静止、開いた瞬間にだけ飛び出す（カット演出として再生時刻で制御）
  order.forEach((h,i)=>{
    const gx=x0+i*stallW;
    const burst=open01*stallW*2.3*(0.72+((h._gate*37)%10)/20);
    const hy=topY+gH-6+((h._gate*7)%3)*2;
    const gframe= el<1.12? 0 : ((Math.floor((el-1.12)*30/7*8 + h._gate*1.31)%8)+8)%8;
    drawHorseSprite(ctx, gx+stallW*0.62+burst, hy, 0.9, h, gframe, false, r.surf==="ダート", false);
    /* 枠の柱と扉 */
    ctx.fillStyle="#4c6650"; ctx.fillRect(gx,topY,3.4,gH);

function drawRacePanels(ctx,W,H,o){

  /* 右上：帽子アイコンによる隊列表示＋残り距離。

  { const li=o.iMap?o.iMap.get(leadH):null;
    if(li){ const hx0=li.x-86*li.s, hx1=li.x+94*li.s, hy0=li.y-84*li.s-40, hy1=li.y+12*li.s;
      if(hx1>fpX-4&&hx0<fpX+fpW+4&&hy1>fpY-4&&hy0<fpY+fpH+4) fpAlpha=0.14; } }
  if(raceState.showForm){ ctx.save(); ctx.globalAlpha=fpAlpha;

  ctx.font="bold 9.5px sans-serif"; ctx.fillStyle="#bfe3c8"; ctx.textAlign="left"; ctx.fillText("隊列", fpX+9, fpY+14);
  ctx.font="bold 13px sans-serif"; ctx.fillStyle="#ffe9a8"; ctx.textAlign="right";
  ctx.fillText(leader>=1?"ゴール":("残り "+remain+"m"), fpX+fpW-9, fpY+15);
  items.forEach(it=>{

    const cx2=fpX+fpW-16-Math.min(fpW-36, behind*2.0), cy2=fpY+26+((it.lat+1)/2)*(fpH-38);

    ctx.fillStyle="#fff"; ctx.font="bold 7.5px sans-serif"; ctx.textAlign="center";
    ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=2; ctx.strokeText(String(it.h._gate),cx2,cy2-2.5); ctx.fillText(String(it.h._gate),cx2,cy2-2.5);
  });

     上に収まる。さらに、後続馬が枠に差し掛かったら枠ごと半透明化して馬を隠さない。

      const hx0=it.x-86*it.s, hx1=it.x+94*it.s, hy0=it.y-84*it.s-40, hy1=it.y+26*it.s;
      if(hx1>mmX-4&&hx0<mmX+mmW+4&&hy1>mmY-4&&hy0<mmY+mmH+4){ mmAlpha= it.h===leadH?0.12:Math.min(mmAlpha,0.22); }

    ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.4; ctx.beginPath();

    ctx.font="bold 9px sans-serif"; ctx.fillStyle="#bfe3c8"; ctx.textAlign="left"; ctx.fillText("コース", mmX+9, mmY+13);

/* 3D表示時：隊列パネルとコースマップをオーバーレイキャンバス（#raceov）へ描く。

function drawRace(simT){

  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}

  /* 発馬ゲートのカット（冒頭1.4秒） */
  if(raceState.phase==="run" && el<1.4){ sim.all.forEach(h=>h._prog=progAt(h,simT,sim.tWin)); drawGateScene(ctx,W,H,el);
    const pb0=$("#posbar"); if(pb0&&raceState._pbStr!=="gate"){ raceState._pbStr="gate"; pb0.innerHTML=""; } const rh0=$("#racehud"); if(rh0&&raceState._hudStr!=="gate"){ raceState._hudStr="gate"; rh0.innerHTML='<span class="rh-rem">まもなく発走</span>'; } return; }
  sim.all.forEach(h=>h._prog=progAt(h,simT,sim.tWin));
  const leadH=sim.all.reduce((m,h)=>h._prog>m._prog?h:m, sim.all[0]);
  const leader=leadH._prog;
  const surfDirt=r.surf==="ダート";
  const gi=GROUNDS.indexOf(r.ground);
  /* コース幾何（ミニマップ・区間判定用に維持） */
  const C=coursePoints(W,H);
  const mPerPx=LAP_M/C.total;
  const startS=C.finS-r.dist/mPerPx;
  const sOf=h=>startS+h._prog*r.dist/mPerPx;
  const homeM=LAP_M*C.finS/C.total, c34M=LAP_M*C.cornerPx/C.total;
  raceState.geo={homeM, c34M};
  const cps=new Map(sim.all.map(h=>[h, courseAt(C, sOf(h), latAt(h, clamp(h._prog,0,1)))]));
  /* 中継カメラ：事前計算パスから現在位置を引く */
  const cam=camAt(el)||{f:leader*r.dist, rel:0.02, anchor:0.68};
  const pxPerM=Math.max(raceState.camMode==="all"?2.0:4.5, cam.rel*W); // 全体視点では全頭を収めるため、より引ける下限にする
  const camLeft=cam.f-(W*(cam.anchor!=null?cam.anchor:0.68))/pxPerM;
  const visW=W/pxPerM;
  const posM=h=>h._prog*r.dist;
  const sx=h=>(posM(h)-camLeft)*pxPerM;
  /* 区間（先頭馬の実位置で判定） */
  const segS=((sOf(leadH)%C.total)+C.total)%C.total;
  const seg = segS<C.straightPx ? "home" : segS<C.straightPx+C.cornerPx ? "c12" : segS<2*C.straightPx+C.cornerPx ? "back" : "c34";
  const remL=(1-leader)*r.dist;
  /* ===== 背景（生成画像の多層パララックス：遠景／中景／近景を速度差でスクロール） ===== */

    const period=2*w; let start=-(((off%period)+period)%period); if(start>0)start-=period;

  ctx.fillStyle="rgba(255,255,255,.10)"; ctx.fillRect(0,skyH,W,3);

    ctx.strokeStyle="rgba(242,242,234,.55)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-30,H*0.575); ctx.quadraticCurveTo(W*0.52,H*0.185,W+30,H*0.515); ctx.stroke();
    ctx.restore();
  }
  /* 馬場：縞刈り／ハロー跡がカメラに同期して流れる */
  ctx.fillStyle= surfDirt? "#c8a468" : (gi>=2?"#5d8a48":"#6cab4e"); ctx.fillRect(0,trackTop,W,H-trackTop);
  const stripePx=6*pxPerM, soff=-((camLeft*pxPerM)%(stripePx*2));
  ctx.fillStyle= surfDirt? "rgba(120,84,40,.10)" : "rgba(255,255,255,.055)";
  for(let x=soff-stripePx*2;x<W+stripePx;x+=stripePx*2) ctx.fillRect(x,trackTop,stripePx,H-trackTop);
  if(surfDirt){ ctx.strokeStyle="rgba(120,84,40,.16)"; ctx.lineWidth=1.2;
    for(let y=trackTop+9;y<H;y+=11){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } }
  /* 遠ラチ＋内ラチの柱（25mおき・実距離同期） */
  const post=(yTop,yBot,col,lw)=>{ ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(0,yTop); ctx.lineTo(W,yTop); ctx.stroke();
    const m0=Math.floor(camLeft/25)*25;
    for(let m=m0;m<camLeft+visW+25;m+=25){ const x=(m-camLeft)*pxPerM; ctx.beginPath(); ctx.moveTo(x,yTop); ctx.lineTo(x,yBot); ctx.stroke(); } };
  post(trackTop+7, trackTop+20, "#f2f2ea", 2.6);
  /* 距離標（残り600/400/200m）とゴール */
  [[600],[400],[200]].forEach(([rm])=>{
    const x=(r.dist-rm-camLeft)*pxPerM; if(x<-20||x>W+20)return;
    ctx.fillStyle="#e8e8e2"; ctx.fillRect(x-1.6,trackTop+16,3.2,H*0.15);
    ctx.fillStyle="#c22f24"; ctx.beginPath(); ctx.arc(x,trackTop+13,10,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 9.5px sans-serif"; ctx.textAlign="center"; ctx.fillText(String(rm/100), x, trackTop+16.5);
  });
  const goalX=(r.dist-camLeft)*pxPerM;
  if(goalX>-30&&goalX<W+30){
    ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(goalX,trackTop+4); ctx.lineTo(goalX,H); ctx.stroke();
    ctx.fillStyle="#c22f24"; ctx.beginPath(); ctx.arc(goalX,trackTop+8,7,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(goalX,trackTop+8,2.8,0,7); ctx.fill();
    ctx.font="bold 10px sans-serif"; ctx.fillStyle="#fff"; ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=3;
    ctx.fillText("GOAL", goalX, trackTop-3); ctx.shadowBlur=0;
  }

  });

      /* 隊列パネル・コースマップは2Dキャンバス専用だったため3Dでは出なかった。

  const rh=$("#racehud");

/* ============ 馬スプライト（描き済みコマ送り方式） ============

 {bob: 0.8, neck:0.5, tail:1.0, dust:true , legs:[[-44, 20],[-36, 30],[  4, -2],[ 12,  6]]}, // 4 後脚接地（体重が乗る）
 {bob:-1.0, neck:1.0, tail:0.9, dust:false, legs:[[-18, 44],[-10, 54],[-40,-30],[-32,-22]]}, // 5 後脚の蹴り出し／前脚は折って前へ

   セル単位に整列済みの画像から切り出し、勝負服の色/模様とゼッケンを重ねて使う。
   生成シートで絵柄が崩れた芦毛は、鹿毛シートと同一個体のまま色調変換したものを採用。 */
const SHEET_OF_COAT=["bay","darkbay","chestnut","darkbay","grey","chestnut","grey"];
const SHEET_FILTER=["none","none","none","brightness(.48) saturate(.6)","none","brightness(.64) saturate(1.06)","brightness(1.17) saturate(.5)"];
const sheetImgs={};
[["bay","assets/gallop-bay.webp"],["darkbay","assets/gallop-darkbay.webp"],["chestnut","assets/gallop-chestnut.webp"],["grey","assets/gallop-grey.webp"]].forEach(([k,src])=>{ const im=new Image(); im.src=src; sheetImgs[k]=im; });

function hexRgb(hex){ const n=parseInt((hex||"#000000").slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function composeSheetSprite(h,frame){

  const silk=silkOf(h), c1=hexRgb(silk.c1), c2=hexRgb(silk.c2);

      const r=d[i],g=d[i+1],b=d[i+2], mn=Math.min(r,g,b), mx=Math.max(r,g,b);

      const gx=ZX+px2, gy=ZY+py;

      else if(silk.pat==="dot"){ const dx=(gx%30)-15, dy=(gy%30)-15; if(dx*dx+dy*dy<38) base=c2; }

/* ============ 馬券 ============ */
const BET_TYPES=[
 {id:"tan",n:"単勝",need:1},{id:"fuku",n:"複勝",need:1},{id:"umaren",n:"馬連",need:2},
 {id:"umatan",n:"馬単",need:2},{id:"sanfuku",n:"三連複",need:3},{id:"santan",n:"三連単",need:3},
];
const betState={raceId:null, field:null, type:"tan", picks:[], stake:10, includeMine:false};
function betOdds(field,race){
  /* 人気・単勝/複勝オッズは出馬表と同じ公開情報スコアから決める（能力値は使わない） */
  assignPopularity(field,race);
  const P=h=>h._p;
  const ordered=(a,b)=>P(a)*P(b)/Math.max(0.05,1-P(a));
  const trio=(a,b,c)=>ordered(a,b)*P(c)/Math.max(0.05,1-P(a)-P(b));
  betState.comboOdds=(type,picks)=>{
    const hs=picks.map(g=>field.find(h=>h._gate===g)); if(hs.some(h=>!h))return 0;
    if(type==="tan")return hs[0]._tanOdds;
    if(type==="fuku")return hs[0]._fukuOdds;
    if(type==="umaren")return +clamp(0.8/Math.max(0.001,ordered(hs[0],hs[1])+ordered(hs[1],hs[0])),1.2,900).toFixed(1);
    if(type==="umatan")return +clamp(0.8/Math.max(0.001,ordered(hs[0],hs[1])),1.5,1500).toFixed(1);
    if(type==="sanfuku"){let s=0; const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]; perms.forEach(pm=>s+=trio(hs[pm[0]],hs[pm[1]],hs[pm[2]])); return +clamp(0.8/Math.max(0.001,s),2,3000).toFixed(1);}
    if(type==="santan")return +clamp(0.8/Math.max(0.001,trio(hs[0],hs[1],hs[2])),3,9000).toFixed(1);
    return 0;
  };
}
function buildBetField(r){
  const field=makeRivals(r);
  const mine=S.horses.find(h=>h.id===S.selected);
  if(betState.includeMine&&mine&&!eligible(mine,r)) field.push(mine);
  const order=[...field].sort(()=>Math.random()-0.5);
  order.forEach((h,i)=>h._gate=i+1);
  betOdds(field,r);
  betState.field=field; betState.picks=[];
}

    html+=`<button type="button" class="rcard ${betState.raceId===r.id?"sel":""}" data-brace="${r.id}"><div class="rn"><span class="gtag ${r.cls===8?"G1":r.cls===6?"G3":"OP"}">${CLASSES[r.cls]}</span>${r.name}</div><div class="rm">${r.course} ／ ${r.surf}${r.dist}m ／ 馬場：${r.ground}</div></button>`;

  html+=`</div>`;

  html+=`<details class="fold"><summary>馬券収支（累計購入 ${fmt(st.bought)}万円／回収率 ${st.bought?Math.round(st.returned/st.bought*100):0}%）</summary><div class="foldbody"><div class="panel"><b>馬券収支</b> <span class="small">累計購入 ${fmt(st.bought)}万円 ／ 払戻 ${fmt(st.returned)}万円 ／ 回収率 ${st.bought?Math.round(st.returned/st.bought*100):0}% ／ 的中 ${st.hit}/${st.count}件</span>
  ${S.betHistory.length?`<div class="mt">${S.betHistory.slice(0,5).map(x=>`<div class="small">${x.hit?"的中":"不的中"} ${esc(x.label)} 購入${fmt(x.stake)}万 → ${fmt(x.pay)}万</div>`).join("")}</div>`:""}</div></div></details>`;
  if(!r) html+=`<p class="small mt">上のレースを選ぶと、出馬表と買い目が出ます。</p>`;
  if(r){
    if(!betState.field||betState.raceRace!==r.id){ buildBetField(r); betState.raceRace=r.id; }
    const f=betState.field, bt=BET_TYPES.find(t=>t.id===betState.type);
    const odds=betState.picks.length===bt.need?betState.comboOdds(betState.type,betState.picks):0;
    const myPending=S.bets.filter(b=>b.raceId===r.id);
    /* 自厩舎馬が出走する場合は作戦もここで決められる（出馬表と同一データ＝h.tactic／h.tactic2を共有し、即セーブされる） */
    const ownInField=f.filter(h=>!h.rival);
    const tacBlocks=ownInField.map(h=>`<div class="panel mt" style="background:var(--panel2)"><b>🐴 ${esc(h.name)} の作戦</b> <span class="small">（出馬表画面と連動・変更はそのまま保持されます）</span>
    <div class="flex mt"><select id="bet-tactic-${h.id}">${TACTICS.map(t=>`<option value="${t.id}" ${t.id===tacOf(h).id?"selected":""}>${t.n} ― ${t.d}</option>`).join("")}</select>
    <select id="bet-tactic2-${h.id}">${TACTIC2.map(t=>`<option value="${t.id}" ${t.id===(h.tactic2||"normal")?"selected":""}>${t.n}${t.d?" ― "+t.d:""}</option>`).join("")}</select>
    <span class="tacfit" id="bet-tacfit-${h.id}">${fitText(h)}</span></div>
    <div class="small mt" id="bet-tacdetail-${h.id}">目標 ${tacOf(h).target}／仕掛け ${tacOf(h).spurt}／スタミナ温存度 ${tacOf(h).reserve}</div></div>`).join("");
    html+=`<h2 class="sec">出馬表＆馬券：${r.name}</h2><div class="panel">
    <div class="flex"><button class="btn sm ${betState.includeMine?"":"ghost"}" id="bet-mine">自厩舎の選択中の馬も出走：${betState.includeMine?"ON":"OFF"}</button></div>
    <div class="mt"><table><tr><th class="num">馬番</th><th>馬名</th><th class="num">人気</th><th class="r">単勝</th><th class="r">複勝</th><th>近走</th></tr>
    ${[...f].sort((a,b)=>a._gate-b._gate).map(h=>`<tr class="${!h.rival?"mine":""}"><td class="num"><b>${h._gate}</b></td><td>${esc(h.name)}${!h.rival?"（自厩舎）":""}</td><td class="num"><span class="pop">${h._pop}</span></td><td class="r">${h._tanOdds}</td><td class="r">${h._fukuOdds}</td><td>${h.races===0?"初出走":(h.form&&h.form.length?h.form.join("・"):"―")}</td></tr>`).join("")}</table></div>
    ${tacBlocks}
    <div class="flex mt"><span class="small">券種</span>${BET_TYPES.map(t=>`<button class="btn sm ${t.id===betState.type?"":"ghost"}" data-btype="${t.id}">${t.n}</button>`).join("")}</div>
    <div class="small mt">買い目（${bt.n}：${bt.need}頭選ぶ${betState.type==="umatan"||betState.type==="santan"?" ※タップした順が着順":""}）</div>
    <div class="betpick">${[...f].sort((a,b)=>a._gate-b._gate).map(h=>`<button data-bpick="${h._gate}" class="${betState.picks.includes(h._gate)?"on":""}">${h._gate}<small>${esc(h.name.slice(0,5))}</small></button>`).join("")}</div>
    <div class="flex"><span class="small">金額（円・直接入力可）</span>
      <button class="btn ghost sm" data-stake="-10">−10万</button><button class="btn ghost sm" data-stake="-1">−1万</button>
      <input type="number" inputmode="numeric" pattern="[0-9]*" id="bet-stake-input" value="${Math.round(betState.stake*10000)}" min="0" step="100" style="width:132px" aria-label="馬券購入金額（円）">
      <button class="btn ghost sm" data-stake="1">＋1万</button><button class="btn ghost sm" data-stake="10">＋10万</button><button class="btn ghost sm" data-stake="50">＋50万</button>
      <span class="small">＝ <b id="bet-stake-man">${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円</b>（100円単位・100円未満は切り捨て）</span>
      <span class="small" id="bet-pay-preview">${odds?`オッズ <b>${odds}倍</b> ／ 的中時払戻 <b>${fmt(Math.floor(betState.stake*odds))}万円</b>`:`${bt.need}頭選ぶとオッズ表示`}</span>
    </div>
    <div class="flex mt"><button class="btn gold" id="btn-buybet" ${odds&&betState.stake>0?"":"disabled"}>この馬券を買う（<span id="btn-buybet-amt">${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円</span>）</button>
    <button class="btn" id="btn-runbet" ${myPending.length||true?"":""}>🏁 レース観戦${myPending.length?"（馬券精算）":""}</button>
    <button class="btn ghost" id="btn-skipbet">結果だけ見る</button></div>
    ${myPending.length?`<div class="mt"><b>購入済み馬券</b>${myPending.map(b=>`<div class="ticket">${BET_TYPES.find(t=>t.id===b.type).n} ${b.picks.join("-")}（${b.odds}倍）${fmt(b.stake)}万円</div>`).join("")}</div>`:""}
    </div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll("[data-brace]").forEach(c=>c.addEventListener("click",()=>{betState.raceId=c.dataset.brace; betState.field=null; renderAll();}));
  el.querySelectorAll("[data-btype]").forEach(b=>b.addEventListener("click",()=>{betState.type=b.dataset.btype; betState.picks=[]; renderAll();}));
  el.querySelectorAll("[data-bpick]").forEach(b=>b.addEventListener("click",()=>{
    const g=+b.dataset.bpick, need=BET_TYPES.find(t=>t.id===betState.type).need;
    const i=betState.picks.indexOf(g);
    if(i>=0)betState.picks.splice(i,1); else { if(betState.picks.length>=need)betState.picks.shift(); betState.picks.push(g); }
    renderAll();
  }));
  el.querySelectorAll("[data-stake]").forEach(b=>b.addEventListener("click",()=>{betState.stake=clamp(Math.round((betState.stake+(+b.dataset.stake))*100)/100,0,100000); renderAll();}));
  /* 金額の数字入力：100円単位に切り捨てて補正し、入力中も想定払戻と購入ボタンをその場で同期する */
  const si=$("#bet-stake-input");
  if(si){
    const syncStake=(rerender)=>{
      let yen=parseInt(si.value,10); if(isNaN(yen)||yen<0)yen=0;
      yen=Math.floor(yen/100)*100; // 100円未満切り捨て
      betState.stake=yen/10000;
      const man=betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2});
      const sm=$("#bet-stake-man"); if(sm)sm.textContent=man+"万円";
      const od=betState.picks.length===bt.need?betState.comboOdds(betState.type,betState.picks):0;
      const pv=$("#bet-pay-preview"); if(pv)pv.innerHTML=od?`オッズ <b>${od}倍</b> ／ 的中時払戻 <b>${fmt(Math.floor(betState.stake*od))}万円</b>`:`${bt.need}頭選ぶとオッズ表示`;
      const bb2=$("#btn-buybet"); if(bb2){ bb2.disabled=!(od&&betState.stake>0); const amt=$("#btn-buybet-amt"); if(amt)amt.textContent=man+"万円"; }
      if(rerender) renderAll();

    si.addEventListener("change",()=>syncStake(true));
  }
  /* 馬券画面の作戦セレクト：所有馬オブジェクトを直接書き換えるため出馬表と双方向に連動し、離れても保持される */
  if(r) (betState.field||[]).filter(h=>!h.rival).forEach(h=>{

      const tf=$("#bet-tacfit-"+h.id); if(tf){ tf.textContent=fitText(h); const fit=tacFit(h,tacOf(h)); tf.style.color=fit>=0.5?"var(--green)":fit>=0.25?"#7a5410":"var(--red)"; }

  const bb=$("#btn-buybet"); if(bb)bb.addEventListener("click",()=>{
    const bt2=BET_TYPES.find(t=>t.id===betState.type); if(betState.picks.length!==bt2.need)return;

    if(S.funds<betState.stake){alert2("資金が足りません",`購入金額 ${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円 が資金 ${fmt(S.funds)}万円 を超えています。`);return;}
    const odds=betState.comboOdds(betState.type,betState.picks);
    S.funds-=betState.stake; S.betStats.bought+=betState.stake; S.betStats.count++;
    S.bets.push({raceId:r.id, raceName:r.name, type:betState.type, picks:[...betState.picks], stake:betState.stake, odds});
    if(auInit())auBetBuy();
    log(`馬券購入：${r.name} ${bt2.n} ${betState.picks.join("-")} ${betState.stake.toLocaleString("ja-JP",{maximumFractionDigits:2})}万円`);
    renderAll();
  });
  const run=(skip)=>{
    const mine=betState.field.find(h=>!h.rival)||null;
    if(mine){ const fee=JOCKEYS[mine.jockey].fee; /* 騎乗料はstartRace内で処理 */ }
    startRace(r, mine, [...betState.field]);
    if(skip){ cancelAnimationFrame(raceState.raf); finishRace(); }
  };
  const rb=$("#btn-runbet"); if(rb)rb.addEventListener("click",()=>run(false));
  const sb=$("#btn-skipbet"); if(sb)sb.addEventListener("click",()=>run(true));
}

/* ============ 秘書 ============ */
const SEC_NAME="秘書・佐倉 澪";
function secretaryState(){
  const B=(label,view,hid,race)=>({label,view,hid,race});
  const ev=S.lastEvent;
  if(raceState.phase==="done") return {face:"normal", text:`レースが終了しました。レース終了画面で結果を確認したら、「帰る」ボタンで厩舎に戻ってくださいね。`, btns:[]};
  if(raceState.phase==="done"&&ev&&ev.type==="win") return {face:"smile", text:`やりましたね！ ${ev.name}が${ev.race}を勝ちました！この調子でいきましょう。`, btns:[B("結果を見る","race"),B("厩舎へ","stable")]};
  if(raceState.phase==="done"&&ev&&ev.type==="betwin") return {face:"smile", text:`馬券が的中しました！払戻${fmt(ev.pay)}万円です。お見事でしたね。`, btns:[B("結果を見る","race"),B("馬券へ","bet")]};
  if(raceState.phase==="done") return {face:"normal", text:`レースお疲れさまでした。馬の疲労が溜まっていますので、様子を見てあげてください。`, btns:[B("結果を見る","race"),B("調教・休養へ","train")]};
  /* エントリーがある週は、そのレースを軸に案内する（最優先の予定） */
  const ne=nearestEntry();
  if(ne){
    if(ne.left<=0){ const rNow=S.races.find(x=>x.name===ne.e.name); return {face:"smile", text:`今週、${ne.h.name}がエントリー中の「${ne.e.name}」に出走します！出馬表で作戦を確認して出走しましょう。このレースを走るか、エントリーを取り消すまで週は進みません。`, btns:[B("出走する","race",ne.h.id, rNow?rNow.id:undefined),B("調教する","train",ne.h.id)]}; }
    return {face:"normal", text:`${ne.h.name}の「${ne.e.name}」（${ne.e.course} ${ne.e.surf}${ne.e.dist}m）まであと${ne.left}週です。いまの調教はこのレースに向けた仕上げが中心になります。${allEntries().length>1?`ほかにもエントリーが${allEntries().length-1}件あります。`:""}`, btns:[B("調教で仕上げる","train",ne.h.id),B("エントリーを確認","race")]};
  }

  const injured=S.horses.find(h=>h.injured>0);

  const debut=S.horses.find(h=>h.races===0&&h.age>=2&&!h.injured);
  if(debut){ const r=S.races.find(x=>!eligible(debut,x));
    if(r) return {face:"smile", text:`今週、${debut.name}が「${r.name}」でデビューできます！作戦を決めて出走しましょう。`, btns:[B("出走する","race",debut.id,r.id),B("調教する","train",debut.id)]};
  }
  for(const h of S.horses){ const r=S.races.find(x=>!eligible(h,x));
    if(r) return {face:"normal", text:`今週、${h.name}が「${r.name}」に出走できます。出馬表で作戦を確認しましょう。`, btns:[B("出走する","race",h.id,r.id),B("調教する","train",h.id)]};

  /* 2歳デビュー前（1〜5月）：2歳戦自体がない時期は、デビュー時期を案内して調教へ誘導する */
  const preDebut=S.horses.find(h=>h.age===2&&h.races===0&&!h.injured);

  }
  const untrained=S.horses.find(h=>h.trainsLeft>0&&!h.injured);
  if(untrained) return {face:"normal", text:`${untrained.name}がまだ調教していません。今週あと${untrained.trainsLeft}回できます。坂路はいかがですか？`, btns:[B("調教する","train",untrained.id),B("次の週へ","next")]};
  const planHorse=S.horses.find(h=>!h.nextPlan&&!h.entry&&h.age>=2&&!h.injured);
  if(planHorse){ const sg=suggestNextRace(planHorse); if(sg) return {face:"normal", text:`${planHorse.name}の次走は「${sg.race.name}」（${sg.race.course} ${sg.race.surf}${sg.race.dist}m・${sg.race.when}）が良さそうです。${sg.reason}。厩舎の馬詳細からワンタップで登録できます。`, btns:[B("次走を登録する","stable",planHorse.id),B("レースへ","race")]}; }
  const old=S.horses.find(h=>h.age>=7);
  if(old) return {face:"normal", text:`${old.name}は${old.age}歳になりました。引退して繁殖に回すのも一つの選択ですよ。`, btns:[B("厩舎で検討","stable",old.id),B("生産へ","breed")]};
  const gnext=GRADED.map(g=>({g,w:weeksUntilRace(g)})).sort((a,b)=>a.w-b.w)[0];
  const weeksTo=gnext?gnext.w:0;
  return {face:"normal", text:`おはようございます。今週の予定は順調です。次の重賞は${gnext?gnext.g.name+"（"+gnext.g.month+"月第"+gnext.g.week+"週）":""}${weeksTo?`まであと約${weeksTo}週です。`:"で、今週開催です。"}`, btns:[B("調教する","train"),B("レースへ","race"),B("次の週へ","next")]};
}

}

function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#26382b;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88vw;text-align:center"; document.body.appendChild(t); } t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.display="none"; },2300); }
function fnv1a(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16).padStart(8,"0"); }
async function sha256hex(str){ try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return fnv1a(str)+fnv1a("~"+str)+fnv1a("#"+str); } }
function b64enc(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(str){ const bin=atob(str.replace(/\s+/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function gzEnc(u8){ if(!window.CompressionStream) return null; try{ const buf=await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); return new Uint8Array(buf); }catch(e){ return null; } }
async function gzDec(u8){ if(!window.DecompressionStream) return null; try{ const buf=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(); return new Uint8Array(buf); }catch(e){ return null; } }
async function passStream(pass, len){ const out=new Uint8Array(len); let off=0, ctr=0; while(off<len){ const hx=await sha256hex("kmg-key:"+pass+":"+ctr++); for(let i=0;i+1<hx.length&&off<len;i+=2) out[off++]=parseInt(hx.substr(i,2),16); } return out; }
async function issueTransferCode(pass){
  const json=JSON.stringify(saveData());
  let bytes=new TextEncoder().encode(json); let mode="P";
  const gz=await gzEnc(bytes); if(gz&&gz.length<bytes.length){ bytes=gz; mode="G"; }
  const chk=fnv1a(json);
  let head="KMG1."+mode+"-", verify="";
  if(pass){ verify=(await sha256hex("kmg-pass:"+pass)).slice(0,10); head="KMG1."+mode+"K"; const ks=await passStream(pass, bytes.length); bytes=bytes.map((b,i)=>b^ks[i]); }
  return head+(verify? "."+verify : "")+"."+chk+"."+b64enc(bytes);
}
async function parseTransferCode(code, pass){
  const seg=String(code||"").trim().split(".");
  if(seg[0]!=="KMG1"||seg.length<4) throw new Error("形式が違います（引き継ぎコードではないか、バージョンが異なります）");
  const mode=seg[1][0], locked=seg[1][1]==="K";
  let i=2, verify=""; if(locked){ verify=seg[2]; i=3; }
  const chk=seg[i], payload=seg[i+1];
  if(!chk||!payload) throw new Error("コードが途中で切れています");
  if(locked){ if(!pass) throw new Error("このコードには合言葉が必要です"); const v=(await sha256hex("kmg-pass:"+pass)).slice(0,10); if(v!==verify) throw new Error("合言葉が違います"); }
  let bytes; try{ bytes=b64dec(payload); }catch(e){ throw new Error("コードが壊れています（復号できません）"); }
  if(locked){ const ks=await passStream(pass, bytes.length); bytes=bytes.map((b,j)=>b^ks[j]); }
  if(mode==="G"){ const dec=await gzDec(bytes); if(!dec) throw new Error("コードが壊れています（展開できません）"); bytes=dec; }
  const text=new TextDecoder().decode(bytes);
  if(fnv1a(text)!==chk) throw new Error("コードが壊れています（チェックサム不一致）");
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("コードが壊れています（データ化できません）"); }
  if(!d||!Array.isArray(d.horses)) throw new Error("セーブデータではありません");
  return d;
}

/* ============ ガイド（提案フロー） ============
   ホーム最上部に「次にやること」を1つ、提案カードを最大3件出す。
   提案は状態から毎回生成し、押せばその場で完了するか該当箇所へ着地する。

let pendingCardFlash=false;

function guideSkipSet(){ if(!S.guideSkip)S.guideSkip=[]; return S.guideSkip; }
function guideDismissed(key){ return guideSkipSet().includes(S.week+":"+key); }
function guideSteps(){
  const ne=nearestEntry();
  const raceDue=!!(ne&&ne.left<=0);
  const trainedAll=!S.horses.some(h=>h.trainsLeft>0&&h.injured===0);
  const hasEntry=S.horses.some(h=>h.entry);
  const racedDone=raceState.phase==="done";
  const steps=[
    {n:"週の確認", done:true},
    {n:"調教・育成", done:trainedAll},
    {n:"出走準備", done:hasEntry||racedDone},
    {n:"レース", done:racedDone, na:!raceDue&&!racedDone},
    {n:"結果", done:false, na:!raceDue&&!racedDone},
    {n:"次の週へ", done:false},
  ];
  let cur=steps.findIndex(s=>!s.done&&!s.na);
  if(raceDue) cur=3;
  if(racedDone) cur=4;
  if(cur<0) cur=5;
  if(trainedAll&&!raceDue&&!racedDone) cur=5;
  return {steps, cur, raceDue, trainedAll, hasEntry};
}
function guideRegister(h){
  const sg=suggestNextRaces(h); const pk=sg.list[0]; if(!pk){ alert2("候補がありません","出走条件に合うレースが見つかりませんでした。"); return; }
  const race=pk.race;
  const cur=S.races.find(x=>x.id===race.id);
  const rs=cur?eligible(h,cur):eligibleAt(h,race,ageAtRaceMonth(h,race.month,race.week),race.weeks||0);
  if(rs){ alert2("エントリーできません",`${esc(h.name)}は「${esc(race.name)}」の出走条件を満たしていません（${rs}）。`); return; }
  const doReg=()=>{ registerEntry(h,race,S.week+(race.weeks||0)); renderAll(); };
  if(h.entry&&h.entry.name!==race.name){ confirm2("エントリーを変更しますか？",`${h.name}は「${h.entry.name}」にエントリー中です。取り消して「${race.name}」に登録し直します。`,doReg); return; }
  doReg();
}
function buildGuide(){
  const cards=[];

  const raceDue=ne&&ne.left<=0;
  let next=null;

  if(raceDue){
    next={title:`${ne.h.name}が今週出走します。作戦を決めましょう`, sub:`${ne.e.name}（${ne.e.course} ${ne.e.surf}${ne.e.dist}m）`};
